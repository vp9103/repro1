<svg class="dia" viewBox="0 0 900 574" role="img" aria-label="Teratogen critical periods in weeks after fertilization: an all-or-none period, organogenesis from week 3 to 8, and the fetal period, with the organ windows for the neural tube, heart, limbs, face, brain, kidneys, teeth and ductus arteriosus and the classic exposure for each">
