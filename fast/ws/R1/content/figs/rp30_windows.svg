<text class="b" x="590" y="486" font-size="14">NSAIDs</text>
<text x="590" y="504" font-size="14">Premature ductus arteriosus closure</text>
<text class="b" x="14" y="536" font-size="14">Organogenesis, weeks 3 to 8, carries the highest risk of major malformations.</text>
<text class="b" x="14" y="560" font-size="14">Gestational age is weeks after fertilization plus 2; later exposures injure growth and function.</text>
