<svg class="dia" viewBox="0 0 900 682" role="img" aria-label="Fluconazole inhibits fungal lanosterol 14-alpha-demethylase and treats candidiasis without partner treatment, while metronidazole is reduced into DNA-damaging radicals only in anaerobic organisms and treats both bacterial vaginosis and trichomoniasis, with partners treated for trichomoniasis">
<text class="ttl" x="14" y="26" font-size="17">Two vaginitis drugs, two targets</text>
<rect x="14" y="44" width="430" height="40" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="wn" x="28" y="70" font-size="16">Fluconazole: candidiasis</text>
<rect x="456" y="44" width="430" height="40" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="a2" x="470" y="70" font-size="16">Metronidazole: vaginosis and trichomoniasis</text>
<rect x="14" y="98" width="430" height="143" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="26" y="127" font-size="15">How it works</text>
<circle cx="29" cy="147" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="40" y="152" font-size="14">Inhibits lanosterol 14-alpha-demethylase</text>
<circle cx="29" cy="171" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="176" font-size="14">A fungal cytochrome P450 enzyme</text>
<circle cx="29" cy="195" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="200" font-size="14">Ergosterol synthesis falls, so the fungal</text>
<text x="40" y="220" font-size="14">membrane fails</text>
<rect x="456" y="98" width="430" height="143" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="468" y="127" font-size="15">How it works</text>
<circle cx="471" cy="147" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="482" y="152" font-size="14">Reduced to DNA-damaging radicals</text>
<circle cx="471" cy="171" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="176" font-size="14">Only anaerobic organisms, bacteria and protozoa,</text>
<text x="482" y="196" font-size="14">do this</text>
<line x1="229" y1="241" x2="229" y2="261" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="229,267 225.4,261 232.6,261" fill="var(--ink-2)"/>
<line x1="671" y1="241" x2="671" y2="261" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="671,267 667.4,261 674.6,261" fill="var(--ink-2)"/>
<rect x="14" y="267" width="430" height="163" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="26" y="296" font-size="15">What it treats</text>
<circle cx="29" cy="316" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="321" font-size="14">Vulvovaginal candidiasis: thick, white, curdlike</text>
<text x="40" y="341" font-size="14">discharge with a normal pH</text>
<rect x="456" y="267" width="430" height="163" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="468" y="296" font-size="15">What it treats</text>
<circle cx="471" cy="316" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="321" font-size="14">Bacterial vaginosis: Gardnerella and other</text>
<text x="482" y="341" font-size="14">anaerobes</text>
<circle cx="471" cy="360" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="365" font-size="14">Trichomoniasis: Trichomonas vaginalis, a</text>
<text x="482" y="385" font-size="14">protozoan</text>
<circle cx="471" cy="404" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="409" font-size="14">One drug covers both</text>
<line x1="229" y1="430" x2="229" y2="450" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="229,456 225.4,450 232.6,450" fill="var(--ink-2)"/>
<line x1="671" y1="430" x2="671" y2="450" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="671,456 667.4,450 674.6,450" fill="var(--ink-2)"/>
<rect x="14" y="456" width="430" height="75" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="26" y="485" font-size="15">What the slide shows</text>
<circle cx="29" cy="505" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="510" font-size="14">Budding yeast and pseudohyphae on a KOH prep</text>
<rect x="456" y="456" width="430" height="75" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="468" y="485" font-size="15">What the slide shows</text>
<circle cx="471" cy="505" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="510" font-size="14">Clue cells, or motile flagellated trichomonads</text>
<line x1="229" y1="531" x2="229" y2="551" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="229,557 225.4,551 232.6,551" fill="var(--ink-2)"/>
<line x1="671" y1="531" x2="671" y2="551" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="671,557 667.4,551 674.6,551" fill="var(--ink-2)"/>
<rect x="14" y="557" width="430" height="119" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="26" y="586" font-size="15">Partners and pregnancy</text>
<circle cx="29" cy="606" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="611" font-size="14">Partners are not treated</text>
<circle cx="29" cy="630" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="635" font-size="14">Topical azole in pregnancy</text>
<rect x="456" y="557" width="430" height="119" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="468" y="586" font-size="15">Partners</text>
<circle cx="471" cy="606" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="611" font-size="14">Trichomoniasis: treat every recent partner</text>
<circle cx="471" cy="630" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="635" font-size="14">Bacterial vaginosis: partners are not routinely</text>
<text x="482" y="655" font-size="14">treated</text>
</svg>
