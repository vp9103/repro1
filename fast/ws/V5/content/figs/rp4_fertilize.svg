<svg class="dia" viewBox="0 0 900 417" role="img" aria-label="The order of events before the zygote: capacitation in the female tract, the acrosome reaction at the zona pellucida, and the cortical reaction that hardens the zona to block a second sperm, which would give a triploid zygote">
<text class="ttl" x="14" y="26" font-size="17">One sperm only: three reactions at fertilization</text>
<text class="b" x="14" y="56" font-size="15">From the female tract to the oocyte, in order</text>
<rect x="14" y="70" width="272" height="153" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="26" y="99" font-size="15">Capacitation</text>
<text x="26" y="118" font-size="13">In the female tract</text>
<circle cx="29" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="142" font-size="14">Uterine and tubal secretions</text>
<text x="40" y="162" font-size="14">strip cholesterol and surface</text>
<text x="40" y="182" font-size="14">proteins from the sperm</text>
<text x="40" y="202" font-size="14">membrane</text>
<rect x="14" y="229" width="272" height="58" rx="8" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="26" y="251" font-size="14">The sperm can now bind the</text>
<text class="b" x="26" y="270" font-size="14">zona pellucida</text>
<rect x="314" y="70" width="272" height="153" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="326" y="99" font-size="15">Acrosome reaction</text>
<text x="326" y="118" font-size="13">At the zona pellucida</text>
<circle cx="329" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="142" font-size="14">The acrosome releases</text>
<text x="340" y="162" font-size="14">enzymes that digest a path</text>
<text x="340" y="182" font-size="14">through the zona</text>
<rect x="314" y="229" width="272" height="58" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="326" y="251" font-size="14">One sperm reaches the oocyte</text>
<text class="b" x="326" y="270" font-size="14">membrane</text>
<rect x="614" y="70" width="272" height="153" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="626" y="99" font-size="15">Cortical reaction</text>
<text x="626" y="118" font-size="13">After the first sperm fuses</text>
<circle cx="629" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="142" font-size="14">Cortical granules release</text>
<text x="640" y="162" font-size="14">enzymes that harden the</text>
<text x="640" y="182" font-size="14">zona pellucida</text>
<rect x="614" y="229" width="272" height="58" rx="8" fill="var(--surface)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="626" y="251" font-size="14">A second sperm cannot enter</text>
<line x1="288" y1="104" x2="306" y2="104" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="312,104 306,107.6 306,100.4" fill="var(--ink-2)"/>
<line x1="588" y1="104" x2="606" y2="104" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="612,104 606,107.6 606,100.4" fill="var(--ink-2)"/>
<rect x="14" y="301" width="872" height="74" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="cr" x="28" y="327" font-size="15">Why only one sperm?</text>
<text x="28" y="349" font-size="14">Without it a second sperm would enter and the zygote would be triploid</text>
<text x="28" y="367" font-size="14">(69 chromosomes). Sperm entry also makes the oocyte finish meiosis II.</text>
<text x="14" y="401" font-size="14">Then the zygote divides without growing: morula by day 3, blastocyst by day 5</text>
</svg>
