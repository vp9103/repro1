<svg class="dia" viewBox="0 0 900 648" role="img" aria-label="Postmenopausal bleeding is worked up by excluding other sources, then an office endometrial biopsy, then hysteroscopy or dilation and curettage if the sample fails; benign endometrial diagnoses include polyp, acute endometritis, chronic endometritis with plasma cells, and Asherman syndrome after curettage">
<text class="ttl" x="14" y="26" font-size="17">Sampling the endometrium, and the benign findings behind bleeding</text>
<rect x="14" y="44" width="430" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="67" font-size="16">Postmenopausal bleeding: three steps</text>
<rect x="456" y="44" width="430" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="470" y="67" font-size="16">Benign endometrial diagnoses</text>
<rect x="14" y="90" width="430" height="106.0" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="26" y="119" font-size="15">Look for other sources</text>
<circle cx="29" cy="139" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="144" font-size="14">Examine the vulva, vagina and cervix: atrophy or</text>
<text x="40" y="164" font-size="14">a cervical lesion can look uterine</text>
<circle cx="418" cy="114" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="418" y="119" font-size="14" text-anchor="middle">1</text>
<line x1="229" y1="196.0" x2="229" y2="214.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="229,220.0 225.4,214.0 232.6,214.0" fill="var(--ink-2)"/>
<rect x="14" y="220.0" width="430" height="130.0" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="26" y="249.0" font-size="15">Sample the lining</text>
<circle cx="29" cy="269.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="40" y="274.0" font-size="14">Office endometrial biopsy: the first test</text>
<circle cx="29" cy="293.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="298.0" font-size="14">A blind suction sample in the office; a positive</text>
<text x="40" y="318.0" font-size="14">result is reliable</text>
<circle cx="418" cy="244.0" r="13" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="418" y="249.0" font-size="14" text-anchor="middle">2</text>
<line x1="229" y1="350.0" x2="229" y2="368.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="229,374.0 225.4,368.0 232.6,368.0" fill="var(--ink-2)"/>
<rect x="14" y="374.0" width="430" height="266.0" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="26" y="403.0" font-size="15">Escalate if the sample fails</text>
<circle cx="29" cy="423.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="40" y="428.0" font-size="14">Hysteroscopy with biopsy</text>
<circle cx="29" cy="447.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="452.0" font-size="14">Direct view of the cavity, with targeted samples</text>
<text x="40" y="472.0" font-size="14">or removal</text>
<circle cx="29" cy="491.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="496.0" font-size="14">Used for a focal lesion such as a polyp, or an</text>
<text x="40" y="516.0" font-size="14">inadequate office sample</text>
<circle cx="29" cy="535.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="40" y="540.0" font-size="14">Dilation and curettage</text>
<circle cx="29" cy="559.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="564.0" font-size="14">Scrapes the whole lining under anesthesia</text>
<circle cx="29" cy="583.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="588.0" font-size="14">Used for an inadequate office sample or retained</text>
<text x="40" y="608.0" font-size="14">tissue</text>
<circle cx="418" cy="398.0" r="13" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="418" y="403.0" font-size="14" text-anchor="middle">3</text>
<rect x="456" y="90" width="430" height="139" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="468" y="119" font-size="15">Endometrial polyp</text>
<circle cx="471" cy="139" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="144" font-size="14">Focal overgrowth of glands and stroma on a</text>
<text x="482" y="164" font-size="14">fibrous core</text>
<circle cx="471" cy="183" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="188" font-size="14">Irregular bleeding; obesity and tamoxifen raise</text>
<text x="482" y="208" font-size="14">the risk</text>
<rect x="456" y="239.0" width="430" height="119" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="468" y="268.0" font-size="15">Acute endometritis</text>
<circle cx="471" cy="288.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="293.0" font-size="14">After delivery, cesarean or abortion; polymicrobial</text>
<circle cx="471" cy="312.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="317.0" font-size="14">Neutrophils, fever, tender uterus: clindamycin</text>
<text x="482" y="337.0" font-size="14">plus gentamicin</text>
<rect x="456" y="368.0" width="430" height="119" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="468" y="397.0" font-size="15">Chronic endometritis</text>
<circle cx="471" cy="417.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="482" y="422.0" font-size="14">Plasma cells in the stroma</text>
<circle cx="471" cy="441.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="446.0" font-size="14">After pelvic inflammatory disease, an IUD,</text>
<text x="482" y="466.0" font-size="14">retained tissue or tuberculosis</text>
<rect x="456" y="497.0" width="430" height="143" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="468" y="526.0" font-size="15">Asherman syndrome</text>
<circle cx="471" cy="546.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="482" y="551.0" font-size="14">Follows uterine curettage or infection</text>
<circle cx="471" cy="570.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="575.0" font-size="14">Scarring of the basalis: the lining cannot rebuild</text>
<circle cx="471" cy="594.0" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="482" y="599.0" font-size="14">Secondary amenorrhea and infertility with normal</text>
<text x="482" y="619.0" font-size="14">hormones</text>
</svg>
