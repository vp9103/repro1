<text x="614" y="516" font-size="14">From 15 weeks, fetal cells</text>
<text x="614" y="542" font-size="14">Fluid AFP and acetylcholinesterase</text>
<text class="b" x="14" y="590" font-size="14">High AFP: open neural tube or abdominal wall defect, twins, or underestimated dates.</text>
<text class="b" x="14" y="614" font-size="14">Low AFP: trisomy 21 or 18, or overestimated dates.</text>
