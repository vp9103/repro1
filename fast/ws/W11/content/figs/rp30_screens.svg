<text class="b" x="320" y="490" font-size="15">Chorionic villus sampling</text>
<text x="320" y="516" font-size="14">10 to 13 weeks, placental tissue</text>
<text x="320" y="542" font-size="14">Cannot detect neural tube defects</text>
<rect x="602" y="464" width="284" height="98" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.2"/>
