<svg class="dia" viewBox="0 0 900 628" role="img" aria-label="Aneuploidy and neural tube screening patterns: quad screen markers for trisomy 21, trisomy 18, open neural tube defect, abdominal wall defect and twins; first-trimester screen markers for trisomy 21 and 18; and the diagnostic tests that confirm a positive screen">
