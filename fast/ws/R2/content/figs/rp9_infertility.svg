<svg class="dia" viewBox="0 0 900 508" role="img" aria-label="Female infertility: evaluate both partners, then sort the factor and match the treatment; ovulation problems such as PCOS get letrozole first (an aromatase inhibitor), clomiphene or gonadotropins with their side effects, tubal damage is shown by hysterosalpingography as a dilated tube without spill and treated with in vitro fertilization, and uterine factors need hysteroscopy">
<text class="ttl" x="14" y="24" font-size="17">Infertility: find the factor, then match the treatment</text>
<rect x="14" y="40" width="872" height="46" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="28" y="69" font-size="14">Evaluate after 12 months of trying, or 6 months if age 35 or older: semen analysis first</text>
<rect x="14" y="100" width="330" height="392" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.6"/>
<rect x="14" y="100" width="330" height="40" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.6"/>
<text class="b" x="28" y="127" font-size="16">Ovulation</text>
<rect x="354" y="100" width="300" height="392" rx="8" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.6"/>
<rect x="354" y="100" width="300" height="40" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.6"/>
<text class="b" x="368" y="127" font-size="16">Tubes</text>
<rect x="664" y="100" width="222" height="392" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.6"/>
<rect x="664" y="100" width="222" height="40" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.6"/>
<text class="b" x="678" y="127" font-size="16">Uterus</text>
<text class="a1" x="28" y="166" font-size="13">TEST</text>
<text x="28" y="188" font-size="14">Mid-luteal progesterone</text>
<text x="28" y="208" font-size="14">confirms ovulation</text>
<text class="a1" x="28" y="242" font-size="13">CAUSES</text>
<text x="28" y="264" font-size="14">PCOS, prolactin, thyroid disease,</text>
<text x="28" y="284" font-size="14">hypothalamic suppression</text>
<text class="a1" x="28" y="318" font-size="13">TREATMENT</text>
<text class="b" x="28" y="340" font-size="14">Letrozole first in PCOS</text>
<text x="28" y="360" font-size="14">Aromatase inhibitor lowers estrogen</text>
<text x="28" y="380" font-size="14">feedback, so FSH rises</text>
<text x="28" y="408" font-size="14">Clomiphene side effects: hot flashes,</text>
<text x="28" y="428" font-size="14">visual disturbances, multiple births</text>
<text x="28" y="456" font-size="14">Gonadotropins risk OHSS: VEGF-driven</text>
<text x="28" y="476" font-size="14">capillary leak, ascites, clots</text>
<text class="a2" x="368" y="166" font-size="13">TEST</text>
<text x="368" y="188" font-size="14">Hysterosalpingography (HSG)</text>
<text class="b" x="368" y="208" font-size="14">Free spill: patent tubes</text>
<text class="b" x="368" y="228" font-size="14">Dilated, no spill: hydrosalpinx</text>
<text class="a2" x="368" y="262" font-size="13">CAUSES</text>
<text x="368" y="284" font-size="14">Past PID, endometriosis, surgery</text>
<text class="a2" x="368" y="318" font-size="13">TREATMENT</text>
<text class="b" x="368" y="340" font-size="14">IVF bypasses the tubes</text>
<text x="368" y="360" font-size="14">Insemination and ovulation drugs</text>
<text x="368" y="380" font-size="14">cannot help blocked tubes</text>
<text class="wn" x="678" y="166" font-size="13">TEST</text>
<text x="678" y="188" font-size="14">HSG, hysteroscopy</text>
<text class="wn" x="678" y="242" font-size="13">CAUSES</text>
<text x="678" y="264" font-size="14">Asherman syndrome,</text>
<text x="678" y="284" font-size="14">submucosal fibroid,</text>
<text x="678" y="304" font-size="14">uterine septum</text>
<text class="wn" x="678" y="338" font-size="13">TREATMENT</text>
<text class="b" x="678" y="360" font-size="14">Hysteroscopic resection</text>
<text class="b" x="678" y="380" font-size="14">or adhesiolysis</text>
</svg>
