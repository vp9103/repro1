12.5. In boys, **testicular enlargement** to a volume of 4 mL or more is the first sign, at about age 11, followed by pubic hair and penile growth; the growth spurt comes late, near genital stage 3 to 4, about two years after girls. About half of boys develop tender pubertal gynecomastia in mid-puberty, and it usually resolves within one to two years."], ["f", "rp7_sequence"], ["p", "**Tanner stages**, also called sexual maturity ratings, grade breast, pubic hair and male genital development from 1, prepubertal, to 5, adult. Breast stage 2 is the **breast bud**, and genital stage 2 is testicular enlargement with thinner, redder scrotal skin. Each sign has its own hormone. Estrogen grows the breasts and the uterus; testosterone lengthens the penis, deepens the voice and builds muscle; DHT drives facial hair, the prostate and acne; FSH enlarges the seminiferous tubules, which make up most of the testicular volume; and adrenal plus gonadal androgens grow pubic and axillary hair."], ["t", ["Tanner stage", "Breast", "Pubic hair", "Male genitalia"], [["1", "Prepubertal, papilla only", "None", "Prepubertal testes under 4 mL"], ["2", "**Breast bud** under the areola", "Sparse, long, straight hair", "Testes 4 mL or more, scrotum reddens"], ["3", "Breast and areola enlarge in one contour", "Darker, coarser, curly hair over the pubis", "Penis lengthens"], ["4", "Areola forms a secondary mound", "Adult-type hair that spares the thighs", "Penis widens, scrotum darkens"], ["5", "Adult contour, areola recedes", "Adult hair spreading to the medial thighs", "Adult size and shape"]]], ["p", "Sex steroids drive the growth spurt directly and by raising **growth hormone** and IGF-1. The same steroids mature the growth plates, and estrogen is the hormone that finally fuses them, in both sexes. Boys get their estrogen by **aromatization** of testosterone, which is why men who lack aromatase or the estrogen receptor keep growing into adulthood with open **epiphyseal** plates. A {{rp7_boneage|bone age}} X-ray of the left hand and wrist therefore reads how much sex steroid a child has been exposed to: it is advanced in precocious puberty and delayed in constitutional delay and hypogonadism."], ["why", "Why does precocious puberty make a child tall now but short as an adult?", "Sex steroids speed growth and speed skeletal maturation at the same time, but they advance the bone age faster than they add height. A child with early puberty therefore shoots up past her classmates while her growth plates race toward closure. Once estrogen fuses the epiphyses, growth stops for good, years earlier than it should, so the adult ends up shorter than her genetic target despite having been the tallest child in the class. This is the main reason to treat central precocious puberty with a continuous GnRH agonist, especially when it starts before age 6: removing the sex steroids slows the bone age and preserves adult height."], ["h", "How do you tell central from peripheral precocious puberty?"], ["p", "Precocious puberty means pubertal signs before age 8 in girls or before age 9 in boys. In **central precocious** puberty, also called GnRH-dependent or true precocious puberty, the whole axis wakes early: LH and FSH are pubertal, LH rises briskly after GnRH-agonist stimulation, bone age is advanced and the signs follow the normal order, with both testes enlarging in boys. About 90% of affected girls have no cause found, but boys more often have a brain lesion, so boys and very young girls get a brain MRI. The classic lesion is a {{rp7_hamartoma|hypothalamic hamartoma}}, a benign mass that contains its own GnRH neurons and can cause laughing seizures. Treatment is a continuous **GnRH agonist** such as depot leuprolide, which downregulates pituitary GnRH receptors so LH, FSH and sex steroids fall."], ["p", "In **peripheral precocious** puberty, also called GnRH-independent, the sex steroids come from outside the axis and suppress it, so LH and FSH are low while estradiol or testosterone is high. {{rp7_mas|McCune-Albright syndrome}} is a postzygotic activating mutation of GNAS that keeps the Gs protein switched on, so ovarian cysts make estrogen on their own; its triad is precocious puberty, **café-au-lait** macules with jagged borders and polyostotic fibrous dysplasia. Other sources are congenital adrenal hyperplasia, granulosa cell tumors, Leydig cell tumors that enlarge one testis, hCG-secreting tumors in boys, because hCG acts at the LH receptor, and exogenous estrogen or testosterone gel. In a boy, virilization with small testes points to an adrenal or exogenous source."], ["f", "rp7_precocious"], ["call", "trap", "Pubic hair or a breast bud alone may be normal", "**Premature adrenarche** gives pubic hair, odor and acne from adrenal DHEA-S with no breast growth or testicular enlargement, normal growth and a near-normal bone age. **Premature thelarche** is isolated breast development, most often in girls under 2, with a prepubertal LH, a normal bone age and no growth spurt, and it usually regresses. Both need follow-up, not a GnRH agonist, unless a growth spurt or an advancing bone age appears."], ["h", "Why is puberty late, and how are the causes sorted?"], ["p", "Puberty is delayed when a girl has no breast development by age 13 or a boy has no testicular enlargement to 4 mL by age 14. {{rp7_cdgp|Constitutional delay}} of growth and puberty is the most common cause, especially in boys: the child is healthy and short, grows steadily below but parallel to the curve, often has a parent who matured late, and has a bone age about 2 years behind, so LH and FSH are appropriately low for that bone age. **Hypogonadotropic** hypogonadism is functional in anorexia nervosa, heavy athletic training and chronic illness, because low energy and low leptin suppress GnRH pulses, or permanent in Kallmann syndrome and pituitary lesions. **Hypergonadotropic** hypogonadism means the gonads have failed, as in Turner syndrome, Klinefelter syndrome or after chemotherapy, so the next test is a karyotype."], ["t", ["Cause", "LH and FSH", "Bone age", "Typical clues"], [["Constitutional delay", "Low, but normal for bone age", "Delayed about 2 years", "Short, healthy, a parent who matured late"], ["Functional hypogonadotropic", "Low", "Delayed", "Anorexia, intense exercise, chronic illness"], ["Permanent hypogonadotropic", "Low and staying low", "Delayed", "Anosmia in Kallmann syndrome, pituitary mass"], ["Hypergonadotropic", "**High**", "Delayed", "Turner or Klinefelter syndrome; order a karyotype"]]], ["steps", ["Working up puberty that is too early or too late", [["Plot growth and stage the child", "A growth chart shows whether height velocity has sped up, as in true puberty, or run slow and steady, as in constitutional delay; Tanner staging records which signs are present."], ["Get a bone age X-ray", "An X-ray of the left hand and wrist shows how far sex steroids have matured the skeleton: advanced in precocious puberty, delayed in constitutional delay and hypogonadism."], ["Measure LH, FSH and sex steroids", "An ultrasensitive basal LH, or LH after GnRH-agonist stimulation, shows whether the axis is awake; pubertal LH means central, and suppressed LH with high steroids means peripheral."], ["Follow the result to its cause", "Central precocious puberty leads to a brain MRI; peripheral leads to 17-hydroxyprogesterone, hCG and pelvic or testicular ultrasound; a high FSH in late puberty leads to a karyotype."], ["Screen for treatable hormone problems", "TSH and prolactin are checked because hypothyroidism and prolactin excess both disturb pubertal timing, and treating them lets puberty resume."]]]], ["sexp", {"id": "sx_rp7_cdgp", "q": "A healthy 14-year-old boy has 3-mL testes, a bone age of 12 and a father who matured late. Which reasoning fits best?", "o": ["A low LH proves GnRH deficiency, so he has Kallmann syndrome and needs gonadotropin therapy now", "Small testes at 14 mean gonadal failure, so his FSH will be high and a karyotype is required", "His bone age is advanced, so puberty is imminent and no further evaluation is needed", "His delayed bone age and family history fit constitutional delay, and a low LH is appropriate for his bone age"], "a": 3, "why": "Constitutional delay is the most common cause of late puberty and delays the whole clock, so the bone age lags along with puberty. Judged against a bone age of 12, prepubertal testes and a low LH are expected rather than proof of GnRH deficiency. Kallmann syndrome would add anosmia and an LH that stays low as the bone age advances. Gonadal failure would raise FSH and LH. Watchful follow-up, sometimes with a short course of testosterone, is the usual plan."}], ["vis", "rp7"]], "grid": {"q": "Which findings point to central rather than peripheral precocious puberty?", "items": [["Pubertal LH that rises after GnRH stimulation", 1], ["Bilateral testicular enlargement in a boy", 1], ["Hypothalamic hamartoma on MRI", 1], ["Laughing seizures in a young boy", 1], ["Pubertal signs appearing in the normal order", 1], ["Response to a continuous GnRH agonist", 1], ["No cause found in a girl", 1], ["Café-au-lait macules with fibrous dysplasia", 0], ["Suppressed LH with a high estradiol", 0], ["Enlargement of one testis only", 0], ["Virilization with prepubertal-size testes", 0], ["High 17-hydroxyprogesterone", 0], ["High serum hCG in a boy", 0]]}}]}, {"id": "rpcycle", "n": "The cycle and its disorders", "wk": "", "topics": []}, {"id": "rpgyn", "n": "Female genital tract pathology", "wk": "", "topics": []}, {"id": "rpinf", "n": "Sexually transmitted and perinatal infections", "wk": "", "topics": []}, {"id": "rpmale", "n": "The male reproductive system", "wk": "", "topics": []}, {"id": "rpbreast", "n": "The breast", "wk": "", "topics": []}, {"id": "rppreg", "n": "Pregnancy", "wk": "", "topics": []}, {"id": "rpcare", "n": "Whole-person reproductive care", "wk": "", "topics": []}, {"id": "enaxes", "n": "Hormones and the pituitary", "wk": "", "topics": []}, {"id": "enthy", "n": "Thyroid", "wk": "", "topics": []}, {"id": "enca", "n": "Calcium, parathyroid and bone", "wk": "", "topics": []}, {"id": "enadr", "n": "Adrenal", "wk": "", "topics": []}, {"id": "enpanc", "n": "Endocrine pancreas and diabetes", "wk": "", "topics": []}, {"id": "enneo", "n": "Endocrine tumor syndromes", "wk": "", "topics": []}];
const QS = [{"id": "rp6q01", "d": 1, "s": "A 16-year-old girl is brought to the physician because she has not had a menstrual period. She is 173 cm tall, breast development is Tanner stage 5, and pubic and axillary hair are sparse. Pelvic examination shows a short vagina ending in a blind pouch. Ultrasonography shows no uterus and a 2-cm oval mass in each inguinal canal.", "l": "A defect in which of the following molecules is the most likely cause of her condition?", "o": ["Androgen receptor", "5-alpha-reductase", "SRY protein", "21-hydroxylase", "Anti-Müllerian hormone"], "a": 0, "e": "Breasts without a uterus, sparse body hair and inguinal gonads describe complete androgen insensitivity in a 46,XY person with a defective **androgen receptor**. Her testes made AMH, which removed the uterus, and plenty of testosterone, which cannot act, so the genitalia are female and body hair is scant; aromatized testosterone grew the breasts. A 5-alpha-reductase defect would leave testosterone active, causing ambiguous genitalia and virilization at puberty. An SRY defect (Swyer syndrome) leaves a uterus and no breast development.", "et": [["Option", "Uterus", "External genitalia", "Body hair at puberty"], [["Androgen receptor", "Absent", "Female", "Sparse"], ["5-alpha-reductase", "Absent", "Ambiguous, virilize later", "Male pattern, little beard"], ["SRY protein", "Present", "Female", "Normal female pattern"], ["21-hydroxylase", "Present", "Virilized", "Increased"], ["Anti-Müllerian hormone", "Present", "Male", "Male pattern"]]], "bl": "Breasts, no uterus and scant pubic hair in a 46,XY person mean a defective androgen receptor.", "pt": {"hl": ["Androgen insensitivity", "DHT binds androgen receptor"], "say": "The androgen insensitivity box marks the androgen receptor link: AMH still removes the uterus, but testosterone and DHT cannot act, so the genitalia stay female."}, "tags": ["receptor-signaling", "sex-development-signals"], "ef": "rp6_signals", "c": "rp6", "b": "rpdev", "w": {"1": "Low DHT leaves testosterone working, so the Wolffian ducts form and the child virilizes at puberty; this girl has female genitalia and sparse hair instead.", "2": "An SRY defect (Swyer syndrome) produces streak gonads that make no AMH, so a uterus would be present and breasts would not develop without estrogen.", "3": "21-hydroxylase deficiency virilizes a 46,XX fetus that keeps a normal uterus and ovaries; it would not remove the uterus or place gonads in the inguinal canals.", "4": "Absent AMH leaves a uterus and tubes in an otherwise normal male (persistent Müllerian duct syndrome), the opposite of her missing uterus."}}, {"id": "rp6q02", "d": 1, "s": "A 15-year-old girl is evaluated for short stature and absent breast development. Her height is below the 3rd percentile. Examination shows a broad chest with widely spaced nipples, a low posterior hairline with a webbed neck, and blood pressure higher in the arms than in the legs. Serum FSH and LH are elevated.", "l": "Which of the following is the most likely diagnosis?", "o": ["Turner syndrome", "Noonan syndrome", "Klinefelter syndrome", "Swyer syndrome", "Müllerian agenesis"], "a": 0, "e": "Short stature, a shield chest, a webbed neck and a coarctation pattern (arm pressure above leg pressure), together with high FSH and LH, describe **Turner syndrome** (45,X). Her ovaries became streaks, so estrogen is absent and the pituitary answers with high gonadotropins. Noonan syndrome shares the short stature and webbed neck but has a normal karyotype, usually normal ovarian function and pulmonary valve stenosis rather than coarctation. Swyer syndrome also causes high gonadotropins and absent breasts, but without short stature or lymphatic and cardiac findings.", "et": [["Option", "Karyotype", "Ovarian function", "Signature findings"], [["Turner syndrome", "45,X", "Streak ovaries, high FSH", "Short, webbed neck, coarctation"], ["Noonan syndrome", "Normal", "Usually normal", "Short, webbed neck, pulmonary stenosis"], ["Klinefelter syndrome", "47,XXY", "Testes, not ovaries", "Tall male, small testes"], ["Swyer syndrome", "46,XY", "Streak gonads, high FSH", "Normal stature, uterus present"], ["Müllerian agenesis", "46,XX", "Normal", "Breasts present, no uterus"]]], "bl": "Short stature, a webbed neck, coarctation and high gonadotropins in a girl mean Turner syndrome, 45,X.", "pt": {"hl": ["Turner syndrome: 45,X", "Bicuspid aortic valve, coarctation"], "say": "The Turner syndrome panel lists her findings: streak ovaries with high FSH and LH, short stature, a webbed neck and coarctation of the aorta."}, "tags": ["meiosis-karyotype", "feedback-logic"], "ef": "rp6_sexchrom", "c": "rp6", "b": "rpdev", "w": {"1": "Noonan syndrome mimics the webbed neck and short stature, but it is autosomal dominant with a normal karyotype, pulmonary stenosis and usually normal ovarian function.", "2": "Klinefelter syndrome is 47,XXY in a phenotypic male with small firm testes, tall stature and gynecomastia, not a short girl with a webbed neck.", "3": "Swyer syndrome (46,XY with streak gonads) also gives absent breasts and high FSH and LH, but stature is normal and there are no lymphatic or aortic defects.", "4": "Müllerian agenesis leaves the ovaries working, so breasts develop normally and FSH and LH stay normal; only the uterus and upper vagina are missing."}}, {"id": "rp6q03", "d": 2, "s": "A 14-year-old is brought to the physician because of voice deepening and enlargement of what had been considered a clitoris. The patient was raised as a girl after being born with ambiguous genitalia: a small phallus, a bifid scrotum and a urethral opening on the perineum. Examination now shows increased muscle mass, a 5-cm phallus and bilateral testes in the labioscrotal folds. There is no facial hair. Karyotype is 46,XY. Serum testosterone is in the normal adult male range.", "l": "Deficiency of which of the following substances most likely caused the ambiguous genitalia at birth?", "o": ["Dihydrotestosterone", "Testosterone", "Anti-Müllerian hormone", "Estradiol", "Cortisol"], "a": 0, "e": "Ambiguous genitalia at birth followed by virilization at puberty, with normal testosterone, is 5-alpha-reductase deficiency: the missing substance is **dihydrotestosterone**. The external genitalia need DHT to form a penis and scrotum, while the Wolffian ducts need only testosterone. At puberty the high testosterone acts on the androgen receptor directly and virilizes the body, but facial hair, which depends on DHT, stays sparse. Testosterone itself is normal, so a testosterone deficiency does not fit, and normal testes made AMH.", "et": [["Option", "Level in this patient", "What it builds or does", "Effect of deficiency"], [["Dihydrotestosterone", "Low", "Penis, scrotum, prostate", "Ambiguous genitalia at birth"], ["Testosterone", "Normal male", "Wolffian ducts, pubertal muscle", "Undervirilized ducts and body"], ["Anti-Müllerian hormone", "Normal", "Regression of Müllerian ducts", "Uterus persists"], ["Estradiol", "Not relevant", "Breasts, growth-plate fusion", "No effect on genital formation"], ["Cortisol", "Normal", "Stress response", "Raises androgens in CAH"]]], "bl": "Ambiguous genitalia at birth with virilization at puberty and normal testosterone mean too little dihydrotestosterone.", "pt": {"hl": ["5-alpha-reductase: DHT", "5-alpha-reductase deficiency"], "say": "Follow the Leydig branch to the 5-alpha-reductase box: without dihydrotestosterone the genitalia are ambiguous at birth, and the later testosterone surge virilizes the body."}, "tags": ["steroidogenesis-enzymes", "sex-development-signals"], "ef": "rp6_signals", "c": "rp6", "b": "rpdev", "w": {"1": "The measured testosterone is in the adult male range, and testosterone alone built the Wolffian ducts; a true testosterone deficiency would also block virilization at puberty.", "2": "Normal testes make AMH, so the uterus regressed; AMH deficiency would leave a uterus and tubes but would not cause ambiguous external genitalia.", "3": "Estradiol does not build male external genitalia; its lack in a 46,XY fetus has no effect on the formation of the penis and scrotum.", "4": "In 21-hydroxylase deficiency, low cortisol raises adrenal androgens, which virilize a 46,XX fetus; it does not explain undervirilized genitalia with normal testosterone."}}, {"id": "rp6q04", "d": 2, "s": "A 17-year-old girl is evaluated for primary amenorrhea. She is 165 cm tall and has no breast development; pubic hair is Tanner stage 2. External genitalia are normal female. Pelvic ultrasonography shows a small uterus and no identifiable ovaries. Serum FSH and LH are markedly elevated, and estradiol is low. Karyotype is 46,XY.", "l": "This patient is at greatest risk for which of the following?", "o": ["Gonadoblastoma", "Granulosa cell tumor", "Endometrial adenocarcinoma", "Aortic dissection", "Breast carcinoma"], "a": 0, "e": "A 46,XY girl with a uterus, no breast development and high gonadotropins has Swyer syndrome: SRY failed, so the gonads became streaks that made neither AMH nor testosterone nor, later, estrogen. Dysgenetic gonads that contain Y material carry a high risk of **gonadoblastoma**, which can progress to dysgerminoma, so both streaks are removed. A granulosa cell tumor arises from functioning ovarian stroma, which she lacks. Aortic dissection is a Turner risk, but she has normal stature and a Y chromosome.", "et": [["Option", "Tissue of origin", "Driver", "Link to her findings"], [["Gonadoblastoma", "Dysgenetic gonad", "Y chromosome material", "46,XY streak gonads"], ["Granulosa cell tumor", "Ovarian follicle cells", "Functioning ovary", "No follicles in streaks"], ["Endometrial adenocarcinoma", "Endometrium", "Unopposed estrogen", "Estradiol is low"], ["Aortic dissection", "Aortic wall", "Turner syndrome", "Karyotype is 46,XY"], ["Breast carcinoma", "Breast epithelium", "Estrogen exposure", "No breast tissue"]]], "bl": "Streak gonads in a 46,XY girl with Swyer syndrome carry a high gonadoblastoma risk, so they are removed.", "tags": ["risk-factors", "sex-development-signals"], "c": "rp6", "b": "rpdev", "w": {"1": "Granulosa cell tumors arise from functioning ovarian follicle cells and make estrogen; her streak gonads contain no follicles, and the Y material is what drives tumor risk.", "2": "Endometrial cancer needs prolonged estrogen stimulation; her estradiol is low, so the small uterus is atrophic rather than hyperplastic.", "3": "Aortic dilation and dissection complicate Turner syndrome (45,X), which also causes streak gonads, but those girls are short and lack a Y chromosome.", "4": "Breast cancer risk rises with estrogen exposure; she has no breast development and low estradiol, so her risk is not increased."}}, {"id": "rp6q05", "d": 2, "s": "A 17-year-old girl is evaluated for primary amenorrhea. Breast development is Tanner stage 5. Pelvic examination shows a normal vulva and a vagina that ends in a short blind pouch; no cervix is seen. Pelvic ultrasonography shows no uterus. Her physician is deciding between two diagnoses that both explain these findings.", "l": "Which additional finding would most strongly favor androgen insensitivity over Müllerian agenesis?", "o": ["Sparse pubic and axillary hair", "Unilateral renal agenesis", "Normal ovaries on ultrasonography", "Testosterone in the female range", "Normal breast development"], "a": 0, "e": "Both disorders cause primary amenorrhea with breasts, no uterus and a blind vaginal pouch, so the discriminator must be androgen action. In androgen insensitivity, 46,XY testes make male-range testosterone that cannot act, so **pubic and axillary hair are sparse**. In Müllerian agenesis, a 46,XX woman has normal ovaries and female-range testosterone that acts normally, so body hair is normal. Renal agenesis travels with Müllerian agenesis, and normal ovaries or female-range testosterone would also point away from androgen insensitivity. Breast development is present in both.", "et": [["Option", "In androgen insensitivity", "In Müllerian agenesis", "Mechanism"], [["Sparse pubic and axillary hair", "Typical", "Absent; hair is normal", "Androgen present but unable to act"], ["Unilateral renal agenesis", "Not associated", "Associated", "Shared mesonephric development"], ["Normal ovaries on ultrasonography", "Absent; testes instead", "Present", "Gonad follows the karyotype"], ["Testosterone in the female range", "No; male range or higher", "Yes", "High LH drives the testes in androgen insensitivity"], ["Normal breast development", "Present", "Present", "Estrogen present in both"]]], "bl": "Sparse pubic and axillary hair separates androgen insensitivity from Müllerian agenesis, because only androgen insensitivity blocks androgen action.", "tags": ["receptor-signaling", "sex-development-signals"], "c": "rp6", "b": "rpdev", "w": {"1": "Renal agenesis accompanies Müllerian agenesis because the mesonephric and paramesonephric ducts develop together; it would favor Müllerian agenesis, not androgen insensitivity.", "2": "Ovaries mean a 46,XX woman with Müllerian agenesis; androgen insensitivity has testes, usually in the abdomen or the inguinal canals.", "3": "Female-range testosterone fits Müllerian agenesis; in androgen insensitivity high LH drives the testes, so testosterone sits at or above the male range.", "4": "Breasts develop in both conditions, from ovarian estrogen in Müllerian agenesis and from aromatized testosterone in androgen insensitivity, so they do not discriminate."}}, {"id": "rp6q06", "d": 3, "s": "A 32-year-old man comes to the physician because he and his wife have been unable to conceive for 2 years. He is 190 cm tall with long legs and has had bilateral breast enlargement since his teens. Both testes are small and firm, about 2 mL each; there is no testicular mass. Semen analysis shows no sperm. Serum studies show high FSH and LH, low testosterone and an estradiol concentration at the upper limit of normal.", "l": "Which of the following best explains his breast enlargement?", "o": ["High LH driving testicular aromatase", "hCG from a testicular germ cell tumor", "Prolactin secretion by a pituitary adenoma", "A defective androgen receptor in breast tissue", "Reduced hepatic clearance of estrogen"], "a": 0, "e": "Tall stature, small firm testes, azoospermia, high FSH and LH and low testosterone describe Klinefelter syndrome (47,XXY). Failing Leydig cells release the pituitary brake, and the **high LH** stimulates testicular aromatase, so estradiol rises relative to testosterone; that shift in the estrogen-to-androgen ratio grows breast tissue. An hCG-secreting germ cell tumor also raises estradiol through aromatase, but it would suppress FSH and LH and usually presents as a testicular mass. A prolactinoma would lower LH and FSH, not raise them.", "et": [["Option", "Effect on FSH and LH", "Testicular findings", "Link to gynecomastia"], [["High LH driving testicular aromatase", "Both high (primary failure)", "Small, firm, no mass", "Estradiol rises relative to testosterone"], ["hCG from a testicular germ cell tumor", "Suppressed", "Mass, often enlarged", "hCG drives aromatase"], ["Prolactin secretion by a pituitary adenoma", "Suppressed", "Normal or soft", "Weak; causes galactorrhea"], ["A defective androgen receptor in breast tissue", "LH high", "Testes in a female phenotype", "Unopposed estrogen action"], ["Reduced hepatic clearance of estrogen", "Variable", "Atrophy late in liver disease", "Estrogen accumulates"]]], "bl": "In Klinefelter syndrome, high LH drives testicular aromatase, so estradiol rises relative to testosterone and causes gynecomastia.", "pt": {"hl": ["LH drives aromatase: gynecomastia", "Testosterone low, so LH high"], "say": "In the Klinefelter panel, low testosterone raises LH, and LH drives aromatase: estradiol climbs relative to testosterone, which explains the gynecomastia."}, "tags": ["feedback-logic", "meiosis-karyotype"], "ef": "rp6_sexchrom", "c": "rp6", "b": "rpdev", "w": {"1": "An hCG-secreting tumor does raise estradiol through aromatase, but hCG suppresses pituitary FSH and LH, and his testes are small without a mass.", "2": "A prolactinoma suppresses GnRH, so LH and FSH would be low, and it causes galactorrhea more than true gynecomastia; his gonadotropins are high.", "3": "Androgen receptor defects cause androgen insensitivity in a 46,XY person who looks female from birth; this man virilized and has a male phenotype.", "4": "Cirrhosis raises estrogen through poor clearance, but it does not cause small firm testes since adolescence, azoospermia and high FSH in a healthy young man."}}, {"id": "rp6q07", "d": 3, "s": "A newborn is evaluated for ambiguous genitalia: an enlarged clitoris and partially fused labioscrotal folds without palpable gonads. During the third trimester the mother developed acne, hirsutism and a deepening voice, which are now improving. Karyotype is 46,XX. Ultrasonography shows a uterus and ovaries. Serum sodium, potassium and 17-hydroxyprogesterone are normal. Maternal serum estriol was low during pregnancy.", "l": "A deficiency of which of the following enzymes is most likely?", "o": ["Aromatase", "21-hydroxylase", "11-beta-hydroxylase", "5-alpha-reductase", "17-alpha-hydroxylase"], "a": 0, "e": "A virilized 46,XX newborn whose mother was also virilized in late pregnancy, with low maternal estriol, has placental **aromatase** deficiency. The placenta normally converts fetal adrenal androgens into estrogens; without aromatase, the androgens virilize both the fetus and the mother. 21-hydroxylase deficiency is the most common cause of a virilized 46,XX newborn, but it raises 17-hydroxyprogesterone, often wastes salt and spares the mother, because intact placental aromatase converts the extra fetal androgen. 11-beta-hydroxylase deficiency also virilizes but raises 11-deoxycortisol.", "et": [["Option", "Newborn 46,XX genitalia", "Mother virilized", "Key lab"], [["Aromatase", "Virilized", "Yes", "Low maternal estriol"], ["21-hydroxylase", "Virilized", "No", "High 17-hydroxyprogesterone"], ["11-beta-hydroxylase", "Virilized", "No", "High 11-deoxycortisol"], ["5-alpha-reductase", "Normal female", "No", "High testosterone-to-DHT ratio in 46,XY"], ["17-alpha-hydroxylase", "Normal female", "No", "Low androgens, high mineralocorticoids"]]], "bl": "A virilized 46,XX newborn with a virilized mother and normal 17-hydroxyprogesterone points to placental aromatase deficiency.", "pt": {"hl": ["CAH or aromatase deficiency", "46,XX with extra androgen"], "say": "The bottom box shows extra androgen reaching a 46,XX fetus; with a virilized mother and normal 17-hydroxyprogesterone, the source is placental aromatase deficiency, not CAH."}, "tags": ["steroidogenesis-enzymes", "maternal-fetal-transfer"], "ef": "rp6_signals", "c": "rp6", "b": "rpdev", "w": {"1": "21-hydroxylase deficiency is the commonest cause of a virilized 46,XX newborn, but it raises 17-hydroxyprogesterone, and the intact placenta shields the mother from fetal androgen.", "2": "11-beta-hydroxylase deficiency virilizes a 46,XX fetus and later causes hypertension from 11-deoxycorticosterone, but it does not virilize the mother, whose placenta still aromatizes.", "3": "5-alpha-reductase deficiency undervirilizes a 46,XY fetus by lowering DHT; it cannot add androgen to a 46,XX fetus or virilize the mother.", "4": "17-alpha-hydroxylase deficiency blocks androgen synthesis, so a 46,XX child is not virilized and instead has absent puberty and hypertension."}}, {"id": "rp6q08", "d": 3, "s": "A female newborn is examined in the nursery. First-trimester ultrasonography showed a large cystic hygroma with increased nuchal translucency, and the parents declined further testing. Examination shows puffy swelling of the backs of both hands and feet, loose skin at the nape of the neck and weak femoral pulses. Tone is normal, and there are no upslanting palpebral fissures or single palmar creases.", "l": "Which of the following is most likely to be found on further evaluation?", "o": ["Coarctation of the aorta", "Atrioventricular septal defect", "Tetralogy of Fallot", "Transposition of the great arteries", "Supravalvular aortic stenosis"], "a": 0, "e": "Lymphedema of the hands and feet, loose nuchal skin and a prenatal cystic hygroma in a girl point to Turner syndrome, and weak femoral pulses point to its classic lesion, **coarctation of the aorta**. The fetal lymphatic defect produced the hygroma, which left redundant neck skin. Increased nuchal translucency also occurs in Down syndrome, whose signature heart lesion is an atrioventricular septal defect, but normal tone, no upslanting palpebral fissures and no single palmar crease argue against it. Supravalvular aortic stenosis belongs to Williams syndrome.", "et": [["Option", "Associated syndrome", "Presenting sign", "Nuchal or lymphatic link"], [["Coarctation of the aorta", "Turner syndrome", "Weak femoral pulses", "Cystic hygroma, lymphedema"], ["Atrioventricular septal defect", "Down syndrome", "Murmur, heart failure", "Increased nuchal translucency"], ["Tetralogy of Fallot", "22q11 deletion", "Cyanotic spells", "None"], ["Transposition of the great arteries", "Maternal diabetes", "Cyanosis at birth", "None"], ["Supravalvular aortic stenosis", "Williams syndrome", "Murmur, hypercalcemia", "None"]]], "bl": "Newborn lymphedema with a prenatal cystic hygroma means Turner syndrome, and weak femoral pulses mean coarctation of the aorta.", "pt": {"hl": ["Bicuspid aortic valve, coarctation", "Cystic hygroma, then webbed neck"], "say": "The Turner panel links the cystic hygroma and lymphedema to the cardiac finding, coarctation of the aorta, which explains the weak femoral pulses."}, "tags": ["imaging-to-diagnosis", "meiosis-karyotype"], "ef": "rp6_sexchrom", "c": "rp6", "b": "rpdev", "w": {"1": "An atrioventricular septal defect is the heart lesion of Down syndrome, which also raises nuchal translucency, but this infant has normal tone and no Down facial or palmar features.", "2": "Tetralogy of Fallot links to 22q11 deletion and Down syndrome and causes cyanosis with a harsh murmur, not weak femoral pulses with lymphedema.", "3": "Transposition presents with severe cyanosis soon after birth and is associated with maternal diabetes, not with a fetal lymphatic defect or weak femoral pulses.", "4": "Supravalvular aortic stenosis belongs to Williams syndrome, with elfin facies, hypercalcemia and a friendly personality, not lymphedema in a newborn girl."}}, {"id": "rp6q09", "d": 2, "s": "A 17-year-old boy is brought to the physician because he has not started puberty. He was born with a cleft lip and says he has never been able to smell smoke or food. He is at the 25th percentile for height. Testes are 2 mL bilaterally and the penis is prepubertal; there is no pubic hair. Serum LH, FSH and testosterone are below the reference range. Karyotype is 46,XY.", "l": "Failure of which of the following processes is the most likely cause of his condition?", "o": ["Migration of GnRH neurons from the olfactory placode", "Differentiation of Leydig cells in the fetal testis", "Signaling through the androgen receptor", "Separation of sex chromosomes during meiosis", "Conversion of testosterone to dihydrotestosterone"], "a": 0, "e": "Anosmia with absent puberty and low LH, FSH and testosterone is Kallmann syndrome, caused by failed **migration of GnRH neurons** from the olfactory placode to the hypothalamus. Olfactory neurons travel the same path and fail too, which explains the anosmia, and midline defects such as a cleft lip can accompany it. Without GnRH the pituitary releases no gonadotropins, so this is hypogonadotropic hypogonadism. Failed separation of sex chromosomes would produce Klinefelter syndrome, whose gonadotropins are high, and an androgen receptor defect would raise LH.", "et": [["Option", "LH and FSH", "Smell", "Genitalia at birth"], [["Migration of GnRH neurons from the olfactory placode", "Low", "Absent", "Normal male"], ["Differentiation of Leydig cells in the fetal testis", "High", "Normal", "Undervirilized"], ["Signaling through the androgen receptor", "LH high", "Normal", "Female"], ["Separation of sex chromosomes during meiosis", "High", "Normal", "Normal male"], ["Conversion of testosterone to dihydrotestosterone", "Normal", "Normal", "Ambiguous"]]], "bl": "Anosmia with low LH, FSH and testosterone means Kallmann syndrome, from failed migration of GnRH neurons out of the olfactory placode.", "tags": ["embryologic-origin", "feedback-logic"], "c": "rp6", "b": "rpdev", "w": {"1": "Leydig cell failure would cause ambiguous genitalia at birth and high LH; his genitalia formed normally because placental hCG drove fetal Leydig cells.", "2": "An androgen receptor defect makes a 46,XY person look female with high LH and testosterone; his hormones are all low and his genitalia are male.", "3": "Nondisjunction causes Klinefelter syndrome (47,XXY), with small firm testes and high FSH and LH; his karyotype is 46,XY and his gonadotropins are low.", "4": "5-alpha-reductase deficiency causes ambiguous genitalia at birth with normal testosterone; it would not explain anosmia or undetectable LH and FSH."}}, {"id": "rp6q10", "d": 2, "s": "A 28-year-old man is evaluated for infertility. He has normal male external genitalia, is 172 cm tall and has sparse body hair. Both testes are small, about 4 mL. Semen analysis shows azoospermia. Serum FSH and LH are elevated and testosterone is low-normal. Karyotype on peripheral blood shows 46,XX in all cells examined.", "l": "Which of the following best explains how testes developed in this patient?", "o": ["Translocation of SRY onto an X chromosome", "Nondisjunction of the X chromosome in maternal meiosis", "Excess adrenal androgen from 21-hydroxylase deficiency", "Mosaicism for a 45,X cell line", "Gain-of-function mutation of the androgen receptor"], "a": 0, "e": "Testes form only when SRY is present, so a 46,XX man with testes carries SRY on one X chromosome after a **translocation** during paternal meiosis, when crossing over extended past the pseudoautosomal region. SRY made the gonads testes, which produced AMH and testosterone, so he is male. The rest of the Y, including genes needed for spermatogenesis, is missing, so he is azoospermic with small testes, much like Klinefelter syndrome. X nondisjunction would give 47,XXY, and 21-hydroxylase deficiency virilizes 46,XX girls who keep their ovaries.", "et": [["Option", "Karyotype produced", "Gonad", "Typical phenotype"], [["Translocation of SRY onto an X chromosome", "46,XX", "Small testes", "Azoospermic male"], ["Nondisjunction of the X chromosome in maternal meiosis", "47,XXY", "Small testes", "Tall azoospermic male"], ["Excess adrenal androgen from 21-hydroxylase deficiency", "46,XX", "Ovaries", "Virilized girl with a uterus"], ["Mosaicism for a 45,X cell line", "45,X/46,XX", "Streak gonads", "Short girl, Turner features"], ["Gain-of-function mutation of the androgen receptor", "Unchanged", "Follows SRY status", "No change in gonadal sex"]]], "bl": "A 46,XX man with testes has SRY moved onto an X chromosome; he is azoospermic because other Y genes are missing.", "tags": ["sex-development-signals", "meiosis-karyotype"], "c": "rp6", "b": "rpdev", "w": {"1": "Maternal X nondisjunction can produce 47,XXY Klinefelter syndrome, which looks similar, but his karyotype shows only two sex chromosomes.", "2": "Adrenal androgen excess virilizes the external genitalia of a 46,XX fetus, but the gonads remain ovaries and a uterus is present; it cannot create testes.", "3": "A 45,X line causes Turner features and streak gonads; all of his cells are 46,XX, and he has testes rather than streaks.", "4": "Androgen receptor activity changes the response to androgen but cannot turn an ovary into a testis; gonadal sex depends on SRY."}}, {"id": "rp6q11", "d": 1, "s": "A 25-year-old woman with complete androgen insensitivity syndrome comes for a routine visit. She had her gonads removed at 18 and takes estrogen. She has always identified as a woman and is in a relationship with a man. Her karyotype is 46,XY, and her external genitalia are female.", "l": "Her 46,XY karyotype describes which of the following?", "o": ["Genotypic sex", "Phenotypic sex", "Gender identity", "Gonadal sex", "Sexual orientation"], "a": 0, "e": "The karyotype is **genotypic sex**, fixed at fertilization. Her phenotypic sex, the body built by hormones, is female because her androgen receptors could not respond to testosterone. Gender identity is her inner sense of being a woman, which she reports, and sexual orientation describes whom she is attracted to; neither is read from the karyotype. Gonadal sex refers to the gonads, which were testes before removal. Each layer can differ from the others, so clinicians describe them separately and ask patients about identity.", "et": [["Option", "What it describes", "How it is determined", "Her status"], [["Genotypic sex", "Chromosomal complement", "Karyotype", "46,XY"], ["Phenotypic sex", "Body built by hormones", "Examination", "Female"], ["Gender identity", "Inner sense of gender", "Asking the person", "Woman"], ["Gonadal sex", "Type of gonad", "Histology or imaging", "Testes, removed"], ["Sexual orientation", "Pattern of attraction", "Asking the person", "Attracted to men"]]], "bl": "The karyotype is genotypic sex; phenotypic sex is the body hormones build, and gender identity is the person's inner sense.", "tags": ["sex-development-signals"], "c": "rp6", "b": "rpdev", "w": {"1": "Phenotypic sex is the body that hormones build, including the ducts, genitalia and breasts; hers is female despite the 46,XY karyotype because androgen could not act.", "2": "Gender identity is a person's own inner sense of gender, learned by asking; it cannot be deduced from the chromosomes.", "3": "Gonadal sex is whether the gonads are testes or ovaries; hers were testes before gonadectomy, a separate layer from the chromosomes.", "4": "Sexual orientation describes whom a person is attracted to and is independent of karyotype, gonads, anatomy and gender identity."}}, {"id": "rp6q12", "d": 2, "s": "A 5-day-old infant is brought to the emergency department because of vomiting and poor feeding. At birth the genitalia were ambiguous, with clitoral enlargement and fused labioscrotal folds, and no gonads were palpable. Blood pressure is 55/30 mm Hg. Serum sodium is 124 mEq/L and potassium is 6.8 mEq/L. Serum 17-hydroxyprogesterone is markedly elevated.", "l": "Which of the following internal structures are most likely present in this infant?", "o": ["Ovaries, uterus and fallopian tubes", "Testes, epididymis and vas deferens", "Streak gonads with a uterus", "Testes with a uterus", "Ovaries without a uterus"], "a": 0, "e": "Salt wasting, hyperkalemia and a high 17-hydroxyprogesterone in a virilized infant mean 21-hydroxylase deficiency, the most common cause of ambiguous genitalia in a 46,XX newborn. Adrenal androgens virilize only the external genitalia; the gonads are **ovaries**, and because no testis made AMH, the **uterus and fallopian tubes** are present. Testes with Wolffian ducts would require SRY and a 46,XY karyotype, and streak gonads with a uterus describe Swyer or Turner syndrome, which are not virilizing and do not waste salt.", "et": [["Option", "Gonad", "Müllerian structures", "Condition it fits"], [["Ovaries, uterus and fallopian tubes", "Ovaries", "Present", "21-hydroxylase deficiency, 46,XX"], ["Testes, epididymis and vas deferens", "Testes", "Absent", "Normal or undervirilized 46,XY"], ["Streak gonads with a uterus", "Streaks", "Present", "Swyer or Turner syndrome"], ["Testes with a uterus", "Testes", "Present", "Persistent Müllerian duct syndrome"], ["Ovaries without a uterus", "Ovaries", "Absent", "Müllerian agenesis"]]], "bl": "A salt-wasting virilized infant with CAH is 46,XX with ovaries, a uterus and fallopian tubes, because no AMH was made.", "tags": ["steroidogenesis-enzymes", "sex-development-signals"], "c": "rp6", "b": "rpdev", "w": {"1": "Male internal organs need SRY-driven testes and local testosterone; 21-hydroxylase deficiency adds adrenal androgen to a 46,XX fetus but cannot create testes.", "2": "Streak gonads with a uterus describe Swyer or Turner syndrome, which give female genitalia without salt wasting or a raised 17-hydroxyprogesterone.", "3": "Testes with a uterus occur when AMH or its receptor fails in a 46,XY male, who has normal male genitalia and normal adrenal function.", "4": "Ovaries without a uterus describe Müllerian agenesis in a 46,XX woman with normal external genitalia; nothing in CAH removes the uterus."}}, {"id": "rp7q01", "d": 1, "s": "An 11-year-old boy is brought for a well-child visit. His parents ask what physical change will signal that puberty has begun. He is healthy, his height has followed the 50th percentile, and he has no pubic or axillary hair. His testes measure 2 mL each.", "l": "Which of the following is most likely to be the first sign of puberty in this boy?", "o": ["Testicular enlargement", "Pubic hair growth", "Penile lengthening", "Voice deepening", "Peak height velocity"], "a": 0, "e": "Rising FSH and LH first enlarge the seminiferous tubules, so **testicular enlargement** to a volume of 4 mL or more is the first sign of male puberty, usually near age 11. Pubic hair growth follows within months, and penile lengthening comes with genital stage 3. The growth spurt in boys is late, with peak height velocity near genital stage 3 to 4, and voice deepening needs sustained testosterone, so it appears even later.", "et": [["Option", "Hormone driver", "Tanner stage when seen", "Typical timing"], [["Testicular enlargement", "FSH and LH", "Genital stage 2", "About age 11, first"], ["Pubic hair growth", "Adrenal and testicular androgens", "Pubic hair stage 2", "Months after the testes"], ["Penile lengthening", "Testosterone", "Genital stage 3", "About a year in"], ["Voice deepening", "Testosterone", "Genital stage 4", "Late"], ["Peak height velocity", "Sex steroids and growth hormone", "Genital stage 3 to 4", "About age 13.5"]]], "bl": "In boys, testicular enlargement to 4 mL or more is the first sign of puberty.", "pt": {"hl": ["Testicular enlargement to 4 mL"], "say": "In the boys panel the top bar, testicular enlargement to 4 mL, starts first; pubic hair, penile growth and the growth spurt all begin later."}, "tags": ["hormone-timeline"], "ef": "rp7_sequence", "c": "rp7", "b": "rpdev", "w": {"1": "Pubic hair usually follows testicular enlargement by months, and early pubic hair can come from adrenal androgens alone, so it does not mark gonadal puberty.", "2": "The penis lengthens in genital stage 3, after testosterone from the enlarging testes has been rising for months.", "3": "Laryngeal growth needs sustained high testosterone, so the voice breaks late, around genital stage 4.", "4": "Boys reach their fastest growth late, near genital stage 3 to 4 and about two years after girls, so it cannot be the first sign."}}, {"id": "rp7q02", "d": 1, "s": "A 10-year-old girl is brought to the physician because her mother noticed a small, tender lump under each nipple. She has no pubic hair. Examination shows a firm button of tissue beneath each areola, with the breast elevated as a small mound. Her growth velocity has recently increased.", "l": "Which hormone is chiefly responsible for this change?", "o": ["Estradiol", "DHEA-S", "Progesterone", "Prolactin", "Testosterone"], "a": 0, "e": "A tender subareolar button in a 10-year-old is thelarche, Tanner breast stage 2, and the normal first sign of female puberty. Ovarian **estradiol**, released as pulsatile GnRH drives FSH and LH, stimulates ductal growth of the breast. DHEA-S from the adrenal drives pubic and axillary hair, not breast tissue. Progesterone, which develops the lobules, rises only after ovulation begins, and prolactin acts on breast tissue already built by estrogen.", "et": [["Option", "Main source", "Main pubertal effect", "Timing"], [["Estradiol", "Ovary", "Breast and uterine growth", "From thelarche onward"], ["DHEA-S", "Adrenal zona reticularis", "Pubic and axillary hair", "Adrenarche, ages 6 to 8"], ["Progesterone", "Corpus luteum", "Lobular breast growth", "After ovulation begins"], ["Prolactin", "Anterior pituitary", "Milk production", "Pregnancy and lactation"], ["Testosterone", "Testis, small ovarian amounts", "Virilization", "Male puberty"]]], "bl": "The breast bud of thelarche is driven by ovarian estradiol and is the first visible sign of female puberty.", "tags": ["hormone-actions"], "c": "rp7", "b": "rpdev", "w": {"1": "This adrenal androgen rises at adrenarche and grows pubic and axillary hair; it is weak and does not build breast tissue.", "2": "Progesterone develops the breast lobules only after ovulatory cycles begin, which is after menarche, years after the breast bud appears.", "3": "Prolactin drives milk production in breast tissue that estrogen has already built; it does not start pubertal breast growth.", "4": "Testosterone opposes breast growth; breast tissue in a boy appears only when estradiol rises relative to testosterone."}}, {"id": "rp7q03", "d": 2, "s": "A 6-year-old girl is brought to the physician because of breast development over the past 8 months. She is at the 97th percentile for height, up from the 50th percentile a year ago. Breasts are Tanner stage 3 and pubic hair is Tanner stage 2. Bone age is 9 years. LH rises to a pubertal level after leuprolide stimulation. MRI of the brain is normal.", "l": "Which of the following is the most appropriate treatment?", "o": ["Depot leuprolide injections", "Pulsatile GnRH by pump", "Letrozole", "Spironolactone", "Observation until age 8"], "a": 0, "e": "Pubertal LH after stimulation, an advanced bone age and rapid growth before age 8 mean central precocious puberty, idiopathic in most girls once the MRI is normal. **Depot leuprolide**, a continuous GnRH agonist, first stimulates and then downregulates pituitary GnRH receptors, so LH, FSH and estradiol fall, puberty halts and adult height is protected. Pulsatile GnRH does the opposite: it mimics the natural pulse generator and stimulates the axis. Observation risks further bone age advance and a short adult height.", "et": [["Option", "Target", "Effect on the axis", "Role here"], [["Depot leuprolide injections", "Pituitary GnRH receptor", "Downregulation, LH and FSH fall", "First-line for central disease"], ["Pulsatile GnRH by pump", "Pituitary GnRH receptor", "Stimulates LH and FSH", "Induces puberty or ovulation"], ["Letrozole", "Aromatase", "Estrogen falls, axis untouched", "Some peripheral causes"], ["Spironolactone", "Androgen receptor", "None on GnRH", "Androgen excess, not estrogen"], ["Observation until age 8", "None", "Puberty continues", "Normal variants only"]]], "bl": "Central precocious puberty is treated with a continuous GnRH agonist such as depot leuprolide, which downregulates pituitary GnRH receptors.", "pt": {"hl": ["Treat: continuous GnRH agonist", "Central (GnRH-dependent)"], "say": "In the central column, a pubertal LH leads to the last line: treat with a continuous GnRH agonist such as depot leuprolide, which shuts the axis down."}, "tags": ["pulsatile-signaling", "drug-mechanism"], "ef": "rp7_precocious", "c": "rp7", "b": "rpdev", "w": {"1": "Pulsed GnRH reproduces the normal pubertal signal and stimulates LH and FSH; it is used to induce puberty or ovulation, not to stop it.", "2": "An aromatase inhibitor lowers estrogen but leaves the central axis running; it has a role in some peripheral causes, not as first-line therapy for central disease.", "3": "Spironolactone blocks androgen receptors and would do nothing about estrogen-driven breast growth or the advancing bone age.", "4": "Waiting lets estrogen keep advancing her bone age, already 3 years ahead, which would close her growth plates early and shorten adult height."}}, {"id": "rp7q04", "d": 3, "s": "A 5-year-old girl is brought to the physician because of vaginal bleeding for 3 days and breast enlargement over 2 months. She has had a limp and pain in the right thigh. Examination shows Tanner stage 2 breasts, no pubic hair, and a large hyperpigmented macule with a jagged border on the lower back. Radiographs of the femur show a ground-glass lesion. Serum estradiol is elevated, and LH and FSH are suppressed. Pelvic ultrasonography shows a 3-cm ovarian cyst.", "l": "Which of the following is the most likely mechanism of her condition?", "o": ["Activating mutation of the Gs alpha subunit", "Early activation of the GnRH pulse generator", "Loss-of-function mutation of neurofibromin", "Deficiency of adrenal 21-hydroxylase", "hCG secretion by a germ cell tumor"], "a": 0, "e": "Vaginal bleeding with suppressed LH and FSH, a café-au-lait macule with a jagged border and fibrous dysplasia of the femur form the triad of McCune-Albright syndrome. A postzygotic **activating mutation of the Gs alpha subunit** (GNAS) keeps cAMP signaling on, so ovarian cysts make estrogen without gonadotropins, which is peripheral precocious puberty. Early activation of the GnRH pulse generator would raise LH. Neurofibromatosis type 1 also causes café-au-lait macules, but they have smooth borders, and its precocious puberty is central, from an optic glioma.", "et": [["Option", "LH and FSH", "Skin or bone clue", "Main hormone effect"], [["Activating mutation of the Gs alpha subunit", "Suppressed", "Jagged café-au-lait, fibrous dysplasia", "Estrogen from ovarian cysts"], ["Early activation of the GnRH pulse generator", "Pubertal", "None", "Estrogen from normal ovaries"], ["Loss-of-function mutation of neurofibromin", "Pubertal", "Smooth café-au-lait, neurofibromas", "Central puberty from optic glioma"], ["Deficiency of adrenal 21-hydroxylase", "Suppressed", "None", "Adrenal androgen, virilization"], ["hCG secretion by a germ cell tumor", "LH suppressed, hCG high", "None", "Testosterone in boys"]]], "bl": "Peripheral precocious puberty with jagged café-au-lait macules and fibrous dysplasia means McCune-Albright syndrome, an activating Gs alpha (GNAS) mutation.", "pt": {"hl": ["McCune-Albright (GNAS)", "LH low, suppressed by steroids"], "say": "The peripheral column fits: LH is suppressed, and McCune-Albright (GNAS) is listed, an activating mutation of the Gs alpha subunit that lets ovarian cysts make estrogen on their own."}, "tags": ["receptor-signaling", "hormone-source"], "ef": "rp7_precocious", "c": "rp7", "b": "rpdev", "w": {"1": "Central precocious puberty raises LH and FSH to pubertal levels; her suppressed gonadotropins show that the estrogen comes from outside the axis.", "2": "Neurofibromatosis type 1 gives smooth-bordered café-au-lait macules and, through optic gliomas, central precocious puberty with high LH, not fibrous dysplasia of bone.", "3": "21-hydroxylase deficiency causes peripheral puberty from adrenal androgens, producing pubic hair and virilization rather than breast growth and vaginal bleeding.", "4": "hCG-secreting tumors cause peripheral puberty mainly in boys, because hCG alone stimulates Leydig cells; it would not explain the skin and bone lesions."}}, {"id": "rp7q05", "d": 3, "s": "A 7-year-old boy is brought to the physician because of pubic hair, acne and rapid growth over the past year. He is at the 95th percentile for height, up from the 50th percentile at age 5. The penis is enlarged, and pubic hair is Tanner stage 3. Both testes are 2 mL. Bone age is 11 years. Serum LH is prepubertal, and serum 17-hydroxyprogesterone is markedly elevated.", "l": "Which of the following is the most likely diagnosis?", "o": ["21-hydroxylase deficiency", "Hypothalamic hamartoma", "Leydig cell tumor", "hCG-secreting germinoma", "Familial male-limited precocious puberty"], "a": 0, "e": "Virilization with prepubertal-size testes and a prepubertal LH means the androgen comes from outside the testes, and a markedly high 17-hydroxyprogesterone points to the adrenal: this is simple virilizing **21-hydroxylase deficiency**. The testes enlarge when gonadotropins, hCG or an activating LH-receptor mutation stimulate them; adrenal androgens leave them small. A hypothalamic hamartoma causes central puberty with pubertal LH and bilateral testicular enlargement, and a Leydig cell tumor enlarges one testis.", "et": [["Option", "LH", "Testes", "Distinguishing lab"], [["21-hydroxylase deficiency", "Prepubertal", "Small, both", "High 17-hydroxyprogesterone"], ["Hypothalamic hamartoma", "Pubertal", "Enlarged, both", "Pubertal LH after GnRH"], ["Leydig cell tumor", "Suppressed", "One enlarged, mass", "High testosterone, normal adrenal markers"], ["hCG-secreting germinoma", "Suppressed, hCG high", "Mildly enlarged, both", "High serum hCG"], ["Familial male-limited precocious puberty", "Suppressed", "Mildly enlarged, both", "LH receptor mutation"]]], "bl": "Virilization with small testes, a prepubertal LH and high 17-hydroxyprogesterone in a boy means 21-hydroxylase deficiency causing peripheral precocious puberty.", "tags": ["hormone-source", "steroidogenesis-enzymes"], "c": "rp7", "b": "rpdev", "w": {"1": "A hamartoma triggers central puberty, so LH would be pubertal and both testes would enlarge; his LH is prepubertal and his testes are small.", "2": "A Leydig cell tumor makes testosterone inside one testis, which is enlarged and often has a palpable mass; both of his testes are small and 17-hydroxyprogesterone would be normal.", "3": "hCG acts at the LH receptor and stimulates both testes, which enlarge modestly; it does not raise 17-hydroxyprogesterone.", "4": "An activating LH-receptor mutation makes the testes produce testosterone and grow somewhat without LH; the adrenal marker 17-hydroxyprogesterone stays normal."}}, {"id": "rp7q06", "d": 2, "s": "A 15-year-old boy is brought to the physician because he is the shortest in his class and has not started puberty. He is healthy, eats well and plays soccer. His height has tracked along the 3rd percentile since early childhood. His father had his growth spurt at 16 and grew through college. Testes are 3 mL bilaterally, and there is no pubic hair. He can identify odors normally. Bone age is 12.5 years. LH and FSH are low but appropriate for his bone age.", "l": "Which of the following is the most likely diagnosis?", "o": ["Constitutional delay", "Kallmann syndrome", "Klinefelter syndrome", "Growth hormone deficiency", "Primary hypothyroidism"], "a": 0, "e": "A healthy, short boy growing steadily along his own percentile, with a father who matured late, a bone age 2.5 years behind and gonadotropins appropriate for that bone age has **constitutional delay** of growth and puberty, the most common cause of late puberty. His puberty will start on its own, and his adult height should fall in the low-normal range. Kallmann syndrome also gives low gonadotropins, but he smells normally. Klinefelter syndrome would raise FSH and LH, and growth hormone deficiency usually causes a falling growth velocity.", "et": [["Option", "LH and FSH", "Growth pattern", "Clue that decides"], [["Constitutional delay", "Low, fit bone age", "Steady along a low percentile", "Late-maturing father"], ["Kallmann syndrome", "Low", "Steady, then no spurt", "Anosmia"], ["Klinefelter syndrome", "High", "Tall", "Small firm testes"], ["Growth hormone deficiency", "Normal", "Falling velocity", "Low IGF-1"], ["Primary hypothyroidism", "Variable", "Falling velocity", "High TSH"]]], "bl": "A healthy short boy with a delayed bone age and a late-maturing parent has constitutional delay, the most common cause of late puberty.", "tags": ["normal-vs-pathologic", "feedback-logic"], "c": "rp7", "b": "rpdev", "w": {"1": "Kallmann syndrome also causes low LH and FSH, but anosmia is its hallmark and there is usually no family history of late maturation; he identifies odors normally.", "2": "Klinefelter syndrome is primary testicular failure, so FSH and LH would be high, and boys are usually tall rather than short.", "3": "Growth hormone deficiency makes a child fall away from the growth curve with slowing velocity; he has grown steadily along his own percentile.", "4": "Hypothyroidism can slow both growth and puberty, but it causes fatigue, weight gain and a falling growth velocity, none of which he has."}}, {"id": "rp7q07", "d": 3, "s": "A 15-year-old girl is brought to the physician because she has no breast development. She trains in gymnastics for 25 hours each week and has lost 4 kg this year. Her BMI is 16 kg/m2. She identifies smells normally and has no headaches, visual changes or galactorrhea. Breasts and pubic hair are Tanner stage 1. Serum LH, FSH and estradiol are low; prolactin and TSH are normal. Bone age is 12 years.", "l": "Which of the following best explains her delayed puberty?", "o": ["Low leptin suppressing GnRH pulses", "Failed migration of GnRH neurons", "Streak ovaries from a 45,X karyotype", "Prolactin suppressing GnRH release", "A defective androgen receptor"], "a": 0, "e": "Intense training with weight loss and a very low BMI, low LH, FSH and estradiol, and normal smell, prolactin and TSH describe functional hypogonadotropic hypogonadism. Fat stores fall, so **leptin** falls, and without its permissive signal the hypothalamus slows GnRH pulses; puberty stalls until energy balance is restored. Failed migration of GnRH neurons (Kallmann syndrome) also lowers gonadotropins but brings anosmia. Streak ovaries in Turner syndrome would raise FSH and LH, and a prolactinoma is excluded by the normal prolactin.", "et": [["Option", "LH and FSH", "Distinguishing clue", "Course"], [["Low leptin suppressing GnRH pulses", "Low", "Low BMI, intense training", "Reverses with weight gain"], ["Failed migration of GnRH neurons", "Low", "Anosmia", "Permanent"], ["Streak ovaries from a 45,X karyotype", "High", "Short stature, webbed neck", "Permanent ovarian failure"], ["Prolactin suppressing GnRH release", "Low", "High prolactin, galactorrhea", "Treatable with dopamine agonist"], ["A defective androgen receptor", "LH high", "46,XY, breasts, no uterus", "Permanent receptor defect"]]], "bl": "Delayed puberty in a thin, heavily training athlete with low gonadotropins reflects low leptin suppressing GnRH pulses.", "tags": ["feedback-logic", "pulsatile-signaling"], "c": "rp7", "b": "rpdev", "w": {"1": "Kallmann syndrome also causes low LH and FSH, but the olfactory neurons fail with the GnRH neurons, so anosmia would be present; she smells normally.", "2": "Turner streak ovaries remove estrogen feedback, so FSH and LH would be high, and short stature with lymphatic findings would be expected.", "3": "Hyperprolactinemia inhibits hypothalamic kisspeptin signaling and would lower gonadotropins, but a pituitary adenoma usually adds galactorrhea, and her measured level is normal.", "4": "Androgen insensitivity gives breast development from aromatized testosterone and high LH; she has no breasts and low gonadotropins."}}, {"id": "rp7q08", "d": 2, "s": "A 14-year-old girl is brought to the physician because she has not developed breasts. She has always been the shortest in her class, and her height is below the 3rd percentile. Pubic hair is Tanner stage 2, and breasts are Tanner stage 1. She has a high-arched palate and short fourth metacarpals. Serum FSH and LH are markedly elevated, and estradiol is low.", "l": "Which of the following is the most appropriate next step in diagnosis?", "o": ["Karyotype", "MRI of the brain", "GnRH stimulation test", "Serum prolactin", "Pelvic MRI to assess the uterus"], "a": 0, "e": "High FSH and LH with low estradiol mean the ovaries have failed, which is hypergonadotropic hypogonadism, and in a short girl with a high-arched palate and short fourth metacarpals the likely cause is Turner syndrome. A **karyotype** confirms 45,X or mosaicism and detects Y material that would require gonadectomy. Pubic hair is present because adrenarche does not need the ovaries. Brain MRI and prolactin investigate low gonadotropins, and a GnRH stimulation test adds nothing when LH and FSH are already high.", "et": [["Option", "What it checks", "Useful when LH and FSH are", "Finding expected here"], [["Karyotype", "Is there a sex chromosome disorder?", "High", "45,X or mosaic"], ["MRI of the brain", "Is there a central lesion?", "Low", "Normal"], ["GnRH stimulation test", "Can the pituitary respond?", "Low or borderline", "Already exaggerated"], ["Serum prolactin", "Is prolactin suppressing GnRH?", "Low", "Normal"], ["Pelvic MRI to assess the uterus", "Is the uterus present?", "Normal, with breasts", "Small prepubertal uterus"]]], "bl": "Delayed puberty with high FSH and LH means gonadal failure; the next step is a karyotype to diagnose Turner syndrome.", "tags": ["workup-sequence", "feedback-logic"], "c": "rp7", "b": "rpdev", "w": {"1": "Brain MRI looks for a hypothalamic or pituitary lesion when LH and FSH are low; her gonadotropins are high, which places the defect in the ovary.", "2": "Stimulation testing asks whether a quiet pituitary can respond; her FSH and LH are already markedly elevated, so the pituitary is working hard.", "3": "Prolactin excess suppresses GnRH and lowers FSH and LH; it cannot explain high gonadotropins with ovarian failure.", "4": "Imaging the uterus addresses Müllerian anomalies, which present with normal breasts; her absent breasts and high FSH point to ovarian failure first."}}, {"id": "rp7q09", "d": 2, "s": "A 20-month-old girl is brought to the physician because her mother noticed breast enlargement 3 months ago. Examination shows bilateral breast buds about 2 cm across, without areolar changes, pubic hair or vaginal discharge. Her height and growth velocity are unchanged along the 50th percentile. Bone age equals her chronologic age, and basal LH is prepubertal.", "l": "Which of the following is the most appropriate next step in management?", "o": ["Reassurance and reexamination in 6 months", "Depot leuprolide injections", "MRI of the brain", "Serum 17-hydroxyprogesterone", "Pelvic ultrasonography and estradiol"], "a": 0, "e": "Isolated breast buds in a girl under 2, with normal growth velocity, a bone age equal to chronologic age and a prepubertal LH, is premature thelarche, a benign variant. It usually regresses or stays stable, so the right step is **reassurance and reexamination** to confirm it is not progressing. Depot leuprolide treats central precocious puberty, which would bring a pubertal LH, accelerated growth and an advancing bone age. A brain MRI is reserved for proven central puberty.", "et": [["Option", "What it addresses", "Indication", "Relevant finding here"], [["Reassurance and reexamination in 6 months", "Premature thelarche", "Isolated breast buds, normal growth", "Normal bone age, prepubertal LH"], ["Depot leuprolide injections", "Central precocious puberty", "Pubertal LH, advancing bone age", "LH prepubertal"], ["MRI of the brain", "Hypothalamic lesion", "Proven central puberty", "No central activation"], ["Serum 17-hydroxyprogesterone", "Congenital adrenal hyperplasia", "Androgen signs", "No pubic hair or clitoromegaly"], ["Pelvic ultrasonography and estradiol", "Ovarian cyst or tumor", "Bleeding or rapid progression", "Stable, no bleeding"]]], "bl": "Isolated breast buds in a toddler with normal growth and bone age are premature thelarche; reassurance and reexamination are appropriate.", "pt": {"hl": ["Premature thelarche", "Reassurance and reexamination"], "say": "The normal-variant column matches her: prepubertal LH, bone age near normal and premature thelarche, so the plan is reassurance and reexamination rather than treatment."}, "tags": ["normal-vs-pathologic"], "ef": "rp7_precocious", "c": "rp7", "b": "rpdev", "w": {"1": "A GnRH agonist is for central precocious puberty with pubertal LH, rapid growth and advancing bone age; none are present, and premature thelarche needs no suppression.", "2": "Imaging looks for a hypothalamic lesion once central puberty is proven; her prepubertal LH and normal bone age do not justify it.", "3": "This marker screens for CAH, which causes androgen signs such as pubic hair and clitoral enlargement rather than isolated breast buds.", "4": "Ultrasound and estradiol help when bleeding or rapid progression suggests an ovarian cyst or tumor; a stable toddler with isolated breast buds does not need them first."}}, {"id": "rp7q10", "d": 2, "s": "A 13-year-old boy is brought to the physician because of a tender lump beneath his left nipple that appeared 4 months ago. He takes no medications or supplements. Examination shows a 2-cm firm, mobile, rubbery disc of tissue beneath the left areola and a smaller one on the right. Pubic hair is Tanner stage 3, and each testis is 10 mL without masses. His height is at the 60th percentile.", "l": "Which of the following is the most appropriate next step in management?", "o": ["Reassurance and reexamination", "Peripheral blood karyotype", "Serum hCG measurement", "Tamoxifen therapy", "MRI of the brain"], "a": 0, "e": "A tender subareolar disc in a mid-pubertal boy with normal, symmetric testes for his stage is pubertal gynecomastia, present in about half of boys. Estradiol transiently rises faster than testosterone early in puberty, and the tissue usually regresses within 1 to 2 years, so **reassurance and reexamination** are appropriate. A karyotype is for small firm testes suggesting Klinefelter syndrome, and serum hCG is for a testicular mass or signs of a germ cell tumor. Tamoxifen is reserved for severe, persistent or painful cases.", "et": [["Option", "Condition it addresses", "Clue that would call for it", "Status in this boy"], [["Reassurance and reexamination", "Pubertal gynecomastia", "Mid-puberty, normal testes", "Tanner 3, 10-mL testes"], ["Peripheral blood karyotype", "Klinefelter syndrome", "Small firm testes", "Testes normal for stage"], ["Serum hCG measurement", "Germ cell tumor", "Testicular mass", "No mass"], ["Tamoxifen therapy", "Persistent gynecomastia", "Severe or lasting over 2 years", "Only 4 months"], ["MRI of the brain", "Pituitary lesion", "Galactorrhea, visual loss", "None"]]], "bl": "Tender gynecomastia in a mid-pubertal boy with normal testes is a normal variant; reassurance and reexamination are the right step.", "tags": ["normal-vs-pathologic"], "c": "rp7", "b": "rpdev", "w": {"1": "A karyotype looks for Klinefelter syndrome, which gives small firm testes for the pubertal stage; his 10-mL testes match Tanner stage 3.", "2": "hCG from a germ cell tumor can cause gynecomastia, but it would bring a testicular mass or other unusual findings; his testes are normal and symmetric.", "3": "Tamoxifen blocks estrogen at breast tissue and is kept for persistent, severe or distressing gynecomastia; most pubertal cases resolve on their own.", "4": "Brain imaging is for a suspected pituitary or hypothalamic lesion, such as a prolactinoma with galactorrhea or visual loss; nothing suggests one."}}, {"id": "rp7q11", "d": 2, "s": "A 3-year-old boy is brought to the physician because of penile enlargement and pubic hair over 6 months. His parents also describe brief episodes of sudden, inappropriate laughter several times a week. He is at the 98th percentile for height. Both testes measure 6 mL. Bone age is 6 years. Serum LH rises to a pubertal level after GnRH-agonist stimulation.", "l": "Which of the following is most likely to be found on MRI of the brain?", "o": ["Hypothalamic hamartoma", "Craniopharyngioma", "Pineal germinoma", "Optic pathway glioma", "Pituitary macroadenoma"], "a": 0, "e": "Pubertal LH after stimulation with bilateral testicular enlargement means central precocious puberty, and in a young boy a brain lesion is likely. Laughing (gelastic) seizures point to a **hypothalamic hamartoma**, a benign malformation that contains GnRH neurons and fires its own pulses. A pineal germinoma causes precocious puberty in boys by secreting hCG, which is peripheral, so LH would be suppressed. An optic pathway glioma in neurofibromatosis type 1 can cause central puberty but not gelastic seizures, and a craniopharyngioma usually delays puberty.", "et": [["Option", "Effect on puberty", "LH", "Companion clue"], [["Hypothalamic hamartoma", "Central precocious", "Pubertal", "Gelastic seizures"], ["Craniopharyngioma", "Delayed puberty", "Low", "Visual loss, calcified mass"], ["Pineal germinoma", "Peripheral precocious in boys", "Suppressed, hCG high", "Upward gaze palsy"], ["Optic pathway glioma", "Central precocious", "Pubertal", "NF1, visual loss"], ["Pituitary macroadenoma", "Delayed puberty", "Low", "Hypopituitarism, prolactin excess"]]], "bl": "Central precocious puberty with laughing seizures in a young boy points to a hypothalamic hamartoma containing GnRH neurons.", "pt": {"hl": ["Boys: hamartoma, CNS lesion", "Central (GnRH-dependent)"], "say": "The central column applies because LH is pubertal, and it notes that boys often have a lesion: a hypothalamic hamartoma, which fits the laughing seizures."}, "tags": ["hormone-source", "imaging-to-diagnosis"], "ef": "rp7_precocious", "c": "rp7", "b": "rpdev", "w": {"1": "Craniopharyngiomas usually compress the pituitary and stalk, causing delayed puberty, growth failure and visual loss rather than early puberty with laughing seizures.", "2": "A pineal germinoma can secrete hCG, which stimulates Leydig cells directly; that peripheral puberty would suppress LH instead of raising it.", "3": "Optic gliomas in neurofibromatosis type 1 can cause central puberty, but they bring visual loss and café-au-lait macules rather than gelastic seizures.", "4": "Pituitary macroadenomas are rare in young children and usually cause hypopituitarism or prolactin excess, which delays rather than advances puberty."}}];
const RAPID = [{"id": "rp6r01", "q": "Which receptor is defective in complete androgen insensitivity syndrome?", "o": ["Androgen receptor", "Estrogen receptor", "LH receptor", "FSH receptor", "AMH receptor"], "a": 0, "x": "The androgen receptor is defective, so testosterone and DHT are made but cannot act. The testes still make AMH, which removes the uterus, and aromatized testosterone grows breasts at puberty.", "w": {"Estrogen receptor": "Estrogen receptors work normally in this syndrome; that is why aromatized testosterone grows normal breasts at puberty.", "LH receptor": "An inactivating LH receptor defect causes Leydig cell hypoplasia with low testosterone, whereas androgen insensitivity has high testosterone.", "FSH receptor": "FSH receptor defects impair follicle growth or spermatogenesis but do not stop androgen from shaping the genitalia.", "AMH receptor": "An AMH receptor defect leaves a uterus in an otherwise normal male, the opposite of the absent uterus in androgen insensitivity."}, "pt": {"hl": ["DHT binds androgen receptor", "Androgen insensitivity"], "say": "Find the androgen insensitivity box: it breaks the chain where DHT binds the androgen receptor, so androgen is made but cannot act."}, "tags": ["receptor-signaling"], "media": "fig:rp6_signals", "c": "rp6", "b": "rpdev"}, {"id": "rp6r02", "q": "Which hormone is low in 5-alpha-reductase deficiency?", "o": ["Dihydrotestosterone", "Testosterone", "Estradiol", "Luteinizing hormone", "Anti-Müllerian hormone"], "a": 0, "x": "Dihydrotestosterone is low because the enzyme that makes it from testosterone is missing. Testosterone is normal, so the ratio of testosterone to DHT is high and the Wolffian ducts form normally.", "w": {"Testosterone": "Testosterone is normal or high in this disorder, which is why the Wolffian ducts form and the body virilizes at puberty.", "Estradiol": "Estradiol comes from aromatase, not 5-alpha-reductase, and stays in the normal male range in this disorder.", "Luteinizing hormone": "LH is normal because testosterone, which provides the feedback signal to the pituitary, is made in normal amounts.", "Anti-Müllerian hormone": "Sertoli cells are healthy and secrete AMH normally, so the uterus regresses as in any male fetus."}, "pt": {"hl": ["5-alpha-reductase: DHT"], "say": "The 5-alpha-reductase box shows the missing step: without the enzyme, dihydrotestosterone is low while testosterone stays normal."}, "tags": ["steroidogenesis-enzymes"], "media": "fig:rp6_signals", "c": "rp6", "b": "rpdev"}, {"id": "rp6r03", "q": "Which karyotype causes Turner syndrome?", "o": ["45,X", "47,XXY", "47,XYY", "46,XY", "47,XXX"], "a": 0, "x": "Turner syndrome is 45,X, or a mosaic such as 45,X/46,XX. Loss of one sex chromosome leaves streak ovaries, short stature from SHOX loss, and lymphatic and cardiac defects.", "w": {"47,XXY": "This is Klinefelter syndrome, a tall man with small firm testes and gynecomastia, not a short girl with streak ovaries.", "47,XYY": "Men with an extra Y are tall with normal testes and normal fertility, and they are usually diagnosed only by chance.", "46,XY": "A 46,XY girl with streak gonads has Swyer syndrome, which gives normal stature and a uterus but no lymphatic or cardiac defects.", "47,XXX": "Triple X women are often tall and usually have normal ovarian function and normal fertility."}, "pt": {"hl": ["Turner syndrome: 45,X"], "say": "The left panel is headed Turner syndrome: 45,X, the loss of one sex chromosome that leaves streak ovaries."}, "tags": ["meiosis-karyotype"], "media": "fig:rp6_sexchrom", "c": "rp6", "b": "rpdev"}, {"id": "rp6r04", "q": "Which tumor arises in streak gonads that contain Y chromosome material?", "o": ["Gonadoblastoma", "Granulosa cell tumor", "Mature teratoma", "Leydig cell tumor", "Serous cystadenoma"], "a": 0, "x": "Gonadoblastoma arises in dysgenetic gonads that carry Y material, as in Swyer syndrome or Turner mosaics with a Y cell line, and it can progress to dysgerminoma, so the streaks are removed.", "w": {"Granulosa cell tumor": "Granulosa cell tumors come from follicle cells of a functioning ovary and make estrogen; streak gonads have no follicles.", "Mature teratoma": "Mature teratomas arise from germ cells of normal ovaries in young women and are not linked to Y material in dysgenetic gonads.", "Leydig cell tumor": "Leydig cell tumors arise in normal testes and secrete testosterone or estrogen; they are not the typical tumor of streak gonads.", "Serous cystadenoma": "Serous cystadenomas are surface epithelial tumors of normal adult ovaries and have no connection to gonadal dysgenesis."}, "tags": ["risk-factors"], "c": "rp6", "b": "rpdev"}, {"id": "rp6r05", "q": "What is the most common cause of ambiguous genitalia in a 46,XX newborn?", "o": ["Congenital adrenal hyperplasia", "Placental aromatase deficiency", "Maternal androgen-secreting tumor", "Ovotesticular DSD", "Maternal progestin exposure"], "a": 0, "x": "Congenital adrenal hyperplasia, usually 21-hydroxylase deficiency, is the commonest cause: blocked cortisol synthesis raises ACTH, which shunts precursors into adrenal androgens that virilize the external genitalia while the uterus and ovaries stay normal.", "w": {"Placental aromatase deficiency": "Placental aromatase deficiency virilizes a 46,XX fetus and the mother too, but it is rare compared with adrenal hyperplasia.", "Maternal androgen-secreting tumor": "A maternal luteoma or androgen-secreting tumor can virilize a female fetus, but it is uncommon and usually virilizes the mother as well.", "Ovotesticular DSD": "Having both ovarian and testicular tissue is a rare cause of ambiguous genitalia in children with two X chromosomes.", "Maternal progestin exposure": "Older androgenic progestins could virilize a female fetus, but modern exposure is rare and does not rival adrenal hyperplasia."}, "pt": {"hl": ["CAH or aromatase deficiency"], "say": "The bottom box shows extra androgen reaching a 46,XX fetus; congenital adrenal hyperplasia is by fa
