<svg class="dia" viewBox="0 0 900 530" role="img" aria-label="Two late-pregnancy problems for the fetus: preterm labor, where a tocolytic buys 48 hours for betamethasone and indomethacin is limited to before 32 weeks because it can close the ductus arteriosus; and fetal growth restriction, symmetric from early causes or asymmetric and head-sparing from placental insufficiency">
<text class="ttl" x="14" y="26" font-size="17">Late pregnancy and the fetus: delaying birth, and two kinds of poor growth</text>
<rect x="14" y="40" width="872" height="200" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="28" y="66" font-size="17">Preterm labor: buy 48 hours</text>
<text x="28" y="88" font-size="14.5">Contractions with cervical change before 37 weeks</text>
<rect x="28" y="104" width="400" height="54" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="128" font-size="15.5">A tocolytic delays birth about 48 hours</text>
<text x="42" y="148" font-size="14">Nifedipine, indomethacin or terbutaline</text>
<line x1="228" y1="158" x2="228.0" y2="167.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="228,174 223.7,167.0 232.3,167.0" fill="var(--ink-2)"/>
<rect x="28" y="174" width="400" height="54" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="198" font-size="15.5">Betamethasone matures the fetal lungs</text>
<text x="42" y="218" font-size="14">The delay gives the steroid time to work</text>
<text class="b" x="462" y="66" font-size="16">Drug points</text>
<circle cx="468" cy="94" r="4" fill="var(--crit)" stroke="var(--crit)" stroke-width="1"/>
<text class="cr" x="480" y="99" font-size="15.5">Indomethacin: only before 32 weeks</text>
<text x="480" y="119" font-size="14.5">It can close the ductus arteriosus</text>
<text x="480" y="138" font-size="14.5">and cause oligohydramnios</text>
<circle cx="468" cy="164" r="4" fill="var(--a2)" stroke="var(--a2)" stroke-width="1"/>
<text x="480" y="169" font-size="14.5">Magnesium before 32 weeks protects the brain</text>
<circle cx="468" cy="190" r="4" fill="var(--a2)" stroke="var(--a2)" stroke-width="1"/>
<text x="480" y="195" font-size="14.5">Group B strep prophylaxis if status is unknown</text>
<circle cx="468" cy="216" r="4" fill="var(--a2)" stroke="var(--a2)" stroke-width="1"/>
<text x="480" y="221" font-size="14.5">Vaginal progesterone if the cervix is short</text>
<rect x="14" y="254" width="872" height="262" rx="10" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="282" font-size="17">Fetal growth restriction: estimated weight under the 10th percentile</text>
<rect x="150" y="298" width="340" height="30" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="164" y="319" font-size="16">Symmetric</text>
<rect x="506" y="298" width="366" height="30" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="520" y="319" font-size="16">Asymmetric, head-sparing</text>
<text class="b" x="28" y="354" font-size="15">Starts</text>
<text x="164" y="354" font-size="15">Early in pregnancy</text>
<text x="520" y="354" font-size="15">Late in pregnancy</text>
<text class="b" x="28" y="388" font-size="15">Cause</text>
<text x="164" y="388" font-size="15">Aneuploidy or congenital infection</text>
<text x="520" y="388" font-size="15">Placental insufficiency: preeclampsia,</text>
<text x="520" y="408" font-size="15">hypertension, smoking</text>
<text class="b" x="28" y="442" font-size="15">Size</text>
<text x="164" y="442" font-size="15">Head and body equally small</text>
<text x="520" y="442" font-size="15">Brain is spared; the abdomen lags</text>
<line x1="28" y1="366" x2="872" y2="366" stroke="var(--line)" stroke-width="1"/>
<line x1="28" y1="420" x2="872" y2="420" stroke="var(--line)" stroke-width="1"/>
<text x="28" y="476" font-size="14.5">Asymmetric: oligohydramnios, stillbirth, asphyxia; later hypertension, type 2 diabetes, metabolic syndrome</text>
<text x="28" y="498" font-size="14.5">Macrosomia is the opposite error, usually from maternal diabetes</text>
</svg>
