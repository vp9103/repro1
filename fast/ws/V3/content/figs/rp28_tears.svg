<svg class="dia" viewBox="0 0 900 464" role="img" aria-label="Perineal tears graded by the deepest structure torn: first-degree vaginal mucosa or perineal skin, second-degree perineal body muscles, third-degree external anal sphincter, fourth-degree rectal mucosa, with the main risk of each">
