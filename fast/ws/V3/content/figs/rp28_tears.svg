<text class="b" x="28" y="392" font-size="16">Grade by the deepest layer torn, not by the length of the tear</text>
<text x="28" y="416" font-size="14.5">Careful layered repair matters: a poorly healed sphincter causes fecal incontinence</text>
<text x="28" y="434" font-size="14.5">The perineal body is the central tendon where bulbospongiosus and transverse perineal muscles meet the sphincter</text>
