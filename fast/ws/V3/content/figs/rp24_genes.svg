<svg class="dia" viewBox="0 0 900 516" role="img" aria-label="Inherited breast cancer genes: BRCA1 and BRCA2 repair DNA, TP53 causes Li-Fraumeni syndrome, PTEN causes Cowden syndrome, STK11 causes Peutz-Jeghers syndrome and CDH1 causes lobular breast cancer and diffuse gastric cancer">
<text class="ttl" x="14" y="26" font-size="17">Inherited breast cancer: which gene, which cancers</text>
<text class="b" x="28" y="54" font-size="15">Gene</text>
<text class="b" x="150" y="54" font-size="15">Normal job</text>
<text class="b" x="512" y="54" font-size="15">Syndrome and cancers</text>
<rect x="14" y="64" width="872" height="54" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="28" y="97" font-size="19">BRCA1</text>
<text x="150" y="88" font-size="14.5">Repairs double-strand DNA breaks</text>
<text x="150" y="108" font-size="14.5">by homologous recombination</text>
<text x="512" y="88" font-size="14.5">Triple-negative (basal-like) breast cancer</text>
<text x="512" y="108" font-size="14.5">High-grade serous ovarian cancer</text>
<rect x="14" y="124" width="872" height="74" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="28" y="157" font-size="19">BRCA2</text>
<text x="150" y="148" font-size="14.5">Repairs double-strand DNA breaks</text>
<text x="150" y="168" font-size="14.5">by homologous recombination</text>
<text x="512" y="148" font-size="14.5">ER-positive breast cancer</text>
<text class="b" x="512" y="168" font-size="14.5">Highest risk of male breast cancer</text>
<text x="512" y="188" font-size="14.5">Ovarian, pancreatic and prostate cancer</text>
<rect x="14" y="204" width="872" height="74" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="28" y="237" font-size="19">TP53</text>
<text x="150" y="228" font-size="14.5">Cell-cycle arrest or apoptosis</text>
<text x="150" y="248" font-size="14.5">after DNA damage</text>
<text class="b" x="512" y="228" font-size="14.5">Li-Fraumeni syndrome</text>
<text x="512" y="248" font-size="14.5">Early breast cancer, sarcoma,</text>
<text x="512" y="268" font-size="14.5">brain and adrenal tumors</text>
<rect x="14" y="284" width="872" height="54" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="28" y="317" font-size="19">PTEN</text>
<text x="150" y="308" font-size="14.5">Phosphatase that brakes</text>
<text x="150" y="328" font-size="14.5">PI3K-AKT signaling</text>
<text class="b" x="512" y="308" font-size="14.5">Cowden syndrome</text>
<text x="512" y="328" font-size="14.5">Breast, thyroid and endometrial cancer</text>
<rect x="14" y="344" width="872" height="54" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="28" y="377" font-size="19">STK11</text>
<text x="150" y="368" font-size="14.5">Kinase that restrains growth</text>
<text x="150" y="388" font-size="14.5">through AMPK</text>
<text class="b" x="512" y="368" font-size="14.5">Peutz-Jeghers syndrome</text>
<text x="512" y="388" font-size="14.5">Polyps, pigmented lips, breast and gut cancer</text>
<rect x="14" y="404" width="872" height="54" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="437" font-size="19">CDH1</text>
<text x="150" y="428" font-size="14.5">E-cadherin holds epithelial</text>
<text x="150" y="448" font-size="14.5">cells together</text>
<text class="b" x="512" y="428" font-size="14.5">Lobular breast cancer</text>
<text x="512" y="448" font-size="14.5">Diffuse gastric cancer</text>
<text x="14" y="480" font-size="14.5">PALB2, ATM and CHEK2 add a moderate increase in breast cancer risk</text>
<text x="14" y="502" font-size="14.5">Two-hit model: a carrier inherits one defective copy, and the breast cell becomes cancerous when it loses the second</text>
</svg>
