<svg class="dia" viewBox="0 0 900 516" role="img" aria-label="Preeclampsia with severe features: the findings that make it severe, the three treatment steps including magnesium sulfate for seizure prophylaxis, and magnesium toxicity running from lost reflexes to respiratory depression to cardiac arrest, reversed by calcium gluconate">
<text class="ttl" x="14" y="26" font-size="17">Severe preeclampsia: severe features, magnesium and its antidote</text>
<rect x="14" y="40" width="410" height="252" rx="10" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="28" y="66" font-size="17">Preeclampsia with severe features</text>
<text x="28" y="88" font-size="14.5">Any one of these after 20 weeks:</text>
<circle cx="36" cy="115" r="4" fill="var(--crit)" stroke="var(--crit)" stroke-width="1"/>
<text class="b" x="50" y="120" font-size="15.5">Blood pressure 160/110 or higher</text>
<circle cx="36" cy="144" r="4" fill="var(--crit)" stroke="var(--crit)" stroke-width="1"/>
<text x="50" y="149" font-size="15.5">Platelets under 100,000</text>
<circle cx="36" cy="173" r="4" fill="var(--crit)" stroke="var(--crit)" stroke-width="1"/>
<text x="50" y="178" font-size="15.5">Creatinine over 1.1 mg/dL</text>
<circle cx="36" cy="202" r="4" fill="var(--crit)" stroke="var(--crit)" stroke-width="1"/>
<text x="50" y="207" font-size="15.5">AST or ALT twice normal</text>
<circle cx="36" cy="231" r="4" fill="var(--crit)" stroke="var(--crit)" stroke-width="1"/>
<text x="50" y="236" font-size="15.5">Pulmonary edema</text>
<circle cx="36" cy="260" r="4" fill="var(--crit)" stroke="var(--crit)" stroke-width="1"/>
<text x="50" y="265" font-size="15.5">New headache or visual change</text>
<rect x="436" y="40" width="450" height="252" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="450" y="66" font-size="17">Treatment in three steps</text>
<rect x="450" y="80" width="422" height="60" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="476" cy="110" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="476" y="115" font-size="14" text-anchor="middle">1</text>
<text class="b" x="500" y="105" font-size="15.5">Lower severe-range pressure</text>
<text x="500" y="127" font-size="14.5">IV labetalol, IV hydralazine or oral nifedipine</text>
<rect x="450" y="148" width="422" height="60" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="476" cy="178" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="476" y="183" font-size="14" text-anchor="middle">2</text>
<text class="b" x="500" y="173" font-size="15.5">Magnesium sulfate prevents seizures</text>
<text x="500" y="195" font-size="14.5">Through labor and 24 hours after birth</text>
<rect x="450" y="216" width="422" height="60" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="476" cy="246" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="476" y="251" font-size="14" text-anchor="middle">3</text>
<text class="b" x="500" y="241" font-size="15.5">Deliver the placenta</text>
<text x="500" y="263" font-size="14.5">Removes the source of sFlt-1: the cure</text>
<text class="b" x="14" y="322" font-size="17">Magnesium toxicity follows the reflexes</text>
<text x="14" y="344" font-size="14.5">The kidneys clear magnesium, so low urine output lets it build up</text>
<rect x="14" y="356" width="280" height="66" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="28" y="380" font-size="13.5">First sign</text>
<text class="b" x="28" y="408" font-size="16">Loss of deep tendon reflexes</text>
<line x1="294" y1="389" x2="303.0" y2="389.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="310,389 303.0,393.3 303.0,384.7" fill="var(--ink-2)"/>
<rect x="310" y="356" width="280" height="66" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="324" y="380" font-size="13.5">Then</text>
<text class="b" x="324" y="408" font-size="16">Respiratory depression</text>
<line x1="590" y1="389" x2="599.0" y2="389.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="606,389 599.0,393.3 599.0,384.7" fill="var(--ink-2)"/>
<rect x="606" y="356" width="280" height="66" rx="10" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="620" y="380" font-size="13.5">Last</text>
<text class="b" x="620" y="408" font-size="16">Cardiac arrest</text>
<rect x="14" y="436" width="872" height="66" rx="10" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="28" y="464" font-size="17">Antidote: intravenous calcium gluconate</text>
<text x="28" y="488" font-size="14.5">It opposes magnesium at the nerve and muscle membrane; check reflexes, breathing rate and urine output often</text>
</svg>
