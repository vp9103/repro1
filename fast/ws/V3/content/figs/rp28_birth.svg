<svg class="dia" viewBox="0 0 900 438" role="img" aria-label="The six cardinal movements of labor in order, then shoulder dystocia and the two brachial plexus injuries it can cause: Erb palsy from upper trunk C5 and C6 stretch, and Klumpke palsy from lower trunk C8 and T1 stretch with possible Horner syndrome">
<text class="ttl" x="14" y="26" font-size="17">The baby's path through the pelvis, and what a stuck shoulder stretches</text>
<rect x="14" y="40" width="280" height="60" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="40" cy="70" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="40" y="75" font-size="14" text-anchor="middle">1</text>
<text class="b" x="64" y="66" font-size="16">Engagement</text>
<text x="64" y="86" font-size="13.5">Head enters the pelvic inlet</text>
<rect x="310" y="40" width="280" height="60" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="336" cy="70" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="336" y="75" font-size="14" text-anchor="middle">2</text>
<text class="b" x="360" y="66" font-size="16">Descent and flexion</text>
<text x="360" y="86" font-size="13.5">Chin tucks onto the chest</text>
<rect x="606" y="40" width="280" height="60" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="632" cy="70" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="632" y="75" font-size="14" text-anchor="middle">3</text>
<text class="b" x="656" y="66" font-size="16">Internal rotation</text>
<text x="656" y="86" font-size="13.5">Occiput faces the symphysis</text>
<rect x="14" y="110" width="280" height="60" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="40" cy="140" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="40" y="145" font-size="14" text-anchor="middle">4</text>
<text class="b" x="64" y="136" font-size="16">Extension</text>
<text x="64" y="156" font-size="13.5">Face sweeps over the perineum</text>
<rect x="310" y="110" width="280" height="60" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="336" cy="140" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="336" y="145" font-size="14" text-anchor="middle">5</text>
<text class="b" x="360" y="136" font-size="16">External rotation</text>
<text x="360" y="156" font-size="13.5">Restitution: turns sideways</text>
<rect x="606" y="110" width="280" height="60" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="632" cy="140" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="632" y="145" font-size="14" text-anchor="middle">6</text>
<text class="b" x="656" y="136" font-size="16">Expulsion</text>
<text x="656" y="156" font-size="13.5">Shoulders, then the body</text>
<text class="b" x="14" y="206" font-size="16">Shoulder dystocia: the head is born but the anterior shoulder catches behind the symphysis</text>
<text x="14" y="228" font-size="14.5">The McRoberts maneuver frees it; hard lateral pulls on the head stretch the brachial plexus</text>
<rect x="14" y="244" width="430" height="180" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="28" y="274" font-size="18">Erb palsy</text>
<text class="b" x="28" y="302" font-size="16">Upper trunk: C5 and C6</text>
<text x="28" y="326" font-size="14.5">Stretch from lateral traction on the head</text>
<text x="28" y="352" font-size="14.5">Arm hangs adducted and internally rotated,</text>
<text x="28" y="372" font-size="14.5">elbow extended, wrist flexed: waiter's tip</text>
<text x="28" y="400" font-size="14.5">Hand grasp is intact</text>
<rect x="456" y="244" width="430" height="180" rx="10" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="470" y="274" font-size="18">Klumpke palsy</text>
<text class="b" x="470" y="302" font-size="16">Lower trunk: C8 and T1</text>
<text x="470" y="326" font-size="14.5">Stretch from traction on an arm above the head</text>
<text x="470" y="352" font-size="14.5">Claw hand; grasp reflex is absent</text>
<text x="470" y="380" font-size="14.5">Sometimes Horner syndrome:</text>
<text class="cr" x="470" y="400" font-size="14.5">Ptosis with a constricted pupil</text>
</svg>
