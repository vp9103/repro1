<svg class="dia" viewBox="0 0 900 538" role="img" aria-label="Diabetes in pregnancy on a 40-week timeline: pregestational diabetes exposes the embryo to high glucose in weeks 3 to 8 and causes malformations such as caudal regression syndrome; gestational diabetes appears later; screening is at 24 to 28 weeks with a 50-g challenge and then a 3-hour 100-g test if abnormal">
<text class="ttl" x="14" y="26" font-size="17">Diabetes in pregnancy: when the embryo is exposed and when to screen</text>
<rect x="14" y="40" width="436" height="190" rx="10" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="28" y="66" font-size="17">Pregestational diabetes</text>
<text x="28" y="94" font-size="15">High glucose bathes the embryo in weeks 3 to 8</text>
<text class="b" x="28" y="118" font-size="15">Caudal regression syndrome: the most specific</text>
<text x="28" y="142" font-size="15">Transposition of the great arteries, VSD</text>
<text x="28" y="164" font-size="15">Neural tube defects; stillbirth</text>
<text class="cr" x="28" y="192" font-size="15">Control glucose before conception</text>
<rect x="464" y="40" width="422" height="190" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="478" y="66" font-size="17">Gestational diabetes</text>
<text x="478" y="94" font-size="15">Begins after organogenesis</text>
<text x="478" y="118" font-size="15">Placental hormones raise insulin resistance</text>
<text x="478" y="142" font-size="15">The fetus overgrows; it is not malformed</text>
<text x="478" y="166" font-size="15">Retest after birth: type 2 diabetes risk stays high</text>
<rect x="101.5" y="244" width="102.5" height="20" rx="4" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.2"/>
<text class="b" x="214.0" y="259" font-size="13.5">Weeks 3 to 8: organogenesis</text>
<rect x="450.0" y="244" width="410.0" height="20" rx="4" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.2"/>
<text x="655.0" y="259" font-size="13" text-anchor="middle">Insulin resistance rises</text>
<rect x="532.0" y="268" width="82.0" height="20" rx="4" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="624.0" y="283" font-size="13.5">Screen: 24 to 28 weeks</text>
<line x1="40.0" y1="296" x2="860.0" y2="296" stroke="var(--ink-3)" stroke-width="2"/>
<line x1="40.0" y1="292" x2="40.0" y2="300" stroke="var(--ink-3)" stroke-width="2"/>
<line x1="101.5" y1="292" x2="101.5" y2="300" stroke="var(--ink-3)" stroke-width="2"/>
<line x1="204.0" y1="292" x2="204.0" y2="300" stroke="var(--ink-3)" stroke-width="2"/>
<line x1="450.0" y1="292" x2="450.0" y2="300" stroke="var(--ink-3)" stroke-width="2"/>
<line x1="532.0" y1="292" x2="532.0" y2="300" stroke="var(--ink-3)" stroke-width="2"/>
<line x1="614.0" y1="292" x2="614.0" y2="300" stroke="var(--ink-3)" stroke-width="2"/>
<line x1="860.0" y1="292" x2="860.0" y2="300" stroke="var(--ink-3)" stroke-width="2"/>
<text x="40.0" y="318" font-size="13.5" text-anchor="middle">0</text>
<text x="245.0" y="318" font-size="13.5" text-anchor="middle">10</text>
<text x="450.0" y="318" font-size="13.5" text-anchor="middle">20</text>
<text x="655.0" y="318" font-size="13.5" text-anchor="middle">30</text>
<text x="854.0" y="318" font-size="13.5" text-anchor="middle">40 weeks</text>
<line x1="152.75" y1="244" x2="152.75" y2="232" stroke="var(--crit)" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="655.0" y1="244" x2="655.0" y2="232" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="14" y="336" width="872" height="188" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="28" y="364" font-size="17">Screening for gestational diabetes</text>
<text x="28" y="390" font-size="15">High risk: first prenatal visit</text>
<text class="b" x="340" y="390" font-size="15">Everyone else: 24 to 28 weeks</text>
<rect x="28" y="408" width="250" height="66" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="42" y="432" font-size="13.5">Two-step, nonfasting</text>
<text class="b" x="42" y="458" font-size="16">1-hour 50-g challenge</text>
<line x1="278" y1="441" x2="299.0" y2="441.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="306,441 299.0,445.3 299.0,436.7" fill="var(--ink-2)"/>
<rect x="306" y="408" width="350" height="66" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="320" y="432" font-size="13.5">If abnormal, fasting</text>
<text class="b" x="320" y="458" font-size="16">3-hour 100-g glucose tolerance test</text>
<rect x="672" y="408" width="200" height="66" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="686" y="432" font-size="13.5">One-step, fasting</text>
<text class="b" x="686" y="458" font-size="16">2-hour 75-g test</text>
<text x="28" y="504" font-size="14.5">Diet and exercise come first; insulin is added if glucose stays high</text>
</svg>
