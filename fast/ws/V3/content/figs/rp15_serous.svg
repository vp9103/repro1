<svg class="dia" viewBox="0 0 900 572" role="img" aria-label="How repeated ovulation leads to high-grade serous ovarian carcinoma in five steps from follicular fluid on the fimbriae to bloating and ascites, with the factors that raise risk and the factors that protect, including salpingectomy">
<text class="ttl" x="14" y="26" font-size="17">From ovulation to peritoneal spread: what raises risk and what protects</text>
<rect x="14" y="50" width="540" height="72" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="42" cy="86" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="91" font-size="14" text-anchor="middle">1</text>
<text class="b" x="70" y="77" font-size="16">Each ovulation breaks the ovarian surface</text>
<text x="70" y="101" font-size="14">Inflammatory follicular fluid bathes the nearby fimbriae</text>
<line x1="42" y1="122" x2="42.0" y2="128.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="42,134 38.4,128.0 45.6,128.0" fill="var(--ink-2)"/>
<rect x="14" y="134" width="540" height="72" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="42" cy="170" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="175" font-size="14" text-anchor="middle">2</text>
<text class="b" x="70" y="161" font-size="16">Repair needs cell division</text>
<text x="70" y="185" font-size="14">Every division can copy a DNA error</text>
<line x1="42" y1="206" x2="42.0" y2="212.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="42,218 38.4,212.0 45.6,212.0" fill="var(--ink-2)"/>
<rect x="14" y="218" width="540" height="98" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="42" cy="267" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="272" font-size="14" text-anchor="middle">3</text>
<text class="b" x="70" y="245" font-size="16">TP53 mutation in a fimbrial cell</text>
<text x="70" y="269" font-size="14">Serous tubal intraepithelial carcinoma (STIC) forms</text>
<text x="70" y="290" font-size="14">BRCA1 or BRCA2 carriers start with higher risk</text>
<line x1="42" y1="316" x2="42.0" y2="322.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="42,328 38.4,322.0 45.6,322.0" fill="var(--ink-2)"/>
<rect x="14" y="328" width="540" height="72" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<circle cx="42" cy="364" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="369" font-size="14" text-anchor="middle">4</text>
<text class="b" x="70" y="355" font-size="16">Cells seed the peritoneum early</text>
<text x="70" y="379" font-size="14">Ascites and omental caking; often both ovaries</text>
<line x1="42" y1="400" x2="42.0" y2="406.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="42,412 38.4,406.0 45.6,406.0" fill="var(--ink-2)"/>
<rect x="14" y="412" width="540" height="98" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<circle cx="42" cy="461" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="466" font-size="14" text-anchor="middle">5</text>
<text class="b" x="70" y="439" font-size="16">Late presentation</text>
<text x="70" y="463" font-size="14">Bloating, early satiety, rising girth</text>
<text x="70" y="484" font-size="14">CA-125 raised; debulking surgery plus platinum drugs</text>
<text x="70" y="505" font-size="14">PARP inhibitors for BRCA carriers</text>
<rect x="574" y="50" width="312" height="150" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="588" y="80" font-size="16">More ovulations, more risk</text>
<text x="588" y="110" font-size="14">Early menarche, late menopause</text>
<text x="588" y="136" font-size="14">Nulliparity</text>
<text x="588" y="162" font-size="14">BRCA1 or BRCA2 mutation: highest risk</text>
<rect x="574" y="212" width="312" height="134" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="588" y="242" font-size="16">Fewer ovulations protect</text>
<text x="588" y="272" font-size="14">Oral contraceptives</text>
<text x="588" y="296" font-size="14">Pregnancy and multiparity</text>
<text x="588" y="320" font-size="14">Breastfeeding</text>
<rect x="574" y="358" width="312" height="152" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="588" y="388" font-size="16">Removing the tube protects</text>
<text x="588" y="418" font-size="14">Salpingectomy removes the tube</text>
<text x="588" y="442" font-size="14">where STIC begins; tubal ligation</text>
<text x="588" y="466" font-size="14">also lowers risk</text>
<rect x="14" y="526" width="872" height="34" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="28" y="548" font-size="14">No screening test works for average-risk women: the USPSTF recommends against screening (as of 2025)</text>
</svg>
