<svg class="dia" viewBox="0 0 900 470" role="img" aria-label="After birth: how the placenta blocks and suckling drives milk, with prolactin, oxytocin let-down and lactational amenorrhea; the three levels of postpartum mood disorder; and when not to breastfeed">
<text class="ttl" x="14" y="26" font-size="17">After birth: milk, mood and when not to nurse</text>
<rect x="14" y="44" width="430" height="408" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="70" font-size="15.5">Milk: the placenta blocks it, suckling drives it</text>
<rect x="26" y="84" width="406" height="86" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="40" y="110" font-size="15">Placenta out: estrogen, progesterone fall</text>
<text x="40" y="133" font-size="14">Their block on prolactin at the breast lifts;</text>
<text x="40" y="153" font-size="14">milk comes in over 2 to 3 days</text>
<line x1="229" y1="170" x2="229.0" y2="174.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="229,180 225.4,174.0 232.6,174.0" fill="var(--ink-2)"/>
<rect x="26" y="180" width="406" height="66" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="40" y="206" font-size="15">Prolactin keeps alveolar cells making milk</text>
<text x="40" y="229" font-size="14">Suckling keeps its level high</text>
<line x1="229" y1="246" x2="229.0" y2="250.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="229,256 225.4,250.0 232.6,250.0" fill="var(--ink-2)"/>
<rect x="26" y="256" width="406" height="66" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="40" y="282" font-size="15">Oxytocin contracts myoepithelial cells</text>
<text x="40" y="305" font-size="14">This is the let-down reflex</text>
<line x1="229" y1="322" x2="229.0" y2="326.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="229,332 225.4,326.0 232.6,326.0" fill="var(--ink-2)"/>
<rect x="26" y="332" width="406" height="90" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="40" y="358" font-size="15">Suckling prolactin suppresses GnRH</text>
<text x="40" y="381" font-size="14">Lactational amenorrhea: protection against</text>
<text x="40" y="401" font-size="14">pregnancy during exclusive nursing up to 6 months</text>
<rect x="456" y="44" width="430" height="246" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="470" y="70" font-size="16">Mood after birth: three levels</text>
<rect x="468" y="84" width="406" height="58" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="482" y="109" font-size="15">Postpartum blues</text>
<text x="482" y="130" font-size="14">Most mothers; fades within 2 weeks</text>
<rect x="468" y="150" width="406" height="58" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="482" y="175" font-size="15">Postpartum depression</text>
<text x="482" y="196" font-size="14">Lasts longer and needs treatment</text>
<rect x="468" y="216" width="406" height="58" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="482" y="241" font-size="15">Postpartum psychosis</text>
<text x="482" y="262" font-size="14">Delusions or hallucinations: an emergency</text>
<rect x="456" y="302" width="430" height="150" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="470" y="328" font-size="16">When not to breastfeed</text>
<rect x="468" y="342" width="406" height="100" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="482" y="368" font-size="15">Infant with classic galactosemia</text>
<text x="482" y="390" font-size="14">It cannot metabolize the galactose in milk</text>
<text x="482" y="416" font-size="14">Also active untreated tuberculosis and certain drugs</text>
</svg>
