<svg class="dia" viewBox="0 0 900 442" role="img" aria-label="After delivery: prolactin makes milk, oxytocin causes let-down, prolactin suppresses GnRH to cause lactational amenorrhea, classic galactosemia forbids breastfeeding; and the mood spectrum from postpartum blues to postpartum depression to postpartum psychosis">
<text class="ttl" x="14" y="26" font-size="17">After delivery: how milk comes in, and how mood changes</text>
<rect x="14" y="40" width="436" height="388" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="28" y="66" font-size="17">Milk and the missing period</text>
<rect x="28" y="78" width="408" height="52" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="52" cy="104" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="52" y="109" font-size="14" text-anchor="middle">1</text>
<text class="b" x="76" y="100" font-size="15.5">Placenta delivered: estrogen falls</text>
<text x="76" y="119" font-size="13.5">The block on prolactin lifts; milk in 2 to 3 days</text>
<line x1="52" y1="130" x2="52.0" y2="134.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="52,140 48.3,134.0 55.7,134.0" fill="var(--ink-2)"/>
<rect x="28" y="140" width="408" height="52" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="52" cy="166" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="52" y="171" font-size="14" text-anchor="middle">2</text>
<text class="b" x="76" y="162" font-size="15.5">Prolactin makes the milk</text>
<text x="76" y="181" font-size="13.5">It keeps the alveolar cells producing milk</text>
<line x1="52" y1="192" x2="52.0" y2="196.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="52,202 48.3,196.0 55.7,196.0" fill="var(--ink-2)"/>
<rect x="28" y="202" width="408" height="52" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="52" cy="228" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="52" y="233" font-size="14" text-anchor="middle">3</text>
<text class="b" x="76" y="224" font-size="15.5">Oxytocin: the let-down reflex</text>
<text x="76" y="243" font-size="13.5">Contracts myoepithelial cells around alveoli</text>
<line x1="52" y1="254" x2="52.0" y2="258.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="52,264 48.3,258.0 55.7,258.0" fill="var(--ink-2)"/>
<rect x="28" y="264" width="408" height="52" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="52" cy="290" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="52" y="295" font-size="14" text-anchor="middle">4</text>
<text class="b" x="76" y="286" font-size="15.5">Prolactin suppresses GnRH pulses</text>
<text x="76" y="305" font-size="13.5">Lactational amenorrhea: 6 months if exclusive</text>
<rect x="28" y="330" width="408" height="90" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="42" y="354" font-size="15.5">Classic galactosemia in the infant</text>
<text x="42" y="376" font-size="13.5">Absolute contraindication: the infant cannot</text>
<text x="42" y="394" font-size="13.5">metabolize galactose in milk</text>
<text x="42" y="412" font-size="13.5">Also avoid with active untreated TB and some drugs</text>
<rect x="464" y="40" width="422" height="388" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="478" y="66" font-size="17">Mood after birth</text>
<rect x="478" y="78" width="394" height="96" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="492" y="104" font-size="16.5">Postpartum blues</text>
<text x="492" y="128" font-size="14.5">Affects most mothers</text>
<text x="492" y="148" font-size="14.5">Fades within 2 weeks</text>
<rect x="478" y="182" width="394" height="116" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="492" y="208" font-size="16.5">Postpartum depression</text>
<text x="492" y="232" font-size="14.5">Lasts longer than 2 weeks</text>
<text x="492" y="252" font-size="14.5">Low mood, guilt, poor sleep</text>
<text class="b" x="492" y="272" font-size="14.5">Needs treatment</text>
<rect x="478" y="306" width="394" height="104" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="492" y="332" font-size="16.5">Postpartum psychosis</text>
<text x="492" y="356" font-size="14.5">Delusions or hallucinations</text>
<text class="cr" x="492" y="376" font-size="14.5">Emergency for mother and infant</text>
</svg>
