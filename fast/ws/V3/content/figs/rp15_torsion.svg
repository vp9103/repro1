<svg class="dia" viewBox="0 0 900 510" role="img" aria-label="Ovarian torsion in four steps: a heavy ovary rotates, the thin-walled veins and lymphatics collapse first, then the artery is cut off, and the ovary infarcts">
<text class="ttl" x="14" y="26" font-size="17">Ovarian torsion: the thin-walled veins fail first, then the artery</text>
<rect x="14" y="40" width="872" height="80" rx="10" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="40" cy="80" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="40" y="85" font-size="14" text-anchor="middle">1</text>
<ellipse cx="124" cy="65" rx="31" ry="19" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<circle cx="116" cy="63" r="8" fill="var(--surface)" stroke="var(--crit)" stroke-width="1.3"/>
<path d="M117 84 C 117 92, 131 94, 131 100 C 131 106, 117 107, 117 114" fill="none" stroke="var(--ink-2)" stroke-width="3" />
<path d="M131 84 C 131 92, 117 94, 117 100 C 117 106, 131 107, 131 114" fill="none" stroke="var(--ink-2)" stroke-width="3" />
<path d="M164 74 A 20 20 0 0 1 164 110" fill="none" stroke="var(--ink-2)" stroke-width="2" />
<polygon points="164,114 158,107 170,107" fill="var(--ink-2)"/>
<text class="b" x="186" y="69" font-size="17">A heavy ovary rotates on its pedicle</text>
<text x="186" y="94" font-size="15">A dermoid or a cyst of 5 cm or more acts as the lever</text>
<text x="186" y="114" font-size="15">The infundibulopelvic ligament carries the ovarian artery, vein and lymphatics</text>
<line x1="40" y1="120" x2="40.0" y2="124.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="40,130 36.3,124.0 43.7,124.0" fill="var(--ink-2)"/>
<rect x="14" y="130" width="872" height="80" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="40" cy="170" r="13" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="40" y="175" font-size="14" text-anchor="middle">2</text>
<circle cx="124" cy="170" r="32" fill="none" stroke="var(--line-strong)" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="111" cy="162" r="8" fill="var(--surface)" stroke="var(--crit)" stroke-width="4.5"/>
<circle cx="134" cy="166" r="12" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="122" cy="187" r="5" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.4" stroke-dasharray="2 2"/>
<text class="b" x="186" y="159" font-size="17">Veins and lymphatics collapse first</text>
<text x="186" y="184" font-size="15">Thin walls, low pressure: the twisted pedicle squeezes them shut</text>
<text x="186" y="204" font-size="15">The artery still pumps blood in: the ovary swells with congestion and edema</text>
<line x1="40" y1="210" x2="40.0" y2="214.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="40,220 36.3,214.0 43.7,214.0" fill="var(--ink-2)"/>
<rect x="14" y="220" width="872" height="80" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<circle cx="40" cy="260" r="13" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="40" y="265" font-size="14" text-anchor="middle">3</text>
<circle cx="124" cy="260" r="32" fill="none" stroke="var(--line-strong)" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="111" cy="252" r="8" fill="var(--surface)" stroke="var(--crit)" stroke-width="4.5"/>
<ellipse cx="134" cy="256" rx="12" ry="2.4" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<ellipse cx="122" cy="277" rx="5" ry="1.4" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.4"/>
<text class="b" x="186" y="249" font-size="17">The artery is cut off</text>
<text x="186" y="274" font-size="15">Rising tissue pressure and more twisting stop arterial inflow</text>
<text x="186" y="294" font-size="15">Doppler flow can persist early, so normal flow does not exclude torsion</text>
<line x1="40" y1="300" x2="40.0" y2="304.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="40,310 36.3,304.0 43.7,304.0" fill="var(--ink-2)"/>
<rect x="14" y="310" width="872" height="80" rx="10" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<circle cx="40" cy="350" r="13" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="40" y="355" font-size="14" text-anchor="middle">4</text>
<ellipse cx="124" cy="350" rx="31" ry="22" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="2.5"/>
<ellipse opacity="0.55" cx="124" cy="350" rx="20" ry="13" fill="var(--crit)" stroke="var(--line-strong)" stroke-width="0"/>
<text class="b" x="186" y="339" font-size="17">Hemorrhagic infarction</text>
<text x="186" y="364" font-size="15">Without inflow the ovary dies and bleeds into itself</text>
<text x="186" y="384" font-size="15">Prompt surgery is needed to save it</text>
<rect x="14" y="400" width="872" height="34" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="36" cy="417" r="7" fill="var(--surface)" stroke="var(--crit)" stroke-width="4"/>
<text x="52" y="422" font-size="15">Artery: thick muscular wall, high pressure</text>
<circle cx="398" cy="417" r="9" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text x="414" y="422" font-size="15">Vein: thin wall, low pressure</text>
<circle cx="660" cy="417" r="5" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.4" stroke-dasharray="2 2"/>
<text x="674" y="422" font-size="15">Lymphatic: thin wall</text>
<rect x="14" y="442" width="872" height="58" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="28" y="466" font-size="15">Sudden, severe, one-sided pelvic pain with nausea and vomiting: a surgical emergency</text>
<text x="28" y="488" font-size="15">Ultrasound: large, edematous ovary, follicles pushed to the edge, whirlpool sign of the twisted pedicle</text>
</svg>
