<svg class="dia" viewBox="0 0 900 566" role="img" aria-label="Four benign breast conditions told apart by setting and histology: acute mastitis, periductal mastitis, duct ectasia and fat necrosis; and three breast implant problems: capsular contracture, silicone granuloma and anaplastic large cell lymphoma">
<text class="ttl" x="14" y="26" font-size="17">Breast inflammation, fat necrosis and implant complications</text>
<rect x="118" y="40" width="188" height="374" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="128" y="62" font-size="16">Acute mastitis</text>
<rect x="310" y="40" width="188" height="374" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="320" y="62" font-size="16">Periductal mastitis</text>
<rect x="502" y="40" width="188" height="374" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="512" y="62" font-size="16">Duct ectasia</text>
<rect x="694" y="40" width="188" height="374" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="704" y="62" font-size="16">Fat necrosis</text>
<line x1="14" y1="70" x2="886" y2="70" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="18" y="94" font-size="15">Who</text>
<text x="128" y="94" font-size="14.5">Nursing mother,</text>
<text x="128" y="113" font-size="14.5">first weeks</text>
<text x="320" y="94" font-size="14.5">Smoker,</text>
<text x="320" y="113" font-size="14.5">not lactating</text>
<text x="512" y="94" font-size="14.5">Older multiparous</text>
<text x="512" y="113" font-size="14.5">woman</text>
<text x="704" y="94" font-size="14.5">After trauma</text>
<text x="704" y="113" font-size="14.5">or surgery</text>
<line x1="14" y1="134" x2="886" y2="134" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="18" y="158" font-size="15">Histology</text>
<text x="128" y="158" font-size="14.5">Neutrophils,</text>
<text x="128" y="177" font-size="14.5">possible abscess;</text>
<text x="128" y="196" font-size="14.5">S. aureus</text>
<text x="320" y="158" font-size="14.5">Squamous metaplasia,</text>
<text x="320" y="177" font-size="14.5">keratin plugs</text>
<text x="512" y="158" font-size="14.5">Dilated ducts,</text>
<text x="512" y="177" font-size="14.5">thick secretions,</text>
<text x="512" y="196" font-size="14.5">plasma cells</text>
<text x="704" y="158" font-size="14.5">Necrotic fat cells,</text>
<text x="704" y="177" font-size="14.5">foamy macrophages,</text>
<text x="704" y="196" font-size="14.5">calcium soaps</text>
<line x1="14" y1="216" x2="886" y2="216" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="18" y="240" font-size="15">Clue</text>
<text x="128" y="240" font-size="14.5">Fever; red, tender</text>
<text x="128" y="259" font-size="14.5">wedge of breast</text>
<text x="320" y="240" font-size="14.5">Recurrent abscess</text>
<text x="320" y="259" font-size="14.5">under the areola,</text>
<text x="320" y="278" font-size="14.5">nipple inversion</text>
<text x="512" y="240" font-size="14.5">Green-brown</text>
<text x="512" y="259" font-size="14.5">discharge</text>
<text x="704" y="240" font-size="14.5">Firm, calcified mass</text>
<text x="704" y="259" font-size="14.5">that mimics cancer</text>
<line x1="14" y1="298" x2="886" y2="298" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="18" y="322" font-size="15">Outcome</text>
<text x="128" y="322" font-size="14.5">Keep nursing;</text>
<text x="128" y="341" font-size="14.5">dicloxacillin or</text>
<text x="128" y="360" font-size="14.5">cephalexin;</text>
<text x="128" y="379" font-size="14.5">drain an abscess</text>
<text x="320" y="322" font-size="14.5">Recurs until the</text>
<text x="320" y="341" font-size="14.5">whole duct is</text>
<text x="320" y="360" font-size="14.5">excised</text>
<text x="512" y="322" font-size="14.5">Benign;</text>
<text x="512" y="341" font-size="14.5">no cancer risk</text>
<text x="704" y="322" font-size="14.5">Benign; biopsy</text>
<text x="704" y="341" font-size="14.5">to exclude</text>
<text x="704" y="360" font-size="14.5">carcinoma</text>
<text class="b" x="14" y="438" font-size="17">Breast implants: three problems</text>
<text x="886" y="438" font-size="14.5" text-anchor="end">Implants have not been shown to cause breast carcinoma</text>
<rect x="14" y="448" width="288" height="104" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="26" y="474" font-size="15">Capsular contracture</text>
<text x="26" y="498" font-size="14.5">Fibrous capsule tightens</text>
<text x="26" y="518" font-size="14.5">Firm, painful, distorted breast</text>
<text x="26" y="538" font-size="14.5">Most common complication</text>
<rect x="306" y="448" width="288" height="104" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="318" y="474" font-size="15">Silicone granuloma</text>
<text x="318" y="498" font-size="14.5">Implant ruptures</text>
<text x="318" y="518" font-size="14.5">Foreign-body giant cell reaction</text>
<text x="318" y="538" font-size="14.5">Mimics carcinoma on imaging</text>
<rect x="598" y="448" width="288" height="104" rx="10" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="610" y="474" font-size="15">Anaplastic large cell lymphoma</text>
<text x="610" y="498" font-size="14.5">CD30-positive, ALK-negative T cells</text>
<text x="610" y="518" font-size="14.5">Textured implants, years later</text>
<text x="610" y="538" font-size="14.5">Sudden fluid collection</text>
</svg>
