<svg class="dia" viewBox="0 0 900 500" role="img" aria-label="How labor starts and how induction copies it: placental CRH drives fetal ACTH, fetal adrenal cortisol and DHEA-S, placental estrogen, oxytocin receptors, connexin 43 gap junctions and the Ferguson reflex; induction ripens the cervix with dinoprostone, misoprostol or a balloon and then uses oxytocin, whose excess causes tachysystole and hyponatremia">
<text class="ttl" x="14" y="26" font-size="17">Labor starts with a fetal cascade; induction copies it</text>
<rect x="14" y="40" width="428" height="446" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="28" y="66" font-size="17">How labor starts</text>
<rect x="28" y="78" width="400" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="98" font-size="15.5">Placental CRH rises near term</text>
<text x="42" y="115" font-size="13.5">corticotropin-releasing hormone</text>
<line x1="228" y1="122" x2="228.0" y2="126.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="228,132 224.3,126.0 231.7,126.0" fill="var(--ink-2)"/>
<rect x="28" y="132" width="400" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="160" font-size="15.5">Fetal pituitary releases ACTH</text>
<line x1="228" y1="176" x2="228.0" y2="180.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="228,186 224.3,180.0 231.7,180.0" fill="var(--ink-2)"/>
<rect x="28" y="186" width="400" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="206" font-size="15.5">Fetal adrenal makes cortisol and DHEA-S</text>
<text x="42" y="223" font-size="13.5">Cortisol also matures the lungs</text>
<line x1="228" y1="230" x2="228.0" y2="234.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="228,240 224.3,234.0 231.7,234.0" fill="var(--ink-2)"/>
<rect x="28" y="240" width="400" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="260" font-size="15.5">Placenta turns DHEA-S into estrogen</text>
<text x="42" y="277" font-size="13.5">Estrogen-to-progesterone ratio rises</text>
<line x1="228" y1="284" x2="228.0" y2="288.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="228,294 224.3,288.0 231.7,288.0" fill="var(--ink-2)"/>
<rect x="28" y="294" width="400" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="314" font-size="15.5">Estrogen raises oxytocin receptors</text>
<text x="42" y="331" font-size="13.5">connexin 43 and prostaglandins</text>
<line x1="228" y1="338" x2="228.0" y2="342.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="228,348 224.3,342.0 231.7,342.0" fill="var(--ink-2)"/>
<rect x="28" y="348" width="400" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="368" font-size="15.5">Connexin 43 gap junctions</text>
<text x="42" y="385" font-size="13.5">The uterus contracts as one unit</text>
<line x1="228" y1="392" x2="228.0" y2="396.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="228,402 224.3,396.0 231.7,396.0" fill="var(--ink-2)"/>
<rect x="28" y="402" width="400" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="422" font-size="15.5">Ferguson reflex</text>
<text x="42" y="439" font-size="13.5">Cervical stretch releases more oxytocin</text>
<line x1="428" y1="424" x2="435.0" y2="424.0" stroke="var(--ink-2)" stroke-width="0"/>
<polygon points="436,424 435.0,424.6 435.0,423.4" fill="var(--ink-2)"/>
<rect x="456" y="40" width="430" height="446" rx="10" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="470" y="66" font-size="17">Copying it: induction</text>
<rect x="470" y="78" width="402" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="484" y="98" font-size="15.5">Bishop score under 8: ripen the cervix first</text>
<text x="484" y="115" font-size="13.5">8 or more: induction is likely to work</text>
<rect x="470" y="134" width="402" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="484" y="154" font-size="15.5">Dinoprostone: prostaglandin E2</text>
<text x="484" y="171" font-size="13.5">Vaginal gel or insert</text>
<rect x="470" y="188" width="402" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="484" y="208" font-size="15.5">Misoprostol: prostaglandin E1 analog</text>
<text x="484" y="225" font-size="13.5">Prostaglandins can cause tachysystole</text>
<rect x="470" y="242" width="402" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="484" y="262" font-size="15.5">Transcervical balloon catheter</text>
<text x="484" y="279" font-size="13.5">Mechanical: used after a cesarean (scar rupture risk)</text>
<line x1="671" y1="122" x2="671.0" y2="128.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="671,134 667.3,128.0 674.7,128.0" fill="var(--ink-2)"/>
<line x1="671" y1="296" x2="671.0" y2="302.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="671,308 667.3,302.0 674.7,302.0" fill="var(--ink-2)"/>
<rect x="470" y="308" width="402" height="44" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="484" y="328" font-size="15.5">Oxytocin then drives the contractions</text>
<text x="484" y="345" font-size="13.5">Gq-coupled receptor: IP3 raises intracellular calcium</text>
<rect x="470" y="366" width="402" height="106" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="484" y="390" font-size="15.5">Too much oxytocin</text>
<text x="484" y="412" font-size="13.5">Tachysystole: more than 5 contractions in 10 minutes</text>
<text x="484" y="430" font-size="13.5">so stop the infusion</text>
<text class="cr" x="484" y="458" font-size="14.5">Hyponatremia from water intoxication</text>
</svg>
