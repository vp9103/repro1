<svg class="dia" viewBox="0 0 900 709" role="img" aria-label="Screening and treatment of bacterial sexually transmitted infections: yearly NAAT under age 25, doxycycline for chlamydia, ceftriaxone for gonorrhea, ceftriaxone plus doxycycline plus metronidazole for pelvic inflammatory disease, benzathine penicillin G for syphilis with desensitization in pregnancy, and the Jarisch-Herxheimer reaction">
<text class="ttl" x="14" y="26" font-size="17">Bacterial STIs and PID: how to screen, and which drug to give</text>
<text class="s" x="26" y="60" font-size="14">Situation</text>
<text class="s" x="222" y="60" font-size="14">What to do</text>
<text class="s" x="552" y="60" font-size="14">Why</text>
<rect x="14" y="72" width="872" height="132" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="72" width="196" height="132" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="210" y1="72" x2="210" y2="204" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="72" x2="540" y2="204" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="98" font-size="15">Screening</text>
<text x="26" y="123" font-size="14">most cases are silent</text>
<circle cx="225" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="98" font-size="14">Nucleic acid amplification test</text>
<text x="236" y="118" font-size="14">(NAAT)</text>
<circle cx="225" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="142" font-size="14">Vaginal swab is acceptable</text>
<circle cx="225" cy="161" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="166" font-size="14">Every year for sexually active</text>
<text x="236" y="186" font-size="14">women under 25</text>
<circle cx="555" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="98" font-size="14">Silent infection can still scar the tubes</text>
<circle cx="555" cy="117" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="122" font-size="14">Gram stain and culture miss it</text>
<rect x="14" y="210" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="210" width="196" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="210" y1="210" x2="210" y2="318" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="210" x2="540" y2="318" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="236" font-size="15">Chlamydia</text>
<text x="26" y="261" font-size="14">uncomplicated</text>
<circle cx="225" cy="231" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="236" font-size="14">Doxycycline for 7 days</text>
<circle cx="225" cy="255" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="260" font-size="14">Azithromycin in pregnancy</text>
<circle cx="555" cy="231" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="236" font-size="14">Doxycycline harms fetal bones and</text>
<text x="566" y="256" font-size="14">teeth</text>
<circle cx="555" cy="275" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="280" font-size="14">Treat partners and retest in about 3</text>
<text x="566" y="300" font-size="14">months</text>
<rect x="14" y="324" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="324" width="196" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="210" y1="324" x2="210" y2="432" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="324" x2="540" y2="432" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="350" font-size="15">Gonorrhea</text>
<text x="26" y="375" font-size="14">uncomplicated</text>
<circle cx="225" cy="345" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="350" font-size="14">Ceftriaxone, a cephalosporin</text>
<circle cx="555" cy="345" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="350" font-size="14">Gonococci resist penicillin and</text>
<text x="566" y="370" font-size="14">fluoroquinolones</text>
<circle cx="555" cy="389" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="394" font-size="14">Add doxycycline unless chlamydia is</text>
<text x="566" y="414" font-size="14">ruled out</text>
<rect x="14" y="438" width="872" height="92" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="438" width="196" height="92" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="210" y1="438" x2="210" y2="530" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="438" x2="540" y2="530" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="464" font-size="15">Pelvic inflammatory</text>
<text class="b" x="26" y="485" font-size="15">disease</text>
<text x="26" y="510" font-size="14">outpatient</text>
<circle cx="225" cy="459" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="464" font-size="14">Ceftriaxone, doxycycline and</text>
<text x="236" y="484" font-size="14">metronidazole</text>
<circle cx="555" cy="459" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="464" font-size="14">Ceftriaxone covers the gonococcus</text>
<circle cx="555" cy="483" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="488" font-size="14">Doxycycline covers chlamydia</text>
<circle cx="555" cy="507" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="512" font-size="14">Metronidazole covers anaerobes</text>
<rect x="14" y="536" width="872" height="88" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="536" width="196" height="88" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<line x1="210" y1="536" x2="210" y2="624" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="536" x2="540" y2="624" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="562" font-size="15">Syphilis</text>
<text x="26" y="587" font-size="14">treat with penicillin</text>
<circle cx="225" cy="557" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="562" font-size="14">Benzathine penicillin G</text>
<circle cx="225" cy="581" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="586" font-size="14">Neurosyphilis: IV penicillin G</text>
<circle cx="555" cy="557" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="562" font-size="14">Pregnant with penicillin allergy:</text>
<text x="566" y="582" font-size="14">desensitize, then give penicillin</text>
<circle cx="555" cy="601" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="606" font-size="14">Only penicillin reliably treats the fetus</text>
<rect x="14" y="630" width="872" height="69" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="630" width="196" height="69" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<line x1="210" y1="630" x2="210" y2="699" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="630" x2="540" y2="699" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="656" font-size="15">After the first dose</text>
<text x="26" y="681" font-size="14">syphilis</text>
<circle cx="225" cy="651" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="656" font-size="14">Jarisch-Herxheimer reaction</text>
<circle cx="225" cy="675" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="680" font-size="14">Fever and muscle aches</text>
<circle cx="555" cy="651" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="656" font-size="14">Dying spirochetes release</text>
<text x="566" y="676" font-size="14">inflammatory lipoproteins</text>
</svg>
