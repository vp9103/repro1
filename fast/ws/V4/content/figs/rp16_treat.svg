<svg class="dia" viewBox="0 0 900 689" role="img" aria-label="Screening and treatment of bacterial sexually transmitted infections: yearly NAAT under age 25, doxycycline for chlamydia, ceftriaxone for gonorrhea, ceftriaxone plus doxycycline plus metronidazole for pelvic inflammatory disease, benzathine penicillin G for syphilis with desensitization in pregnancy, and the Jarisch-Herxheimer reaction">
<text class="ttl" x="14" y="26" font-size="17">Bacterial STIs and PID: how to screen, and which drug to give</text>
<text class="s" x="26" y="60" font-size="14">Situation</text>
<text class="s" x="236" y="60" font-size="14">What to do</text>
<text class="s" x="576" y="60" font-size="14">Why</text>
<rect x="14" y="72" width="872" height="112" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="72" width="210" height="112" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="224" y1="72" x2="224" y2="184" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="564" y1="72" x2="564" y2="184" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="98" font-size="15">Screening</text>
<text x="26" y="123" font-size="14">most cases are silent</text>
<circle cx="239" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="98" font-size="14">Nucleic acid amplification test (NAAT)</text>
<circle cx="239" cy="117" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="122" font-size="14">Vaginal swab is acceptable</text>
<circle cx="239" cy="141" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="146" font-size="14">Every year for sexually active women</text>
<text x="250" y="166" font-size="14">under 25</text>
<circle cx="579" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="98" font-size="14">Silent cervical infection can still scar the</text>
<text x="590" y="118" font-size="14">tubes</text>
<circle cx="579" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="142" font-size="14">Gram stain and culture miss most of it</text>
<rect x="14" y="190" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="190" width="210" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="224" y1="190" x2="224" y2="298" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="564" y1="190" x2="564" y2="298" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="216" font-size="15">Chlamydia</text>
<text x="26" y="241" font-size="14">uncomplicated</text>
<circle cx="239" cy="211" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="216" font-size="14">Doxycycline for 7 days</text>
<circle cx="239" cy="235" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="240" font-size="14">Azithromycin in pregnancy</text>
<circle cx="579" cy="211" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="216" font-size="14">Doxycycline harms fetal bones and</text>
<text x="590" y="236" font-size="14">teeth</text>
<circle cx="579" cy="255" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="260" font-size="14">Treat partners and retest in about 3</text>
<text x="590" y="280" font-size="14">months</text>
<rect x="14" y="304" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="304" width="210" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="224" y1="304" x2="224" y2="412" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="564" y1="304" x2="564" y2="412" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="330" font-size="15">Gonorrhea</text>
<text x="26" y="355" font-size="14">uncomplicated</text>
<circle cx="239" cy="325" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="330" font-size="14">Ceftriaxone</text>
<circle cx="579" cy="325" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="330" font-size="14">Gonococci resist penicillin and</text>
<text x="590" y="350" font-size="14">fluoroquinolones</text>
<circle cx="579" cy="369" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="374" font-size="14">Add doxycycline unless chlamydia is</text>
<text x="590" y="394" font-size="14">ruled out</text>
<rect x="14" y="418" width="872" height="92" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="418" width="210" height="92" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="224" y1="418" x2="224" y2="510" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="564" y1="418" x2="564" y2="510" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="444" font-size="15">Pelvic inflammatory</text>
<text class="b" x="26" y="465" font-size="15">disease</text>
<text x="26" y="490" font-size="14">outpatient</text>
<circle cx="239" cy="439" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="444" font-size="14">Ceftriaxone, doxycycline and</text>
<text x="250" y="464" font-size="14">metronidazole</text>
<circle cx="579" cy="439" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="444" font-size="14">Ceftriaxone covers the gonococcus</text>
<circle cx="579" cy="463" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="468" font-size="14">Doxycycline covers chlamydia</text>
<circle cx="579" cy="487" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="492" font-size="14">Metronidazole covers anaerobes</text>
<rect x="14" y="516" width="872" height="88" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="516" width="210" height="88" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<line x1="224" y1="516" x2="224" y2="604" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="564" y1="516" x2="564" y2="604" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="542" font-size="15">Syphilis</text>
<text x="26" y="567" font-size="14">treat with penicillin</text>
<circle cx="239" cy="537" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="542" font-size="14">Benzathine penicillin G</text>
<circle cx="239" cy="561" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="566" font-size="14">Neurosyphilis: IV penicillin G</text>
<circle cx="579" cy="537" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="542" font-size="14">Pregnant with penicillin allergy:</text>
<text x="590" y="562" font-size="14">desensitize, then give penicillin</text>
<circle cx="579" cy="581" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="586" font-size="14">Only penicillin reliably treats the fetus</text>
<rect x="14" y="610" width="872" height="69" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="610" width="210" height="69" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<line x1="224" y1="610" x2="224" y2="679" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="564" y1="610" x2="564" y2="679" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="636" font-size="15">After the first dose</text>
<text x="26" y="661" font-size="14">syphilis</text>
<circle cx="239" cy="631" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="636" font-size="14">Jarisch-Herxheimer reaction</text>
<circle cx="239" cy="655" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="250" y="660" font-size="14">Fever and muscle aches</text>
<circle cx="579" cy="631" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="590" y="636" font-size="14">Dying spirochetes release inflammatory</text>
<text x="590" y="656" font-size="14">lipoproteins</text>
</svg>
