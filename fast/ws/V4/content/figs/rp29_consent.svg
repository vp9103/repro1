<svg class="dia" viewBox="0 0 900 718" role="img" aria-label="When a minor can consent alone, the three parts of valid informed consent (capacity, disclosure of reasonable alternatives, voluntariness), the difference between capacity and legal competence, and the history of Tuskegee and coerced sterilization that explains mistrust and why an informed refusal is accepted">
<text class="ttl" x="14" y="26" font-size="17">Consent, confidentiality and history: what makes reproductive care ethical</text>
<text class="b" x="14" y="56" font-size="16">A minor can usually consent alone, with limits</text>
<rect x="14" y="68" width="429" height="143" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="26" y="97" font-size="15">Without a parent in most states</text>
<circle cx="29" cy="117" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="122" font-size="14">Contraception</text>
<circle cx="29" cy="141" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="146" font-size="14">Testing and treatment for sexually transmitted</text>
<text x="40" y="166" font-size="14">infections</text>
<circle cx="29" cy="185" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="190" font-size="14">Prenatal care</text>
<rect x="457" y="68" width="429" height="143" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="469" y="97" font-size="15">The limits</text>
<circle cx="472" cy="117" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="483" y="122" font-size="14">Abortion is the outlier: many states require</text>
<text x="483" y="142" font-size="14">parental notice or consent unless a judge grants</text>
<text x="483" y="162" font-size="14">a bypass</text>
<circle cx="472" cy="181" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="483" y="186" font-size="14">Abuse or a serious risk of harm must be acted on</text>
<text class="b" x="14" y="237" font-size="16">Valid informed consent has three parts</text>
<rect x="14" y="251" width="281" height="135" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="26" y="280" font-size="15">Capacity</text>
<circle cx="29" cy="300" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="305" font-size="14">For this one decision:</text>
<text x="40" y="325" font-size="14">understands, appreciates,</text>
<text x="40" y="345" font-size="14">reasons and states a choice</text>
<rect x="309" y="251" width="281" height="135" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="321" y="280" font-size="15">Disclosure</text>
<circle cx="324" cy="300" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="335" y="305" font-size="14">The procedure, its risks and</text>
<text x="335" y="325" font-size="14">benefits, and the reasonable</text>
<text x="335" y="345" font-size="14">alternatives, including doing</text>
<text x="335" y="365" font-size="14">nothing</text>
<rect x="604" y="251" width="281" height="135" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="616" y="280" font-size="15">Voluntariness</text>
<circle cx="619" cy="300" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="630" y="305" font-size="14">Free of coercion from family,</text>
<text x="630" y="325" font-size="14">clinicians or institutions</text>
<rect x="14" y="396" width="429" height="95" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="26" y="425" font-size="15">Capacity is a clinical judgment</text>
<text x="26" y="450" font-size="14">Made by the treating clinician about one decision</text>
<text x="26" y="470" font-size="14">at one time</text>
<rect x="457" y="396" width="429" height="95" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="469" y="425" font-size="15">Competence is a legal status</text>
<text x="469" y="450" font-size="14">Only a court decides it</text>
<text class="b" x="14" y="517" font-size="16">History explains mistrust, and what to do about it</text>
<rect x="14" y="531" width="429" height="183" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="26" y="560" font-size="15">Why some patients mistrust</text>
<circle cx="29" cy="580" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="585" font-size="14">Tuskegee study, 1932 to 1972: syphilis left</text>
<text x="40" y="605" font-size="14">untreated in Black men</text>
<circle cx="29" cy="624" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="629" font-size="14">Coerced sterilization of Black, Latina, Native</text>
<text x="40" y="649" font-size="14">American, disabled and incarcerated women</text>
<circle cx="29" cy="668" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="673" font-size="14">Belmont Report, 1979: respect for persons,</text>
<text x="40" y="693" font-size="14">beneficence, justice</text>
<rect x="457" y="531" width="429" height="183" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="469" y="560" font-size="15">What to do</text>
<circle cx="472" cy="580" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="483" y="585" font-size="14">Pressure toward a long-acting method can feel</text>
<text x="483" y="605" font-size="14">like history repeating</text>
<circle cx="472" cy="624" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="483" y="629" font-size="14">Accept a capable patient's decision and offer</text>
<text x="483" y="649" font-size="14">follow-up options</text>
</svg>
