<svg class="dia" viewBox="0 0 900 591" role="img" aria-label="Normal changes of pregnancy that change interpretation: filtration up about 50 percent so creatinine falls, glucosuria without hyperglycemia, ureteral dilation and urinary stasis from progesterone and uterine compression, placental alkaline phosphatase, thyroxine-binding globulin and hCG effects on thyroid tests, and relaxin loosening pelvic ligaments">
<text class="ttl" x="14" y="26" font-size="17">Kidney, ureter and lab changes of pregnancy: what is normal and what misleads</text>
<text class="s" x="26" y="60" font-size="14">Finding</text>
<text class="s" x="222" y="60" font-size="14">What changes</text>
<text class="s" x="552" y="60" font-size="14">Why</text>
<rect x="14" y="72" width="872" height="69" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="72" width="196" height="69" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="210" y1="72" x2="210" y2="141" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="72" x2="540" y2="141" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="98" font-size="15">Creatinine, BUN</text>
<text x="26" y="123" font-size="14">kidney filtering</text>
<circle cx="225" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="98" font-size="14">Both fall; a creatinine of 1.0 mg/dL</text>
<text x="236" y="118" font-size="14">already suggests reduced function</text>
<circle cx="555" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="98" font-size="14">Renal plasma flow and GFR rise about</text>
<text x="566" y="118" font-size="14">50 percent</text>
<rect x="14" y="147" width="872" height="64" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="147" width="196" height="64" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="210" y1="147" x2="210" y2="211" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="147" x2="540" y2="211" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="173" font-size="15">Urine glucose</text>
<circle cx="225" cy="168" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="173" font-size="14">Glucosuria without hyperglycemia</text>
<circle cx="555" cy="168" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="173" font-size="14">Filtered glucose exceeds proximal</text>
<text x="566" y="193" font-size="14">tubular reabsorption</text>
<rect x="14" y="217" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="217" width="196" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="210" y1="217" x2="210" y2="325" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="217" x2="540" y2="325" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="243" font-size="15">Ureters</text>
<text x="26" y="268" font-size="14">urinary tract</text>
<circle cx="225" cy="238" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="243" font-size="14">Physiologic hydroureter and</text>
<text x="236" y="263" font-size="14">hydronephrosis, more on the right</text>
<circle cx="225" cy="282" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="287" font-size="14">Urinary stasis: pyelonephritis is more</text>
<text x="236" y="307" font-size="14">common</text>
<circle cx="555" cy="238" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="243" font-size="14">Progesterone relaxes ureteral muscle</text>
<circle cx="555" cy="262" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="267" font-size="14">The uterus compresses the ureters at</text>
<text x="566" y="287" font-size="14">the pelvic brim</text>
<rect x="14" y="331" width="872" height="66" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="331" width="196" height="66" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="210" y1="331" x2="210" y2="397" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="331" x2="540" y2="397" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="357" font-size="15">Alkaline</text>
<text class="b" x="26" y="378" font-size="15">phosphatase</text>
<circle cx="225" cy="352" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="357" font-size="14">Doubles or triples without liver</text>
<text x="236" y="377" font-size="14">disease</text>
<circle cx="555" cy="352" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="357" font-size="14">The placenta makes it</text>
<rect x="14" y="403" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="403" width="196" height="108" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<line x1="210" y1="403" x2="210" y2="511" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="403" x2="540" y2="511" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="429" font-size="15">Thyroid tests</text>
<circle cx="225" cy="424" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="429" font-size="14">Total T4 rises, free T4 stays normal</text>
<circle cx="225" cy="448" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="453" font-size="14">TSH can dip in the first trimester</text>
<circle cx="555" cy="424" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="429" font-size="14">Estrogen raises thyroxine-binding</text>
<text x="566" y="449" font-size="14">globulin</text>
<circle cx="555" cy="468" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="473" font-size="14">Peak hCG weakly stimulates the TSH</text>
<text x="566" y="493" font-size="14">receptor</text>
<rect x="14" y="517" width="872" height="64" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="517" width="196" height="64" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="210" y1="517" x2="210" y2="581" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="540" y1="517" x2="540" y2="581" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="543" font-size="15">Pelvic ligaments</text>
<circle cx="225" cy="538" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="543" font-size="14">The pubic symphysis and ligaments</text>
<text x="236" y="563" font-size="14">loosen</text>
<circle cx="555" cy="538" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="566" y="543" font-size="14">Relaxin from the corpus luteum and</text>
<text x="566" y="563" font-size="14">placenta</text>
</svg>
