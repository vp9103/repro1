<svg class="dia" viewBox="0 0 900 449" role="img" aria-label="Prostatitis patterns compared: acute bacterial with a boggy tender prostate and Escherichia coli, avoiding vigorous massage; chronic bacterial with recurrent infection and fluoroquinolones; chronic pelvic pain syndrome with negative cultures as the most common type; and granulomatous prostatitis after BCG">
<text class="ttl" x="14" y="26" font-size="17">Four patterns of prostatitis: the clue, the cause and what to avoid</text>
<text class="s" x="26" y="60" font-size="14">Pattern</text>
<text class="s" x="252" y="60" font-size="14">What you find</text>
<text class="s" x="572" y="60" font-size="14">What to remember</text>
<rect x="14" y="72" width="872" height="128" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="72" width="226" height="128" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<line x1="240" y1="72" x2="240" y2="200" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="560" y1="72" x2="560" y2="200" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="98" font-size="15">Acute bacterial</text>
<text x="26" y="123" font-size="14">fever and dysuria</text>
<circle cx="255" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="266" y="98" font-size="14">A very tender, swollen, boggy</text>
<text x="266" y="118" font-size="14">prostate</text>
<circle cx="255" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="266" y="142" font-size="14">Escherichia coli from refluxed urine;</text>
<text x="266" y="162" font-size="14">chlamydia and gonorrhea in young,</text>
<text x="266" y="182" font-size="14">sexually active men</text>
<circle cx="575" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="586" y="98" font-size="14">Avoid vigorous prostatic massage: it</text>
<text x="586" y="118" font-size="14">can push bacteria into the blood</text>
<rect x="14" y="206" width="872" height="84" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="206" width="226" height="84" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="240" y1="206" x2="240" y2="290" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="560" y1="206" x2="560" y2="290" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="232" font-size="15">Chronic bacterial</text>
<text x="26" y="257" font-size="14">recurrent infection</text>
<circle cx="255" cy="227" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="266" y="232" font-size="14">Repeated urinary infections with</text>
<text x="266" y="252" font-size="14">the same organism</text>
<circle cx="575" cy="227" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="586" y="232" font-size="14">The gland is a reservoir that only</text>
<text x="586" y="252" font-size="14">lipid-soluble antibiotics, such as</text>
<text x="586" y="272" font-size="14">fluoroquinolones, can reach</text>
<rect x="14" y="296" width="872" height="68" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="296" width="226" height="68" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="240" y1="296" x2="240" y2="364" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="560" y1="296" x2="560" y2="364" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="322" font-size="15">Chronic pelvic pain</text>
<text class="b" x="26" y="343" font-size="15">syndrome</text>
<circle cx="255" cy="317" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="266" y="322" font-size="14">Pelvic pain with negative cultures</text>
<circle cx="575" cy="317" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="586" y="322" font-size="14">The most common type</text>
<circle cx="575" cy="341" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="586" y="346" font-size="14">Antibiotics do not help it</text>
<rect x="14" y="370" width="872" height="69" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="370" width="226" height="69" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="240" y1="370" x2="240" y2="439" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="560" y1="370" x2="560" y2="439" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="396" font-size="15">Granulomatous</text>
<text x="26" y="421" font-size="14">rare</text>
<circle cx="255" cy="391" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="266" y="396" font-size="14">A hard prostate that can mimic</text>
<text x="266" y="416" font-size="14">cancer</text>
<circle cx="575" cy="391" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="586" y="396" font-size="14">Often follows BCG treatment for</text>
<text x="586" y="416" font-size="14">bladder cancer</text>
</svg>
