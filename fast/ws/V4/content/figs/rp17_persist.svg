<svg class="dia" viewBox="0 0 900 516" role="img" aria-label="How four sexually transmitted viruses persist: HIV as an integrated provirus in resting CD4 cells, herpes simplex as an episome in sacral dorsal root ganglia, HPV as an episome in basal keratinocytes with wart treatments and the L1 virus-like particle vaccine, and molluscum as a cytoplasmic poxvirus that is widespread when the CD4 count is below 200">
<text class="ttl" x="14" y="26" font-size="17">Where each STI virus hides between episodes, and what that predicts</text>
<text class="s" x="26" y="60" font-size="14">Virus</text>
<text class="s" x="222" y="60" font-size="14">Where it hides</text>
<text class="s" x="504" y="60" font-size="14">What follows</text>
<rect x="14" y="72" width="872" height="88" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="72" width="196" height="88" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<line x1="210" y1="72" x2="210" y2="160" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="492" y1="72" x2="492" y2="160" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="98" font-size="15">HIV</text>
<text x="26" y="123" font-size="14">retrovirus</text>
<circle cx="225" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="98" font-size="14">Integrated provirus in resting</text>
<text x="236" y="118" font-size="14">CD4 cells</text>
<circle cx="507" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="518" y="98" font-size="14">No drug clears it, so the virus rebounds when</text>
<text x="518" y="118" font-size="14">therapy stops</text>
<circle cx="507" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="518" y="142" font-size="14">AIDS when the CD4 count falls below 200</text>
<rect x="14" y="166" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="166" width="196" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="210" y1="166" x2="210" y2="274" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="492" y1="166" x2="492" y2="274" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="192" font-size="15">Herpes simplex</text>
<text x="26" y="217" font-size="14">DNA virus</text>
<circle cx="225" cy="187" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="192" font-size="14">Sacral dorsal root ganglia, as a</text>
<text x="236" y="212" font-size="14">circular episome</text>
<circle cx="225" cy="231" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="236" font-size="14">Oral HSV-1: trigeminal</text>
<text x="236" y="256" font-size="14">ganglion</text>
<circle cx="507" cy="187" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="518" y="192" font-size="14">Stress, menses or illness reactivate it</text>
<circle cx="507" cy="211" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="518" y="216" font-size="14">Acyclovir needs active replication, so it never</text>
<text x="518" y="236" font-size="14">cures</text>
<rect x="14" y="280" width="872" height="112" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="280" width="196" height="112" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="210" y1="280" x2="210" y2="392" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="492" y1="280" x2="492" y2="392" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="306" font-size="15">HPV</text>
<text x="26" y="331" font-size="14">nonenveloped DNA</text>
<text x="26" y="351" font-size="14">virus</text>
<circle cx="225" cy="301" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="306" font-size="14">Basal keratinocytes, as an</text>
<text x="236" y="326" font-size="14">episome</text>
<circle cx="225" cy="345" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="350" font-size="14">New virus forms only as cells</text>
<text x="236" y="370" font-size="14">mature</text>
<circle cx="507" cy="301" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="518" y="306" font-size="14">Types 6 and 11 cause genital warts</text>
<circle cx="507" cy="325" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="518" y="330" font-size="14">Imiquimod activates toll-like receptor 7;</text>
<text x="518" y="350" font-size="14">podofilox blocks microtubules</text>
<circle cx="507" cy="369" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="518" y="374" font-size="14">Vaccine: L1 virus-like particles, no DNA</text>
<rect x="14" y="398" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="398" width="196" height="108" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="210" y1="398" x2="210" y2="506" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="492" y1="398" x2="492" y2="506" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="424" font-size="15">Molluscum</text>
<text x="26" y="449" font-size="14">poxvirus</text>
<circle cx="225" cy="419" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="236" y="424" font-size="14">Cytoplasm of keratinocytes</text>
<circle cx="507" cy="419" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="518" y="424" font-size="14">Pearly, umbilicated papules with molluscum</text>
<text x="518" y="444" font-size="14">bodies</text>
<circle cx="507" cy="463" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="518" y="468" font-size="14">Widespread lesions suggest HIV with a CD4</text>
<text x="518" y="488" font-size="14">count below 200</text>
</svg>
