<svg class="dia" viewBox="0 0 900 626" role="img" aria-label="An endocrine axis with negative feedback, and a grid of five lab patterns: primary gland failure, secondary failure, autonomous gland, trophic-hormone tumor and end-organ resistance, showing whether the trophic and target hormones are high or low">
<text class="ttl" x="14" y="24" font-size="17">One axis, five lab patterns: which way each number moves</text>
<rect x="14" y="44" width="872" height="146" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="24" y="66" width="130" height="36" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.3"/>
<text class="b" x="34" y="89" font-size="14">Hypothalamus</text>
<line x1="154" y1="84" x2="290" y2="84" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="290,79 298,84 290,89" fill="var(--ink-2)"/>
<text x="226" y="74" font-size="13" text-anchor="middle">releasing hormone</text>
<rect x="300" y="66" width="110" height="36" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.3"/>
<text class="b" x="312" y="89" font-size="14">Pituitary</text>
<line x1="410" y1="84" x2="546" y2="84" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="546,79 554,84 546,89" fill="var(--ink-2)"/>
<text x="481" y="74" font-size="13" text-anchor="middle">trophic hormone</text>
<rect x="556" y="66" width="90" height="36" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.3"/>
<text class="b" x="568" y="89" font-size="14">Gland</text>
<line x1="646" y1="84" x2="770" y2="84" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="770,79 778,84 770,89" fill="var(--ink-2)"/>
<text x="712" y="74" font-size="13" text-anchor="middle">target hormone</text>
<rect x="780" y="66" width="98" height="36" rx="6" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.3"/>
<text class="b" x="792" y="89" font-size="14">Tissues</text>
<path d="M601 102 C 601 150, 355 150, 355 110" fill="none" stroke="var(--a1)" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="349,113 355,103 361,113" fill="var(--a1)"/>
<path d="M585 102 C 585 176, 89 176, 89 110" fill="none" stroke="var(--a1)" stroke-width="2" stroke-dasharray="6 4"/>
<polygon points="83,113 89,103 95,113" fill="var(--a1)"/>
<text class="a1" x="660" y="140" font-size="14">negative feedback</text>
<text x="660" y="162" font-size="14">on pituitary and hypothalamus</text>
<text class="b" x="28" y="218" font-size="14">Pattern and where the lesion is</text>
<text class="b" x="390" y="218" font-size="14" text-anchor="middle">Trophic</text>
<text class="b" x="510" y="218" font-size="14" text-anchor="middle">Target</text>
<text class="b" x="635" y="218" font-size="14" text-anchor="middle">Tissue effect</text>
<text class="b" x="714" y="218" font-size="14">Example</text>
<rect x="14" y="236" width="872" height="72" rx="8" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1"/>
<text class="b" x="28" y="266" font-size="15">Primary gland failure</text>
<text x="28" y="290" font-size="14">the gland itself fails</text>
<polygon points="349,279 363,279 356,265" fill="var(--warn)"/>
<text class="wn" x="368" y="278" font-size="14">High</text>
<polygon points="469,265 483,265 476,279" fill="var(--a2)"/>
<text class="a2" x="488" y="278" font-size="14">Low</text>
<text class="cr" x="635" y="278" font-size="14" text-anchor="middle">Deficiency</text>
<text x="714" y="266" font-size="13">Primary hypothyroidism</text>
<text x="714" y="290" font-size="13">Addison disease</text>
<rect x="14" y="312" width="872" height="72" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
<text class="b" x="28" y="342" font-size="15">Secondary failure</text>
<text x="28" y="366" font-size="14">pituitary or hypothalamus fails</text>
<polygon points="349,341 363,341 356,355" fill="var(--a2)"/>
<text class="a2" x="368" y="354" font-size="14">Low</text>
<polygon points="469,341 483,341 476,355" fill="var(--a2)"/>
<text class="a2" x="488" y="354" font-size="14">Low</text>
<text class="cr" x="635" y="354" font-size="14" text-anchor="middle">Deficiency</text>
<text x="714" y="342" font-size="13">Sheehan syndrome</text>
<text x="714" y="366" font-size="13">Central hypothyroidism</text>
<rect x="14" y="388" width="872" height="72" rx="8" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1"/>
<text class="b" x="28" y="418" font-size="15">Autonomous gland</text>
<text x="28" y="442" font-size="14">gland makes excess on its own</text>
<polygon points="349,417 363,417 356,431" fill="var(--a2)"/>
<text class="a2" x="368" y="430" font-size="14">Low</text>
<polygon points="469,431 483,431 476,417" fill="var(--warn)"/>
<text class="wn" x="488" y="430" font-size="14">High</text>
<text class="wn" x="635" y="430" font-size="14" text-anchor="middle">Excess</text>
<text x="714" y="418" font-size="13">Graves disease</text>
<text x="714" y="442" font-size="13">Adrenal adenoma</text>
<rect x="14" y="464" width="872" height="72" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1"/>
<text class="b" x="28" y="494" font-size="15">Trophic-hormone tumor</text>
<text x="28" y="518" font-size="14">a tumor makes the trophic hormone</text>
<polygon points="349,507 363,507 356,493" fill="var(--warn)"/>
<text class="wn" x="368" y="506" font-size="14">High</text>
<polygon points="469,507 483,507 476,493" fill="var(--warn)"/>
<text class="wn" x="488" y="506" font-size="14">High</text>
<text class="wn" x="635" y="506" font-size="14" text-anchor="middle">Excess</text>
<text x="714" y="494" font-size="13">Cushing disease</text>
<text x="714" y="518" font-size="13">TSH-secreting adenoma</text>
<rect x="14" y="540" width="872" height="72" rx="8" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1"/>
<text class="b" x="28" y="570" font-size="15">End-organ resistance</text>
<text x="28" y="594" font-size="14">target cells cannot respond</text>
<polygon points="349,583 363,583 356,569" fill="var(--warn)"/>
<text class="wn" x="368" y="582" font-size="14">High</text>
<polygon points="469,583 483,583 476,569" fill="var(--warn)"/>
<text class="wn" x="488" y="582" font-size="14">High</text>
<text class="cr" x="635" y="582" font-size="14" text-anchor="middle">Deficiency</text>
<text x="714" y="570" font-size="13">Androgen insensitivity</text>
<text x="714" y="594" font-size="13">LH, testosterone high</text>
</svg>
