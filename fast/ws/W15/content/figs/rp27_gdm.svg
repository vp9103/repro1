<svg class="dia" viewBox="0 0 900 470" role="img" aria-label="Gestational diabetes: placental lactogen causes maternal insulin resistance, glucose crosses the placenta while insulin does not, and fetal hyperinsulinemia causes macrosomia, neonatal hypoglycemia, delayed surfactant, polycythemia and polyhydramnios">
<text class="ttl" x="14" y="26" font-size="17">Glucose crosses the placenta; insulin does not</text>
<rect x="14" y="44" width="250" height="412" rx="10" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="70" font-size="16">Mother</text>
<text x="28" y="104" font-size="14">Placental lactogen (hPL)</text>
<text x="28" y="128" font-size="14">and cortisol cause</text>
<text class="b" x="28" y="152" font-size="14">insulin resistance</text>
<text x="28" y="196" font-size="14">Lipolysis fuels the mother,</text>
<text x="28" y="220" font-size="14">so glucose is spared</text>
<text x="28" y="244" font-size="14">for the fetus</text>
<text x="28" y="288" font-size="14">If beta cells fall short:</text>
<text class="cr" x="28" y="312" font-size="15">Gestational diabetes</text>
<text x="28" y="356" font-size="14">Screen at 24 to 28 weeks</text>
<text x="28" y="380" font-size="14">High risk: first visit</text>
<text x="28" y="424" font-size="14">Later: type 2 diabetes risk</text>
<rect x="280" y="44" width="110" height="412" rx="10" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="335" y="70" font-size="15" text-anchor="middle">Placenta</text>
<text class="gd" x="335" y="156" font-size="14" text-anchor="middle">Glucose</text>
<line x1="250" y1="170" x2="412" y2="170" stroke="var(--good)" stroke-width="3"/>
<polygon points="412,164 422,170 412,176" fill="var(--good)"/>
<text class="gd" x="335" y="194" font-size="14" text-anchor="middle">crosses</text>
<text class="cr" x="335" y="276" font-size="14" text-anchor="middle">Insulin</text>
<line x1="250" y1="300" x2="322" y2="300" stroke="var(--crit)" stroke-width="3"/>
<line x1="330" y1="284" x2="330" y2="316" stroke="var(--crit)" stroke-width="5"/>
<text class="cr" x="335" y="338" font-size="14" text-anchor="middle">blocked</text>
<rect x="406" y="44" width="480" height="412" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="422" y="70" font-size="16">Fetus and newborn</text>
<text x="440" y="104" font-size="14">Fetal hyperglycemia</text>
<line x1="428" y1="110" x2="428" y2="124" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="424,122 428,130 432,122" fill="var(--ink-2)"/>
<text x="440" y="140" font-size="14">Beta-cell hyperplasia</text>
<line x1="428" y1="146" x2="428" y2="160" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="424,158 428,166 432,158" fill="var(--ink-2)"/>
<text class="b" x="440" y="176" font-size="14">Fetal hyperinsulinemia</text>
<text class="a2" x="422" y="214" font-size="14">Insulin then causes:</text>
<circle cx="430" cy="237" r="3" fill="var(--a2)"/>
<text x="440" y="242" font-size="14">Macrosomia, then shoulder dystocia</text>
<circle cx="430" cy="263" r="3" fill="var(--a2)"/>
<text x="440" y="268" font-size="14">Neonatal hypoglycemia once the cord is cut</text>
<circle cx="430" cy="289" r="3" fill="var(--a2)"/>
<text x="440" y="294" font-size="14">Delayed surfactant: respiratory distress</text>
<circle cx="430" cy="315" r="3" fill="var(--a2)"/>
<text x="440" y="320" font-size="14">Polycythemia from high oxygen demand</text>
<circle cx="430" cy="341" r="3" fill="var(--a2)"/>
<text x="440" y="346" font-size="14">Neonatal hypocalcemia</text>
<circle cx="430" cy="367" r="3" fill="var(--a2)"/>
<text x="440" y="372" font-size="14">Polyhydramnios from fetal polyuria</text>
<text class="wn" x="422" y="420" font-size="14">Pregestational diabetes: anomalies in weeks 3-8</text>
</svg>
