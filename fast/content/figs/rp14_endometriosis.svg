<svg class="dia" viewBox="0 0 900 596" role="img" aria-label="Endometriosis is endometrial glands and stroma outside the uterus, mostly from retrograde menstruation, with dysmenorrhea, dyspareunia and dyschezia; treatment steps from NSAIDs and hormones to the GnRH agonist leuprolide, which desensitizes the pituitary, and danazol, a synthetic androgen with acne and hirsutism that also treats hereditary angioedema">
<text class="ttl" x="14" y="26" font-size="17">Endometriosis: where it sits, why it forms and how it is treated</text>
<rect x="14" y="44" width="272" height="247" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="26" y="73" font-size="15">What it is</text>
<circle cx="29" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="40" y="98" font-size="14">Endometrial glands and</text>
<text class="b" x="40" y="118" font-size="14">stroma outside the uterus</text>
<circle cx="29" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="142" font-size="14">Ovary: endometrioma, a</text>
<text x="40" y="162" font-size="14">chocolate cyst of old blood</text>
<circle cx="29" cy="181" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="186" font-size="14">Pelvic peritoneum: red-brown</text>
<text x="40" y="206" font-size="14">nodules</text>
<circle cx="29" cy="225" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="230" font-size="14">Biopsy: glands, stroma and</text>
<text x="40" y="250" font-size="14">hemosiderin-laden</text>
<text x="40" y="270" font-size="14">macrophages</text>
<rect x="314" y="44" width="272" height="247" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="326" y="73" font-size="15">Why it forms</text>
<circle cx="329" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="340" y="98" font-size="14">Retrograde menstruation</text>
<circle cx="329" cy="117" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="122" font-size="14">Menstrual blood flows</text>
<text x="340" y="142" font-size="14">backward through the tubes</text>
<text x="340" y="162" font-size="14">onto the pelvis</text>
<circle cx="329" cy="181" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="186" font-size="14">Peritoneal metaplasia, or</text>
<text x="340" y="206" font-size="14">spread by lymph or blood,</text>
<text x="340" y="226" font-size="14">explains unusual sites</text>
<rect x="614" y="44" width="272" height="247" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="626" y="73" font-size="15">What the patient has</text>
<circle cx="629" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="640" y="98" font-size="14">Dysmenorrhea, dyspareunia</text>
<text class="b" x="640" y="118" font-size="14">and dyschezia</text>
<circle cx="629" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="142" font-size="14">Painful urination if implants</text>
<text x="640" y="162" font-size="14">reach the bladder</text>
<circle cx="629" cy="181" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="186" font-size="14">Infertility</text>
<circle cx="629" cy="205" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="210" font-size="14">A uterus of normal size</text>
<text class="b" x="14" y="323" font-size="16">Treatment suppresses the estrogen-driven growth, step by step</text>
<rect x="14" y="337" width="188" height="207" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="26" y="366" font-size="15">First steps</text>
<circle cx="29" cy="386" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="391" font-size="14">NSAIDs for pain</text>
<circle cx="29" cy="410" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="415" font-size="14">Then combined</text>
<text x="40" y="435" font-size="14">oral contraceptives</text>
<text x="40" y="455" font-size="14">or progestins</text>
<rect x="226" y="337" width="316" height="207" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="238" y="366" font-size="15">Leuprolide (GnRH agonist)</text>
<circle cx="241" cy="386" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="252" y="391" font-size="14">Desensitizes the pituitary</text>
<circle cx="241" cy="410" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="252" y="415" font-size="14">FSH, LH and estradiol fall</text>
<circle cx="241" cy="434" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="252" y="439" font-size="14">Low estrogen causes hot flashes</text>
<text x="252" y="459" font-size="14">and bone loss, which limits how</text>
<text x="252" y="479" font-size="14">long it is given</text>
<circle cx="241" cy="498" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="252" y="503" font-size="14">Elagolix blocks the GnRH receptor</text>
<text x="252" y="523" font-size="14">by mouth</text>
<rect x="566" y="337" width="318" height="207" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="578" y="366" font-size="15">Danazol</text>
<circle cx="581" cy="386" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="592" y="391" font-size="14">Synthetic androgen that</text>
<text class="b" x="592" y="411" font-size="14">suppresses gonadotropins</text>
<circle cx="581" cy="430" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="592" y="435" font-size="14">Acne, hirsutism, voice deepening</text>
<circle cx="581" cy="454" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="592" y="459" font-size="14">Weight gain with edema, low HDL,</text>
<text x="592" y="479" font-size="14">liver injury</text>
<circle cx="581" cy="498" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="592" y="503" font-size="14">Also treats hereditary angioedema</text>
<line x1="204" y1="373" x2="218" y2="373" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="224,373 218,376.6 218,369.4" fill="var(--ink-2)"/>
<line x1="544" y1="373" x2="558" y2="373" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="564,373 558,376.6 558,369.4" fill="var(--ink-2)"/>
<rect x="14" y="554" width="872" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="28" y="577" font-size="14">Surgery removes the implants when drugs fail to control the pain</text>
</svg>
