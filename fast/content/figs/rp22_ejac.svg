<svg class="dia" viewBox="0 0 900 484" role="img" aria-label="Emission by sympathetic hypogastric nerves T10 to L2 and ejaculation by the pudendal nerve S2 to S4, then how serotonin and SSRIs delay ejaculation, how premature ejaculation is treated, and how alpha-1 blockers, diabetic neuropathy and prostate surgery cause retrograde ejaculation">
<text class="ttl" x="14" y="26" font-size="17">Ejaculation in two steps, and what delays or misdirects it</text>
<rect x="14" y="46" width="422" height="139" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="26" y="75" font-size="15">1 Emission</text>
<circle cx="29" cy="95" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="100" font-size="14">Sympathetic: hypogastric nerves, T10 to L2</text>
<circle cx="29" cy="119" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="124" font-size="14">Ductus deferens, seminal vesicles and prostate</text>
<text x="40" y="144" font-size="14">contract; alpha-1 receptors close the bladder</text>
<text x="40" y="164" font-size="14">neck</text>
<rect x="464" y="46" width="422" height="139" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="476" y="75" font-size="15">2 Ejaculation</text>
<circle cx="479" cy="95" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="490" y="100" font-size="14">Somatic: pudendal nerve, S2 to S4</text>
<circle cx="479" cy="119" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="490" y="124" font-size="14">Bulbospongiosus and ischiocavernosus contract</text>
<text x="490" y="144" font-size="14">in rhythm</text>
<line x1="438" y1="115" x2="456" y2="115" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="462,115 456,118.6 456,111.4" fill="var(--ink-2)"/>
<text class="s" x="26" y="207" font-size="14">What changes it</text>
<text class="s" x="262" y="207" font-size="14">What it does</text>
<text class="s" x="562" y="207" font-size="14">Result</text>
<rect x="14" y="219" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="219" width="236" height="108" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="250" y1="219" x2="250" y2="327" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="550" y1="219" x2="550" y2="327" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="245" font-size="15">Serotonin</text>
<text x="26" y="270" font-size="14">SSRIs and clomipramine</text>
<circle cx="265" cy="240" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="276" y="245" font-size="14">Raises the ejaculation threshold</text>
<circle cx="565" cy="240" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="576" y="245" font-size="14">Delays or blocks ejaculation, lowers</text>
<text x="576" y="265" font-size="14">libido; erections usually intact</text>
<circle cx="565" cy="284" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="576" y="289" font-size="14">The same effect treats premature</text>
<text x="576" y="309" font-size="14">ejaculation</text>
<rect x="14" y="333" width="872" height="69" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="333" width="236" height="69" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<line x1="250" y1="333" x2="250" y2="402" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="550" y1="333" x2="550" y2="402" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="359" font-size="15">Alpha-1 blockers</text>
<text x="26" y="384" font-size="14">tamsulosin</text>
<circle cx="265" cy="354" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="276" y="359" font-size="14">Impair emission and bladder</text>
<text x="276" y="379" font-size="14">neck closure</text>
<circle cx="565" cy="354" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="576" y="359" font-size="14">Retrograde or absent ejaculation with</text>
<text x="576" y="379" font-size="14">a normal orgasm</text>
<rect x="14" y="408" width="872" height="66" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="408" width="236" height="66" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="250" y1="408" x2="250" y2="474" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="550" y1="408" x2="550" y2="474" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="434" font-size="15">Diabetic neuropathy,</text>
<text class="b" x="26" y="455" font-size="15">prostate surgery</text>
<circle cx="265" cy="429" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="276" y="434" font-size="14">Damage the nerves or the</text>
<text x="276" y="454" font-size="14">bladder neck</text>
<circle cx="565" cy="429" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="576" y="434" font-size="14">Low volume, with sperm in the urine</text>
<text x="576" y="454" font-size="14">afterward: retrograde ejaculation</text>
</svg>
