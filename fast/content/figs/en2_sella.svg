<svg class="dia" viewBox="0 0 900 520" role="img" aria-label="Left: a coronal view of the sella with the optic chiasm above the pituitary, the sphenoid sinus below, and the cavernous sinus on each side holding the internal carotid artery and cranial nerves III, IV, V1, V2 and VI. Right: crossing nasal retina fibers in the chiasm explain bitemporal hemianopia when a mass presses from below">
<text class="ttl" x="14" y="24" font-size="17">What surrounds the sella, and why a mass from below takes both temporal fields</text>
<rect x="14" y="44" width="546" height="462" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="70" font-size="15">Coronal view through the sella</text>
<rect x="190" y="112" width="120" height="18" rx="9" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="126" font-size="14">Optic chiasm</text>
<line x1="130" y1="121" x2="186" y2="121" stroke="var(--ink-3)" stroke-width="1.2"/>
<rect x="242" y="130" width="16" height="78" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="266" y="172" font-size="13">stalk</text>
<line x1="222" y1="204" x2="222" y2="142" stroke="var(--crit)" stroke-width="2.5"/>
<polygon points="216,144 222,134 228,144" fill="var(--crit)"/>
<text class="cr" x="96" y="176" font-size="13">upward growth</text>
<ellipse cx="250" cy="250" rx="66" ry="42" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.8"/>
<text class="b" x="250" y="255" font-size="14" text-anchor="middle">Pituitary</text>
<path d="M178 236 C 178 318, 322 318, 322 236" fill="none" stroke="var(--ink-3)" stroke-width="3"/>
<rect x="170" y="326" width="160" height="66" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text x="250" y="364" font-size="14" text-anchor="middle">Sphenoid sinus</text>
<rect x="66" y="206" width="100" height="96" rx="18" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="140" cy="262" r="15" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<circle cx="108" cy="276" r="6" fill="var(--warn)"/>
<circle cx="78" cy="222" r="5" fill="var(--warn)"/>
