<circle cx="800" cy="108" r="26" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.5"/>
<path d="M660 82 A 26 26 0 0 0 660 134 Z" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<path d="M800 82 A 26 26 0 0 1 800 134 Z" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="cr" x="730" y="162" font-size="14" text-anchor="middle">bitemporal hemianopia</text>
<ellipse cx="660" cy="196" rx="24" ry="14" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
<ellipse cx="800" cy="196" rx="24" ry="14" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
<polyline points="648,210 700,300 700,420" fill="none" stroke="var(--a2)" stroke-width="2.5"/>
<polyline points="812,210 760,300 760,420" fill="none" stroke="var(--a2)" stroke-width="2.5"/>
<polyline points="672,210 730,300 760,330 760,420" fill="none" stroke="var(--a1)" stroke-width="2.5"/>
<polyline points="788,210 730,300 700,330 700,420" fill="none" stroke="var(--a1)" stroke-width="2.5"/>
<rect x="690" y="288" width="80" height="24" rx="10" fill="none" stroke="var(--a1)" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="b" x="588" y="305" font-size="14">Chiasm</text>
<line x1="646" y1="300" x2="686" y2="300" stroke="var(--ink-3)" stroke-width="1"/>
<circle cx="730" cy="352" r="16" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.8"/>
<text class="cr" x="588" y="360" font-size="13">mass from</text>
<text class="cr" x="588" y="378" font-size="13">below</text>
<line x1="652" y1="362" x2="712" y2="356" stroke="var(--crit)" stroke-width="1"/>
<text x="770" y="410" font-size="13">optic tracts</text>
<line x1="592" y1="446" x2="616" y2="446" stroke="var(--a1)" stroke-width="3"/>
<text x="622" y="451" font-size="13">nasal retina fibers cross</text>
<line x1="592" y1="472" x2="616" y2="472" stroke="var(--a2)" stroke-width="3"/>
<text x="622" y="477" font-size="13">temporal fibers stay uncrossed</text>
</svg>
