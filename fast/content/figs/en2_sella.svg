<circle cx="78" cy="258" r="5" fill="var(--warn)"/>
<circle cx="78" cy="276" r="5" fill="var(--warn)"/>
<text x="116" y="322" font-size="13" text-anchor="middle">Cavernous sinus</text>
<rect x="334" y="206" width="100" height="96" rx="18" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="360" cy="262" r="15" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<circle cx="392" cy="276" r="6" fill="var(--warn)"/>
<circle cx="422" cy="222" r="5" fill="var(--warn)"/>
<circle cx="422" cy="240" r="5" fill="var(--warn)"/>
<circle cx="422" cy="258" r="5" fill="var(--warn)"/>
<circle cx="422" cy="276" r="5" fill="var(--warn)"/>
<line x1="428" y1="222" x2="466" y2="222" stroke="var(--ink-3)" stroke-width="1"/>
<line x1="428" y1="240" x2="466" y2="240" stroke="var(--ink-3)" stroke-width="1"/>
<line x1="428" y1="258" x2="466" y2="258" stroke="var(--ink-3)" stroke-width="1"/>
<line x1="428" y1="276" x2="466" y2="276" stroke="var(--ink-3)" stroke-width="1"/>
<line x1="397" y1="280" x2="466" y2="296" stroke="var(--ink-3)" stroke-width="1"/>
<text x="472" y="226" font-size="13">CN III</text>
<text x="472" y="244" font-size="13">CN IV</text>
<text x="472" y="262" font-size="13">CN V1</text>
<text x="472" y="280" font-size="13">CN V2</text>
<text x="472" y="300" font-size="13">CN VI</text>
<line x1="360" y1="277" x2="360" y2="312" stroke="var(--ink-3)" stroke-width="1"/>
<text x="344" y="326" font-size="13">Internal carotid artery</text>
<text class="s" x="28" y="430" font-size="13">Lateral wall: CN III, IV, V1, V2. Free in the sinus: CN VI</text>
<text class="s" x="28" y="452" font-size="13">beside the carotid. Sideways growth gives diplopia,</text>
<text class="s" x="28" y="474" font-size="13">ophthalmoplegia and facial numbness.</text>
<rect x="574" y="44" width="312" height="462" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="588" y="70" font-size="15">Why the temporal fields go</text>
