<svg class="dia" viewBox="0 0 900 672" role="img" aria-label="Contraceptive pitfalls follow from mechanism: ethinyl estradiol keeps FSH low and raises liver clotting factors (venous thromboembolism, stroke with migraine aura or smoking at 35 and older), ovulation suppression lowers ovarian cancer risk, DMPA lowers estradiol and bone density, the copper IUD raises prostaglandins and bleeding, enzyme inducers such as rifampin and carbamazepine cause pill failure, and obesity weakens levonorgestrel emergency contraception">
<text class="ttl" x="14" y="24" font-size="17">Each contraceptive pitfall follows from its mechanism</text>
<rect x="14" y="42" width="232" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="26" y="65" font-size="15">Agent or situation</text>
<rect x="254" y="42" width="318" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="266" y="65" font-size="15">Mechanism</text>
<rect x="580" y="42" width="306" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="592" y="65" font-size="15">What follows</text>
<rect x="14" y="84" width="232" height="62" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<rect x="254" y="84" width="318" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="580" y="84" width="306" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="120" font-size="15">Estrogen in the pill</text>
<text x="266" y="110" font-size="14">Suppressing FSH by negative</text>
<text x="266" y="130" font-size="14">feedback: no dominant follicle</text>
<text class="b" x="592" y="110" font-size="14">Ovulation is blocked</text>
<text x="592" y="130" font-size="14">Progestin blocks the LH surge too</text>
<rect x="14" y="154" width="232" height="62" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<rect x="254" y="154" width="318" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="580" y="154" width="306" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="190" font-size="15">Estrogen in the liver</text>
<text x="266" y="180" font-size="14">Ethinyl estradiol (pill, patch or ring)</text>
<text x="266" y="200" font-size="14">raises clotting factors such as fibrinogen</text>
<text class="b" x="592" y="180" font-size="14">Venous thromboembolism</text>
<text x="592" y="200" font-size="14">DVT and pulmonary embolism</text>
<rect x="14" y="224" width="232" height="62" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<rect x="254" y="224" width="318" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="580" y="224" width="306" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="250" font-size="15">Migraine with aura,</text>
<text x="26" y="270" font-size="13">or smoker age 35+</text>
<text x="266" y="250" font-size="14">These already raise vascular</text>
<text x="266" y="270" font-size="14">risk; estrogen adds clotting</text>
<text class="b" x="592" y="250" font-size="14">Ischemic stroke or MI</text>
<text x="592" y="270" font-size="14">Use progestin-only or copper</text>
<rect x="14" y="294" width="232" height="62" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.4"/>
<rect x="254" y="294" width="318" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="580" y="294" width="306" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="320" font-size="15">Ovulation suppressed</text>
<text x="26" y="340" font-size="13">for years</text>
<text x="266" y="320" font-size="14">Fewer ovulations, so less repair</text>
<text x="266" y="340" font-size="14">of the ovarian and tubal surface</text>
<text class="b" x="592" y="320" font-size="14">Lower ovarian cancer risk</text>
<text x="592" y="340" font-size="14">Protection lasts for decades</text>
<rect x="14" y="364" width="232" height="62" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.4"/>
<rect x="254" y="364" width="318" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="580" y="364" width="306" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="400" font-size="15">DMPA injection</text>
<text x="266" y="390" font-size="14">Strong gonadotropin suppression,</text>
<text x="266" y="410" font-size="14">so estradiol falls</text>
<text class="b" x="592" y="390" font-size="14">Lower bone density</text>
<text x="592" y="410" font-size="14">Reversible; fertility returns slowly</text>
<rect x="14" y="434" width="232" height="62" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.4"/>
<rect x="254" y="434" width="318" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="580" y="434" width="306" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="470" font-size="15">Copper IUD</text>
<text x="266" y="460" font-size="14">Sterile inflammation raises</text>
<text x="266" y="480" font-size="14">endometrial prostaglandins</text>
<text class="b" x="592" y="460" font-size="14">Heavier, more painful periods</text>
<text x="592" y="480" font-size="14">NSAIDs help</text>
<rect x="14" y="504" width="232" height="86" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/>
<rect x="254" y="504" width="318" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="580" y="504" width="306" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="530" font-size="15">Enzyme inducers</text>
<text x="26" y="550" font-size="13">Rifampin, carbamazepine,</text>
<text x="26" y="570" font-size="13">phenytoin, St John's wort</text>
<text x="266" y="530" font-size="14">Induce hepatic CYP3A4, so</text>
<text x="266" y="550" font-size="14">contraceptive hormones are</text>
<text x="266" y="570" font-size="14">cleared faster</text>
<text class="b" x="592" y="530" font-size="14">Pill, patch, ring may fail</text>
<text x="592" y="550" font-size="14">Use an IUD or DMPA instead</text>
<text x="592" y="570" font-size="14">Amoxicillin has no such effect</text>
<rect x="14" y="598" width="232" height="62" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/>
<rect x="254" y="598" width="318" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="580" y="598" width="306" height="62" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="624" font-size="15">Levonorgestrel</text>
<text x="26" y="644" font-size="13">emergency pill</text>
<text x="266" y="624" font-size="14">Only delays the LH surge;</text>
<text x="266" y="644" font-size="14">BMI of 30 or more weakens it</text>
<text class="b" x="592" y="624" font-size="14">Ulipristal or a copper IUD</text>
<text x="592" y="644" font-size="14">works better in obesity</text>
</svg>
