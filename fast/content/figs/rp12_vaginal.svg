<svg class="dia" viewBox="0 0 900 462" role="img" aria-label="Three vaginal tumors by patient: sarcoma botryoides in a girl under 5 with desmin-positive small round blue cells, vaginal adenosis and clear cell adenocarcinoma after in utero diethylstilbestrol exposure, and vaginal squamous carcinoma in older women, usually spread from the cervix">
<text class="ttl" x="14" y="26" font-size="17">Vaginal tumors depend on age and exposure</text>
<text class="s" x="26" y="60" font-size="14">Who</text>
<text class="s" x="216" y="60" font-size="14">Lesion</text>
<text class="s" x="536" y="60" font-size="14">Key clue</text>
<rect x="14" y="72" width="872" height="152" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="72" width="190" height="152" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="204" y1="72" x2="204" y2="224" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="524" y1="72" x2="524" y2="224" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="98" font-size="15">Girl younger than 5</text>
<circle cx="219" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="230" y="98" font-size="14">Sarcoma botryoides</text>
<circle cx="219" cy="117" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="230" y="122" font-size="14">Botryoid form of embryonal</text>
<text x="230" y="142" font-size="14">rhabdomyosarcoma</text>
<circle cx="539" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="550" y="98" font-size="14">Grape-like, bleeding mass pushing out of</text>
<text x="550" y="118" font-size="14">the vagina</text>
<circle cx="539" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="550" y="142" font-size="14">Small round blue cells in a dense</text>
<text x="550" y="162" font-size="14">cambium layer under intact epithelium;</text>
<text x="550" y="182" font-size="14">some show cross-striations</text>
<circle cx="539" cy="201" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="550" y="206" font-size="14">Desmin and myogenin positive</text>
<rect x="14" y="230" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="230" width="190" height="108" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="204" y1="230" x2="204" y2="338" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="524" y1="230" x2="524" y2="338" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="256" font-size="15">Diethylstilbestrol</text>
<text class="b" x="26" y="277" font-size="15">(DES) in utero</text>
<text x="26" y="302" font-size="14">young woman</text>
<circle cx="219" cy="251" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="230" y="256" font-size="14">Vaginal adenosis</text>
<circle cx="219" cy="275" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="230" y="280" font-size="14">Glandular Müllerian epithelium that</text>
<text x="230" y="300" font-size="14">persists in the upper vagina</text>
<circle cx="539" cy="251" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="550" y="256" font-size="14">Rarely progresses to clear cell</text>
<text x="550" y="276" font-size="14">adenocarcinoma</text>
<circle cx="539" cy="295" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="550" y="300" font-size="14">Clear, glycogen-rich cells with hobnail</text>
<text x="550" y="320" font-size="14">nuclei</text>
<rect x="14" y="344" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="344" width="190" height="108" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="204" y1="344" x2="204" y2="452" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="524" y1="344" x2="524" y2="452" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="370" font-size="15">Older woman</text>
<circle cx="219" cy="365" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="230" y="370" font-size="14">Vaginal squamous carcinoma</text>
<circle cx="219" cy="389" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="230" y="394" font-size="14">Rare; usually high-risk HPV through</text>
<text x="230" y="414" font-size="14">vaginal intraepithelial neoplasia</text>
<text x="230" y="434" font-size="14">(VAIN)</text>
<circle cx="539" cy="365" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="550" y="370" font-size="14">Most squamous carcinoma found in the</text>
<text x="550" y="390" font-size="14">vagina has spread from the cervix</text>
</svg>
