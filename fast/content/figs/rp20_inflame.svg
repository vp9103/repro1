<svg class="dia" viewBox="0 0 900 685" role="img" aria-label="Causes of a swollen painful testis or epididymis: epididymitis by age with Chlamydia, gonorrhea or Escherichia coli, mumps orchitis with pressure necrosis inside the tunica albuginea, torsed appendix testis, and the cremasteric reflex arc through the genitofemoral nerve">
<text class="ttl" x="14" y="26" font-size="17">The painful scrotum beyond torsion: who gets it, why, and the cremasteric reflex</text>
<text class="s" x="26" y="60" font-size="14">Cause</text>
<text class="s" x="226" y="60" font-size="14">Who gets it</text>
<text class="s" x="566" y="60" font-size="14">What to remember</text>
<rect x="14" y="72" width="872" height="128" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="72" width="200" height="128" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="214" y1="72" x2="214" y2="200" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="554" y1="72" x2="554" y2="200" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="98" font-size="15">Epididymitis</text>
<text x="26" y="123" font-size="14">infection from the</text>
<text x="26" y="143" font-size="14">urethra</text>
<circle cx="229" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="240" y="98" font-size="14">Under about 35: Chlamydia and</text>
<text x="240" y="118" font-size="14">gonorrhea</text>
<circle cx="229" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="240" y="142" font-size="14">Older men, urinary obstruction or a</text>
<text x="240" y="162" font-size="14">recent catheter: Escherichia coli and</text>
<text x="240" y="182" font-size="14">other enteric rods</text>
<circle cx="569" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="580" y="98" font-size="14">Lifting the testis eases the pain:</text>
<text x="580" y="118" font-size="14">Prehn sign</text>
<circle cx="569" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="580" y="142" font-size="14">Cremasteric reflex present, Doppler</text>
<text x="580" y="162" font-size="14">flow increased</text>
<rect x="14" y="206" width="872" height="128" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="206" width="200" height="128" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="214" y1="206" x2="214" y2="334" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="554" y1="206" x2="554" y2="334" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="232" font-size="15">Mumps orchitis</text>
<text x="26" y="257" font-size="14">viral</text>
<circle cx="229" cy="227" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="240" y="232" font-size="14">Males after puberty, about a week</text>
<text x="240" y="252" font-size="14">after the parotitis</text>
<circle cx="569" cy="227" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="580" y="232" font-size="14">The swollen testis is trapped inside</text>
<text x="580" y="252" font-size="14">the inelastic tunica albuginea</text>
<circle cx="569" cy="271" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="580" y="276" font-size="14">Pressure necrosis of tubules, then</text>
<text x="580" y="296" font-size="14">atrophy; both sides can cause</text>
<text x="580" y="316" font-size="14">infertility</text>
<rect x="14" y="340" width="872" height="110" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="340" width="200" height="110" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="214" y1="340" x2="214" y2="450" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="554" y1="340" x2="554" y2="450" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="366" font-size="15">Torsed appendix</text>
<text class="b" x="26" y="387" font-size="15">testis</text>
<text x="26" y="412" font-size="14">small remnant at the</text>
<text x="26" y="432" font-size="14">upper pole</text>
<circle cx="229" cy="361" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="240" y="366" font-size="14">Boys about 7 to 12 years old</text>
<circle cx="569" cy="361" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="580" y="366" font-size="14">Focal pain and a blue dot under the</text>
<text x="580" y="386" font-size="14">skin</text>
<circle cx="569" cy="405" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="580" y="410" font-size="14">Cremasteric reflex is preserved</text>
<text class="b" x="14" y="478" font-size="16">The cremasteric reflex: stroke the inner thigh and the testis rises</text>
<rect x="14" y="492" width="182" height="135" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="26" y="521" font-size="15">1 Stroke</text>
<text x="26" y="546" font-size="14">Inner thigh</text>
<rect x="224" y="492" width="212" height="135" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="236" y="521" font-size="15">2 Femoral branch</text>
<text x="236" y="546" font-size="14">Sensory limb: carries</text>
<text x="236" y="566" font-size="14">the stroke in along the</text>
<text x="236" y="586" font-size="14">genitofemoral nerve</text>
<rect x="464" y="492" width="212" height="135" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="476" y="521" font-size="15">3 Genital branch</text>
<text x="476" y="546" font-size="14">Motor limb: the</text>
<text x="476" y="566" font-size="14">genitofemoral nerve</text>
<text x="476" y="586" font-size="14">(L1 to L2) makes the</text>
<text x="476" y="606" font-size="14">cremaster contract</text>
<rect x="704" y="492" width="182" height="135" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="716" y="521" font-size="15">4 Testis rises</text>
<text x="716" y="546" font-size="14">The cremaster lifts</text>
<text x="716" y="566" font-size="14">the testis on that</text>
<text x="716" y="586" font-size="14">side</text>
<line x1="198" y1="559" x2="216" y2="559" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="222,559 216,562.6 216,555.4" fill="var(--ink-2)"/>
<line x1="438" y1="559" x2="456" y2="559" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="462,559 456,562.6 456,555.4" fill="var(--ink-2)"/>
<line x1="678" y1="559" x2="696" y2="559" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="702,559 696,562.6 696,555.4" fill="var(--ink-2)"/>
<rect x="14" y="637" width="872" height="40" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="28" y="663" font-size="15">Absent in torsion; present in epididymitis and torsion of the appendix testis</text>
</svg>
