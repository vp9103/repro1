<svg class="dia" viewBox="0 0 900 506" role="img" aria-label="Calcium homeostasis loop: the calcium-sensing receptor on parathyroid chief cells releases PTH when ionized calcium falls; PTH acts on bone through osteoblast RANKL and on the kidney, where 1-alpha-hydroxylase makes calcitriol that raises gut absorption; the rise in calcium switches PTH off">
<text class="ttl" x="14" y="26" font-size="17">When ionized calcium falls, PTH and calcitriol put it back</text>
<rect x="24" y="44" width="236" height="86" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="38" y="68" font-size="15">Magnesium</text>
<text x="38" y="92" font-size="15">Needed to release PTH;</text>
<text x="38" y="114" font-size="15">a severe lack lowers Ca</text>
<rect x="280" y="44" width="340" height="86" rx="10" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="450" y="68" font-size="16" text-anchor="middle">Parathyroid chief cells</text>
<text x="450" y="92" font-size="15" text-anchor="middle">Calcium-sensing receptor:</text>
<text x="450" y="114" font-size="15" text-anchor="middle">low ionized Ca &#8594; release PTH</text>
<rect x="640" y="44" width="236" height="86" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="654" y="68" font-size="15">C cells: calcitonin</text>
<text x="654" y="92" font-size="15">Brakes osteoclasts;</text>
<text x="654" y="114" font-size="15">minor role in humans</text>
<line x1="390" y1="130" x2="168" y2="174" stroke="var(--a1)" stroke-width="2"/>
<polygon points="160,176 170,179 168,169" fill="var(--a1)"/>
<text class="a1" x="262" y="146" font-size="15">PTH</text>
<line x1="443" y1="130" x2="443" y2="168" stroke="var(--a1)" stroke-width="2"/>
<polygon points="438,168 443,176 448,168" fill="var(--a1)"/>
<text class="a1" x="452" y="160" font-size="15">PTH</text>
<rect x="24" y="178" width="250" height="194" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="38" y="202" font-size="16">Bone</text>
<text x="38" y="226" font-size="15">PTH binds osteoblasts,</text>
<text x="38" y="248" font-size="15">which raise RANKL</text>
<text x="38" y="270" font-size="15">RANKL activates</text>
<text x="38" y="292" font-size="15">osteoclasts</text>
<text x="38" y="314" font-size="15">Resorption frees</text>
<text x="38" y="336" font-size="15">calcium and phosphate</text>
<rect x="318" y="178" width="250" height="194" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="332" y="202" font-size="16">Kidney</text>
<text x="332" y="226" font-size="15">Distal tubule: keeps</text>
<text x="332" y="248" font-size="15">more calcium</text>
<text x="332" y="270" font-size="15">Proximal tubule: dumps</text>
<text x="332" y="292" font-size="15">phosphate in urine</text>
<text x="332" y="314" font-size="15">1-alpha-hydroxylase on</text>
<text x="332" y="336" font-size="15">&#8594; makes calcitriol</text>
<rect x="626" y="178" width="250" height="194" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="640" y="202" font-size="16">Gut (via calcitriol)</text>
<text x="640" y="226" font-size="15">Calcitriol raises</text>
<text x="640" y="248" font-size="15">absorption of calcium</text>
<text x="640" y="270" font-size="15">and phosphate</text>
<text x="640" y="292" font-size="15">Needs 25-hydroxyvitamin D</text>
<text x="640" y="314" font-size="15">from the liver</text>
<polyline points="443,372 443,394 751,394 751,382" fill="none" stroke="var(--a2)" stroke-width="2"/>
<polygon points="746,382 751,374 756,382" fill="var(--a2)"/>
<text class="a2" x="560" y="415" font-size="15">calcitriol</text>
<rect x="24" y="428" width="852" height="66" rx="10" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="40" y="452" font-size="16">Net result: serum calcium rises, serum phosphate falls</text>
<text x="40" y="478" font-size="15">Rising ionized calcium switches the calcium-sensing receptor off, so PTH falls again</text>
</svg>
