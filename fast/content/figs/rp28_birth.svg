<svg class="dia" viewBox="0 0 900 584" role="img" aria-label="The passage of the baby: the six cardinal movements of labor, then the injuries that can follow, namely Erb and Klumpke palsy after shoulder dystocia and the four degrees of perineal laceration">
<text class="ttl" x="14" y="26" font-size="17">The baby’s passage: six movements, then where it can injure</text>
<rect x="14" y="44" width="280" height="58" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="38" cy="73" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="38" y="78" font-size="14" text-anchor="middle">1</text>
<text class="b" x="60" y="69" font-size="14">Engagement</text>
<text x="60" y="90" font-size="13">The head passes the pelvic inlet</text>
<line x1="295" y1="73" x2="303.0" y2="73.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="309,73 303.0,76.6 303.0,69.4" fill="var(--ink-2)"/>
<rect x="310" y="44" width="280" height="58" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="334" cy="73" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="334" y="78" font-size="14" text-anchor="middle">2</text>
<text class="b" x="356" y="69" font-size="14">Descent and flexion</text>
<text x="356" y="90" font-size="13">The chin tucks onto the chest</text>
<line x1="591" y1="73" x2="599.0" y2="73.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="605,73 599.0,76.6 599.0,69.4" fill="var(--ink-2)"/>
<rect x="606" y="44" width="280" height="58" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="630" cy="73" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="630" y="78" font-size="14" text-anchor="middle">3</text>
<text class="b" x="652" y="69" font-size="14">Internal rotation</text>
<text x="652" y="90" font-size="13">The occiput turns to the pubis</text>
<rect x="14" y="112" width="280" height="58" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="38" cy="141" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="38" y="146" font-size="14" text-anchor="middle">4</text>
<text class="b" x="60" y="137" font-size="14">Extension</text>
<text x="60" y="158" font-size="13">The head pivots under the pubis</text>
<line x1="295" y1="141" x2="303.0" y2="141.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="309,141 303.0,144.6 303.0,137.4" fill="var(--ink-2)"/>
<rect x="310" y="112" width="280" height="58" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<circle cx="334" cy="141" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="334" y="146" font-size="14" text-anchor="middle">5</text>
<text class="b" x="356" y="137" font-size="14">External rotation</text>
<text x="356" y="158" font-size="13">Restitution: head turns sideways</text>
<line x1="591" y1="141" x2="599.0" y2="141.0" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="605,141 599.0,144.6 599.0,137.4" fill="var(--ink-2)"/>
<rect x="606" y="112" width="280" height="58" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<circle cx="630" cy="141" r="13" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="630" y="146" font-size="14" text-anchor="middle">6</text>
<text class="b" x="652" y="137" font-size="14">Expulsion</text>
<text x="652" y="158" font-size="13">The shoulders, then the body</text>
<rect x="14" y="190" width="440" height="376" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="216" font-size="16">Shoulder dystocia and the brachial plexus</text>
<text x="28" y="238" font-size="14">McRoberts maneuver frees it; no hard pulls</text>
<rect x="26" y="250" width="416" height="140" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="40" y="276" font-size="15">Erb palsy</text>
<text class="a1" x="40" y="298" font-size="14">Upper trunk, C5 and C6</text>
<text x="40" y="324" font-size="14">A hard pull on the head stretches the plexus</text>
<text x="40" y="344" font-size="14">Waiter’s tip: arm adducted, internally rotated,</text>
<text x="40" y="364" font-size="14">elbow extended, wrist flexed</text>
<rect x="26" y="398" width="416" height="140" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="40" y="424" font-size="15">Klumpke palsy</text>
<text class="a1" x="40" y="446" font-size="14">Lower trunk, C8 and T1</text>
<text x="40" y="472" font-size="14">An arm pulled above the head</text>
<text x="40" y="492" font-size="14">Claw hand; grasp reflex absent</text>
<text x="40" y="512" font-size="14">Horner syndrome: ptosis, constricted pupil</text>
<rect x="466" y="190" width="420" height="376" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="480" y="216" font-size="16">Perineal tears: the deepest structure torn</text>
<rect x="478" y="234" width="396" height="68" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="492" y="261" font-size="15">First degree</text>
<text x="492" y="285" font-size="14">Vaginal mucosa or perineal skin</text>
<rect x="478" y="310" width="396" height="68" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="492" y="337" font-size="15">Second degree</text>
<text x="492" y="361" font-size="14">Muscles of the perineal body</text>
<rect x="478" y="386" width="396" height="68" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="492" y="413" font-size="15">Third degree: external anal sphincter</text>
<text x="492" y="437" font-size="14">Partial or complete; the rectal lining is intact</text>
<rect x="478" y="462" width="396" height="68" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="492" y="489" font-size="15">Fourth degree: anorectal mucosa torn too</text>
<text x="492" y="513" font-size="14">Through the sphincter into the rectal lining</text>
<text x="480" y="554" font-size="14">Third and fourth degree risk fecal incontinence</text>
</svg>
