<svg class="dia" viewBox="0 0 900 678" role="img" aria-label="Cervical findings compared by cause, appearance and what to remember: ectropion from estrogen, nabothian cyst from a trapped gland, stenosis with hematometra after scarring, cervicitis from chlamydia or gonorrhea, and invasive carcinoma that compresses the ureters and causes renal failure">
<text class="ttl" x="14" y="26" font-size="17">On the cervix: harmless changes, infection and invasive cancer</text>
<text class="s" x="26" y="60" font-size="14">Finding</text>
<text class="s" x="188" y="60" font-size="14">Cause</text>
<text class="s" x="412" y="60" font-size="14">What you find</text>
<text class="s" x="648" y="60" font-size="14">What to remember</text>
<rect x="14" y="72" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="72" width="162" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="176" y1="72" x2="176" y2="180" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="400" y1="72" x2="400" y2="180" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="636" y1="72" x2="636" y2="180" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="98" font-size="15">Ectropion</text>
<circle cx="191" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="202" y="98" font-size="14">High estrogen everts</text>
<text x="202" y="118" font-size="14">columnar lining onto</text>
<text x="202" y="138" font-size="14">the ectocervix</text>
<circle cx="415" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="426" y="98" font-size="14">Red, velvety ring around</text>
<text x="426" y="118" font-size="14">the opening</text>
<circle cx="415" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="426" y="142" font-size="14">Mucoid discharge,</text>
<text x="426" y="162" font-size="14">spotting after sex</text>
<circle cx="651" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="662" y="98" font-size="14">Benign</text>
<circle cx="651" cy="117" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="662" y="122" font-size="14">Contact bleeding still</text>
<text x="662" y="142" font-size="14">needs a Pap test</text>
<rect x="14" y="186" width="872" height="104" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="186" width="162" height="104" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<line x1="176" y1="186" x2="176" y2="290" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="400" y1="186" x2="400" y2="290" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="636" y1="186" x2="636" y2="290" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="212" font-size="15">Nabothian cyst</text>
<circle cx="191" cy="207" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="202" y="212" font-size="14">Metaplastic squamous</text>
<text x="202" y="232" font-size="14">epithelium seals the</text>
<text x="202" y="252" font-size="14">opening of a gland and</text>
<text x="202" y="272" font-size="14">traps its mucus</text>
<circle cx="415" cy="207" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="426" y="212" font-size="14">A smooth, harmless</text>
<text x="426" y="232" font-size="14">bump</text>
<circle cx="651" cy="207" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="662" y="212" font-size="14">Needs no treatment</text>
<rect x="14" y="296" width="872" height="104" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="296" width="162" height="104" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="176" y1="296" x2="176" y2="400" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="400" y1="296" x2="400" y2="400" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="636" y1="296" x2="636" y2="400" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="322" font-size="15">Cervical</text>
<text class="b" x="26" y="343" font-size="15">stenosis</text>
<circle cx="191" cy="317" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="202" y="322" font-size="14">Scarring after excision,</text>
<text x="202" y="342" font-size="14">radiation or severe</text>
<text x="202" y="362" font-size="14">inflammation narrows</text>
<text x="202" y="382" font-size="14">the opening</text>
<circle cx="415" cy="317" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="426" y="322" font-size="14">Menstrual blood collects</text>
<text x="426" y="342" font-size="14">in the uterus</text>
<text x="426" y="362" font-size="14">(hematometra)</text>
<circle cx="651" cy="317" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="662" y="322" font-size="14">Cyclic pain and an</text>
<text x="662" y="342" font-size="14">enlarged uterus, with no</text>
<text x="662" y="362" font-size="14">visible bleeding</text>
<rect x="14" y="406" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="406" width="162" height="108" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="176" y1="406" x2="176" y2="514" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="400" y1="406" x2="400" y2="514" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="636" y1="406" x2="636" y2="514" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="432" font-size="15">Cervicitis</text>
<circle cx="191" cy="427" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="202" y="432" font-size="14">Chlamydia or</text>
<text x="202" y="452" font-size="14">gonorrhea most often;</text>
<text x="202" y="472" font-size="14">often no organism is</text>
<text x="202" y="492" font-size="14">found</text>
<circle cx="415" cy="427" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="426" y="432" font-size="14">Mucopurulent discharge</text>
<text x="426" y="452" font-size="14">from the opening</text>
<circle cx="415" cy="471" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="426" y="476" font-size="14">Friable cervix that bleeds</text>
<text x="426" y="496" font-size="14">when swabbed</text>
<circle cx="651" cy="427" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="662" y="432" font-size="14">Test for both with NAAT</text>
<circle cx="651" cy="451" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="662" y="456" font-size="14">Treat the patient and her</text>
<text x="662" y="476" font-size="14">partners</text>
<rect x="14" y="520" width="872" height="148" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="520" width="162" height="148" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<line x1="176" y1="520" x2="176" y2="668" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="400" y1="520" x2="400" y2="668" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="636" y1="520" x2="636" y2="668" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="546" font-size="15">Invasive</text>
<text class="b" x="26" y="567" font-size="15">carcinoma</text>
<circle cx="191" cy="541" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="202" y="546" font-size="14">Persistent high-risk</text>
<text x="202" y="566" font-size="14">HPV; about</text>
<text x="202" y="586" font-size="14">three-quarters are</text>
<text x="202" y="606" font-size="14">squamous</text>
<circle cx="415" cy="541" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="426" y="546" font-size="14">Bleeding after</text>
<text x="426" y="566" font-size="14">intercourse</text>
<circle cx="415" cy="585" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="426" y="590" font-size="14">Watery, blood-tinged</text>
<text x="426" y="610" font-size="14">discharge</text>
<circle cx="651" cy="541" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="662" y="546" font-size="14">Renal failure from ureter</text>
<text class="b" x="662" y="566" font-size="14">compression</text>
<circle cx="651" cy="585" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="662" y="590" font-size="14">Tumor spreads beside the</text>
<text x="662" y="610" font-size="14">cervix; bilateral</text>
<text x="662" y="630" font-size="14">hydronephrosis is a</text>
<text x="662" y="650" font-size="14">leading cause of death</text>
</svg>
