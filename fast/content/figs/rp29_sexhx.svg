<svg class="dia" viewBox="0 0 900 410" role="img" aria-label="A sexual health visit for any patient: ask the CDC 5 Ps and what body parts partners use, test the exposed sites (urethra, vagina or neovagina, rectum, throat), protect with PrEP and HPV vaccination, and offer a levonorgestrel intrauterine device or other estrogen-free method to a transgender man on testosterone because testosterone is not contraception">
<text class="ttl" x="14" y="26" font-size="17">Sexual health visit: ask about anatomy, test, protect and plan contraception</text>
<rect x="14" y="46" width="272" height="203" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="26" y="75" font-size="15">1 Ask</text>
<circle cx="29" cy="95" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="100" font-size="14">Behavior and anatomy, not</text>
<text x="40" y="120" font-size="14">identity</text>
<circle cx="29" cy="139" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="144" font-size="14">The 5 Ps: partners, practices,</text>
<text x="40" y="164" font-size="14">protection, past infections</text>
<text x="40" y="184" font-size="14">and pregnancy intention</text>
<circle cx="29" cy="203" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="208" font-size="14">What body parts do you and</text>
<text x="40" y="228" font-size="14">your partners use during sex?</text>
<rect x="314" y="46" width="272" height="203" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="326" y="75" font-size="15">2 Test the exposed sites</text>
<circle cx="329" cy="95" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="100" font-size="14">Urethra</text>
<circle cx="329" cy="119" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="124" font-size="14">Vagina or neovagina</text>
<circle cx="329" cy="143" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="148" font-size="14">Rectum</text>
<circle cx="329" cy="167" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="172" font-size="14">Throat</text>
<rect x="614" y="46" width="272" height="203" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="626" y="75" font-size="15">3 Protect</text>
<circle cx="629" cy="95" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="100" font-size="14">PrEP for people at risk;</text>
<text x="640" y="120" font-size="14">receptive anal sex carries the</text>
<text x="640" y="140" font-size="14">highest HIV risk</text>
<circle cx="629" cy="159" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="164" font-size="14">HPV vaccination</text>
<circle cx="629" cy="183" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="188" font-size="14">Condoms: hormones do not</text>
<text x="640" y="208" font-size="14">prevent infection</text>
<line x1="288" y1="80" x2="306" y2="80" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="312,80 306,83.6 306,76.4" fill="var(--ink-2)"/>
<line x1="588" y1="80" x2="606" y2="80" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="612,80 606,83.6 606,76.4" fill="var(--ink-2)"/>
<rect x="14" y="263" width="872" height="143" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="26" y="292" font-size="15">If a pregnancy is possible: contraception for a transgender man on testosterone</text>
<circle cx="29" cy="312" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="317" font-size="14">Testosterone is not contraception: amenorrhea does not prove that ovulation has stopped</text>
<circle cx="29" cy="336" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="341" font-size="14">Offer a levonorgestrel intrauterine device (IUD), an implant or a progestin injection; estrogen is not</text>
<text x="40" y="361" font-size="14">needed</text>
<circle cx="29" cy="380" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="385" font-size="14">Testosterone harms a pregnancy by virilizing a female fetus</text>
</svg>
