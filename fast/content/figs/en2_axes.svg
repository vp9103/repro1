<svg class="dia" viewBox="0 0 900 600" role="img" aria-label="The five anterior pituitary axes, each drawn from hypothalamic signal to pituitary cell to hormone to target, with acidophils and basophils marked, and the posterior pituitary pathway from the supraoptic and paraventricular nuclei down axons to Herring bodies">
<text class="ttl" x="14" y="24" font-size="17">Hypothalamic signal, pituitary cell, target: the five anterior axes</text>
<text class="b" x="24" y="58" font-size="14">Hypothalamus</text>
<text class="b" x="264" y="58" font-size="14">Anterior pituitary cell</text>
<text class="b" x="512" y="58" font-size="14">Hormone</text>
<text class="b" x="672" y="58" font-size="14">Target and product</text>
<text class="s" x="24" y="80" font-size="13">releasing hormones reach the lobe in portal blood</text>
<text x="512" y="80" font-size="13">anterior lobe grows from Rathke pouch</text>
<rect x="14" y="96" width="200" height="52" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="26" y="118" font-size="14">TRH</text>
<text x="26" y="138" font-size="13">stimulates</text>
<rect x="252" y="96" width="210" height="52" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.2"/>
<text class="b" x="264" y="118" font-size="14">Thyrotroph</text>
<text x="264" y="138" font-size="13">basophil</text>
<rect x="500" y="96" width="130" height="52" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="512" y="127" font-size="14">TSH</text>
<rect x="660" y="96" width="226" height="52" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.2"/>
<text x="672" y="118" font-size="14">Thyroid</text>
<text x="672" y="138" font-size="13">T4 and T3</text>
<rect x="14" y="158" width="200" height="52" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="26" y="180" font-size="14">CRH</text>
<text x="26" y="200" font-size="13">stimulates</text>
<rect x="252" y="158" width="210" height="52" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.2"/>
<text class="b" x="264" y="180" font-size="14">Corticotroph</text>
<text x="264" y="200" font-size="13">basophil</text>
<rect x="500" y="158" width="130" height="52" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="512" y="180" font-size="14">ACTH</text>
<text x="512" y="200" font-size="13">cut from POMC</text>
<rect x="660" y="158" width="226" height="52" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.2"/>
<text x="672" y="180" font-size="14">Adrenal cortex</text>
<text x="672" y="200" font-size="13">cortisol</text>
<rect x="14" y="220" width="200" height="52" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="26" y="242" font-size="14">GnRH</text>
<text x="26" y="262" font-size="13">in pulses</text>
<rect x="252" y="220" width="210" height="52" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.2"/>
<text class="b" x="264" y="242" font-size="14">Gonadotroph</text>
<text x="264" y="262" font-size="13">basophil</text>
<rect x="500" y="220" width="130" height="52" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="512" y="251" font-size="14">LH and FSH</text>
<rect x="660" y="220" width="226" height="52" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.2"/>
<text x="672" y="242" font-size="14">Ovary or testis</text>
<text x="672" y="262" font-size="13">sex steroids, gametes</text>
<rect x="14" y="282" width="200" height="52" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="26" y="304" font-size="14">GHRH stimulates</text>
<text x="26" y="324" font-size="13">somatostatin inhibits</text>
