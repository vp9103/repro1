<text x="26" y="386" font-size="13">TRH stimulates</text>
<rect x="252" y="344" width="210" height="52" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.2"/>
<text class="b" x="264" y="366" font-size="14">Lactotroph</text>
