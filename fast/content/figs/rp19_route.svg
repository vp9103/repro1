<svg class="dia" viewBox="0 0 900 680" role="img" aria-label="The path of sperm from the rete testis through the efferent ductules, epididymis with stereocilia and ductus deferens, the glands that add semen fluid, and how the pampiniform plexus, cremaster and dartos keep the testis cooler than the body">
<text class="ttl" x="14" y="26" font-size="17">Getting sperm out of the testis, and keeping the testis cool</text>
<text class="b" x="14" y="58" font-size="16">The path of the sperm</text>
<rect x="14" y="70" width="272" height="179" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="26" y="99" font-size="15">Rete testis and efferent</text>
<text class="b" x="26" y="120" font-size="15">ductules</text>
<circle cx="29" cy="140" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="145" font-size="14">Flat to low cuboidal cells;</text>
<text x="40" y="165" font-size="14">ciliated cells in the ductules</text>
<circle cx="29" cy="184" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="189" font-size="14">Collect sperm and reabsorb</text>
<text x="40" y="209" font-size="14">fluid</text>
<rect x="314" y="70" width="272" height="179" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="326" y="99" font-size="15">Epididymis</text>
<circle cx="329" cy="119" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="124" font-size="14">Tall pseudostratified</text>
<text x="340" y="144" font-size="14">columnar cells with</text>
<text x="340" y="164" font-size="14">stereocilia, and a thin circular</text>
<text x="340" y="184" font-size="14">muscle layer</text>
<circle cx="329" cy="203" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="208" font-size="14">Sperm gain motility and wait</text>
<text x="340" y="228" font-size="14">in the tail</text>
<rect x="614" y="70" width="272" height="179" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="626" y="99" font-size="15">Ductus deferens</text>
<circle cx="629" cy="119" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="124" font-size="14">Thick three-layer muscle wall</text>
<circle cx="629" cy="143" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="148" font-size="14">Drives sperm forward during</text>
<text x="640" y="168" font-size="14">emission</text>
<line x1="288" y1="104" x2="306" y2="104" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="312,104 306,107.6 306,100.4" fill="var(--ink-2)"/>
<line x1="588" y1="104" x2="606" y2="104" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="612,104 606,107.6 606,100.4" fill="var(--ink-2)"/>
<text class="b" x="14" y="279" font-size="16">Glands that add the fluid</text>
<rect x="14" y="293" width="272" height="159" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="26" y="322" font-size="15">Seminal vesicle</text>
<circle cx="29" cy="342" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="347" font-size="14">Highly folded mucosa, no</text>
<text x="40" y="367" font-size="14">sperm</text>
<circle cx="29" cy="386" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="391" font-size="14">Most of the volume: alkaline,</text>
<text x="40" y="411" font-size="14">fructose-rich fluid</text>
<rect x="314" y="293" width="272" height="159" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="326" y="322" font-size="15">Prostate</text>
<circle cx="329" cy="342" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="347" font-size="14">Glands with papillary</text>
<text x="340" y="367" font-size="14">infoldings and corpora</text>
<text x="340" y="387" font-size="14">amylacea</text>
<circle cx="329" cy="406" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="340" y="411" font-size="14">About a quarter of the</text>
<text x="340" y="431" font-size="14">volume: PSA, citrate and zinc</text>
<rect x="614" y="293" width="272" height="159" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="626" y="322" font-size="15">Bulbourethral gland</text>
<circle cx="629" cy="342" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="347" font-size="14">Small mucous acini</text>
<circle cx="629" cy="366" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="640" y="371" font-size="14">Clear pre-ejaculate mucus</text>
<text class="b" x="14" y="482" font-size="16">Keeping the testis 2 to 4 degrees Celsius below body temperature</text>
<rect x="14" y="496" width="286" height="180" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="26" y="525" font-size="15">Pampiniform plexus</text>
<circle cx="29" cy="545" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="550" font-size="14">Veins that wrap the testicular</text>
<text x="40" y="570" font-size="14">artery</text>
<circle cx="29" cy="589" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="40" y="594" font-size="14">Cool the incoming blood by</text>
<text x="40" y="614" font-size="14">countercurrent exchange</text>
<rect x="307" y="496" width="286" height="180" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="319" y="525" font-size="15">Cremaster and dartos</text>
<circle cx="322" cy="545" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="333" y="550" font-size="14">Cremaster pulls the testis</text>
<text x="333" y="570" font-size="14">toward the warm body in the</text>
<text x="333" y="590" font-size="14">cold</text>
<circle cx="322" cy="609" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="333" y="614" font-size="14">Dartos wrinkles the scrotal skin</text>
<text x="333" y="634" font-size="14">to shed less heat</text>
<rect x="600" y="496" width="286" height="180" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="612" y="525" font-size="15">Heat harms sperm, not</text>
<text class="b" x="612" y="546" font-size="15">testosterone</text>
<circle cx="615" cy="566" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="626" y="571" font-size="14">Germ cells and Sertoli cells</text>
<text x="626" y="591" font-size="14">suffer: sperm count and inhibin</text>
<text x="626" y="611" font-size="14">B fall</text>
<circle cx="615" cy="630" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="626" y="635" font-size="14">Leydig cells are spared, so</text>
<text x="626" y="655" font-size="14">testosterone stays normal</text>
</svg>
