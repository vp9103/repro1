<circle cx="208" cy="383" r="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.3"/>
<circle cx="256" cy="383" r="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.3"/>
<rect x="28" y="396" width="258" height="50" rx="4" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="130" y1="396" x2="130" y2="434" stroke="var(--ink-3)" stroke-width="2"/>
<line x1="162" y1="396" x2="162" y2="434" stroke="var(--ink-3)" stroke-width="2"/>
<circle cx="146" cy="408" r="5" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.2"/>
<circle cx="146" cy="424" r="5" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.2"/>
<ellipse cx="146" cy="438" rx="26" ry="9" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="28" y="466" font-size="13">Large pale cells in the epidermis</text>
<text class="b" x="332" y="386" font-size="17">Paget disease of the nipple</text>
<text x="332" y="414" font-size="14">A one-sided, itchy, scaly, crusted nipple that fails topical steroids</text>
<text x="332" y="435" font-size="14">Cells travel up the ducts from underlying DCIS</text>
<text x="332" y="456" font-size="14">or invasive cancer, so the whole breast needs imaging</text>
