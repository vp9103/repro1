<text x="69" y="142" font-size="14">Papillary</text>
<text x="69" y="159" font-size="12">fronds</text>
<circle cx="178" cy="144" r="21" fill="var(--surface-3)" stroke="var(--ink-2)" stroke-width="2"/>
<circle cx="178" cy="144" r="16" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.2"/>
<circle cx="178" cy="144" r="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.2"/>
<circle cx="176" cy="142" r="1.4" fill="var(--ink)" stroke="var(--line-strong)" stroke-width="0"/>
