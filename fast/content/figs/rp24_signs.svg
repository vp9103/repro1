<text x="207" y="142" font-size="14">Comedo</text>
<text x="207" y="159" font-size="12">central necrosis</text>
<text class="b" x="332" y="76" font-size="17">DCIS: ductal carcinoma in situ</text>
<text x="332" y="104" font-size="14">Malignant cells fill the duct but stay inside the basement</text>
<text x="332" y="125" font-size="14">membrane. Four growth patterns are shown at the left.</text>
<text x="332" y="146" font-size="14">Comedo necrosis calcifies: clustered microcalcifications</text>
<text x="332" y="167" font-size="14">on a mammogram, usually with no lump</text>
<rect x="28" y="222" width="258" height="24" rx="4" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="38" y="239" font-size="13">Skin: red, warm, dimpled</text>
