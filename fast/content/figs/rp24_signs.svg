<circle cx="216" cy="285" r="4.6" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.2"/>
<circle cx="246" cy="285" r="4.6" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.2"/>
<text class="b" x="28" y="318" font-size="13">Tumor emboli in dermal lymphatics</text>
<text class="b" x="332" y="238" font-size="17">Inflammatory carcinoma</text>
<text x="332" y="266" font-size="14">The red, warm, swollen breast looks like infection but is not</text>
<text x="332" y="287" font-size="14">Emboli block lymph drainage; the skin swells yet stays tethered</text>
<text x="332" y="308" font-size="14">at hair follicles. No response to antibiotics; poor outlook</text>
<text x="332" y="329" font-size="14">There is often no discrete mass</text>
<rect x="28" y="370" width="258" height="26" rx="4" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<circle cx="58" cy="383" r="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.3"/>
