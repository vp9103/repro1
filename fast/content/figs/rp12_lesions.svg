<svg class="dia" viewBox="0 0 900 646" role="img" aria-label="Five vulvar lesions compared by appearance, biopsy and what to remember: lichen sclerosus with a figure-of-eight and ultrapotent steroid, lichen simplex chronicus from scratching, lichen planus with vaginal and mouth involvement, extramammary Paget disease with usually no underlying carcinoma, and condyloma acuminatum from HPV types 6 and 11">
<text class="ttl" x="14" y="26" font-size="17">Five vulvar lesions compared: look, biopsy and what to remember</text>
<text class="s" x="26" y="60" font-size="14">Lesion</text>
<text class="s" x="196" y="60" font-size="14">What you see</text>
<text class="s" x="422" y="60" font-size="14">Biopsy or cause</text>
<text class="s" x="662" y="60" font-size="14">What to remember</text>
<rect x="14" y="72" width="872" height="128" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="72" width="170" height="128" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<line x1="184" y1="72" x2="184" y2="200" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="410" y1="72" x2="410" y2="200" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="650" y1="72" x2="650" y2="200" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="98" font-size="15">Lichen sclerosus</text>
<circle cx="199" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="210" y="98" font-size="14">Thin, white, wrinkled</text>
<text x="210" y="118" font-size="14">skin in a figure-of-eight</text>
<text x="210" y="138" font-size="14">around the vulva and</text>
<text x="210" y="158" font-size="14">anus</text>
<circle cx="199" cy="177" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="210" y="182" font-size="14">The vagina is spared</text>
<circle cx="425" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="436" y="98" font-size="14">Thin epidermis, no rete</text>
<text x="436" y="118" font-size="14">ridges</text>
<circle cx="425" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="436" y="142" font-size="14">Pale, scarred collagen</text>
<text x="436" y="162" font-size="14">with a band of</text>
<text x="436" y="182" font-size="14">lymphocytes below</text>
<circle cx="665" cy="93" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="676" y="98" font-size="14">Ultrapotent topical</text>
<text class="b" x="676" y="118" font-size="14">corticosteroid</text>
<circle cx="665" cy="137" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="676" y="142" font-size="14">Small cancer risk: biopsy</text>
<text x="676" y="162" font-size="14">a new ulcer or thick</text>
<text x="676" y="182" font-size="14">plaque</text>
<rect x="14" y="206" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="206" width="170" height="108" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<line x1="184" y1="206" x2="184" y2="314" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="410" y1="206" x2="410" y2="314" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="650" y1="206" x2="650" y2="314" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="232" font-size="15">Lichen simplex</text>
<text class="b" x="26" y="253" font-size="15">chronicus</text>
<circle cx="199" cy="227" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="210" y="232" font-size="14">Thick, leathery white</text>
<text x="210" y="252" font-size="14">plaque from an</text>
<text x="210" y="272" font-size="14">itch-scratch cycle</text>
<circle cx="425" cy="227" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="436" y="232" font-size="14">Acanthosis and</text>
<text x="436" y="252" font-size="14">hyperkeratosis</text>
<circle cx="425" cy="271" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="436" y="276" font-size="14">No atypia</text>
<circle cx="665" cy="227" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="676" y="232" font-size="14">No cancer risk</text>
<circle cx="665" cy="251" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="676" y="256" font-size="14">Steroids and no</text>
<text x="676" y="276" font-size="14">scratching break the</text>
<text x="676" y="296" font-size="14">cycle</text>
<rect x="14" y="320" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="320" width="170" height="108" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<line x1="184" y1="320" x2="184" y2="428" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="410" y1="320" x2="410" y2="428" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="650" y1="320" x2="650" y2="428" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="346" font-size="15">Lichen planus</text>
<circle cx="199" cy="341" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="210" y="346" font-size="14">Raw red vestibular</text>
<text x="210" y="366" font-size="14">patches with lacy white</text>
<text x="210" y="386" font-size="14">borders</text>
<circle cx="425" cy="341" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="436" y="346" font-size="14">T-cell mediated and</text>
<text x="436" y="366" font-size="14">erosive</text>
<circle cx="665" cy="341" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="676" y="346" font-size="14">Extends into the vagina</text>
<text class="b" x="676" y="366" font-size="14">and the mouth</text>
<circle cx="665" cy="385" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="676" y="390" font-size="14">Scarring can narrow the</text>
<text x="676" y="410" font-size="14">canal</text>
<rect x="14" y="434" width="872" height="108" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="434" width="170" height="108" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<line x1="184" y1="434" x2="184" y2="542" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="410" y1="434" x2="410" y2="542" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="650" y1="434" x2="650" y2="542" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="460" font-size="15">Extramammary</text>
<text class="b" x="26" y="481" font-size="15">Paget disease</text>
<circle cx="199" cy="455" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="210" y="460" font-size="14">Red, scaly, eczema-like</text>
<text x="210" y="480" font-size="14">patch that itches and</text>
<text x="210" y="500" font-size="14">ignores topical steroids</text>
<circle cx="425" cy="455" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="436" y="460" font-size="14">Large pale Paget cells in</text>
<text x="436" y="480" font-size="14">the epidermis</text>
<circle cx="425" cy="499" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="436" y="504" font-size="14">PAS and keratin positive;</text>
<text x="436" y="524" font-size="14">S100 negative</text>
<circle cx="665" cy="455" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="676" y="460" font-size="14">Usually no underlying</text>
<text class="b" x="676" y="480" font-size="14">carcinoma</text>
<circle cx="665" cy="499" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="676" y="504" font-size="14">Unlike Paget disease of</text>
<text x="676" y="524" font-size="14">the nipple</text>
<rect x="14" y="548" width="872" height="88" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="14" y="548" width="170" height="88" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<line x1="184" y1="548" x2="184" y2="636" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="410" y1="548" x2="410" y2="636" stroke="var(--line-strong)" stroke-width="1"/>
<line x1="650" y1="548" x2="650" y2="636" stroke="var(--line-strong)" stroke-width="1"/>
<text class="b" x="26" y="574" font-size="15">Condyloma</text>
<text class="b" x="26" y="595" font-size="15">acuminatum</text>
<circle cx="199" cy="569" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="210" y="574" font-size="14">Soft, cauliflower-like</text>
<text x="210" y="594" font-size="14">warts</text>
<circle cx="425" cy="569" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="436" y="574" font-size="14">Koilocytes: clear halo</text>
<text x="436" y="594" font-size="14">around a wrinkled, dark</text>
<text x="436" y="614" font-size="14">nucleus</text>
<circle cx="665" cy="569" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="676" y="574" font-size="14">Low-risk HPV types 6</text>
<text class="b" x="676" y="594" font-size="14">and 11</text>
<circle cx="665" cy="613" r="3" fill="var(--ink-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="676" y="618" font-size="14">Does not become cancer</text>
</svg>
