<svg class="dia" viewBox="0 0 900 520" role="img" aria-label="Thyroid storm treatment in order: beta-blocker, thionamide, iodide one hour later, glucocorticoid and supportive care, with the signature harms of thionamides and of radioactive iodine">
<text class="ttl" x="14" y="26" font-size="17">Thyroid storm: treat in this order, and know what each drug costs</text>
<rect x="14" y="42" width="872" height="56" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.3"/>
<text x="28" y="64" font-size="14"><tspan class="b">Triggers:</tspan> surgery, infection, childbirth, iodinated contrast, amiodarone, stopping thionamides</text>
<text x="28" y="86" font-size="14">Fever, atrial fibrillation or other tachyarrhythmia, delirium, vomiting</text>
<rect x="14" y="112" width="872" height="48" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.2"/>
<text class="b" x="28" y="141" font-size="15">1 Beta-blocker (propranolol)</text>
<text x="390" y="141" font-size="14">slows the heart now; high doses also cut T4 to T3</text>
<rect x="14" y="166" width="872" height="48" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.2"/>
<text class="b" x="28" y="195" font-size="15">2 Thionamide: PTU preferred</text>
<text x="390" y="195" font-size="14">stops new synthesis; PTU also blocks deiodinase</text>
<rect x="14" y="220" width="872" height="48" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.2"/>
<text class="b" x="28" y="249" font-size="15">3 Iodide, 1 hour after the thionamide</text>
<text x="390" y="249" font-size="14">blocks release; given first, it would feed synthesis</text>
<rect x="14" y="274" width="872" height="48" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.2"/>
<text class="b" x="28" y="303" font-size="15">4 Glucocorticoid (hydrocortisone)</text>
<text x="390" y="303" font-size="14">blocks T4 to T3; covers relative adrenal insufficiency</text>
<rect x="14" y="328" width="872" height="48" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.2"/>
<text class="b" x="28" y="357" font-size="15">5 Support and treat the trigger</text>
<text x="390" y="357" font-size="14">cool with acetaminophen, not aspirin (frees T4 from TBG)</text>
<rect x="14" y="392" width="430" height="116" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text class="b" x="28" y="416" font-size="15">Thionamide harms</text>
<text x="28" y="440" font-size="14">Both: agranulocytosis (fever, sore throat)</text>
<text x="28" y="462" font-size="14">PTU: hepatotoxicity, ANCA vasculitis</text>
<text x="28" y="484" font-size="14">Methimazole: aplasia cutis in trimester 1</text>
<rect x="456" y="392" width="430" height="116" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text class="b" x="470" y="416" font-size="15">Definitive treatment</text>
<text x="470" y="440" font-size="14">Radioactive iodine: never in pregnancy;</text>
<text x="470" y="462" font-size="14">can worsen Graves eye disease</text>
<text x="470" y="484" font-size="14">RAI or surgery: lifelong levothyroxine</text>
</svg>
