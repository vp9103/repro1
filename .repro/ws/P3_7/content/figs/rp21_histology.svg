<text class="b" x="813" y="284" font-size="14" text-anchor="middle">Nerve</text>
<text x="28" y="306" font-size="14">Large glands, papillary infolding</text>
<text x="28" y="328" font-size="14">Two layers: basal and secretory</text>
<text x="28" y="350" font-size="14">Corpora amylacea in older men</text>
<text class="gd" x="28" y="372" font-size="14">p63 positive, AMACR negative</text>
<text x="320" y="306" font-size="14">Glands and stroma both multiply</text>
<text x="320" y="328" font-size="14">Transition zone nodules, DHT-driven</text>
<text x="320" y="350" font-size="14">Basal layer kept; not premalignant</text>
<text class="gd" x="320" y="372" font-size="14">p63 positive, AMACR negative</text>
<text x="612" y="306" font-size="14">Small crowded glands, one layer</text>
<text x="612" y="328" font-size="14">Infiltrative, little stroma between</text>
<text x="612" y="350" font-size="14">Nucleoli; perineural invasion</text>
<text class="cr" x="612" y="372" font-size="14">p63 negative, AMACR positive</text>
<rect x="14" y="404" width="872" height="118" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="430" font-size="15">What the cancer cell is</text>
<text x="28" y="458" font-size="14">Keeps the androgen receptor and makes PSA, so androgen deprivation works</text>
<text x="28" y="482" font-size="14">High-grade PIN (atypia inside glands that keep a basal layer) is the precursor</text>
<text x="28" y="506" font-size="14">Gleason grade scores the gland pattern: Grade Groups 1 to 5, from 3 + 3 to 5 + 5</text>
