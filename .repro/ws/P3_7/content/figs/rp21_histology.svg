<svg class="dia" viewBox="0 0 900 536" role="img" aria-label="Three prostate glands compared: a normal gland with papillary infolding and two cell layers, benign hyperplasia with crowded glands that keep the basal layer, and adenocarcinoma with small crowded single-layer glands, prominent nucleoli, perineural invasion and no basal layer">
