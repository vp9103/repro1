<text x="28" y="590" font-size="14">Root of the penis, in the superficial pouch: the bulb (continues as the corpus spongiosum) and two crura (the corpora cavernosa).</text>
<text x="28" y="610" font-size="14">Female equivalents: vestibular bulbs and clitoral crura.</text>
