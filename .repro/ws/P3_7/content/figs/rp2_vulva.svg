<text class="b" x="100" y="398" font-size="14">Prostatic urethra (3 cm)</text>
<text x="100" y="416" font-size="14">widest; ejaculatory ducts open</text>
<line x1="186" y1="420" x2="186" y2="446" stroke="var(--ink-3)" stroke-width="1"/>
<text x="150" y="441" font-size="13" text-anchor="middle">Prostate</text>
<text class="b" x="400" y="398" font-size="14">Spongy urethra (about 15 cm)</text>
<text x="400" y="416" font-size="14">torn by a straddle injury</text>
<line x1="450" y1="420" x2="450" y2="446" stroke="var(--ink-3)" stroke-width="1"/>
<text class="b" x="100" y="522" font-size="14">Membranous urethra (2 cm)</text>
<text x="100" y="540" font-size="14">narrowest; crosses the perineal</text>
<text x="100" y="558" font-size="14">membrane (dashed); torn in pelvic fracture</text>
