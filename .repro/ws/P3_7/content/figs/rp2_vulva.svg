<svg class="dia" viewBox="0 0 900 640" role="img" aria-label="Top: the vulva seen from below, with the mons pubis, labia majora and minora, clitoris, external urethral orifice, vaginal orifice rimmed by the hymen, Bartholin duct openings at 4 and 8 o'clock, vestibular bulbs, perineal body and anus. Bottom: the male urethra in three parts, prostatic, membranous and spongy, with the bulb of the penis, the navicular fossa in the glans, the prepuce and the erectile bodies">
