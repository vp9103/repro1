<path d="M434 124 A 16 16 0 0 1 466 124" fill="none" stroke="var(--a1)" stroke-width="2"/>
<circle cx="450" cy="158" r="4" fill="var(--warn)" stroke="var(--warn)" stroke-width="1"/>
