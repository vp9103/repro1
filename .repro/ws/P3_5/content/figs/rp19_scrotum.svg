<svg class="dia" viewBox="0 0 900 548" role="img" aria-label="Layers of the scrotal wall from skin to testis, each paired with its disease, and the venous and lymphatic drainage of the left and right testis">
<text class="ttl" x="14" y="24" font-size="17">Scrotal layers and drainage: each layer and each side has its own disease</text>
<ellipse cx="200" cy="178" rx="180" ry="128" fill="var(--surface-3)" stroke="var(--line-strong)" stroke-width="2"/>
<ellipse cx="200" cy="178" rx="160" ry="112" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="2"/>
<ellipse cx="200" cy="178" rx="140" ry="96" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="2"/>
<ellipse cx="200" cy="178" rx="120" ry="80" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="2"/>
<ellipse cx="200" cy="178" rx="98" ry="62" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="2"/>
<ellipse cx="200" cy="178" rx="70" ry="44" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="2"/>
<line x1="285" y1="65" x2="402" y2="61" stroke="var(--ink-3)" stroke-width="1.5"/>
<circle cx="285" cy="65" r="4" fill="var(--ink)"/>
<line x1="319" y1="103" x2="402" y2="107" stroke="var(--ink-3)" stroke-width="1.5"/>
<circle cx="319" cy="103" r="4" fill="var(--ink)"/>
<line x1="328" y1="139" x2="402" y2="153" stroke="var(--ink-3)" stroke-width="1.5"/>
<circle cx="328" cy="139" r="4" fill="var(--ink)"/>
<line x1="320" y1="172" x2="402" y2="199" stroke="var(--ink-3)" stroke-width="1.5"/>
<circle cx="320" cy="172" r="4" fill="var(--ink)"/>
<line x1="291" y1="201" x2="402" y2="245" stroke="var(--ink-3)" stroke-width="1.5"/>
<circle cx="291" cy="201" r="4" fill="var(--ink)"/>
<line x1="254" y1="206" x2="402" y2="291" stroke="var(--ink-3)" stroke-width="1.5"/>
<circle cx="254" cy="206" r="4" fill="var(--ink)"/>
<text class="b" x="410" y="66" font-size="15">Skin and dartos</text>
<text x="410" y="86" font-size="14">Smooth muscle wrinkles in the cold; plane of Fournier gangrene</text>
<text class="b" x="410" y="112" font-size="15">External spermatic fascia</text>
<text x="410" y="132" font-size="14">From the external oblique aponeurosis</text>
<text class="b" x="410" y="158" font-size="15">Cremaster muscle and fascia</text>
<text x="410" y="178" font-size="14">Internal oblique: the cremasteric reflex lifts the testis</text>
<text class="b" x="410" y="204" font-size="15">Internal spermatic fascia</text>
<text x="410" y="224" font-size="14">From transversalis fascia; an indirect hernia sac runs inside</text>
<text class="b" x="410" y="250" font-size="15">Tunica vaginalis</text>
<text x="410" y="270" font-size="14">Peritoneal sac around the testis; fluid in it is a hydrocele</text>
<text class="b" x="410" y="296" font-size="15">Tunica albuginea and testis</text>
<text x="410" y="316" font-size="14">Inelastic capsule: swelling inside it raises pressure</text>
<rect x="14" y="336" width="280" height="196" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="a1" x="28" y="364" font-size="15">Left testis</text>
<text x="28" y="392" font-size="14">Left testicular vein joins the</text>
<text x="28" y="416" font-size="14">left renal vein at a right angle:</text>
<text x="28" y="440" font-size="14">a long, high-pressure column</text>
<text x="28" y="464" font-size="14">Left varicocele in about 90%</text>
<text x="28" y="488" font-size="14">Grade I: Valsalva only; II:</text>
<text x="28" y="512" font-size="14">palpable; III: visible</text>
<rect x="310" y="336" width="280" height="196" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="a2" x="324" y="364" font-size="15">Right testis</text>
<text x="324" y="392" font-size="14">Right testicular vein enters the</text>
<text x="324" y="416" font-size="14">vena cava obliquely, so it</text>
<text x="324" y="440" font-size="14">rarely backs up</text>
<text x="324" y="464" font-size="14">A new right varicocele, or one</text>
<text x="324" y="488" font-size="14">that stays full lying down:</text>
<text x="324" y="512" font-size="14">image the abdomen for a mass</text>
<rect x="606" y="336" width="280" height="196" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="620" y="364" font-size="15">Lymph drainage</text>
<text x="620" y="392" font-size="14">Testis: para-aortic nodes,</text>
<text x="620" y="416" font-size="14">never inguinal</text>
<text x="620" y="440" font-size="14">Right tumor: interaortocaval;</text>
<text x="620" y="464" font-size="14">left tumor: left para-aortic</text>
<text x="620" y="488" font-size="14">Penis and scrotal skin: inguinal</text>
<text x="620" y="512" font-size="14">So: inguinal orchiectomy only</text>
</svg>
