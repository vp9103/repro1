<svg class="dia" viewBox="0 0 900 660" role="img" aria-label="Cervical screening by age and risk group, the screen then diagnose then treat sequence, the 9-valent HPV vaccine schedule and other preventive services at the same visit">
<text class="ttl" x="14" y="24" font-size="17">Cervical cancer prevention: who is screened, with what, and how often</text>
<rect x="14" y="40" width="282" height="116" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="67" font-size="16">Under 21</text>
<text x="28" y="94" font-size="15">No screening</text>
<text x="28" y="118" font-size="15">Even if sexually active</text>
<text x="28" y="142" font-size="15">Infections clear on their own</text>
<rect x="309" y="40" width="282" height="116" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="323" y="67" font-size="16">21 to 29</text>
<text x="323" y="94" font-size="15">Cytology alone</text>
<text x="323" y="118" font-size="15">Every 3 years</text>
<text x="323" y="142" font-size="15">HPV testing not used yet</text>
<rect x="604" y="40" width="282" height="116" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="618" y="67" font-size="16">30 to 65</text>
<text x="618" y="94" font-size="15">Primary HPV every 5 years</text>
<text x="618" y="118" font-size="15">or cotest every 5 years</text>
<text x="618" y="142" font-size="15">or cytology every 3 years</text>
<rect x="14" y="168" width="282" height="116" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="195" font-size="16">Over 65</text>
<text x="28" y="222" font-size="15">Stop after adequate</text>
<text x="28" y="246" font-size="15">negative screening</text>
<text x="28" y="270" font-size="15">No CIN 2 or worse in 25 years</text>
<rect x="309" y="168" width="282" height="116" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="323" y="195" font-size="16">After hysterectomy</text>
<text x="323" y="222" font-size="15">Total, for benign disease:</text>
<text x="323" y="246" font-size="15">stop screening</text>
<text x="323" y="270" font-size="15">Supracervical: keep screening</text>
<rect x="604" y="168" width="282" height="116" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="618" y="195" font-size="16">HIV or immunosuppressed</text>
<text x="618" y="222" font-size="15">Start at diagnosis</text>
<text x="618" y="246" font-size="15">Screen more often, lifelong</text>
<text x="618" y="270" font-size="15">Add anal cytology</text>
<rect x="14" y="296" width="270" height="140" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="323" font-size="16">Screening test</text>
<text x="28" y="350" font-size="15">Cytology or HPV test</text>
<text x="28" y="374" font-size="15">Sorts well people by risk</text>
<text x="28" y="398" font-size="15">Never makes a diagnosis</text>
<rect x="315" y="296" width="270" height="140" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="329" y="323" font-size="16">Diagnosis</text>
<text x="329" y="350" font-size="15">Colposcopy with biopsy</text>
<text x="329" y="374" font-size="15">Acetic acid whitens lesions</text>
<text x="329" y="398" font-size="15">Endocervical curettage if</text>
<text x="329" y="422" font-size="15">the junction is hidden</text>
<rect x="616" y="296" width="270" height="140" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="630" y="323" font-size="16">Treatment</text>
<text x="630" y="350" font-size="15">LSIL: watch, repeat testing</text>
<text x="630" y="374" font-size="15">HSIL: LEEP or conization</text>
<text x="630" y="398" font-size="15">Later risk: cervical</text>
<text x="630" y="422" font-size="15">insufficiency, preterm birth</text>
<line x1="284" y1="366" x2="307" y2="366" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="307,361 315,366 307,371" fill="var(--ink-2)"/>
<line x1="585" y1="366" x2="608" y2="366" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="608,361 616,366 608,371" fill="var(--ink-2)"/>
<rect x="14" y="452" width="430" height="190" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="28" y="479" font-size="16">9-valent HPV vaccine</text>
<text x="28" y="506" font-size="15">Recombinant L1 capsid protein</text>
<text x="28" y="530" font-size="15">Forms virus-like particles, no DNA</text>
<text x="28" y="554" font-size="15">Types 6, 11, 16, 18, 31, 33, 45, 52, 58</text>
<text x="28" y="578" font-size="15">Age 11 to 12; catch-up through 26</text>
<text x="28" y="602" font-size="15">Shared decision from 27 to 45</text>
<text x="28" y="626" font-size="15">Two doses before 15, else three</text>
<rect x="458" y="452" width="428" height="190" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="472" y="479" font-size="16">Same visit: other screening</text>
<text x="472" y="506" font-size="15">Chlamydia and gonorrhea NAAT, age 24 and under</text>
<text x="472" y="530" font-size="15">Cervicitis: pus at the os; NAAT confirms</text>
<text x="472" y="554" font-size="15">Mammography every 2 years, 40 to 74</text>
<text x="472" y="578" font-size="15">Colorectal screening from 45 to 75</text>
</svg>
