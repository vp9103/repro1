<svg class="dia" viewBox="0 0 900 668" role="img" aria-label="Signature fetal effects of the high-yield teratogens: ACE inhibitors, warfarin, isotretinoin, valproate, carbamazepine, phenytoin, lithium, methotrexate, thalidomide, tetracyclines, aminoglycosides, diethylstilbestrol, alcohol, cocaine, methimazole, misoprostol, mycophenolate, topiramate and NSAIDs">
<text class="ttl" x="14" y="24" font-size="17">One teratogen, one signature effect</text>
<rect x="14" y="40" width="872" height="30" rx="4" fill="var(--surface-3)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="60" font-size="14">Exposure</text>
<text class="b" x="250" y="60" font-size="14">Signature effect in the fetus</text>
<text class="b" x="640" y="60" font-size="14">Pearl</text>
<rect x="14" y="76" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="96" font-size="14">ACE inhibitors, ARBs</text>
<text x="250" y="96" font-size="14">Renal failure, oligohydramnios, lung hypoplasia</text>
<text x="640" y="96" font-size="14">Second and third trimesters</text>
<rect x="14" y="106" width="872" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="126" font-size="14">Warfarin</text>
<text x="250" y="126" font-size="14">Nasal hypoplasia, stippled epiphyses</text>
<text x="640" y="126" font-size="14">Heparin does not cross</text>
<rect x="14" y="136" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="156" font-size="14">Isotretinoin</text>
<text x="250" y="156" font-size="14">Craniofacial, cardiac and CNS defects</text>
<text x="640" y="156" font-size="14">Vitamin A excess acts alike</text>
<rect x="14" y="166" width="872" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="186" font-size="14">Valproate</text>
<text x="250" y="186" font-size="14">Neural tube defects, clefts, low IQ</text>
<text x="640" y="186" font-size="14">Folic acid before conception</text>
<rect x="14" y="196" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="216" font-size="14">Carbamazepine</text>
<text x="250" y="216" font-size="14">Neural tube defects, hypoplastic nails</text>
<text x="640" y="216" font-size="14">Neonatal vitamin K deficiency</text>
<rect x="14" y="226" width="872" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="246" font-size="14">Phenytoin</text>
<text x="250" y="246" font-size="14">Hypoplastic nails and distal phalanges</text>
<text x="640" y="246" font-size="14">Fetal hydantoin syndrome</text>
<rect x="14" y="256" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="276" font-size="14">Lithium</text>
<text x="250" y="276" font-size="14">Ebstein anomaly</text>
<text x="640" y="276" font-size="14">Tricuspid valve displaced down</text>
<rect x="14" y="286" width="872" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="306" font-size="14">Methotrexate</text>
<text x="250" y="306" font-size="14">Limb and craniofacial defects</text>
<text x="640" y="306" font-size="14">Folate antagonist</text>
<rect x="14" y="316" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="336" font-size="14">Thalidomide</text>
<text x="250" y="336" font-size="14">Phocomelia</text>
<text x="640" y="336" font-size="14">Limb buds, weeks 4 to 8</text>
<rect x="14" y="346" width="872" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="366" font-size="14">Tetracyclines</text>
<text x="250" y="366" font-size="14">Yellow-brown tooth discoloration</text>
<text x="640" y="366" font-size="14">Second and third trimesters</text>
<rect x="14" y="376" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="396" font-size="14">Aminoglycosides</text>
<text x="250" y="396" font-size="14">Eighth-nerve deafness</text>
<text x="640" y="396" font-size="14">Streptomycin, kanamycin</text>
<rect x="14" y="406" width="872" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="426" font-size="14">Diethylstilbestrol (DES)</text>
<text x="250" y="426" font-size="14">Vaginal clear cell adenocarcinoma, T-shaped uterus</text>
<text x="640" y="426" font-size="14">Appears in daughters</text>
<rect x="14" y="436" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="456" font-size="14">Alcohol</text>
<text x="250" y="456" font-size="14">Smooth philtrum, thin upper lip, microcephaly</text>
<text x="640" y="456" font-size="14">Fetal alcohol syndrome</text>
<rect x="14" y="466" width="872" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="486" font-size="14">Cocaine</text>
<text x="250" y="486" font-size="14">Placental abruption, growth restriction</text>
<text x="640" y="486" font-size="14">Vasoconstriction</text>
<rect x="14" y="496" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="516" font-size="14">Methimazole</text>
<text x="250" y="516" font-size="14">Aplasia cutis, choanal atresia</text>
<text x="640" y="516" font-size="14">Use propylthiouracil first</text>
<rect x="14" y="526" width="872" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="546" font-size="14">Misoprostol</text>
<text x="250" y="546" font-size="14">Mobius sequence, limb defects</text>
<text x="640" y="546" font-size="14">Also causes contractions</text>
<rect x="14" y="556" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="576" font-size="14">Mycophenolate</text>
<text x="250" y="576" font-size="14">Microtia, cleft lip and palate</text>
<text x="640" y="576" font-size="14">Miscarriage risk too</text>
<rect x="14" y="586" width="872" height="28" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="606" font-size="14">Topiramate</text>
<text x="250" y="606" font-size="14">Cleft lip with or without palate</text>
<text x="640" y="606" font-size="14">Also an antimigraine drug</text>
<rect x="14" y="616" width="872" height="28" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text class="b" x="22" y="636" font-size="14">NSAIDs, late pregnancy</text>
<text x="250" y="636" font-size="14">Premature ductus arteriosus closure</text>
<text x="640" y="636" font-size="14">Also oligohydramnios</text>
</svg>
