<svg class="dia" viewBox="0 0 900 530" role="img" aria-label="Around ovulation each part of the tract has its own cell and job: the ovary releases the oocyte and can cause mittelschmerz, ciliated cells of the fallopian tube carry it and fail in Kartagener syndrome, endocervical glands make thin stretchy mucus under estradiol, and the ectocervix is nonkeratinized stratified squamous epithelium">
<text class="ttl" x="14" y="24" font-size="17">Around ovulation, each part of the tract has its own cell and its own job</text>
<text class="b" x="14" y="58" font-size="14">Site</text>
<text class="b" x="176" y="58" font-size="14">Cell and its job at mid-cycle</text>
<text class="b" x="518" y="58" font-size="14">Clinical clue</text>
<rect x="14" y="70" width="150" height="106" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<ellipse cx="89" cy="110" rx="44" ry="26" fill="var(--surface)" stroke="var(--a1)" stroke-width="2"/>
<circle cx="72" cy="108" r="10" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.6"/>
<circle cx="100" cy="114" r="6" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.6"/>
<circle cx="104" cy="98" r="4" fill="var(--a1)" stroke="var(--a1)" stroke-width="1"/>
<text class="b" x="26" y="162" font-size="15">Ovary</text>
<rect x="176" y="70" width="330" height="106" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<rect x="518" y="70" width="368" height="106" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text class="b" x="190" y="117" font-size="14">Follicle wall ruptures about 36 hours</text>
<text x="190" y="139" font-size="14">after the LH surge begins</text>
<text class="b" x="532" y="106" font-size="14">Mittelschmerz: fluid or blood irritates</text>
<text x="532" y="128" font-size="14">the peritoneum, so brief one-sided</text>
<text x="532" y="150" font-size="14">pain arrives in the middle of the cycle</text>
<rect x="14" y="184" width="150" height="106" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<path d="M34 240 C 52 200, 90 200, 142 228" fill="none" stroke="var(--a2)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="34" y1="240" x2="24" y2="248" stroke="var(--a2)" stroke-width="3"/>
<line x1="40" y1="246" x2="30" y2="254" stroke="var(--a2)" stroke-width="3"/>
<line x1="28" y1="232" x2="18" y2="240" stroke="var(--a2)" stroke-width="3"/>
<line x1="62" y1="206" x2="62" y2="218" stroke="var(--ink-2)" stroke-width="1.6"/>
<line x1="82" y1="206" x2="82" y2="218" stroke="var(--ink-2)" stroke-width="1.6"/>
<line x1="102" y1="214" x2="102" y2="226" stroke="var(--ink-2)" stroke-width="1.6"/>
<line x1="122" y1="214" x2="122" y2="226" stroke="var(--ink-2)" stroke-width="1.6"/>
<text class="b" x="26" y="276" font-size="15">Fallopian tube</text>
<rect x="176" y="184" width="330" height="106" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<rect x="518" y="184" width="368" height="106" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text class="b" x="190" y="220" font-size="14">Ciliated cells beat toward the uterus</text>
<text x="190" y="242" font-size="14">and carry the oocyte; peg cells secrete</text>
<text x="190" y="264" font-size="14">nutritive fluid</text>
<text class="b" x="532" y="220" font-size="14">Kartagener syndrome (defective dynein):</text>
<text x="532" y="242" font-size="14">immotile cilia, so infertility and</text>
<text x="532" y="264" font-size="14">ectopic pregnancy</text>
<rect x="14" y="298" width="150" height="106" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<rect x="64" y="308" width="50" height="60" rx="18" fill="var(--surface)" stroke="var(--warn)" stroke-width="2"/>
<path d="M76 320 q10 8 0 16 t0 16" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M100 320 q10 8 0 16 t0 16" fill="none" stroke="var(--warn)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="b" x="26" y="390" font-size="15">Endocervix</text>
<rect x="176" y="298" width="330" height="106" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<rect x="518" y="298" width="368" height="106" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text class="b" x="190" y="334" font-size="14">Mucinous columnar cells</text>
<text x="190" y="356" font-size="14">At peak estradiol the mucus is</text>
<text x="190" y="378" font-size="14">thin, watery, stretchy</text>
<text class="b" x="532" y="334" font-size="14">Spinnbarkeit and ferning mark the fertile</text>
<text x="532" y="356" font-size="14">window; progesterone makes the mucus</text>
<text x="532" y="378" font-size="14">thick and scant</text>
<rect x="14" y="412" width="150" height="106" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="36" y="428" width="106" height="11" rx="5" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.4"/>
<rect x="36" y="444" width="106" height="11" rx="5" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.4"/>
<rect x="36" y="460" width="106" height="11" rx="5" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.4"/>
<text class="b" x="26" y="504" font-size="15">Ectocervix</text>
<rect x="176" y="412" width="330" height="106" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<rect x="518" y="412" width="368" height="106" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text class="b" x="190" y="459" font-size="14">Nonkeratinized stratified squamous</text>
<text x="190" y="481" font-size="14">epithelium, continuous with the vagina</text>
<text class="b" x="532" y="448" font-size="14">The squamocolumnar junction with the</text>
<text x="532" y="470" font-size="14">endocervix is the transformation zone,</text>
<text x="532" y="492" font-size="14">where HPV transforms cells</text>
</svg>
