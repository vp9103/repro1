<svg class="dia" viewBox="0 0 900 548" role="img" aria-label="Neural crest derivatives beside look-alikes from other germ layers, and the structures around the umbilicus: allantois to urachus, vitelline duct, umbilical vein and umbilical arteries with what each becomes">
<text class="ttl" x="14" y="26" font-size="18">Origins and fates: neural crest and the umbilical remnants</text>
<rect x="14" y="44" width="424" height="214" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="74" font-size="15">Neural crest cells become</text>
<text x="28" y="108" font-size="15">Adrenal medulla: chromaffin cells</text>
<text x="28" y="142" font-size="15">Sympathetic and sensory ganglia</text>
<text x="28" y="176" font-size="15">Schwann cells and melanocytes</text>
<text x="28" y="210" font-size="15">Enteric ganglia of the gut wall</text>
<text x="28" y="244" font-size="15">Failed migration: Hirschsprung disease</text>
<rect x="450" y="44" width="436" height="214" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="464" y="74" font-size="15">Look-alikes with other origins</text>
<text x="464" y="108" font-size="15">Adrenal cortex: mesoderm</text>
<text x="464" y="142" font-size="15">Thyroid follicular cells: endoderm</text>
<text x="464" y="176" font-size="15">Anterior pituitary: surface ectoderm</text>
<text x="464" y="210" font-size="15">Retina: neuroectoderm</text>
<text x="464" y="244" font-size="15">Posterior pituitary: neuroectoderm</text>
<rect x="14" y="274" width="872" height="262" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="302" font-size="15">Channels around the umbilicus</text>
<text class="b" x="28" y="330" font-size="14">Embryonic structure</text>
<text class="b" x="262" y="330" font-size="14">Becomes</text>
<text class="b" x="518" y="330" font-size="14">What to remember</text>
<line x1="24" y1="340" x2="876" y2="340" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="24" y="346" width="852" height="40" rx="4" fill="var(--surface-2)" stroke="none" stroke-width="0"/>
<text class="b" x="32" y="372" font-size="15">Allantois (urachus)</text>
<text x="262" y="372" font-size="14">Median umbilical ligament</text>
<text x="518" y="372" font-size="14">Patent urachus: urine leaks at the umbilicus</text>
<text class="b" x="32" y="418" font-size="15">Vitelline duct</text>
<text x="262" y="418" font-size="14">Obliterates</text>
<text x="518" y="418" font-size="14">Meckel diverticulum, or stool at the umbilicus</text>
<rect x="24" y="438" width="852" height="40" rx="4" fill="var(--surface-2)" stroke="none" stroke-width="0"/>
<text class="b" x="32" y="464" font-size="15">Umbilical vein</text>
<text x="262" y="464" font-size="14">Ligamentum teres of the liver</text>
<text x="518" y="464" font-size="14">Carries the most oxygenated fetal blood</text>
<text class="b" x="32" y="510" font-size="15">Umbilical arteries</text>
<text x="262" y="510" font-size="14">Medial umbilical ligaments</text>
<text x="518" y="510" font-size="14">Single artery: marker for renal anomalies</text>
</svg>
