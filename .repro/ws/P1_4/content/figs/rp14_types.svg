<svg class="dia" viewBox="0 0 900 460" role="img" aria-label="Two pathways to endometrial carcinoma: type I runs from unopposed estrogen through hyperplasia and atypical hyperplasia to low-grade endometrioid carcinoma with PTEN and mismatch repair defects; type II runs from atrophic endometrium through an early TP53 mutation and a serous precursor to high-grade serous carcinoma">
<text class="ttl" x="14" y="24" font-size="17">Two roads to endometrial carcinoma</text>
<rect x="14" y="40" width="872" height="196" rx="10" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="30" y="66" font-size="16">Type I: estrogen-driven endometrioid (about 80%)</text>
<rect x="30" y="82" width="190" height="108" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="44" y="108" font-size="16">Unopposed estrogen</text>
<text x="44" y="132" font-size="15">Obesity, anovulation</text>
<text x="44" y="156" font-size="15">Estrogen-only therapy</text>
<text x="44" y="180" font-size="15">Tamoxifen</text>
<rect x="240" y="82" width="190" height="108" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="254" y="108" font-size="16">Hyperplasia</text>
<text x="254" y="132" font-size="15">Crowded glands</text>
<text x="254" y="156" font-size="15">No atypia: low risk</text>
<text x="254" y="180" font-size="15">Progestin reverses</text>
<rect x="450" y="82" width="210" height="108" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="464" y="108" font-size="16">Atypical hyperplasia</text>
<text x="464" y="132" font-size="15">Also called EIN</text>
<text x="464" y="156" font-size="15">PTEN loss</text>
<text x="464" y="180" font-size="15">Highest cancer risk</text>
<rect x="680" y="82" width="190" height="108" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="694" y="108" font-size="16">Endometrioid</text>
<text x="694" y="132" font-size="15">Carcinoma, low grade</text>
<text x="694" y="156" font-size="15">Mismatch repair loss</text>
<text x="694" y="180" font-size="15">Good prognosis</text>
<text x="30" y="222" font-size="15">Early events: PTEN loss and mismatch repair defects, which are inherited in Lynch syndrome</text>
<rect x="14" y="250" width="872" height="196" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="30" y="276" font-size="16">Type II: estrogen-independent serous and clear cell</text>
<rect x="30" y="292" width="190" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="44" y="318" font-size="16">Atrophic lining</text>
<text x="44" y="342" font-size="15">Older, thinner women</text>
<text x="44" y="366" font-size="15">No estrogen excess</text>
<text x="44" y="390" font-size="15">No hyperplasia</text>
<rect x="240" y="292" width="190" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="254" y="318" font-size="16">TP53 mutation</text>
<text x="254" y="342" font-size="15">Early, central event</text>
<text x="254" y="366" font-size="15">Aberrant p53 staining</text>
<text x="254" y="390" font-size="15">Genomic chaos</text>
<rect x="450" y="292" width="210" height="108" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="464" y="318" font-size="16">Serous precursor</text>
<text x="464" y="342" font-size="15">Intraepithelial</text>
<text x="464" y="366" font-size="15">carcinoma (SEIC)</text>
<text x="464" y="390" font-size="15">Can spread early</text>
<rect x="680" y="292" width="190" height="108" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="694" y="318" font-size="16">Serous carcinoma</text>
<text x="694" y="342" font-size="15">Papillae, psammoma</text>
<text x="694" y="366" font-size="15">Clear cell is similar</text>
<text x="694" y="390" font-size="15">Poor prognosis</text>
<text x="30" y="432" font-size="15">Carcinosarcoma (malignant mixed M&#252;llerian tumor) joins this aggressive, p53-driven group</text>
<line x1="220" y1="136" x2="232" y2="136" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="232,131 240,136 232,141" fill="var(--ink-2)"/>
<line x1="430" y1="136" x2="442" y2="136" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="442,131 450,136 442,141" fill="var(--ink-2)"/>
<line x1="660" y1="136" x2="672" y2="136" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="672,131 680,136 672,141" fill="var(--ink-2)"/>
<line x1="220" y1="346" x2="232" y2="346" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="232,341 240,346 232,351" fill="var(--ink-2)"/>
<line x1="430" y1="346" x2="442" y2="346" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="442,341 450,346 442,351" fill="var(--ink-2)"/>
<line x1="660" y1="346" x2="672" y2="346" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="672,341 680,346 672,351" fill="var(--ink-2)"/>
</svg>
