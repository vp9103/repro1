<svg class="dia" viewBox="0 0 900 500" role="img" aria-label="Layers of the vaginal wall with the function of each, and a numbered view of the vestibule showing the Bartholin glands, the paraurethral glands and the site of a Gartner duct cyst">
<text class="ttl" x="14" y="24" font-size="17">Structure explains function in the vagina and vestibule</text>
<rect x="14" y="40" width="416" height="448" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="64" font-size="16">Vaginal wall: made to stretch</text>
<rect x="28" y="76" width="388" height="90" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="42" y="100" font-size="15">Nonkeratinized squamous epithelium</text>
<text x="42" y="123" font-size="14">Resists friction; glycogen-rich cells</text>
<text x="42" y="146" font-size="14">Rugae (folds) flatten as the canal stretches</text>
<rect x="28" y="172" width="388" height="90" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="42" y="196" font-size="15">Lamina propria</text>
<text x="42" y="219" font-size="14">Elastic fibers let the wall distend</text>
<text x="42" y="242" font-size="14">Venous plexus: plasma transudate lubricates</text>
<rect x="28" y="268" width="388" height="60" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="292" font-size="15">Smooth muscle</text>
<text x="42" y="315" font-size="14">Stretches and contracts with the canal</text>
<rect x="28" y="334" width="388" height="60" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="42" y="358" font-size="15">Adventitia</text>
<text x="42" y="381" font-size="14">Connective tissue; no glands in the wall</text>
<rect x="28" y="402" width="388" height="78" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="42" y="426" font-size="15">Acid barrier</text>
<text x="42" y="447" font-size="14">Lactobacilli turn glycogen to lactic acid</text>
<text x="42" y="468" font-size="14">After menopause glycogen falls and pH rises</text>
<rect x="446" y="40" width="440" height="448" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="460" y="64" font-size="16">Vestibular glands and cysts</text>
<ellipse cx="666" cy="140" rx="130" ry="58" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<circle cx="666" cy="108" r="7" fill="var(--a2)"/>
<circle cx="648" cy="110" r="4" fill="var(--a1)"/>
<circle cx="684" cy="110" r="4" fill="var(--a1)"/>
<ellipse cx="666" cy="150" rx="30" ry="20" fill="var(--surface)" stroke="var(--ink-3)" stroke-width="1.5"/>
<circle cx="686" cy="152" r="5" fill="none" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="3 2"/>
<circle cx="610" cy="178" r="9" fill="var(--a1)"/>
<circle cx="722" cy="178" r="9" fill="var(--a1)"/>
<line x1="710" y1="102" x2="688" y2="109" stroke="var(--ink-2)" stroke-width="1.5"/>
<line x1="738" y1="146" x2="692" y2="151" stroke="var(--ink-2)" stroke-width="1.5"/>
<circle cx="572" cy="178" r="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text class="b" x="572" y="183" font-size="14" text-anchor="middle">1</text>
<circle cx="760" cy="178" r="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text class="b" x="760" y="183" font-size="14" text-anchor="middle">1</text>
<circle cx="722" cy="96" r="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text class="b" x="722" y="101" font-size="14" text-anchor="middle">2</text>
<circle cx="750" cy="146" r="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text class="b" x="750" y="151" font-size="14" text-anchor="middle">3</text>
<circle cx="468" cy="238" r="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text class="b" x="468" y="243" font-size="14" text-anchor="middle">1</text>
<text class="b" x="490" y="243" font-size="16">Bartholin glands</text>
<text x="490" y="265" font-size="14">Open at 4 and 8 o'clock; mucus-secreting acini</text>
<text x="490" y="286" font-size="14">Duct lined by transitional epithelium</text>
<text x="490" y="307" font-size="14">Blocked: cyst, then abscess; Word catheter</text>
<circle cx="468" cy="338" r="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text class="b" x="468" y="343" font-size="14" text-anchor="middle">2</text>
<text class="b" x="490" y="343" font-size="16">Paraurethral (Skene) glands</text>
<text x="490" y="365" font-size="14">Female prostate counterpart beside the urethra</text>
<text x="490" y="386" font-size="14">Infection gives urethral symptoms, not a mass</text>
<circle cx="468" cy="416" r="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
<text class="b" x="468" y="421" font-size="14" text-anchor="middle">3</text>
<text class="b" x="490" y="421" font-size="16">Gartner duct cyst</text>
<text x="490" y="443" font-size="14">Lateral vaginal wall; mesonephric duct remnant</text>
<text x="490" y="464" font-size="14">Higher than the introitus, not in the vestibule</text>
</svg>
