<svg class="dia" viewBox="0 0 900 626" role="img" aria-label="The male genital tract: hypospadias from unfused urethral folds, epispadias from a misplaced genital tubercle, testis descent along the gubernaculum with cryptorchidism and patent processus vaginalis, and the layer of the abdominal wall that gives each covering of the spermatic cord">
<text class="ttl" x="14" y="26" font-size="18">The male tract: urethra, descent and cord coverings</text>
<rect x="14" y="44" width="424" height="236" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="72" font-size="15">Where the urethra opens</text>
<rect x="24" y="84" width="404" height="90" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="38" y="110" font-size="15">Hypospadias: opening on the underside</text>
<text x="38" y="136" font-size="15">Urethral folds fail to fuse</text>
<text x="38" y="160" font-size="15">Common; delay circumcision</text>
<rect x="24" y="184" width="404" height="90" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="38" y="210" font-size="15">Epispadias: opening on the dorsum</text>
<text x="38" y="236" font-size="15">Genital tubercle positioned abnormally</text>
<text x="38" y="260" font-size="15">Rare; travels with bladder exstrophy</text>
<rect x="14" y="292" width="424" height="322" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="320" font-size="15">How the testis descends, and what fails</text>
<text x="28" y="346" font-size="14">The gubernaculum guides the testis down</text>
<text x="28" y="366" font-size="14">The processus vaginalis precedes it</text>
<rect x="24" y="378" width="404" height="124" rx="6" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="38" y="404" font-size="15">Cryptorchidism: germ cell tumor risk</text>
<text x="38" y="430" font-size="15">Seminoma risk stays raised in both testes,</text>
<text x="38" y="454" font-size="15">even after orchiopexy</text>
<text x="38" y="478" font-size="15">Warmth impairs sperm: operate in infancy</text>
<rect x="24" y="510" width="404" height="98" rx="6" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="38" y="536" font-size="15">Patent processus vaginalis</text>
<text x="38" y="562" font-size="15">Hydrocele: transilluminates</text>
<text x="38" y="586" font-size="15">Indirect inguinal hernia: bowel follows</text>
<rect x="450" y="44" width="436" height="360" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="464" y="72" font-size="15">Each layer of the wall wraps the cord</text>
<rect x="462" y="88" width="190" height="62" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="476" y="114" font-size="15">External oblique</text>
<text x="476" y="136" font-size="14">aponeurosis</text>
<line x1="656" y1="119" x2="684" y2="119" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="684,114 692,119 684,124" fill="var(--ink-2)"/>
<rect x="694" y="88" width="180" height="62" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="706" y="114" font-size="14">External spermatic</text>
<text x="706" y="136" font-size="14">fascia</text>
<rect x="462" y="164" width="190" height="62" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="476" y="190" font-size="15">Internal oblique</text>
<text x="476" y="212" font-size="14">muscle</text>
<line x1="656" y1="195" x2="684" y2="195" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="684,190 692,195 684,200" fill="var(--ink-2)"/>
<rect x="694" y="164" width="180" height="62" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="706" y="190" font-size="14">Cremaster muscle</text>
<text x="706" y="212" font-size="14">and fascia</text>
<rect x="462" y="240" width="190" height="62" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="476" y="266" font-size="15">Transversalis</text>
<text x="476" y="288" font-size="14">fascia</text>
<line x1="656" y1="271" x2="684" y2="271" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="684,266 692,271 684,276" fill="var(--ink-2)"/>
<rect x="694" y="240" width="180" height="62" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="706" y="266" font-size="14">Internal spermatic</text>
<text x="706" y="288" font-size="14">fascia</text>
<rect x="462" y="316" width="190" height="62" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="476" y="342" font-size="15">Parietal</text>
<text x="476" y="364" font-size="14">peritoneum</text>
<line x1="656" y1="347" x2="684" y2="347" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="684,342 692,347 684,352" fill="var(--ink-2)"/>
<rect x="694" y="316" width="180" height="62" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="706" y="342" font-size="14">Processus vaginalis,</text>
<text x="706" y="364" font-size="14">then tunica vaginalis</text>
<rect x="450" y="416" width="436" height="198" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="464" y="448" font-size="15">Inside the cord</text>
<text x="464" y="482" font-size="15">Vas deferens, testicular artery,</text>
<text x="464" y="506" font-size="15">pampiniform plexus</text>
<text x="464" y="548" font-size="15">The genital branch of the genitofemoral</text>
<text x="464" y="572" font-size="15">nerve supplies the cremaster</text>
</svg>
