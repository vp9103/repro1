<svg class="dia" viewBox="0 0 900 589" role="img" aria-label="Menopause care: the first move depends on the presentation; primary ovarian insufficiency before 40 needs a karyotype and FMR1 testing, amenorrhea at 42 needs a pregnancy test first, hot flashes with a uterus need estrogen plus a progestogen, hot flashes with breast cancer need a nonhormonal drug that avoids CYP2D6 inhibitors with tamoxifen, dryness alone needs vaginal estradiol, and any postmenopausal bleeding needs endometrial biopsy when the stripe exceeds 4 mm">
<text class="ttl" x="14" y="24" font-size="17">Menopause: the first move depends on the presentation</text>
<rect x="14" y="42" width="262" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="26" y="65" font-size="15">Presentation</text>
<rect x="282" y="42" width="332" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="294" y="65" font-size="15">First move</text>
<rect x="622" y="42" width="264" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="634" y="65" font-size="15">Key point</text>
<rect x="14" y="84" width="262" height="86" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/>
<rect x="282" y="84" width="332" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="622" y="84" width="264" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="110" font-size="14">Under 40, FSH high twice</text>
<text x="26" y="131" font-size="14">low estradiol, no menses</text>
<text class="b" x="294" y="110" font-size="14">Primary ovarian insufficiency</text>
<text x="294" y="131" font-size="14">Karyotype, FMR1 CGG-repeat test</text>
<text x="294" y="152" font-size="14">(fragile X), adrenal antibodies</text>
<text class="b" x="634" y="110" font-size="14">Estrogen until about age 51</text>
<text x="634" y="131" font-size="14">the usual age of menopause</text>
<rect x="14" y="178" width="262" height="65" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/>
<rect x="282" y="178" width="332" height="65" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="622" y="178" width="264" height="65" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="204" font-size="14">Missed periods at 42</text>
<text x="26" y="225" font-size="14">with hot flashes</text>
<text class="b" x="294" y="204" font-size="14">Serum or urine hCG first</text>
<text x="294" y="225" font-size="14">then FSH, TSH and prolactin</text>
<text class="b" x="634" y="204" font-size="14">Do not assume menopause</text>
<text x="634" y="225" font-size="14">Pregnancy, thyroid, prolactin</text>
<rect x="14" y="251" width="262" height="65" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<rect x="282" y="251" width="332" height="65" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="622" y="251" width="264" height="65" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="277" font-size="14">Hot flashes, estrogen safe</text>
<text x="26" y="298" font-size="14">uterus present</text>
<text class="b" x="294" y="277" font-size="14">Estrogen plus a progestogen</text>
<text x="294" y="298" font-size="14">such as micronized progesterone</text>
<text class="b" x="634" y="277" font-size="14">Estrogen alone is unopposed:</text>
<text x="634" y="298" font-size="14">hyperplasia and cancer</text>
<rect x="14" y="324" width="262" height="86" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<rect x="282" y="324" width="332" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="622" y="324" width="264" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="350" font-size="14">Hot flashes, estrogen unsafe</text>
<text x="26" y="371" font-size="14">breast cancer or past clot</text>
<text class="b" x="294" y="350" font-size="14">Venlafaxine or gabapentin,</text>
<text x="294" y="371" font-size="14">or fezolinetant (NK3 blocker)</text>
<text x="294" y="392" font-size="14">Fezolinetant: check liver enzymes</text>
<text class="b" x="634" y="350" font-size="14">On tamoxifen, avoid</text>
<text x="634" y="371" font-size="14">paroxetine and fluoxetine:</text>
<text x="634" y="392" font-size="14">strong CYP2D6 inhibitors</text>
<rect x="14" y="418" width="262" height="65" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<rect x="282" y="418" width="332" height="65" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="622" y="418" width="264" height="65" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="444" font-size="14">Dryness, painful sex,</text>
<text x="26" y="465" font-size="14">urinary infections only</text>
<text class="b" x="294" y="444" font-size="14">Low-dose vaginal estradiol</text>
<text x="294" y="465" font-size="14">No progestogen needed</text>
<text class="b" x="634" y="444" font-size="14">Genitourinary syndrome of</text>
<text x="634" y="465" font-size="14">menopause (GSM)</text>
<rect x="14" y="491" width="262" height="86" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.4"/>
<rect x="282" y="491" width="332" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="622" y="491" width="264" height="86" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="26" y="517" font-size="14">Any bleeding after</text>
<text x="26" y="538" font-size="14">menopause</text>
<text class="b" x="294" y="517" font-size="14">Endometrial biopsy if the stripe</text>
<text x="294" y="538" font-size="14">is over 4 mm or bleeding recurs</text>
<text x="294" y="559" font-size="14">Hysteroscopy if sampling fails</text>
<text class="b" x="634" y="517" font-size="14">Cancer until proven otherwise</text>
<text x="634" y="538" font-size="14">Atrophy is a diagnosis of</text>
<text x="634" y="559" font-size="14">exclusion</text>
</svg>
