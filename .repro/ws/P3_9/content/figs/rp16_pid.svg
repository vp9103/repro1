<text x="100" y="340" font-size="14" text-anchor="middle">Ovary</text>
<text x="400" y="340" font-size="14" text-anchor="middle">Ovary</text>
<text x="250" y="474" font-size="14" text-anchor="middle">Pelvic peritoneum</text>
<text x="496" y="214" font-size="13" text-anchor="middle">right</text>
<text x="496" y="230" font-size="13" text-anchor="middle">gutter</text>
<circle cx="284" cy="382" r="12" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.6"/>
<text class="a1" x="284" y="387" font-size="14" text-anchor="middle">1</text>
<circle cx="274" cy="292" r="12" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.6"/>
<text class="a1" x="274" y="297" font-size="14" text-anchor="middle">2</text>
<circle cx="336" cy="210" r="12" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.6"/>
<text class="a1" x="336" y="215" font-size="14" text-anchor="middle">3</text>
<circle cx="448" cy="310" r="12" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.6"/>
<text class="a1" x="448" y="315" font-size="14" text-anchor="middle">4</text>
<circle cx="60" cy="400" r="12" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.6"/>
<text class="a1" x="60" y="405" font-size="14" text-anchor="middle">5</text>
<circle cx="270" cy="96" r="12" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.6"/>
<text class="a1" x="270" y="101" font-size="14" text-anchor="middle">6</text>
<rect x="556" y="44" width="330" height="276" rx="10" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<text class="b" x="572" y="72" font-size="15">Ascending spread, in order</text>
<text x="572" y="106" font-size="14"><tspan class="b">1</tspan>  Cervicitis at the cervix</text>
<text x="572" y="142" font-size="14"><tspan class="b">2</tspan>  Endometritis in the uterus</text>
<text x="572" y="178" font-size="14"><tspan class="b">3</tspan>  Salpingitis in the tubes</text>
<text x="572" y="214" font-size="14"><tspan class="b">4</tspan>  Tubo-ovarian abscess</text>
<text x="572" y="250" font-size="14"><tspan class="b">5</tspan>  Pelvic peritonitis</text>
<text x="572" y="286" font-size="14"><tspan class="b">6</tspan>  Perihepatitis: Fitz-Hugh-Curtis</text>
<rect x="556" y="334" width="330" height="150" rx="10" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.4"/>
<text class="b" x="572" y="362" font-size="15">Scarred tubes then cause</text>
<text x="572" y="392" font-size="14">Tubal factor infertility</text>
<text x="572" y="418" font-size="14">Ectopic pregnancy</text>
<text x="572" y="444" font-size="14">Chronic pelvic pain</text>
<text x="572" y="470" font-size="14">Hydrosalpinx on imaging</text>
