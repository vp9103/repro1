<svg class="dia" viewBox="0 0 900 500" role="img" aria-label="Pelvic inflammatory disease as ascending spread: organisms move from the cervix to the endometrium, the tubes, the ovary and pelvic peritoneum, and up the right paracolic gutter to the liver capsule, with scarred tubes causing infertility, ectopic pregnancy and chronic pain">
