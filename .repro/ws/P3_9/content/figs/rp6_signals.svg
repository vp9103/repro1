<svg class="dia" viewBox="0 0 900 548" role="img" aria-label="The male signal chain from SRY to the external genitalia, and the link each disorder of sex development breaks: Swyer syndrome at SRY, 5-alpha-reductase deficiency at DHT, androgen insensitivity at the androgen receptor, and extra androgen reaching a 46,XX fetus in CAH or aromatase deficiency">
<text class="ttl" x="14" y="24" font-size="17">Where each disorder breaks the male signal chain</text>
<rect x="20" y="70" width="500" height="46" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="36" y="99" font-size="15">SRY on the Y chromosome makes a testis</text>
<rect x="20" y="150" width="240" height="46" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text x="36" y="179" font-size="15">Sertoli cells: AMH</text>
<rect x="280" y="150" width="240" height="46" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text x="296" y="179" font-size="15">Leydig cells: testosterone</text>
<rect x="20" y="230" width="240" height="46" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text x="36" y="259" font-size="15">Müllerian ducts regress</text>
<rect x="280" y="230" width="240" height="46" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text x="296" y="259" font-size="15">Wolffian ducts kept</text>
<rect x="20" y="310" width="240" height="46" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text x="36" y="339" font-size="15">No uterus or upper vagina</text>
<rect x="280" y="310" width="240" height="46" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text x="296" y="339" font-size="15">5-alpha-reductase: DHT</text>
<rect x="280" y="390" width="240" height="46" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text x="296" y="419" font-size="15">DHT binds androgen receptor</text>
<rect x="280" y="470" width="240" height="46" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text x="296" y="499" font-size="15">Penis, scrotum, prostate</text>
<rect x="20" y="390" width="240" height="126" rx="8" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1.5"/>
<text class="b" x="36" y="418" font-size="15">Default path</text>
<text x="36" y="446" font-size="15">No testis signals means</text>
<text x="36" y="472" font-size="15">female ducts and</text>
<text x="36" y="498" font-size="15">female genitalia</text>
<line x1="140" y1="116" x2="140" y2="142" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="135,142 140,150 145,142" fill="var(--ink-2)"/>
<line x1="400" y1="116" x2="400" y2="142" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="395,142 400,150 405,142" fill="var(--ink-2)"/>
<line x1="140" y1="196" x2="140" y2="222" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="135,222 140,230 145,222" fill="var(--ink-2)"/>
<line x1="400" y1="196" x2="400" y2="222" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="395,222 400,230 405,222" fill="var(--ink-2)"/>
<line x1="140" y1="276" x2="140" y2="302" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="135,302 140,310 145,302" fill="var(--ink-2)"/>
<line x1="400" y1="276" x2="400" y2="302" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="395,302 400,310 405,302" fill="var(--ink-2)"/>
<line x1="400" y1="356" x2="400" y2="382" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="395,382 400,390 405,382" fill="var(--ink-2)"/>
<line x1="400" y1="436" x2="400" y2="462" stroke="var(--ink-2)" stroke-width="2"/>
<polygon points="395,462 400,470 405,462" fill="var(--ink-2)"/>
<rect x="548" y="62" width="338" height="62" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="562" y="86" font-size="15">Swyer syndrome breaks here</text>
<text x="562" y="110" font-size="15">Streak gonads, uterus kept</text>
<line x1="520" y1="93" x2="548" y2="93" stroke="var(--crit)" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="548" y="150" width="338" height="126" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="562" y="176" font-size="15">Three quick readings</text>
<text x="562" y="204" font-size="15">Uterus present: no AMH made</text>
<text x="562" y="232" font-size="15">Male ducts need testosterone</text>
<text x="562" y="260" font-size="15">Low DHT alone: ambiguous</text>
<rect x="548" y="302" width="338" height="62" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="562" y="326" font-size="15">5-alpha-reductase deficiency</text>
<text x="562" y="350" font-size="15">Ambiguous at birth, virilizes later</text>
<line x1="520" y1="333" x2="548" y2="333" stroke="var(--crit)" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="548" y="382" width="338" height="62" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="562" y="406" font-size="15">Androgen insensitivity</text>
<text x="562" y="430" font-size="15">Female genitalia, no uterus</text>
<line x1="520" y1="413" x2="548" y2="413" stroke="var(--crit)" stroke-width="2" stroke-dasharray="4 3"/>
<rect x="548" y="462" width="338" height="62" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="562" y="486" font-size="15">46,XX with extra androgen</text>
<text x="562" y="510" font-size="15">CAH or aromatase deficiency</text>
<line x1="520" y1="493" x2="548" y2="493" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
