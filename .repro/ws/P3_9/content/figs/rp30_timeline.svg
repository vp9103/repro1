<svg class="dia" viewBox="0 0 900 604" role="img" aria-label="Prenatal care timeline in gestational weeks: folic acid before conception, first-visit labs and crown-rump dating, first-trimester screening and chorionic villus sampling, quad screen and amniocentesis, anatomy scan, fundal height, glucose challenge, Tdap, RSV vaccine and group B strep culture, with trimesters and the preterm and term boundaries">
<text class="ttl" x="14" y="24" font-size="17">Prenatal care on one timeline, in gestational weeks</text>
<rect x="520" y="13" width="12" height="12" rx="2" fill="var(--a1)"/>
<text x="537" y="24" font-size="13">Screening</text>
<rect x="620" y="13" width="12" height="12" rx="2" fill="var(--a2)"/>
<text x="637" y="24" font-size="13">Prevention</text>
<rect x="728" y="13" width="12" height="12" rx="2" fill="var(--ink-3)"/>
<text x="745" y="24" font-size="13">Dating, monitoring</text>
<rect x="14" y="40" width="872" height="26" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="70.0" y="47" width="295.8" height="12" rx="3" fill="var(--a2)"/>
<text x="373.8" y="58" font-size="14">Folic acid 0.4 mg daily (4 mg after a prior NTD)</text>
<rect x="14" y="68" width="872" height="26" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="244.0" y="75" width="104.4" height="12" rx="3" fill="var(--ink-3)"/>
<text x="356.4" y="86" font-size="14">First visit: blood type, HIV, HBsAg, syphilis, urine culture</text>
<rect x="14" y="96" width="872" height="26" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="261.4" y="103" width="121.8" height="12" rx="3" fill="var(--ink-3)"/>
<text x="391.2" y="114" font-size="14">Crown-rump length: the most accurate dating</text>
<rect x="14" y="124" width="872" height="26" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="313.6" y="131" width="522.0" height="12" rx="3" fill="var(--a1)"/>
<text x="24.0" y="142" font-size="14">Cell-free DNA from 10 weeks</text>
<rect x="14" y="152" width="872" height="26" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="313.6" y="159" width="69.6" height="12" rx="3" fill="var(--a1)"/>
<text x="391.2" y="170" font-size="14">First-trimester screen: NT, PAPP-A, hCG</text>
<rect x="14" y="180" width="872" height="26" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="313.6" y="187" width="69.6" height="12" rx="3" fill="var(--a1)"/>
<text x="391.2" y="198" font-size="14">Chorionic villus sampling (placenta)</text>
<rect x="14" y="208" width="872" height="26" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="400.6" y="215" width="121.8" height="12" rx="3" fill="var(--a1)"/>
<text x="530.4" y="226" font-size="14">Quad screen: AFP, estriol, hCG, inhibin A</text>
<rect x="14" y="236" width="872" height="26" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="400.6" y="243" width="87.0" height="12" rx="3" fill="var(--a1)"/>
<text x="495.6" y="254" font-size="14">Amniocentesis from 15 weeks</text>
<rect x="14" y="264" width="872" height="26" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="452.8" y="271" width="69.6" height="12" rx="3" fill="var(--ink-3)"/>
<text x="530.4" y="282" font-size="14">Anatomy scan: heart, spine, abdominal wall</text>
<rect x="14" y="292" width="872" height="26" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="487.6" y="299" width="348.0" height="12" rx="3" fill="var(--ink-3)"/>
<text x="274.2" y="310" font-size="14">Fundal height (cm) = weeks</text>
<rect x="14" y="320" width="872" height="26" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="557.2" y="327" width="69.6" height="12" rx="3" fill="var(--a1)"/>
<text x="634.8" y="338" font-size="14">Glucose challenge test</text>
<rect x="14" y="348" width="872" height="26" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="609.4" y="355" width="156.6" height="12" rx="3" fill="var(--a2)"/>
<text x="419.7" y="366" font-size="14">Tdap in every pregnancy</text>
<rect x="14" y="376" width="872" height="26" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="696.4" y="383" width="87.0" height="12" rx="3" fill="var(--a2)"/>
<text x="522.5" y="394" font-size="14">RSV vaccine in season</text>
<rect x="14" y="404" width="872" height="26" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="0.8"/>
<rect x="766.0" y="411" width="34.8" height="12" rx="3" fill="var(--a1)"/>
<text x="592.1" y="422" font-size="14">Group B strep culture</text>
<line x1="70" y1="452" x2="880" y2="452" stroke="var(--ink-2)" stroke-width="1.5"/>
<line x1="139.6" y1="446" x2="139.6" y2="458" stroke="var(--ink-2)" stroke-width="1.5"/>
<text x="139.6" y="474" font-size="13" text-anchor="middle">0 (LMP)</text>
<line x1="313.6" y1="446" x2="313.6" y2="458" stroke="var(--ink-2)" stroke-width="1.5"/>
<text x="313.6" y="474" font-size="13" text-anchor="middle">10</text>
<line x1="383.2" y1="446" x2="383.2" y2="458" stroke="var(--ink-2)" stroke-width="1.5"/>
<text x="383.2" y="474" font-size="13" text-anchor="middle">14</text>
<line x1="487.6" y1="446" x2="487.6" y2="458" stroke="var(--ink-2)" stroke-width="1.5"/>
<text x="487.6" y="474" font-size="13" text-anchor="middle">20</text>
<line x1="626.8" y1="446" x2="626.8" y2="458" stroke="var(--ink-2)" stroke-width="1.5"/>
<text x="626.8" y="474" font-size="13" text-anchor="middle">28</text>
<line x1="783.4" y1="446" x2="783.4" y2="458" stroke="var(--ink-2)" stroke-width="1.5"/>
<text x="783.4" y="474" font-size="13" text-anchor="middle">37</text>
<line x1="870.4" y1="446" x2="870.4" y2="458" stroke="var(--ink-2)" stroke-width="1.5"/>
<text x="870.4" y="474" font-size="13" text-anchor="middle">42</text>
<text x="14" y="474" font-size="13">Preconception</text>
<rect x="139.6" y="484" width="243.6" height="24" rx="4" fill="var(--a1-soft)" stroke="var(--line)" stroke-width="0.8"/>
<text x="149.6" y="501" font-size="14">First trimester</text>
<rect x="383.2" y="484" width="243.6" height="24" rx="4" fill="var(--a2-soft)" stroke="var(--line)" stroke-width="0.8"/>
<text x="393.2" y="501" font-size="14">Second trimester</text>
<rect x="626.8" y="484" width="243.6" height="24" rx="4" fill="var(--surface-3)" stroke="var(--line)" stroke-width="0.8"/>
<text x="636.8" y="501" font-size="14">Third trimester</text>
<rect x="139.6" y="516" width="348.0" height="24" rx="4" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.8"/>
<text x="149.6" y="533" font-size="14">Abortion: loss before 20 weeks</text>
<rect x="487.6" y="516" width="295.8" height="24" rx="4" fill="var(--warn-soft)" stroke="var(--line)" stroke-width="0.8"/>
<text x="497.6" y="533" font-size="14">Preterm: 20 to 36 6/7 weeks</text>
<rect x="783.4" y="516" width="87.0" height="24" rx="4" fill="var(--good-soft)" stroke="var(--line)" stroke-width="0.8"/>
<text x="793.4" y="533" font-size="14">Term</text>
<text class="b" x="14" y="566" font-size="14">Term begins at 37 weeks; post-term is 42 weeks or later.</text>
<text class="b" x="14" y="590" font-size="14">Avoid live vaccines (MMR, varicella) until after delivery.</text>
</svg>
