<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Repro-Endo Path</title></head><body>
<!-- P1.1 fix, two defects on these two lines. (a) The root element carried no lang
     attribute, so screen readers chose a voice by guesswork and translation tools had
     nothing to go on; it now declares lang="en". (b) A duplicate title element sat here
     inside the body, invalid HTML that handed assistive tech two competing document
     names. The copy in the head is the real one, so the stray was deleted, not synced. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ============================ TOKENS ============================
   Palette is block-specific: --a1 / --a2 are the two subject hues, filled by
   build.py from content/meta.json (palette.a1/a2, a1Dark/a2Dark). Their -2 and
   -soft variants are DERIVED here with color-mix(), so a new palette recolours
   every accent (P2.2, R25). Everything else is shared across the series. */
:root{
  --ground:#FBF7F6; --surface:#FFFFFF; --surface-2:#F6EEEC; --surface-3:#EFE4E1;
  --line:#E8DBD8; --line-strong:#D4C0BC;
  --ink:#1F1417; --ink-2:#57474B; --ink-3:#8A7679;

  /* block accents — overridden per block */
  --a1:#8A2E62;  --a1-2:color-mix(in srgb, var(--a1) 82%, #fff);  --a1-soft:color-mix(in srgb, var(--a1) 12%, #fff);
  --a2:#1F6F68;  --a2-2:color-mix(in srgb, var(--a2) 82%, #fff);  --a2-soft:color-mix(in srgb, var(--a2) 12%, #fff);

  --good:#3A7A63; --good-soft:#E2F0EA;
  --warn:#A26A1F; --warn-soft:#FAECD6;
  --crit:#AB3F38; --crit-soft:#FBE5E3;
  --lock:#9C8E90;

  --shadow:0 1px 2px rgba(31,20,23,.05), 0 8px 24px -12px rgba(31,20,23,.18);
  --shadow-lift:0 2px 4px rgba(31,20,23,.06), 0 18px 40px -18px rgba(31,20,23,.28);
  --shadow-soft:0 1px 2px rgba(31,20,23,.04), 0 6px 18px -12px rgba(31,20,23,.14);   /* P2.2 (R26): was read, never defined */
  --r:10px; --r-lg:16px;
  --serif:"Newsreader","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* P2.V N5 - native scrollbars and form controls (the calendar strip's scrollbar, the date field)
   were drawn in light colors on the dark cards; color-scheme hands them the theme */
:root{color-scheme:light}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#151011; --surface:#1D1719; --surface-2:#251D20; --surface-3:#2E2528;
    --line:#362B2E; --line-strong:#4C3D41;
    --ink:#F4EDEC; --ink-2:#C6B6B8; --ink-3:#958487;
    --a1:#E39AC6; --a1-2:color-mix(in srgb, var(--a1) 86%, #000); --a1-soft:color-mix(in srgb, var(--a1) 18%, #1D1719);
    --a2:#7FD0C5; --a2-2:color-mix(in srgb, var(--a2) 86%, #000); --a2-soft:color-mix(in srgb, var(--a2) 18%, #1D1719);
    --good:#72C2A5; --good-soft:#1A2F29;
    --warn:#D9A25C; --warn-soft:#332510;
    --crit:#E27C74; --crit-soft:#391D1C;
    --lock:#6B5D60;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -18px rgba(0,0,0,.8);
    --shadow-soft:0 1px 2px rgba(0,0,0,.35), 0 6px 18px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#151011; --surface:#1D1719; --surface-2:#251D20; --surface-3:#2E2528;
  --line:#362B2E; --line-strong:#4C3D41;
  --ink:#F4EDEC; --ink-2:#C6B6B8; --ink-3:#958487;
  --a1:#E39AC6; --a1-2:color-mix(in srgb, var(--a1) 86%, #000); --a1-soft:color-mix(in srgb, var(--a1) 18%, #1D1719);
  --a2:#7FD0C5; --a2-2:color-mix(in srgb, var(--a2) 86%, #000); --a2-soft:color-mix(in srgb, var(--a2) 18%, #1D1719);
  --good:#72C2A5; --good-soft:#1A2F29;
  --warn:#D9A25C; --warn-soft:#332510;
  --crit:#E27C74; --crit-soft:#391D1C;
  --lock:#6B5D60;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -18px rgba(0,0,0,.8);
  --shadow-soft:0 1px 2px rgba(0,0,0,.35), 0 6px 18px -12px rgba(0,0,0,.6);
}

/* ============================ BASE ============================ */
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;line-height:1.22}
p{margin:0}
a{color:var(--a1)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;font-family:var(--sans)}
:focus-visible{outline:2.5px solid var(--a1);outline-offset:2px;border-radius:4px}
::selection{background:var(--a1-soft);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.hide{display:none !important}
.tnum{font-variant-numeric:tabular-nums}

/* ============================ HEADER ============================ */
header{position:sticky;top:0;z-index:60;background:var(--ground);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:18px;height:62px}
.brand{display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.brand b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.012em;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;flex:none;
  background:linear-gradient(135deg,var(--a1) 0 50%,var(--a2) 50% 100%)}
.countdown{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);line-height:1.35;
  border-left:1px solid var(--line-strong);padding-left:14px;flex:none}
.countdown b{color:var(--a1);font-weight:600}
nav.modes{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.modes button{padding:7px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink-2);
  transition:background .15s,color .15s;white-space:nowrap}
nav.modes button:hover{background:var(--surface-2);color:var(--ink)}
nav.modes button[aria-current="true"]{background:var(--ink);color:var(--ground);font-weight:600}
.hprog{display:flex;align-items:center;gap:9px;flex:none;padding-left:16px;border-left:1px solid var(--line)}
.ring{width:34px;height:34px;flex:none}
.hprog .pn{font-family:var(--mono);font-size:15px;font-weight:600;line-height:1.1}
.hprog .pl{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.savedot{width:6px;height:6px;border-radius:50%;background:var(--good);opacity:0;transition:opacity .3s}
.savedot.on{opacity:1}

/* ============================ LAYOUT ============================ */
main{padding:30px 0 120px}
.cols{display:grid;grid-template-columns:262px minmax(0,1fr);gap:38px;align-items:start}
.rail{position:sticky;top:86px;max-height:calc(100vh - 110px);overflow-y:auto;padding-right:6px;
  scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.rail::-webkit-scrollbar{width:6px}
.rail::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.rail h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;margin:0 0 9px 2px;display:flex;align-items:center;gap:8px}
.rail h4 .rnum{font-size:10px;color:var(--a1);font-weight:600}
.railgrp{margin-bottom:20px;display:flex;flex-direction:column;gap:1px}
.railtoggle{display:none}  /* the phone/tablet fold (RESPONSIVE); the desktop rail never folds */
.railitem{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13.4px;
  line-height:1.34;color:var(--ink-2);transition:background .13s,color .13s}
.railitem:hover{background:var(--surface-2);color:var(--ink)}
.railitem[aria-current="true"]{background:var(--a1-soft);color:var(--ink);font-weight:600}
.railitem .rt{display:flex;align-items:center;gap:8px}
.railitem .stepn{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none;width:16px;
  text-align:right;font-variant-numeric:tabular-nums}
.railitem[aria-current="true"] .stepn{color:var(--a1)}
.railitem.done .stepn{color:var(--good)}
.rbar{height:2.5px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--good);border-radius:2px;transition:width .4s}
.yield{width:5px;height:5px;border-radius:50%;flex:none}
.y-hi{background:var(--a1)} .y-mid{background:var(--warn)} .y-lo{background:var(--ink-3);opacity:.55}
.flagdot{width:5px;height:5px;border-radius:50%;background:var(--crit);margin-left:auto;flex:none}

/* ============================ CARDS ============================ */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 30px}
.flat{background:var(--surface-2);border-radius:var(--r);padding:18px 20px}

/* ============================ PATH / SPINE ============================ */
.pathhero{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow);margin-bottom:30px}
.phtop{padding:26px 30px 22px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--a1-soft),transparent)}
.phtop .eyebrow{margin-bottom:9px}
.phtop h1{font-size:clamp(26px,3.6vw,38px);letter-spacing:-.024em;margin-bottom:10px}
.phtop .lede{font-family:var(--serif);font-size:18.5px;line-height:1.55;color:var(--ink-2);max-width:58ch}
.phtop .lede b{color:var(--ink);font-weight:600}
.phbody{padding:22px 30px 26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:26px;align-items:center}
.phnext{min-width:0}
.phnext .nl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:7px}
.phnext .nt{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.25;letter-spacing:-.014em;margin-bottom:6px}
.phnext .nd{font-size:14px;color:var(--ink-2);line-height:1.5;max-width:56ch}
.phmeta{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}

/* stage stepper */
.stages{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:var(--r-lg);overflow:hidden}
.stage{background:var(--surface);display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:16px;
  padding:15px 20px;align-items:center;text-align:left;width:100%;transition:background .13s}
.stage:hover{background:var(--surface-2)}
.stage .sn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;
  place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-3);flex:none}
.stage.done .sn{background:var(--good);border-color:var(--good);color:#fff}
.stage.cur .sn{background:var(--a1);border-color:var(--a1);color:#fff;
  box-shadow:0 0 0 4px var(--a1-soft)}
.stage .st{display:block;font-size:15.5px;font-weight:600;line-height:1.32}
.stage .sd{display:block;font-size:12.8px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.stage.done .st{color:var(--ink-3)}
.stage .sm{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;text-align:right;
  display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.stagebar{width:56px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.stagebar i{display:block;height:100%;border-radius:2px;background:var(--good);transition:width .4s}

/* ============================ TYPE / READING ============================ */
.topichead{margin-bottom:26px;padding-bottom:20px;border-bottom:1.5px solid var(--ink)}
.topichead .kick{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.topichead h2{font-size:clamp(26px,3.4vw,37px);letter-spacing:-.02em;margin-bottom:9px}
.topichead .sub{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--ink-2);max-width:62ch;line-height:1.45}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  padding:3.5px 8px;border-radius:5px;white-space:nowrap}
.tag.hi{background:var(--a1);color:#fff}
.tag.mid{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.tag.lo{background:var(--surface-3);color:var(--ink-3)}
.tag.ghost{background:transparent;color:var(--ink-3);border:1px solid var(--line-strong)}
.tag.step{background:var(--a2);color:#fff}
/* P3.4: badge for a topic proven weak on two or more independent signals. Soft
   fill plus a crit outline so it alerts in both themes; the one-signal
   "suspected" badge deliberately reuses the muted .tag.ghost, so the two read
   as different strengths of claim at a glance rather than as two colours. */
.tag.crit{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit)}

.prose{font-family:var(--serif);font-size:18.5px;line-height:1.66;color:var(--ink);max-width:66ch}
.prose p{margin:0 0 17px}
.prose strong{font-weight:600;color:var(--ink)}
.prose em{font-style:italic}
.sechead{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--a1);margin:38px 0 15px;display:flex;align-items:center;gap:11px}
.sechead::after{content:"";flex:1;height:1px;background:var(--line)}
.body-inner>.sechead:first-child{margin-top:0}

/* cloze */
.cz{border-bottom:1.5px solid var(--a2-2);cursor:pointer;font-weight:600;color:var(--a2);
  padding:0 1px;border-radius:2px;transition:background .13s}
.cz:hover{background:var(--a2-soft)}
.cz.blank{background:var(--a2-soft);border-bottom-style:dashed;color:transparent;user-select:none;
  border-radius:3px;position:relative}
.cz.blank::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--a2-2);
  font-family:var(--mono);font-size:.78em;font-weight:600}

/* callouts */
.call{border-radius:var(--r);padding:15px 18px;margin:20px 0;font-family:var(--sans);font-size:14.5px;
  line-height:1.56;border-left:3px solid;max-width:66ch}
.call .cl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:600;display:block;margin-bottom:6px}
.call.key{background:var(--a2-soft);border-color:var(--a2)} .call.key .cl{color:var(--a2)}
.call.trap{background:var(--crit-soft);border-color:var(--crit)} .call.trap .cl{color:var(--crit)}
.call.mnem{background:var(--good-soft);border-color:var(--good)} .call.mnem .cl{color:var(--good)}
.call.step{background:var(--warn-soft);border-color:var(--warn)} .call.step .cl{color:var(--warn)}
.call strong{font-weight:600}
.call.mnem b{font-family:var(--mono);font-weight:600;color:var(--good)}

/* elaborative interrogation */
.why{margin:20px 0;max-width:66ch;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface-2)}
.why>summary{padding:13px 17px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;gap:11px;list-style:none}
.why>summary::-webkit-details-marker{display:none}
.why>summary .qm{font-family:var(--mono);font-size:11px;color:var(--a1);flex:none;font-weight:600}
.why>summary .ch{margin-left:auto;color:var(--ink-3);font-size:12px;transition:transform .2s;flex:none}
.why[open]>summary .ch{transform:rotate(90deg)}
.why .ans{padding:0 17px 16px 44px;font-family:var(--serif);font-size:16.5px;line-height:1.6;color:var(--ink-2)}
.why .ans strong{color:var(--ink);font-weight:600}

/* tables */
.tblwrap{overflow-x:auto;margin:22px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:13.8px;min-width:540px}
th{background:var(--surface-2);text-align:left;padding:10px 14px;font-weight:600;font-size:11px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
tr:last-child td{border-bottom:none}
td:first-child{font-weight:600;color:var(--ink)}
tbody tr:hover{background:var(--surface-2)}
td b,th b{color:var(--a1);font-weight:600}

/* ============================ FIGURES ============================ */
figure{margin:26px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px 22px 16px;overflow-x:auto}
figure svg.dia{display:block;width:100%;height:auto;max-width:100%;min-width:520px}
figcaption{font-family:var(--sans);font-size:12.8px;color:var(--ink-3);line-height:1.55;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line)}
figcaption b{color:var(--ink-2);font-weight:600}
/* P2.5 (K22): a CSS font-size beats an SVG font-size ATTRIBUTE, so this default used to
   flatten every authored label size to 11.5 (8.6 px on screen at 1280). The defaults now
   apply only to labels that carry no size of their own; the fitter's shrink, which works
   by writing the attribute, takes effect for the same reason. */
figure svg.dia text{font-family:var(--sans);fill:var(--ink-2)}
figure svg.dia text:not([font-size]){font-size:11.5px}
figure svg.dia text.b{font-weight:700;fill:var(--ink)}
/* <b> is illegal inside <text> -- the HTML parser closes the <svg> at it and
   spills the rest of the figure into the page as prose. <tspan> is the legal
   form, so it needs the same weight. Fill is inherited, so coloured text keeps
   its colour. */
figure svg.dia tspan.b{font-weight:700}
figure svg.dia text.s{font-family:var(--mono);fill:var(--ink-3);letter-spacing:.02em}
figure svg.dia text.s:not([font-size]){font-size:10px}
figure svg.dia text.a1{fill:var(--a1);font-weight:600}
figure svg.dia text.a2{fill:var(--a2);font-weight:600}
figure svg.dia text.gd{fill:var(--good);font-weight:600}
figure svg.dia text.wn{fill:var(--warn);font-weight:600}
figure svg.dia text.cr{fill:var(--crit);font-weight:600}
figure svg.dia text.ttl{font-weight:700;fill:var(--ink)}
figure svg.dia text.ttl:not([font-size]){font-size:12.5px}

/* ---- annotated photographs: numbered markers + legend below (never overlapping text) ---- */
figure.photo{padding:0;overflow:hidden}
.imgbox{position:relative;display:block;line-height:0;background:#0b0b0c}
.imgbox img{display:block;width:100%;height:auto}
.imgbox svg.ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;
  transition:opacity .25s}
.imgbox.raw svg.ovl{opacity:0}
.ovl .mk{fill:none;stroke-width:1.1;vector-effect:non-scaling-stroke}
.ovl .mk.c1{stroke:#FF4D3D} .ovl .mk.c2{stroke:#4DA3FF} .ovl .mk.c3{stroke:#39D98A}
.ovl .mk.c4{stroke:#FFC24D} .ovl .mk.c5{stroke:#C77DFF}
.ovl .sh{stroke:none;opacity:.22}
.ovl .sh.c1{fill:#FF4D3D} .ovl .sh.c2{fill:#4DA3FF} .ovl .sh.c3{fill:#39D98A}
.ovl .sh.c4{fill:#FFC24D} .ovl .sh.c5{fill:#C77DFF}
.ovl .pin{stroke:#fff;stroke-width:.6;vector-effect:non-scaling-stroke}
.ovl .pin.c1{fill:#FF4D3D} .ovl .pin.c2{fill:#4DA3FF} .ovl .pin.c3{fill:#39D98A}
.ovl .pin.c4{fill:#FFC24D} .ovl .pin.c5{fill:#C77DFF}
.ovl text.pn{fill:#fff;font-family:var(--mono);font-weight:700;text-anchor:middle;
  paint-order:stroke;stroke:rgba(0,0,0,.5);stroke-width:.4}
.photobar{display:flex;align-items:center;gap:10px;padding:11px 18px;background:var(--surface-2);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.photobar .pt{font-size:13.5px;font-weight:600;color:var(--ink);min-width:0}
.photobar .pbtn{margin-left:auto}
.legend{display:flex;flex-direction:column;gap:9px;padding:15px 18px 4px}
.legend .li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:11px;align-items:start;
  font-size:13.6px;line-height:1.5;color:var(--ink-2)}
.legend .li b{color:var(--ink);font-weight:600}
.legend .lnum{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:10.5px;font-weight:700;color:#fff;margin-top:1px}
.lnum.c1{background:#D8352A} .lnum.c2{background:#2F72C4} .lnum.c3{background:#1E9B63}
.lnum.c4{background:#B9791A} .lnum.c5{background:#8B4CC7}
figure.photo figcaption{margin:0;padding:13px 18px 15px;border-top:1px solid var(--line);
  color:var(--ink-2);font-size:13.2px}
.cred{display:block;margin-top:9px;font-family:var(--mono);font-size:10px;color:var(--ink-3);
  line-height:1.45;opacity:.85}
.cred a{color:var(--ink-3);text-decoration:none;border-bottom:1px dotted var(--line-strong)}
.cred a:hover{color:var(--a1)}

/* ============================ BUTTONS ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:9px;
  font-size:14px;font-weight:600;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);transition:background .14s,border-color .14s,transform .1s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.pri:hover{background:var(--a1);border-color:var(--a1);color:#fff}
.btn.acc{background:var(--a1);color:#fff;border-color:var(--a1)}
.btn.acc:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:7px}
.btn.lg{padding:13px 24px;font-size:15px;border-radius:10px}
.btn.gho{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12.5px;
  font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);
  cursor:pointer;transition:all .13s}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink);font-weight:600}
.chiprow{display:flex;gap:7px;flex-wrap:wrap}
.nbadge{display:inline-grid;place-items:center;min-width:16px;height:16px;padding:0 4px;margin-left:6px;
  border-radius:9px;background:var(--crit);color:#fff;font-family:var(--mono);font-size:9.5px;font-weight:600}
nav.modes button[aria-current="true"] .nbadge{background:var(--ground);color:var(--crit)}

/* ============================ QUESTIONS ============================ */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow)}
.qtop{display:flex;align-items:center;gap:10px;padding:13px 22px;background:var(--surface-2);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.qtop .qn{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-weight:500}
.qtop .qsp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qstem{padding:24px 26px 6px;font-family:var(--serif);font-size:18px;line-height:1.62;max-width:74ch}
.qstem b{font-weight:600}
.qstem .lead{margin-top:14px;font-weight:600;font-style:italic}
.qopts{padding:14px 26px 22px;display:flex;flex-direction:column;gap:8px;max-width:78ch}
.qopt{display:flex;gap:13px;align-items:flex-start;padding:13px 16px;border:1.5px solid var(--line);
  border-radius:var(--r);background:var(--surface);text-align:left;font-size:15.5px;line-height:1.48;
  transition:border-color .13s,background .13s;width:100%}
.qopt:hover:not(:disabled):not([aria-disabled="true"]):not(.wrong){border-color:var(--a1-2);background:var(--surface-2)}
.qopt .ol{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink-3);flex:none;
  width:21px;height:21px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;margin-top:1px}
.qopt.right{border-color:var(--good);background:var(--good-soft)}
.qopt.right .ol{background:var(--good);color:#fff}
.qopt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.qopt.wrong .ol{background:var(--crit);color:#fff}
.qopt.dim{opacity:.55}
.qopt:disabled{cursor:default}
.qexp{margin:0 26px 24px;padding:19px 21px;background:var(--surface-2);border-radius:var(--r);
  border-left:3px solid var(--a2);max-width:78ch}
.qexp .vt{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  color:var(--a2);margin-bottom:8px;display:block}
.qexp p{font-family:var(--serif);font-size:16.5px;line-height:1.6;margin-bottom:12px}
.qexp p:last-child{margin-bottom:0}
.qexp .wrongs{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:13.5px;
  line-height:1.55;color:var(--ink-2)}
.qexp .wrongs div{margin-bottom:6px}
.qexp .wrongs b{color:var(--ink);font-weight:600;font-family:var(--mono);font-size:12px}
/* P2.3 (K7-K11): after answering, every wrong option is a toggle for its own why-note
   (.optwhy, directly under it) and the picked one opens at once; the bottom line leads the
   explanation; the comparison table marks the keyed row; the old note list sits under a
   disclosure; a finished set shows its summary. Theme tokens only (light and dark). */
.qow{display:flex;flex-direction:column;gap:6px}
.qopt[aria-disabled="true"]{cursor:default}
.qopt.dim[aria-expanded="true"]{opacity:1;border-color:var(--ink-3)}
.qopt .rfwh{margin-left:auto;flex:none;align-self:center;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:8px}
.qopt .rfwh::after{content:" \25BE"}
.qopt[aria-expanded="true"] .rfwh::after{content:" \25B4"}
.qopts .optwhy{margin:0 0 4px 34px;padding:10px 14px;border-left:3px solid var(--ink-3);background:var(--surface-2);
  border-radius:0 var(--r) var(--r) 0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.qopts .qow.picked .optwhy{border-left-color:var(--crit)}
.qopts .optwhy b{color:var(--ink)}
@media (max-width:600px){.qopts .optwhy{margin-left:0}}
.qexp .qbl,.sumexp .qbl{margin:0 0 12px;padding:10px 13px;border-left:4px solid var(--good);border-radius:8px;
  background:var(--good-soft);font-family:var(--sans);font-size:15px;line-height:1.5;font-weight:600;color:var(--ink)}
.qbl .blk{display:block;font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--good);margin-bottom:3px}
.qexp .tblwrap.et,.sumexp .tblwrap.et{margin:14px 0}
.tblwrap.et tr.etkey td{background:var(--good-soft)}
.tblwrap.et tr.etkey td:first-child{box-shadow:inset 4px 0 0 var(--good)}
.tblwrap.et .etl{display:inline-grid;place-items:center;width:19px;height:19px;margin-right:7px;border-radius:5px;
  background:var(--surface-3);color:var(--ink-3);font:600 11.5px var(--mono);vertical-align:1px}
.tblwrap.et tr.etkey .etl{background:var(--good);color:#fff}
.tblwrap.et .etans{font:700 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--good)}
.qexp details.wrongs>summary{cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3)}
.qexp details.wrongs[open]>summary{margin-bottom:8px}
.setsummary .sumhead{padding:20px 26px 6px;font-size:15px;line-height:1.55;color:var(--ink-2)}
.setsummary .sumhead b{color:var(--ink)}
/* P2.V F3 (redo): a check's result on its summary and on the Path card */
.setsummary .checkres{margin:20px 26px 0;max-width:78ch}
.phnext .checkres{margin:14px 0 0;max-width:56ch;font-size:14px}
.checkres b{color:var(--ink)}
.setsummary .sumrows{padding:10px 26px 22px;display:flex;flex-direction:column;gap:8px;max-width:78ch}
.sumq{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 15px;border:1.5px solid var(--line);
  border-radius:var(--r);background:var(--surface);font-size:15px;line-height:1.45}
.sumq:hover{background:var(--surface-2)}
.sumrow.ok .sumq{border-left:4px solid var(--good)}
.sumrow.bad .sumq{border-left:4px solid var(--crit)}
.sumq::after{content:"\25BE";margin-left:auto;flex:none;color:var(--ink-3)}
.sumq[aria-expanded="true"]::after{content:"\25B4"}
.sumk{flex:none;width:54px;padding-top:2px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.sumrow.ok .sumk{color:var(--good)}
.sumrow.bad .sumk{color:var(--crit)}
.sumtxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.sumlead{font-weight:600;color:var(--ink)}
.sumstem,.sumpick{font-size:13.5px;color:var(--ink-2)}
.sumexp{margin:6px 0 4px;padding:15px 18px;background:var(--surface-2);border-radius:var(--r);border-left:3px solid var(--a2)}
.sumexp p{font-family:var(--serif);font-size:16px;line-height:1.6;margin-bottom:10px}
.sumexp .wrongs{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.sumexp .wrongs div{margin-bottom:6px}
.sumexp .wrongs b{color:var(--ink);font-weight:600}
@media (max-width:600px){.setsummary .sumhead,.setsummary .sumrows{padding-left:18px;padding-right:18px}.setsummary .checkres{margin-left:18px;margin-right:18px}}
.qfoot{display:flex;align-items:center;gap:12px;padding:15px 26px;border-top:1px solid var(--line);
  background:var(--surface-2);flex-wrap:wrap}
.conf{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.conf .cl2{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* pretest (errorful generation before instruction) */
.pretest{border:1.5px dashed var(--warn);background:var(--warn-soft);border-radius:var(--r-lg);
  padding:18px 20px;margin-bottom:26px;max-width:66ch}
.pthead{font-size:14px;line-height:1.55;color:var(--ink-2);margin-bottom:6px}
.pthead b{color:var(--warn)}
.ptq{padding:13px 0;border-top:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.ptqq{font-family:var(--serif);font-size:17px;line-height:1.45;margin-bottom:10px}
.ptopts{display:flex;flex-direction:column;gap:6px}
.ptopt{display:flex;gap:10px;align-items:flex-start;padding:9px 13px;border:1.5px solid var(--line);
  border-radius:8px;background:var(--surface);text-align:left;font-size:14.5px;line-height:1.45;width:100%}
.ptopt.right{border-color:var(--good);background:var(--good-soft)}
.ptopt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.ptopt:disabled{cursor:default}
.ptwhy{margin-top:10px;font-size:13.5px;line-height:1.55;color:var(--ink-2);
  padding-left:13px;border-left:2px solid var(--warn)}
/* P2.4 (K14): after a pick the keyed option is aria-disabled, .ptwhy leads with the picked
   option's own note, and every other wrong option toggles its note (.optwhy) under it. */
.ptopt:hover:not(:disabled):not([aria-disabled="true"]):not(.right):not(.wrong){border-color:var(--warn)}
.ptopt[aria-disabled="true"]{cursor:default}
.ptopt.dim{color:var(--ink-2)}
.ptopt.dim[aria-expanded="true"]{border-color:var(--ink-3)}
.ptopt .rfwh{margin-left:auto;flex:none;align-self:center;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:8px}
.ptopt .rfwh::after{content:" \25BE"}
.ptopt[aria-expanded="true"] .rfwh::after{content:" \25B4"}
.ptopts .optwhy{margin:0 0 2px 14px;padding:8px 12px;border-left:3px solid var(--ink-3);background:var(--surface);
  border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.ptopts .optwhy b,.ptwhy b{color:var(--ink)}
.ptwhy .ptpick{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
@media (max-width:600px){.ptopts .optwhy{margin-left:0}}

/* ============================ RAPID PICK ============================ */
.rf{max-width:820px;margin:0 auto}
.rfcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:32px 34px 26px;box-shadow:var(--shadow)}
.rfq{font-family:var(--serif);font-size:clamp(21px,2.8vw,27px);line-height:1.34;letter-spacing:-.012em;
  margin-bottom:22px;text-wrap:balance}
.rfopts{display:flex;flex-direction:column;gap:9px}
.rfopt{display:flex;gap:12px;align-items:flex-start;padding:14px 17px;border:1.5px solid var(--line);
  border-radius:var(--r);background:var(--surface);text-align:left;font-size:16px;line-height:1.45;width:100%;
  transition:border-color .13s,background .13s}
/* P1.7: answered options are no longer disabled (wrong ones open their why), so the
   hover lift must skip the keyed option, which is marked aria-disabled instead. */
.rfopt:hover:not(:disabled):not([aria-disabled="true"]){border-color:var(--a1-2);background:var(--surface-2)}
.rfopt.right{border-color:var(--good);background:var(--good-soft)}
.rfopt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.rfopt:disabled{cursor:default}
/* P1.7: after answering, every wrong option is a toggle for its own why-note
   (.optwhy, directly under it); the picked one opens at once. Theme tokens only,
   so both light and dark themes carry the same contrast. */
.rfow{display:flex;flex-direction:column;gap:6px}
.rfopt[aria-disabled="true"]{cursor:default}
.rfopt.dim{color:var(--ink-2)}
.rfopt.dim[aria-expanded="true"]{border-color:var(--ink-3)}
.rfopt .rfwh{margin-left:auto;flex:none;align-self:center;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:8px}
.rfopt .rfwh::after{content:" \25BE"}
.rfopt[aria-expanded="true"] .rfwh::after{content:" \25B4"}
.rf .optwhy{margin:0 0 4px 32px;padding:10px 14px;border-left:3px solid var(--ink-3);background:var(--surface-2);
  border-radius:0 var(--r) var(--r) 0;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.rf .rfow.picked .optwhy{border-left-color:var(--crit)}
.rf .optwhy b{color:var(--ink)}
.rfcat{display:inline-block;margin:0 8px 4px 0;padding:1px 9px;border:1px solid var(--a2);border-radius:999px;
  background:var(--surface);color:var(--a2);font-size:12px;font-weight:600;letter-spacing:.02em;vertical-align:1px}
.rfhint{margin-top:12px;font-size:12.5px;color:var(--ink-3)}
@media (hover:none){.rfhint{display:none}}
@media (max-width:600px){.rf .optwhy{margin-left:0}}
.rfopt .ol{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-3);flex:none;
  width:20px;height:20px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;margin-top:1px}
.rfx{margin-top:16px;padding:13px 16px;background:var(--a2-soft);border-left:3px solid var(--a2);
  border-radius:var(--r);font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.rfx b{color:var(--ink)}
.rfx.miss{border-left-color:var(--crit)}
.rfmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:14px;flex-wrap:wrap}
.rfbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:18px}
.rfbar i{display:block;height:100%;background:var(--a1);transition:width .3s}

/* ============================ DRILLS ============================ */
/* A/B sorting */
.disc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin:22px 0}
.disccol{background:var(--surface);padding:19px 20px}
.disccol h5{font-family:var(--sans);font-size:15px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.disccol .dsub{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:13px}
.disccol ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.disccol li{font-size:14px;line-height:1.5;padding-left:15px;position:relative;color:var(--ink-2)}
.disccol li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
.disccol li b{color:var(--ink);font-weight:600}
.disccol.a{border-top:3px solid var(--a1)}
.disccol.b{border-top:3px solid var(--a2)}
.dkey{font-size:14.5px;line-height:1.55;background:var(--warn-soft);border-left:3px solid var(--warn);
  padding:14px 17px;border-radius:var(--r);margin:0 0 22px}
.dkey b{color:var(--warn);font-weight:700}
.sortitem{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);
  padding:14px 17px;font-size:16px;line-height:1.45;margin-bottom:14px;font-family:var(--serif)}
.sortbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sortbtns .btn{padding:13px 14px;font-size:14.5px;flex-wrap:wrap;gap:2px 8px}
/* P2.V F21: an answered item keeps its sides on screen, disabled; the pick and the right side
   say so in words (.dres) as well as by color */
.sortbtns .btn.dright,.sortbtns .btn.dwrong{opacity:1;cursor:default;color:var(--ink)}
.sortbtns .btn.dright{border-color:var(--good);background:var(--good-soft)}
.sortbtns .btn.dwrong{border-color:var(--crit);background:var(--crit-soft)}
.sortbtns .btn .dres{font-size:12px;font-weight:600;color:var(--ink-2)}
#drnext{scroll-margin-bottom:24px}
/* P2.6 (F31): a landing that scrolls (landOn / applyLand) stops below the sticky header, not under it */
[data-viewlead],.qstem,.rfq,.sortitem,.sumhead,.topichead h2,.oitem,#ordverdict,#pathnote,#rendernote,.phnext [data-checkres]{scroll-margin-top:calc(var(--hh,62px) + 12px)}
#ordverdict{scroll-margin-bottom:24px}
/* P2.V K13: the multi drill set its column count as an inline repeat(3,1fr), which no media
   query can override, so at 400 px the end screen kept three columns (about 590 px) inside a
   330 px .disc with overflow hidden and the last column's items and why toggles were clipped.
   The count is now --dcols, the tracks may shrink, and below 760 px the end screen and the
   running board are one column, as the sort end screen already is. */
.disc.dmulti,.sortbtns.dmulti{grid-template-columns:repeat(var(--dcols,3),minmax(0,1fr))}
@media (max-width:760px){.disc.dmulti,.sortbtns.dmulti{grid-template-columns:minmax(0,1fr)}}

/* ordering / build-the-chain */
.orderwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin:18px 0}
.orderpool,.ordertgt{display:flex;flex-direction:column;gap:8px;min-height:90px;padding:14px;
  border-radius:var(--r);border:1.5px dashed var(--line-strong);background:var(--surface-2)}
.ordertgt{border-style:solid;background:var(--surface)}
.ordercol h6{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 9px 2px;font-weight:500}
.oitem{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border:1.5px solid var(--line);
  border-radius:8px;background:var(--surface);font-size:14.5px;line-height:1.45;text-align:left;width:100%;
  transition:border-color .13s,background .13s}
.oitem:hover:not(:disabled):not(.right):not(.wrong){border-color:var(--a1-2)}
.ordertgt .oitem{background:var(--surface-2)}
.oitem .on{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-3);flex:none;width:18px;
  height:18px;border-radius:4px;background:var(--surface-3);display:grid;place-items:center;margin-top:1px}
.oitem.right{border-color:var(--good);background:var(--good-soft)}
.oitem.right .on{background:var(--good);color:#fff}
.oitem.wrong{border-color:var(--crit);background:var(--crit-soft)}
.oitem.wrong .on{background:var(--crit);color:#fff}
.oitem:disabled{cursor:default}
/* P2.4 (K13): drill end screens - every item (columns, missed list, checked order steps)
   is a toggle for its own why-note (.optwhy, directly under it). Theme tokens only. */
.dwrow{display:flex;flex-direction:column;gap:6px}
.dwbtn{display:flex;gap:8px;align-items:flex-start;width:100%;padding:0;text-align:left;font-size:inherit;line-height:inherit;color:inherit}
button.dwbtn:hover > span:first-child{text-decoration:underline;text-decoration-color:var(--line-strong)}
.dwbtn .rfwh,.oitem .rfwh{margin-left:auto;flex:none;align-self:center;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-left:8px}
.dwbtn .rfwh::after,.oitem .rfwh::after{content:" \25BE"}
.dwbtn[aria-expanded="true"] .rfwh::after,.oitem[aria-expanded="true"] .rfwh::after{content:" \25B4"}

/* ---------- daily plan ---------- */
.plan{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);
  margin-bottom:28px}
.planhead{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.planhead .pd2{font-size:13px;color:var(--ink-2);margin-top:3px}
.streak{margin-left:auto;display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;
  color:var(--ink-2);flex:none}
.streak b{font-size:17px;color:var(--a1)}
.planlist{display:flex;flex-direction:column;gap:1px;background:var(--line)}
.planrow{background:var(--surface);display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;
  padding:13px 20px;align-items:center;text-align:left;width:100%;transition:background .13s}
.planrow:hover{background:var(--surface-2)}
.planrow .pn2{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);
  display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);flex:none}
.planrow.done .pn2{background:var(--good);border-color:var(--good);color:#fff}
.planrow.done .pl2t{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.planrow .pl2t{font-size:14.5px;font-weight:600;line-height:1.35;display:block}
.planrow .pl2d{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.4;display:block}
.planrow .pl2m{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}

/* calendar strip */
.calstrip{display:flex;gap:4px;padding:14px 20px;overflow-x:auto;background:var(--surface);
  border-top:1px solid var(--line);scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.calday{flex:none;width:38px;border-radius:8px;padding:7px 0;text-align:center;
  background:var(--surface-2);border:1px solid transparent}
.calday .cdn{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase}
.calday .cdd{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-2);margin-top:2px}
.calday.today{border-color:var(--a1);background:var(--a1-soft)}
.calday.today .cdd{color:var(--a1)}
.calday.past{opacity:.42}
.calday.exam{background:var(--a1);border-color:var(--a1)}
.calday.exam .cdn,.calday.exam .cdd{color:#fff}
.calday{cursor:pointer;transition:border-color .13s,background .13s;position:relative}
.calday:hover{border-color:var(--ink-3)}
.calday .cdn,.calday .cdd{display:block}
.calday .cdm{display:block;height:5px;line-height:5px;font-size:11px;color:var(--good)}
.calday.exam .cdm{color:#fff}
.calday.sel{border-color:var(--a2);background:var(--a2-soft);box-shadow:0 0 0 2px var(--a2-soft)}
.caldetail{display:flex;align-items:flex-start;gap:12px;margin:0 20px 16px;padding:12px 15px;
  background:var(--surface-2);border-left:3px solid var(--a2);border-radius:var(--r);
  font-size:13.4px;line-height:1.55;color:var(--ink-2)}
.caldetail .cdt{font-weight:700;color:var(--ink);white-space:nowrap}
.caldetail .cdb{flex:1;min-width:0}
.caldetail .cdb b{color:var(--ink);font-weight:600}
.caldetail .cdx{color:var(--ink-3);font-size:17px;line-height:1;padding:0 2px;flex:none}
.caldetail .cdx:hover{color:var(--a1)}
.bldbox{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);
  margin-bottom:22px;overflow:hidden}
.bldbox>summary{padding:14px 20px;cursor:pointer;font-size:14.5px;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:10px;background:var(--surface-2)}
.bldbox>summary::-webkit-details-marker{display:none}
.bldbox>summary::before{content:"\25B8";color:var(--ink-3);font-size:11px;transition:transform .18s}
.bldbox[open]>summary::before{transform:rotate(90deg)}
.bldbox[open]>summary{border-bottom:1px solid var(--line)}
.bldbox>summary .bldn{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--a1);font-weight:600}
.bldbody{padding:4px 20px 18px}
.bldrow{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.bldrow:last-of-type{border-bottom:none}
.bldl{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);width:84px;flex:none;padding-top:6px}
.bldsub{font-size:12px;color:var(--ink-3);margin-bottom:8px;line-height:1.5}
.bldgl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);width:100%;margin-bottom:3px}
.bldfoot{display:flex;gap:11px;align-items:center;padding-top:15px;flex-wrap:wrap;
  border-top:1px solid var(--line);margin-top:4px}
.bldgo{font-size:13.5px;color:var(--ink-2)}
.bldgo b{color:var(--ink)}
.bldwarn{font-size:12.5px;color:var(--warn)}
.bldbox .chip{font-size:12px;padding:4.5px 10px}
@media (max-width:700px){ .bldrow{flex-direction:column;gap:7px} .bldl{width:auto;padding-top:0} }
.examset{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.examset .exl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap}
.examset input[type=date],.examset select{font-family:var(--mono);font-size:12.5px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:7px;

@media (max-width:700px){ .examset{margin-left:0;width:100%} .caldetail{margin:0 14px 14px;flex-wrap:wrap} }

/* linked-review banner */
.linked{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:0 26px 20px;
  border-radius:var(--r);background:var(--warn-soft);border-left:3px solid var(--warn);

@media (max-width:700px){

}

/* ---------- "unpack": one idea per row, each with its own explanation ---------- */
.unpack{margin:24px 0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  background:var(--surface);max-width:70ch}
.unpackhead{padding:14px 20px;background:var(--a1-soft);border-bottom:1px solid var(--line);
  font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
.unpackrow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding:15px 20px;
  border-bottom:1px solid var(--line)}
.unpackrow:last-child{border-bottom:none}
.unpackrow .un{width:26px;height:26px;border-radius:50%;background:var(--a1);color:#fff;
  display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;
  flex:none;margin-top:1px}
.unpackrow .ut{display:block;font-size:15.5px;font-weight:600;line-height:1.4;color:var(--ink)}
.unpackrow .ud{display:block;font-family:var(--serif);font-size:16.5px;line-height:1.6;
  color:var(--ink-2);margin-top:6px}

/* ---------- yield filter ---------- */
.yieldbtn{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-3);font-size:12.5px;
  font-weight:500;transition:all .13s}
.yieldbtn:hover{border-color:var(--a1);color:var(--a1)}
.yieldbtn.on{background:var(--a1);border-color:var(--a1);color:#fff;font-weight:600}
.yieldbanner{padding:11px 16px;margin-bottom:20px;border-radius:var(--r);background:var(--a1-soft);
  border-left:3px solid var(--a1);font-size:13.6px;line-height:1.55;color:var(--ink-2)}
.yieldbanner b{color:var(--a1)}
.ybadge{font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:2px 5px;border-radius:4px;
  background:var(--surface-3);color:var(--ink-3);margin-left:auto;margin-right:6px;
  white-space:nowrap;flex:none} /* P2.V: a long block name split "0/4 HY" onto two lines */
.rail h4 .rnum{margin-left:0}

/* ---------- progress backup ---------- */
.backup{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 4px}
.backup label.btn{cursor:pointer}
.bkn{font-size:12.5px;color:var(--ink-3);flex:1 1 240px;min-width:0}

/* ---------- calibration + hypercorrection ---------- */
.conf .chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.conf.needconf{animation:nudge .42s}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hypercorr{margin:0 26px 14px;padding:14px 16px;border-radius:10px;font-size:14px;line-height:1.6;
  background:var(--crit-soft);border:1px solid var(--crit);color:var(--ink)}
.hypercorr.lucky{background:var(--warn-soft);border-color:var(--warn)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.danger:hover{background:var(--crit-soft)}

/* ---------- H1: annotation text sits next to its pin ---------- */
/* The pins live inside .ovlayer, which is pointer-events:none so the overlay
   never blocks the image. That also made the pins themselves un-hittable --
   elementFromPoint returned null over a pin -- so hover AND tap silently did
   nothing on every annotated image. Re-enable hits on the pin only; shapes and
   leader lines stay transparent to the pointer. */
.opin{cursor:pointer;padding:0;z-index:3;pointer-events:auto}
.optip{pointer-events:none}   /* tooltip must not steal the hover from its pin */
.opin[aria-expanded="true"]{z-index:20;outline:2px solid var(--ground);outline-offset:1px}
/* the image box clips its contents, so it has to stop clipping while a label is open */
.imgbox:has(.opin[aria-expanded="true"]){overflow:visible}
.ovlayer{overflow:visible}
/* Fixed width, not vw: inside an embedded frame vw can resolve to 0, which
   collapses the box to its padding and looks like nothing opened at all. */
.optip{display:none;position:absolute;width:300px;padding:11px 13px;border-radius:9px;
  background:var(--ink);color:var(--ground);font-family:var(--sans);font-size:12.5px;line-height:1.55;
  font-weight:400;text-align:left;letter-spacing:0;box-shadow:0 8px 28px -6px rgba(0,0,0,.55);
  white-space:normal;pointer-events:none}
.opin[aria-expanded="true"] .optip{display:block}
/* ONLY the leading number is a disc. Styling every <b> in the label turned each
   bold word into a coloured blob and collapsed the box to the pin's width. */
.optip .otn{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border-radius:50%;background:var(--oc);color:#fff;font-size:10.5px;margin-right:7px;
  vertical-align:-3px;flex:none}
.optip :is(b,strong){font-weight:700;display:inline;width:auto;height:auto;background:none;
  border-radius:0;margin:0;vertical-align:baseline}
.optip.r{left:26px} .optip.l{right:26px}
.optip.dn{top:-4px} .optip.up{bottom:-4px}
.optip :is(b,strong){color:#fff}
.imgbox .annhot{pointer-events:auto;cursor:help;background:transparent;opacity:.18;
  transition:opacity .16s,background .16s,box-shadow .16s;border-width:2px}
.imgbox:hover .annhot{opacity:.7;background:color-mix(in srgb,var(--oc) 18%,transparent)}
.imgbox .annhot:hover,.imgbox .annhot:focus-visible,.imgbox .annhot.hot{opacity:1;
  background:color-mix(in srgb,var(--oc) 38%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--oc) 22%,transparent);z-index:12}
.annhot::before{content:attr(data-num);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:var(--oc);color:#fff;
  border:2px solid #fff;font:700 11px var(--mono);box-shadow:0 2px 7px rgba(0,0,0,.45)}
.photoannot{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,330px);gap:14px;align-items:stretch}
.photoannot .imgbox{overflow:hidden;min-width:0}
.annrail{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:16px;
  color:var(--ink-2);font:400 13.5px/1.6 var(--sans);box-shadow:var(--shadow-soft);min-height:150px}
.annrail .arhead{display:block;color:var(--ink-3);font:700 10px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px}
.annrail .arnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;margin-right:8px;
  background:var(--a1);color:#fff;font:700 11px var(--mono)}
.annrail b,.annrail strong{color:var(--ink)}
@media (max-width:820px){.photoannot{grid-template-columns:1fr}.annrail{min-height:0}}
.vmap{margin:26px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);padding:18px}
.vmap h4{margin:0 0 5px;font:600 17px var(--serif)}.vmap>p{margin:0 0 14px;color:var(--ink-3);font-size:13px}
.vmapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vzone{position:relative;min-height:116px;border:1px solid var(--line-strong);border-radius:12px;padding:16px 14px;
  text-align:left;background:linear-gradient(145deg,var(--surface),var(--a2-soft));transition:transform .15s,box-shadow .15s,background .15s}
.vzone:hover,.vzone:focus-visible{transform:translateY(-2px);background:var(--a1-soft);box-shadow:var(--shadow-lift);z-index:4}
.vzone b{display:block;color:var(--a1);font-size:14px;margin-bottom:7px}.vzone span{font-size:13px;line-height:1.5;color:var(--ink-2)}
.vzone::after{content:"hover annotation";display:block;margin-top:10px;font:9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.vzone .vnote{display:none;position:absolute;left:calc(100% + 10px);top:0;width:270px;padding:12px 14px;border-radius:10px;
  background:var(--ink);color:var(--ground);font:13px/1.55 var(--sans);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.vzone:nth-child(3n) .vnote{left:auto;right:calc(100% + 10px)}.vzone:hover .vnote,.vzone:focus-visible .vnote{display:block}
@media(max-width:760px){.vmapgrid{grid-template-columns:1fr}.vzone .vnote{position:static;width:auto;margin-top:10px}.vzone:nth-child(3n) .vnote{margin-top:10px}}
.conceptvisual{margin:26px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);padding:18px}
.conceptvisual>h4{margin:0 0 6px;font:600 17px var(--serif)}.conceptvisual>.cvintro{margin:0 0 14px;color:var(--ink-3);font-size:13px}
.conceptvisual figure{margin:12px 0}.conceptsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.conceptsteps>div{border-left:4px solid var(--a1);background:var(--surface);border-radius:7px;padding:10px 12px;color:var(--ink-2);font-size:13px;line-height:1.45}
.conceptsteps b{display:block;color:var(--ink);margin-bottom:3px}@media(max-width:760px){.conceptsteps{grid-template-columns:1fr}}
.deepreview{margin:14px 22px 18px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface)}
.deepreview>summary{cursor:pointer;padding:13px 15px;color:var(--a1);font:700 12px var(--sans);letter-spacing:.03em}
.deepbody{padding:0 15px 16px}.deepbody .reviewgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.reviewgrid>div{padding:10px;border-radius:8px;background:var(--surface-2);font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.reviewgrid b{display:block;color:var(--ink);margin-bottom:3px}@media(max-width:760px){.deepbody .reviewgrid{grid-template-columns:1fr}.deepreview{margin:12px 10px}}
/* P1.8: where-to-look line above a pinned figure, and the answer highlight inside it. Both are
   built from theme tokens only, so they re-colour with the theme: amber tint + amber rule for
   the line; an amber halo behind the answer label with the label itself in full ink and bold. */
.rfsay,.ptsay,.qsay{margin:14px 0 4px;padding:10px 13px;border-left:4px solid var(--warn);border-radius:8px;
  background:var(--warn-soft);color:var(--ink);font-size:14px;line-height:1.55;max-width:78ch}
.rfsay .sayk,.ptsay .sayk,.qsay .sayk{display:block;font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--warn);margin-bottom:3px}
figure svg.dia rect.hlbox{fill:color-mix(in srgb,var(--warn) 24%,transparent);stroke:var(--warn);stroke-width:1.4;pointer-events:none}
figure svg.dia text.hl,figure svg.dia tspan.hl{fill:var(--ink);font-weight:700}
.legend{margin-top:12px}
.legend > summary{cursor:pointer;font-family:var(--sans);font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);padding:7px 0;list-style:none}
.legend > summary::-webkit-details-marker{display:none}
.legend > summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.legend[open] > summary::before{content:"▾ "}

/* ---------- signalling: bold marks the testable fact, soft marks the rest ---------- */
em.soft{font-style:normal;font-weight:500;box-shadow:inset 0 -0.42em 0 var(--a1-soft)}
.gterm.auto{border-bottom-style:dotted}

/* ---------- pacing indicator ---------- */
.pace{font-family:var(--mono);font-size:12px;color:var(--ink-3);padding:2px 8px;border-radius:20px;
  border:1px solid var(--line);min-width:52px;text-align:center}
.pace.near{color:var(--warn);border-color:var(--warn)}
.pace.over{color:var(--crit);border-color:var(--crit);font-weight:700}

/* ---------- memory scenes: a spatial board, not a paragraph ---------- */
.palboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin:16px 0 6px}
.palcard{margin:0;display:flex;flex-direction:column;gap:9px;padding:14px 13px 15px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line);min-width:0}

  background:var(--a1);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700}

.palcard .pv{font-size:13px;line-height:1.55;color:var(--ink-2)}
.palstorywrap{margin-top:6px}
.palstorywrap > summary{cursor:pointer;font-family:var(--sans);font-size:12px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3);padding:7px 0;list-style:none}
.palstorywrap > summary::-webkit-details-marker{display:none}
.palstorywrap > summary::before{content:"▸ "}
.palstorywrap[open] > summary::before{content:"▾ "}

@media (max-width:620px){ .optip{width:224px;font-size:12px} }

/* ---------- leader lines tie each pin to the mark it numbers ---------- */
.oleads{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.olead{stroke:var(--oc);stroke-width:.5;opacity:.55;vector-effect:non-scaling-stroke;
  stroke-dasharray:2 1.6}
.olead.hot{opacity:1;stroke-width:1.4;stroke-dasharray:none}
.oshape{transition:box-shadow .12s,opacity .12s}
.oshape.hot{box-shadow:0 0 0 2px var(--ground),0 0 0 4px var(--oc);opacity:1}

text x=\"560\" y=\"248\" font-size=\"14\">Ampulla of the ductus<\/text>\n<text x=\"560\" y=\"266\" font-size=\"14\">and seminal vesicle<\/text>\n<line x1=\"556\" y1=\"256\" x2=\"442\" y2=\"250\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"a1\" x=\"560\" y=\"316\" font-size=\"14\">Ejaculatory duct opens on<\/text>\n<text class=\"a1\" x=\"560\" y=\"334\" font-size=\"14\">the seminal colliculus<\/text>\n<line x1=\"556\" y1=\"324\" x2=\"348\" y2=\"304\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"b\" x=\"560\" y=\"388\" font-size=\"14\">Denonvilliers fascia<\/text>\n<line x1=\"556\" y1=\"384\" x2=\"446\" y2=\"330\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"560\" y=\"412\" font-size=\"14\">Pelvic floor<\/text>\n<line x1=\"556\" y1=\"408\" x2=\"430\" y2=\"364\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"560\" y=\"446\" font-size=\"14\">Rectum<\/text>\n<text class=\"cr\" x=\"500\" y=\"488\" font-size=\"14\">Digital rectal exam: finger<\/text>\n<text class=\"cr\" x=\"500\" y=\"506\" font-size=\"14\">feels the posterior prostate<\/text>\n<rect x=\"14\" y=\"520\" width=\"282\" height=\"116\" rx=\"10\" fill=\"var(--a1-soft)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"28\" y=\"544\" font-size=\"15\">Where the semen comes from<\/text>\n<text x=\"28\" y=\"568\" font-size=\"14\">Seminal vesicles: about 70%,<\/text>\n<text x=\"28\" y=\"586\" font-size=\"14\">fructose and clotting proteins<\/text>\n<text x=\"28\" y=\"610\" font-size=\"14\">Prostate: about 20%, PSA<\/text>\n<text x=\"28\" y=\"628\" font-size=\"14\">liquefies the clot<\/text>\n<rect x=\"308\" y=\"520\" width=\"282\" height=\"116\" rx=\"10\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"322\" y=\"544\" font-size=\"15\">Emission is sympathetic<\/text>\n<text x=\"322\" y=\"568\" font-size=\"14\">Hypogastric fibers contract the<\/text>\n<text x=\"322\" y=\"586\" font-size=\"14\">ductus, vesicles ize=\"14\">External urethral sphincter<\/text>\n<text x=\"630\" y=\"434\" font-size=\"14\">contracts to hold urine<\/text>\n<text class=\"cr\" x=\"620\" y=\"482\" font-size=\"14\">Trap: pelvic splanchnic nerves<\/text>\n<text class=\"cr\" x=\"620\" y=\"502\" font-size=\"14\">are parasympathetic<\/text>\n<\/svg>\n"}, "rp1_sagittal": {"cap": "In midline section the peritoneum dips twice: shallowly between bladder and uterus (vesicouterine pouch) and deeply between uterus and rectum (rectouterine pouch), which lies on the posterior fornix and is reached by culdocentesis. The retropubic space is extraperitoneal. The diagonal conjugate runs from the sacral promontory to the lower pubic symphysis, and a weak floor lets the bladder or rectum bulge into the vagina.", "svg": "<svg class=\"dia\" viewBox=\"0 0 900 560\" role=\"img\" aria-label=\"Female pelvis in midline section: the bladder behind the pubic symphysis with the retropubic space between them, the anteverted and anteflexed uterus, the vagina and its posterior fornix, the shallow vesicouterine pouch and the deep rectouterine pouch, the rectum on the sacrum, the levator ani sling and the diagonal conjugate\">\n<text class=\"ttl\" x=\"14\" y=\"24\" font-size=\"17\">Female pelvis in midline section: pouches, fornix and floor<\/text>\n<path d=\"M626 140 C 680 215, 684 330, 640 450\" fill=\"none\" stroke=\"var(--line-strong)\" stroke-width=\"18\" stroke-linecap=\"round\"/>\n<line x1=\"230\" y1=\"160\" x2=\"234\" y2=\"328\" stroke=\"var(--line-strong)\" stroke-width=\"3\"/>\n<ellipse cx=\"246\" cy=\"368\" rx=\"13\" ry=\"36\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"2\"/>\n<path d=\"M259 334 Q 266 364 259 402 L 270 402 Q 278 364 272 330 Z\" fill=\"var(--warn-soft)\" stroke=\"var(--warn)\" stroke-width=\"1\"/>\n<ellipse cx=\"318\" cy=\"352\" rx=\"42\" ry=\"32\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"2\"/>\n<path d=\"M590 150 C 612 230, 602 320, 556 392 L 522 455 L 542 510\ agonal conjugate<\/text>\n<text x=\"522\" y=\"240\" font-size=\"14\">Rectum<\/text>\n<text x=\"372\" y=\"470\" font-size=\"14\" text-anchor=\"end\">Vagina<\/text>\n<text x=\"472\" y=\"540\" font-size=\"14\" text-anchor=\"middle\">Perineal body<\/text>\n<text x=\"14\" y=\"204\" font-size=\"14\">Anteverted and<\/text>\n<text x=\"14\" y=\"222\" font-size=\"14\">anteflexed uterus<\/text>\n<line x1=\"150\" y1=\"214\" x2=\"352\" y2=\"242\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"14\" y=\"252\" font-size=\"14\">Vesicouterine pouch<\/text>\n<line x1=\"166\" y1=\"248\" x2=\"370\" y2=\"342\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"14\" y=\"316\" font-size=\"14\">Retropubic space<\/text>\n<line x1=\"146\" y1=\"312\" x2=\"262\" y2=\"352\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"14\" y=\"378\" font-size=\"14\">Pubic symphysis<\/text>\n<line x1=\"136\" y1=\"374\" x2=\"231\" y2=\"370\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"14\" y=\"430\" font-size=\"14\">Cystocele: bladder bulges<\/text>\n<text x=\"14\" y=\"448\" font-size=\"14\">into the anterior vaginal wall<\/text>\n<line x1=\"252\" y1=\"440\" x2=\"402\" y2=\"418\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"14\" y=\"498\" font-size=\"14\">Rectocele: rectum bulges<\/text>\n<text x=\"14\" y=\"516\" font-size=\"14\">into the posterior vaginal wall<\/text>\n<line x1=\"256\" y1=\"508\" x2=\"446\" y2=\"440\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"650\" y=\"132\" font-size=\"14\">Sacral promontory<\/text>\n<text x=\"700\" y=\"304\" font-size=\"14\">Sacrum<\/text>\n<text class=\"b\" x=\"700\" y=\"364\" font-size=\"14\">Rectouterine pouch<\/text>\n<text x=\"700\" y=\"382\" font-size=\"14\">(Douglas): lowest point<\/text>\n<line x1=\"696\" y1=\"370\" x2=\"522\" y2=\"378\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"cr\" x=\"700\" y=\"422\" font-size=\"14\">Culdocentesis needle<\/text>\n<text x=\"700\" y=\"440\" font-size=\"14\">via posterior fornix<\/text>\n<line x1=\"696\" y1=\"428\" x2=\"454\" y2=\"392\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"b\" x=\"700\" y=\"478\" font-size=\"14\">Levator ani:<\/text>\n<text x=\"700\" y=\"496\" font-size=\"14\">puborectalis sling<\/text>\n<line x1=\"696\" y1=\"484\" x2=\"571\" y2=\"472\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<\/svg>\n"}, "rp1_vessels": {"cap": "The ovarian vessels come from the aorta and run in the infundibulopelvic ligament; the left ovarian vein drains to the left renal vein and the right to the IVC. The uterine artery, from the anterior division of the internal iliac, runs over the cardinal ligament and crosses over the ureter about 2 cm lateral to the cervix. In men the ductus deferens is the bridge, and the seminal vesicle joins it at the ejaculatory duct.", "svg": "<svg class=\"dia\" viewBox=\"0 0 900 620\" role=\"img\" aria-label=\"Front view of the female pelvic vessels: ovarian arteries from the aorta and ovarian veins to the IVC on the right and the left renal vein on the left, both running in the infundibulopelvic ligaments; the uterine artery from the anterior division of the internal iliac crossing over the ureter beside the cervix above the cardinal ligament; and an inset showing the male ductus deferens crossing over the ureter\">\n<text class=\"ttl\" x=\"14\" y=\"24\" font-size=\"17\">Two bridges over the ureter: the uterine artery and the ductus deferens<\/text>\n<text class=\"s\" x=\"150\" y=\"56\" font-size=\"13\" text-anchor=\"middle\">Patient's right<\/text>\n<text class=\"s\" x=\"590\" y=\"56\" font-size=\"13\" text-anchor=\"middle\">Patient's left<\/text>\n<polygon points=\"336,402 347,434 248,446 248,400\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"1\"/>\n<polygon points=\"404,402 393,434 492,446 492,400\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"1\"/>\n<path d=\"M198 250 C 194 278, 204 300, 212 318\" fill=\"none\" stroke=\"v
