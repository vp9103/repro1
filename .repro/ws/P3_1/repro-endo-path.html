aorta<\/text>\n<line x1=\"596\" y1=\"136\" x2=\"454\" y2=\"164\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"a2\" x=\"600\" y=\"178\" font-size=\"14\">Left ovarian vein<\/text>\n<text class=\"a2\" x=\"600\" y=\"196\" font-size=\"14\">&#8594; left renal vein<\/text>\n<line x1=\"596\" y1=\"182\" x2=\"524\" y2=\"177\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"b\" x=\"600\" y=\"236\" font-size=\"14\">Infundibulopelvic ligament<\/text>\n<text x=\"600\" y=\"254\" font-size=\"14\">(suspensory): ovarian vessels<\/text>\n<line x1=\"596\" y1=\"240\" x2=\"553\" y2=\"272\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"cr\" x=\"600\" y=\"300\" font-size=\"14\">Internal iliac, anterior division<\/text>\n<line x1=\"596\" y1=\"296\" x2=\"486\" y2=\"326\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"b\" x=\"600\" y=\"346\" font-size=\"14\">Uterine artery over the ureter<\/text>\n<text class=\"wn\" x=\"600\" y=\"364\" font-size=\"14\">water under the bridge<\/text>\n<line x1=\"596\" y1=\"350\" x2=\"446\" y2=\"394\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"a2\" x=\"24\" y=\"150\" font-size=\"14\">Right ovarian vein &#8594; IVC<\/text>\n<line x1=\"214\" y1=\"146\" x2=\"304\" y2=\"168\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"wn\" x=\"24\" y=\"214\" font-size=\"14\">Ureter<\/text>\n<line x1=\"74\" y1=\"210\" x2=\"282\" y2=\"214\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"24\" y=\"350\" font-size=\"14\">Ovarian ligament<\/text>\n<line x1=\"152\" y1=\"346\" x2=\"282\" y2=\"337\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"24\" y=\"452\" font-size=\"14\">Round ligament<\/text>\n<text x=\"24\" y=\"470\" font-size=\"14\">to the inguinal canal<\/text>\n<line x1=\"90\" y1=\"438\" x2=\"126\" y2=\"407\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"b\" x=\"24\" y=\"508\" font-size=\"14\">Cardinal ligament:<\/text>\n<text x=\"24\" y=\"526\" font-size=\"14\">uterine vessels at its base<\/text>\n<line x1=\"172\" y1=\"504\" x2=\"262\" y2=\"438\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<rect x=\"600\" y=\"408\" width=\"286\" height=\"200\" rx=\"10\" fill=\"var(--surface)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"612\" y=\"430\" font-size=\"14\">Male: the ductus is the bridge<\/text>\n<ellipse cx=\"660\" cy=\"488\" rx=\"44\" ry=\"28\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"2\"/>\n<path d=\"M690 438 C 688 452, 686 462, 682 474\" fill=\"none\" stroke=\"var(--warn)\" stroke-width=\"4\"/>\n<path d=\"M748 450 C 720 446, 700 446, 688 456 C 676 468, 672 502, 674 526\" fill=\"none\" stroke=\"var(--surface)\" stroke-width=\"10\"/>\n<path d=\"M748 450 C 720 446, 700 446, 688 456 C 676 468, 672 502, 674 526\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"4\"/>\n<ellipse cx=\"702\" cy=\"530\" rx=\"24\" ry=\"8\" transform=\"rotate(-20 702 530)\" fill=\"var(--a1-soft)\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<line x1=\"674\" y1=\"526\" x2=\"660\" y2=\"556\" stroke=\"var(--a1)\" stroke-width=\"3\"/>\n<ellipse cx=\"656\" cy=\"568\" rx=\"30\" ry=\"17\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"2\"/>\n<line x1=\"656\" y1=\"552\" x2=\"656\" y2=\"592\" stroke=\"var(--ink-2)\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\n<text x=\"640\" y=\"493\" font-size=\"14\" text-anchor=\"middle\">Bladder<\/text>\n<text class=\"wn\" x=\"672\" y=\"452\" font-size=\"14\" text-anchor=\"end\">Ureter<\/text>\n<text class=\"a1\" x=\"752\" y=\"455\" font-size=\"14\">Ductus deferens<\/text>\n<text x=\"754\" y=\"532\" font-size=\"14\">Seminal vesicle<\/text>\n<line x1=\"750\" y1=\"528\" x2=\"727\" y2=\"526\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"754\" y=\"556\" font-size=\"14\">Ejaculatory duct<\/text>\n<line x1=\"750\" y1=\"552\" x2=\"669\" y2=\"542\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"754\" y=\"580\" font-size=\"14\">Prostate<\/text>\n<line x1=\"750\" y1=\"576\" x2=\"687\" y2=\"570\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"754\" y=\"600\" font-size=\"14\">Prostatic urethra<\/text>\n<line x1=\"750\" y1=\"596\" x2=\"659\" y2=\"586\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<\/svg>\n"}, "rp2_lymph": {"cap": "Lymph follows each organ's arteries. The gonads keep their aortic vessels and drain to para-aortic nodes; the uterus, cervix, upper vagina, prostate and bladder drain to iliac and obturator nodes; perineal skin and lining, including the scrotum, vulva, lower vagina and anal canal below the pectinate line, drain to superficial inguinal nodes; the glans drains to deep inguinal nodes.", "svg": "<svg class=\"dia\" viewBox=\"0 0 900 510\" role=\"img\" aria-label=\"Lymph drainage map: ovary and testis to para-aortic nodes; uterine body, cervix, upper vagina, prostate and bladder to iliac and obturator nodes; the uterine fundus along the round ligament, the lower vagina and vulva, the scrotum and penile shaft skin and the anal canal below the pectinate line to superficial inguinal nodes; the glans to deep inguinal nodes\">\n<text class=\"ttl\" x=\"14\" y=\"24\" font-size=\"17\">First lymph nodes for each pelvic and perineal structure<\/text>\n<path d=\"M330 72 L 600 92 M330 112 L 600 92\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"2.5\"/>\n<path d=\"M330 162 L 600 202 M330 202 L 600 202 M330 242 L 600 202\" fill=\"none\" stroke=\"var(--a2)\" stroke-width=\"2.5\"/>\n<path d=\"M330 302 L 600 362 M330 342 L 600 362 M330 382 L 600 362 M330 422 L 600 362\" fill=\"none\" stroke=\"var(--warn)\" stroke-width=\"2.5\"/>\n<path d=\"M330 472 L 600 472\" fill=\"none\" stroke=\"var(--crit)\" stroke-width=\"2.5\"/>\n<rect x=\"14\" y=\"58\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"77\" font-size=\"14\">Ovary<\/text>\n<rect x=\"14\" y=\"98\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"117\" font-size=\"14\">Testis<\/text>\n<rect x=\"14\" y=\"148\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"167\" font-size=\"14\">Uterine body and cervix<\/text>\n<rect x=\"14\" y=\"188\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"207\" font-size=\"14\">Upper vagina<\/text>\n<rect x=\"14\" y=\"228\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"247\" font-size=\"14\">Prostate and bladder<\/text>\n<rect x=\"14\" y=\"288\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--warn)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"307\" font-size=\"14\">Uterine fundus via round ligament<\/text>\n<rect x=\"14\" y=\"328\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--warn)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"347\" font-size=\"14\">Lower vagina and vulva<\/text>\n<rect x=\"14\" y=\"368\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--warn)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"387\" font-size=\"14\">Scrotum and penile shaft skin<\/text>\n<rect x=\"14\" y=\"408\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--warn)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"427\" font-size=\"14\">Anal canal below pectinate line<\/text>\n<rect x=\"14\" y=\"458\" width=\"316\" height=\"28\" rx=\"6\" fill=\"var(--surface)\" stroke=\"var(--crit)\" stroke-width=\"1.5\"/>\n<text x=\"28\" y=\"477\" font-size=\"14\">Glans penis or clitoris<\/text>\n<rect x=\"600\" y=\"58\" width=\"286\" height=\"68\" rx=\"8\" fill=\"var(--a1-soft)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"614\" y=\"84\" font-size=\"14\">Para-aortic (lumbar) nodes<\/text>\n<text x=\"614\" y=\"108\" font-size=\"14\">where the gonadal arteries start<\/text>\n<rect x=\"600\" y=\"148\" width=\"286\" height=\"108\" rx=\"8\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"614\" y=\"180\" font-size=\"14\">Iliac and obturator nodes<\/text>\n<text x=\"614\" y=\"204\" font-size=\"14\">internal and external iliac<\/text>\n<text x=\"614\" y=\"228\" font-size=\"14\">on the pelvic side wall<\/text>\n<rect x=\"600\" y=\"288\" width=\"286\" height=\"148\" rx=\"8\" fill=\"var(--warn-soft)\" stroke=\"var(--warn)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"614\" y=\"356\" font-size=\"14\">Superficial inguinal nodes<\/text>\n<text x=\"614\" y=\"380\" font-size=\"14\">below the inguinal ligament<\/text>\n<rect x=\"600\" y=\"452\" width=\"286\" height=\"42\" rx=\"8\" fill=\"var(--crit-soft)\" stroke=\"var(--crit)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"614\" y=\"478\" font-size=\"14\">Deep inguinal nodes<\/text>\n<text class=\"a1\" x=\"344\" y=\"140\" font-size=\"13\">gonads follow their vessels<\/text>\n<text class=\"wn\" x=\"344\" y=\"278\" font-size=\"13\">perineal skin drains to the groin<\/text>\n<\/svg>\n"}, "rp2_pectinate": {"cap": "Above the pectinate line the anal canal is hindgut endoderm: columnar lining, adenocarcinoma, painless internal hemorrhoids, superior rectal vessels to the portal system and internal iliac nodes. Below it is ectoderm: squamous lining, squamous cell carcinoma, painful external hemorrhoids, inferior rectal vessels and nerve, caval drainage and superficial inguinal nodes. The internal sphincter is smooth and involuntary; the external sphincter is skeletal and voluntary.", "svg": "<svg class=\"dia\" viewBox=\"0 0 900 520\" role=\"img\" aria-label=\"The anal canal in longitudinal section, divided by the pectinate line: above it endoderm with columnar epithelium, adenocarcinoma, painless internal hemorrhoids, the superior rectal artery and vein draining to the portal system, visceral nerves and internal iliac nodes; below it ectoderm with squamous epithelium, squamous cell carcinoma, painful external hemorrhoids, the inferior rectal artery, vein and nerve and superficial inguinal nodes; the internal and external anal sphincters are labeled\">\n<text class=\"ttl\" x=\"14\" y=\"24\" font-size=\"17\">The pectinate line splits the anal canal into two territories<\/text>\n<rect x=\"392\" y=\"56\" width=\"26\" height=\"206\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<rect x=\"482\" y=\"56\" width=\"26\" height=\"206\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<rect x=\"394\" y=\"292\" width=\"22\" height=\"182\" rx=\"4\" fill=\"var(--crit-soft)\" stroke=\"var(--crit)\" stroke-width=\"1.5\"/>\n<rect x=\"484\" y=\"292\" width=\"22\" height=\"182\" rx=\"4\" fill=\"var(--crit-soft)\" stroke=\"var(--crit)\" stroke-width=\"1.5\"/>\n<rect x=\"418\" y=\"232\" width=\"14\" height=\"206\" rx=\"4\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<rect x=\"468\" y=\"232\" width=\"14\" height=\"206\" rx=\"4\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<ellipse cx=\"438\" cy=\"214\" rx=\"8\" ry=\"15\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"2\"/>\n<ellipse cx=\"384\" cy=\"470\" rx=\"9\" ry=\"12\" fill=\"var(--crit-soft)\" stroke=\"var(--crit)\" stroke-width=\"2\"/>\n<line x1=\"360\" y1=\"262\" x2=\"540\" y2=\"262\" stroke=\"var(--ink)\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n<rect x=\"390\" y=\"250\" width=\"120\" height=\"24\" rx=\"12\" fill=\"var(--surface)\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"450\" y=\"267\" font-size=\"13\" text-anchor=\"middle\">Pectinate line<\/text>\n<text class=\"a2\" x=\"14\" y=\"70\" font-size=\"14\">Above the line: endoderm (hindgut)<\/text>\n<text x=\"14\" y=\"98\" font-size=\"14\">Simple columnar epithelium<\/text>\n<text x=\"14\" y=\"124\" font-size=\"14\">Adenocarcinoma<\/text>\n<text x=\"14\" y=\"150\" font-size=\"14\">Visceral nerves: stretch only, no sharp pain<\/text>\n<text class=\"b\" x=\"14\" y=\"214\" font-size=\"14\">Internal hemorrhoids: painless bleeding<\/text>\n<line x1=\"312\" y1=\"210\" x2=\"428\" y2=\"214\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"540\" y=\"98\" font-size=\"14\">Superior rectal artery (from IMA)<\/text>\n<text x=\"540\" y=\"124\" font-size=\"14\">Superior rectal vein &#8594; portal system<\/text>\n<text x=\"540\" y=\"150\" font-size=\"14\">Lymph &#8594; internal iliac nodes<\/text>\n<text class=\"cr\" x=\"14\" y=\"306\" font-size=\"14\">Below the line: ectoderm (proctodeum)<\/text>\n<text x=\"14\" y=\"334\" font-size=\"14\">Stratified squamous epithelium<\/text>\n<text x=\"14\" y=\"360\" font-size=\"14\">Squamous cell carcinoma<\/text>\n<text x=\"14\" y=\"386\" font-size=\"14\">Inferior rectal nerve: somatic pain<\/text>\n<text class=\"b\" x=\"14\" y=\"474\" font-size=\"14\">External hemorrhoids: painful<\/text>\n<line x1=\"228\" y1=\"470\" x2=\"374\" y2=\"470\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"540\" y=\"334\" font-size=\"14\">Inferior rectal artery (internal pudendal)<\/text>\n<text x=\"540\" y=\"360\" font-size=\"14\">Inferior rectal vein &#8594; caval system<\/text>\n<text x=\"540\" y=\"386\" font-size=\"14\">Lymph &#8594; superficial inguinal nodes<\/text>\n<text class=\"a2\" x=\"540\" y=\"214\" font-size=\"14\">Internal anal sphincter:<\/text>\n<text x=\"540\" y=\"232\" font-size=\"14\">smooth muscle, involuntary<\/text>\n<line x1=\"536\" y1=\"222\" x2=\"483\" y2=\"250\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"cr\" x=\"540\" y=\"448\" font-size=\"14\">External anal sphincter:<\/text>\n<text x=\"540\" y=\"466\" font-size=\"14\">skeletal, inferior rectal nerve<\/text>\n<line x1=\"536\" y1=\"456\" x2=\"507\" y2=\"440\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"s\" x=\"450\" y=\"500\" font-size=\"13\" text-anchor=\"middle\">anal verge<\/text>\n<text x=\"450\" y=\"92\" font-size=\"13\" text-anchor=\"middle\">Rectum<\/text>\n<\/svg>\n"}, "rp2_pouches": {"cap": "The perineal membrane spans the ischiopubic rami and divides the urogenital triangle: the deep pouch above holds the external urethral sphincter, membranous urethra and bulbourethral glands; the superficial pouch below holds the bulb, which continues as the corpus spongiosum, the crura and their muscles, and in women the Bartholin glands, whose ducts open at the posterolateral vaginal orifice. A spongy urethral tear spreads under Colles fascia to the scrotum, penis and abdominal wall, but not the thighs; a membranous tear leaks into the retropubic space.", "svg": "<svg class=\"dia\" viewBox=\"0 0 900 580\" role=\"img\" aria-label=\"Coronal section of the male urogenital triangle: the levator ani above, the deep perineal pouch with the external urethral sphincter, membranous urethra and bulbourethral glands, the perineal membrane between the ischiopubic rami, the superficial pouch with the bulb, crura, bulbospongiosus and ischiocavernosus, and Colles fascia below; two panels show where urine spreads after spongy and membranous urethral tears\">\n<text class=\"ttl\" x=\"14\" y=\"24\" font-size=\"17\">Urogenital triangle in coronal section: two pouches, one membrane, Colles fascia<\/text>\n<path d=\"M232 252 L 488 252 L 488 258 Q 482 336 360 340 Q 238 336 232 258 Z\" fill=\"var(--a1-soft)\" stroke=\"none\"/>\n<rect x=\"232\" y=\"190\" width=\"256\" height=\"60\" fill=\"var(--a2-soft)\" stroke=\"none\"/>\n<ellipse cx=\"360\" cy=\"92\" rx=\"60\" ry=\"36\" fill=\"var(--surface-2)\" stroke=\"var(--line-strong)\" stroke-width=\"2\"/>\n<ellipse cx=\"360\" cy=\"156\" rx=\"36\" ry=\"22\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"2\"/>\n<path d=\"M212 138 L 326 182 M508 138 L 394 182\" fill=\"none\" stroke=\"var(--warn)\" stroke-width=\"8\" stroke-linecap=\"round\"/>\n<line x1=\"360\" y1=\"178\" x2=\"360\" y2=\"292\" stroke=\"var(--ink-2)\" stroke-width=\"3\"/>\n<rect x=\"342\" y=\"196\" width=\"36\" height=\"48\" rx=\"8\" fill=\"none\" stroke=\"var(--a2)\" stroke-width=\"3.5\"/>\n<circle cx=\"326\" cy=\"236\" r=\"6\" fill=\"var(--surface)\" stroke=\"var(--a2)\" stroke-width=\"2\"/>\n<circle cx=\"394\" cy=\"236\" r=\"6\" fill=\"var(--surface)\" stroke=\"var(--a2)\" stroke-width=\"2\"/>\n<rect x=\"210\" y=\"236\" width=\"24\" height=\"30\" rx=\"6\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<rect x=\"486\" y=\"236\" width=\"24\" height=\"30\" rx=\"6\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<line x1=\"232\" y1=\"251\" x2=\"488\" y2=\"251\" stroke=\"var(--ink)\" stroke-width=\"4\"/>\n<ellipse cx=\"258\" cy=\"268\" rx=\"22\" ry=\"10\" fill=\"var(--surface)\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<ellipse cx=\"462\" cy=\"268\" rx=\"22\" ry=\"10\" fill=\"var(--surface)\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<ellipse cx=\"360\" cy=\"282\" rx=\"32\" ry=\"16\" fill=\"var(--surface)\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<circle cx=\"360\" cy=\"282\" r=\"4\" fill=\"var(--ink-2)\"/>\n<path d=\"M326 286 Q 360 318 394 286\" fill=\"none\" stroke=\"var(--crit)\" stroke-width=\"4\"/>\n<path d=\"M236 274 Q 258 292 280 274 M440 274 Q 462 292 484 274\" fill=\"none\" stroke=\"var(--crit)\" stroke-width=\"3\"/>\n<path d=\"M232 258 Q 238 336 360 340 Q 482 336 488 258\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"3\"/>\n<text x=\"360\" y=\"97\" font-size=\"14\" text-anchor=\"middle\">Bladder<\/text>\n<text x=\"360\" y=\"161\" font-size=\"14\" text-anchor=\"middle\">Prostate<\/text>\n<text class=\"wn\" x=\"14\" y=\"140\" font-size=\"14\">Levator ani<\/text>\n<line x1=\"98\" y1=\"136\" x2=\"228\" y2=\"146\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"a2\" x=\"14\" y=\"200\" font-size=\"14\">Deep perineal pouch<\/text>\n<line x1=\"160\" y1=\"196\" x2=\"240\" y2=\"206\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"14\" y=\"228\" font-size=\"14\">Ischiopubic ramus<\/text>\n<line x1=\"146\" y1=\"226\" x2=\"210\" y2=\"244\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"b\" x=\"14\" y=\"258\" font-size=\"14\">Perineal membrane<\/text>\n<line x1=\"152\" y1=\"254\" x2=\"232\" y2=\"251\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"a1\" x=\"14\" y=\"298\" font-size=\"14\">Superficial perineal pouch<\/text>\n<text x=\"14\" y=\"316\" font-size=\"14\">Bartholin glands in women<\/text>\n<line x1=\"208\" y1=\"294\" x2=\"300\" y2=\"300\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"a1\" x=\"14\" y=\"342\" font-size=\"14\">Colles fascia<\/text>\n<line x1=\"112\" y1=\"338\" x2=\"270\" y2=\"330\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"576\" y=\"178\" font-size=\"14\">Membranous urethra<\/text>\n<line x1=\"572\" y1=\"174\" x2=\"364\" y2=\"188\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"a2\" x=\"576\" y=\"208\" font-size=\"14\">External urethral sphincter<\/text>\n<line x1=\"572\" y1=\"204\" x2=\"380\" y2=\"214\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"576\" y=\"230\" font-size=\"14\">Bulbourethral glands<\/text>\n<line x1=\"572\" y1=\"226\" x2=\"401\" y2=\"235\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"576\" y=\"280\" font-size=\"14\">Crus and ischiocavernosus<\/text>\n<line x1=\"572\" y1=\"276\" x2=\"485\" y2=\"272\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"576\" y=\"304\" font-size=\"14\">Bulb with spongy urethra<\/text>\n<line x1=\"572\" y1=\"300\" x2=\"392\" y2=\"284\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"cr\" x=\"576\" y=\"330\" font-size=\"14\">Bulbospongiosus<\/text>\n<line x1=\"572\" y1=\"326\" x2=\"384\" y2=\"300\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<rect x=\"14\" y=\"372\" width=\"430\" height=\"196\" rx=\"10\" fill=\"var(--crit-soft)\" stroke=\"var(--crit)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"28\" y=\"398\" font-size=\"14\">Spongy urethra torn below the membrane<\/text>\n<text x=\"28\" y=\"424\" font-size=\"14\">Straddle injury: urine fills the superficial pouch<\/text>\n<text x=\"28\" y=\"448\" font-size=\"14\">Colles fascia steers it into the scrotum, penis<\/text>\n<text x=\"28\" y=\"472\" font-size=\"14\">and up the abdominal wall under Scarpa fascia<\/text>\n<text class=\"cr\" x=\"28\" y=\"500\" font-size=\"14\">Not the thighs: fused to the fascia lata<\/text>\n<text class=\"cr\" x=\"28\" y=\"524\" font-size=\"14\">Not the anal triangle: fused to the membrane<\/text>\n<rect x=\"456\" y=\"372\" width=\"430\" height=\"196\" rx=\"10\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"470\" y=\"398\" font-size=\"14\">Membranous urethra torn above the membrane<\/text>\n<text x=\"470\" y=\"424\" font-size=\"14\">Pelvic fracture: urine enters the deep pouch<\/text>\n<text x=\"470\" y=\"448\" font-size=\"14\">and rises into the retropubic space<\/text>\n<text x=\"470\" y=\"472\" font-size=\"14\">Scrotum and penis usually stay dry<\/text>\n<text class=\"a2\" x=\"470\" y=\"500\" font-size=\"14\">High-riding prostate, blood at the meatus<\/text>\n<text class=\"a2\" x=\"470\" y=\"524\" font-size=\"14\">Retrograde urethrogram before a catheter<\/text>\n<\/svg>\n"}, "rp2_pudendal": {"cap": "The pudendal nerve (S2 to S4) leaves the pelvis below the piriformis, hooks around the ischial spine, where a pudendal block is placed, and runs in the pudendal canal to give inferior rectal, perineal and dorsal branches. Erection is parasympathetic, emission sympathetic and ejaculation somatic: point, squeeze, shoot. Sympathetic damage leaves the internal sphincter open, so semen flows back into the bladder.", "svg": "<svg class=\"dia\" viewBox=\"0 0 900 540\" role=\"img\" aria-label=\"The pudendal nerve's path from the S2 to S4 ventral rami through the greater sciatic foramen below the piriformis, around the ischial spine where a pudendal block is placed, back through the lesser sciatic foramen into the pudendal canal, and its three branches: inferior rectal, perineal and dorsal nerve of the penis or clitoris; beside it the autonomic and somatic steps of male sexual function: point, squeeze, shoot\">\n<text class=\"ttl\" x=\"14\" y=\"24\" font-size=\"17\">The pudendal nerve: path, landmark and branches, and who runs sex function<\/text>\n<rect x=\"30\" y=\"44\" width=\"510\" height=\"32\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"44\" y=\"65\" font-size=\"14\">S2&#8211;S4 ventral rami of the sacral plexus<\/text>\n<rect x=\"30\" y=\"94\" width=\"510\" height=\"32\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<text x=\"44\" y=\"115\" font-size=\"14\">Leaves via the greater sciatic foramen, below piriformis<\/text>\n<rect x=\"30\" y=\"144\" width=\"510\" height=\"54\" rx=\"8\" fill=\"var(--warn-soft)\" stroke=\"var(--warn)\" stroke-width=\"2\"/>\n<text class=\"b\" x=\"44\" y=\"166\" font-size=\"14\">Hooks around the ischial spine (sacrospinous lig.)<\/text>\n<text class=\"wn\" x=\"44\" y=\"188\" font-size=\"14\">Pudendal block: inject here, felt through the vagina<\/text>\n<rect x=\"30\" y=\"216\" width=\"510\" height=\"32\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<text x=\"44\" y=\"237\" font-size=\"14\">Re-enters the perineum via the lesser sciatic foramen<\/text>\n<rect x=\"30\" y=\"266\" width=\"510\" height=\"32\" rx=\"8\" fill=\"var(--surface)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<text x=\"44\" y=\"287\" font-size=\"14\">Runs in the pudendal (Alcock) canal, ischioanal fossa<\/text>\n<path d=\"M285 76 L 285 94 M285 126 L 285 144 M285 198 L 285 216 M285 248 L 285 266\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2.5\"/>\n<path d=\"M285 298 L 111 334 M285 298 L 285 334 M285 298 L 457 334\" fill=\"none\" stroke=\"var(--ink-3)\" stroke-width=\"2.5\"/>\n<rect x=\"30\" y=\"334\" width=\"163\" height=\"132\" rx=\"8\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"42\" y=\"356\" font-size=\"14\">Inferior rectal<\/text>\n<text x=\"42\" y=\"380\" font-size=\"13\">External anal<\/text>\n<text x=\"42\" y=\"398\" font-size=\"13\">sphincter and<\/text>\n<text x=\"42\" y=\"416\" font-size=\"13\">perianal skin,<\/text>\n<text x=\"42\" y=\"434\" font-size=\"13\">canal below the<\/text>\n<text x=\"42\" y=\"452\" font-size=\"13\">pectinate line<\/text>\n<rect x=\"203\" y=\"334\" width=\"163\" height=\"132\" rx=\"8\" fill=\"var(--a1-soft)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"215\" y=\"356\" font-size=\"14\">Perineal<\/text>\n<text x=\"215\" y=\"380\" font-size=\"13\">Deep: external<\/text>\n<text x=\"215\" y=\"398\" font-size=\"13\">urethral sphincter,<\/text>\n<text x=\"215\" y=\"416\" font-size=\"13\">perineal muscles<\/text>\n<text x=\"215\" y=\"434\" font-size=\"13\">Superficial: labial<\/text>\n<text x=\"215\" y=\"452\" font-size=\"13\">or scrotal skin<\/text>\n<rect x=\"376\" y=\"334\" width=\"163\" height=\"132\" rx=\"8\" fill=\"var(--surface-2)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"388\" y=\"356\" font-size=\"14\">Dorsal nerve<\/text>\n<text x=\"388\" y=\"380\" font-size=\"13\">of the penis or<\/text>\n<text x=\"388\" y=\"398\" font-size=\"13\">clitoris: skin<\/text>\n<text x=\"388\" y=\"416\" font-size=\"13\">and glans<\/text>\n<text x=\"388\" y=\"434\" font-size=\"13\">sensation<\/text>\n<text class=\"cr\" x=\"30\" y=\"496\" font-size=\"14\">Anterior scrotum or labia: ilioinguinal nerve (L1),<\/text>\n<text class=\"cr\" x=\"30\" y=\"516\" font-size=\"14\">so a pudendal block leaves the front sensitive<\/text>\n<rect x=\"560\" y=\"44\" width=\"326\" height=\"482\" rx=\"10\" fill=\"var(--surface)\" stroke=\"var(--line)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"574\" y=\"70\" font-size=\"15\">Point, squeeze, shoot<\/text>\n<rect x=\"572\" y=\"84\" width=\"302\" height=\"106\" rx=\"8\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"584\" y=\"106\" font-size=\"14\">Point: erection<\/text>\n<text class=\"a2\" x=\"584\" y=\"128\" font-size=\"14\">Parasympathetic<\/text>\n<text x=\"584\" y=\"150\" font-size=\"14\">Pelvic splanchnic nerves (S2&#8211;S4)<\/text>\n<text x=\"584\" y=\"172\" font-size=\"14\">Nitric oxide dilates penile arteries<\/text>\n<rect x=\"572\" y=\"200\" width=\"302\" height=\"106\" rx=\"8\" fill=\"var(--a1-soft)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"584\" y=\"222\" font-size=\"14\">Squeeze: emission<\/text>\n<text class=\"a1\" x=\"584\" y=\"244\" font-size=\"14\">Sympathetic (L1&#8211;L2)<\/text>\n<text x=\"584\" y=\"266\" font-size=\"14\">Hypogastric nerves<\/text>\n<text x=\"584\" y=\"288\" font-size=\"14\">Ductus, vesicles, prostate contract<\/text>\n<rect x=\"572\" y=\"316\" width=\"302\" height=\"106\" rx=\"8\" fill=\"var(--warn-soft)\" stroke=\"var(--warn)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"584\" y=\"338\" font-size=\"14\">Shoot: ejaculation<\/text>\n<text class=\"wn\" x=\"584\" y=\"360\" font-size=\"14\">Somatic: pudendal nerve<\/text>\n<text x=\"584\" y=\"382\" font-size=\"14\">Bulbospongiosus contracts<\/text>\n<text x=\"584\" y=\"404\" font-size=\"14\">Internal sphincter stays shut<\/text>\n<text x=\"574\" y=\"452\" font-size=\"14\">Sympathetic damage: semen goes<\/text>\n<text x=\"574\" y=\"472\" font-size=\"14\">back into the bladder (retrograde<\/text>\n<text x=\"574\" y=\"492\" font-size=\"14\">ejaculation) because the internal<\/text>\n<text x=\"574\" y=\"512\" font-size=\"14\">urethral sphincter stays open<\/text>\n<\/svg>\n"}, "rp2_vulva": {"cap": "The labia minora enclose the vestibule, which holds the external urethral orifice, the vaginal orifice rimmed by the hymen and, at 4 and 8 o'clock, the Bartholin duct openings, with the vestibular bulbs deep to the labia. The male urethra has prostatic, membranous and spongy parts: the membranous part is the narrowest, and the spongy part dilates in the bulb and again in the glans as the navicular fossa. The bulb and the two crura form the root of the penis.", "svg": "<svg class=\"dia\" viewBox=\"0 0 900 640\" role=\"img\" aria-label=\"Top: the vulva seen from below, with the mons pubis, labia majora and minora, clitoris, external urethral orifice, vaginal orifice rimmed by the hymen, Bartholin duct openings at 4 and 8 o'clock, vestibular bulbs, perineal body and anus. Bottom: the male urethra in three parts, prostatic, membranous and spongy, with the bulb of the penis, the navicular fossa in the glans, the prepuce and the erectile bodies\">\n<text class=\"ttl\" x=\"14\" y=\"24\" font-size=\"17\">External genitalia: the vulva, and the male urethra with its erectile bodies<\/text>\n<rect x=\"14\" y=\"38\" width=\"872\" height=\"300\" rx=\"10\" fill=\"var(--surface)\" stroke=\"var(--line)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"28\" y=\"62\" font-size=\"15\">Vulva seen from below<\/text>\n<ellipse cx=\"450\" cy=\"84\" rx=\"62\" ry=\"20\" fill=\"var(--surface-2)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<ellipse cx=\"386\" cy=\"204\" rx=\"30\" ry=\"98\" fill=\"var(--surface-2)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<ellipse cx=\"514\" cy=\"204\" rx=\"30\" ry=\"98\" fill=\"var(--surface-2)\" stroke=\"var(--line-strong)\" stroke-width=\"1.5\"/>\n<ellipse cx=\"418\" cy=\"206\" rx=\"14\" ry=\"70\" fill=\"var(--a1-soft)\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<ellipse cx=\"482\" cy=\"206\" rx=\"14\" ry=\"70\" fill=\"var(--a1-soft)\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<ellipse cx=\"450\" cy=\"206\" rx=\"18\" ry=\"62\" fill=\"var(--surface)\" stroke=\"var(--line)\" stroke-width=\"1.5\"/>\n<ellipse cx=\"428\" cy=\"196\" rx=\"6\" ry=\"40\" a (2 cm)<\/text>\n<text x=\"100\" y=\"540\" font-size=\"14\">narrowest; crosses the perineal<\/text>\n<text x=\"100\" y=\"558\" font-size=\"14\">membrane (dashed); torn in pelvic fracture<\/text>\n<line x1=\"224\" y1=\"508\" x2=\"224\" y2=\"478\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text class=\"b\" x=\"440\" y=\"522\" font-size=\"14\">Bulb of the penis<\/text>\n<text x=\"440\" y=\"540\" font-size=\"14\">dilated urethra inside it<\/text>\n<line x1=\"436\" y1=\"518\" x2=\"300\" y2=\"480\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"520\" y=\"474\" font-size=\"13\">Corpora cavernosa (erection)<\/text>\n<text class=\"b\" x=\"690\" y=\"522\" font-size=\"14\">Navicular fossa<\/text>\n<text x=\"690\" y=\"540\" font-size=\"14\">dilation in the glans<\/text>\n<line x1=\"740\" y1=\"508\" x2=\"792\" y2=\"466\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"610\" y=\"398\" font-size=\"14\">Prepuce (foreskin) covers the glans<\/text>\n<line x1=\"780\" y1=\"404\" x2=\"788\" y2=\"424\" stroke=\"var(--ink-3)\" stroke-width=\"1\"/>\n<text x=\"28\" y=\"590\" font-size=\"14\">Root of the penis, in the superficial pouch: the bulb (continues as the corpus spongiosum) and two crura (the corpora cavernosa).<\/text>\n<text x=\"28\" y=\"610\" font-size=\"14\">Female equivalents: vestibular bulbs and clitoral crura.<\/text>\n<\/svg>\n"}, "rp3_axilla": {"cap": "Most breast lymph runs laterally to the axillary nodes, which are named by their relation to pectoralis minor, and the first node it reaches is the sentinel node; the medial quadrants also drain to internal mammary nodes beside the sternum. Node surgery puts three nerves at risk, and each injury has one signature: winged scapula, weak adduction and extension, or a numb medial arm.", "svg": "<svg class=\"dia\" viewBox=\"0 0 900 560\" role=\"img\" aria-label=\"Left breast seen from the front: lateral lymph flows to axillary nodes at levels I, II and III around pectoralis minor, with the sentinel node first
