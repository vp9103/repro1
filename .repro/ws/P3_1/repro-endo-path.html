fill=\"var(--warn-soft)\" stroke=\"var(--warn)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"614\" y=\"102\" font-size=\"15\">Long thoracic nerve<\/text>\n<text x=\"614\" y=\"127\" font-size=\"14\">Runs down the medial wall<\/text>\n<text x=\"614\" y=\"146\" font-size=\"14\">on serratus anterior<\/text>\n<text x=\"614\" y=\"174\" font-size=\"14\"><tspan class=\"b\">Injury:<\/tspan> winged scapula<\/text>\n<rect x=\"600\" y=\"204\" width=\"286\" height=\"116\" rx=\"10\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"614\" y=\"230\" font-size=\"15\">Thoracodorsal nerve<\/text>\n<text x=\"614\" y=\"255\" font-size=\"14\">Runs along the posterior wall<\/text>\n<text x=\"614\" y=\"274\" font-size=\"14\">to latissimus dorsi<\/text>\n<text x=\"614\" y=\"302\" font-size=\"14\"><tspan class=\"b\">Injury:<\/tspan> weak adduction, extension<\/text>\n<rect x=\"600\" y=\"332\" width=\"286\" height=\"116\" rx=\"10\" fill=\"var(--a1-soft)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/>\n<text class=\"b\" x=\"614\" y=\"358\" font-size=\"15\">Intercostobrachial nerve<\/text>\n<text x=\"614\" y=\"383\" font-size=\"14\">Sensory branch of T2 crossing<\/text>\n<text x=\"614\" y=\"402\" font-size=\"14\">the axilla to the medial arm<\/text>\n<text x=\"614\" y=\"430\" font-size=\"14\"><tspan class=\"b\">Injury:<\/tspan> numb medial upper arm<\/text>\n<text x=\"600\" y=\"476\" font-size=\"14\">Skin: intercostal nerves T4 to T6<\/text>\n<\/svg>\n"}, "rp3_section": {"cap": "The gland hangs from the skin by Cooper ligaments and rests on the pectoral fascia, separated from it by the loose retromammary space. Ducts from each lobule widen into a lactiferous sinus and open on the nipple. That layering explains two exam signs: tumor that shortens Cooper ligaments dimples the skin, and tumor that crosses the retromammary space fixes the mass to the chest wall.", "svg": "<svg class=\"dia\" viewBox=\"0 0 900 600\" role=\"img\" aria-label=\"Section through the breast: lobules and lactiferous ducts converge on the nipple, Cooper ligaments run from the skin to the pectoral fascia, and the retromammary space separates the gland from pectoralis major and the ribs\">\n<text class=\"ttl\" x=\"14\" y=\"24\" font-size=\"17\">From skin to chest wall: a section through the breast<\/text>\n<rect x=\"14\" y=\"392\" width=\"872\" height=\"26\" fill=\"var(--surface-2)\" stroke=\"var(--line-strong)\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/>\n<line x1=\"14\" y1=\"420\" x2=\"886\" y2=\"420\" stroke=\"var(--ink)\" stroke-width=\"3\"/>\n<rect x=\"14\" y=\"422\" width=\"872\" height=\"50\" fill=\"var(--a1-soft)\" stroke=\"var(--a1)\" stroke-width=\"1.5\"/>\n<rect x=\"14\" y=\"474\" width=\"872\" height=\"52\" fill=\"var(--surface-3)\" stroke=\"var(--line-strong)\" stroke-width=\"1.2\"/>\n<ellipse cx=\"430\" cy=\"500\" rx=\"42\" ry=\"16\" fill=\"var(--surface)\" stroke=\"var(--ink-3)\" stroke-width=\"1.5\"/>\n<ellipse cx=\"570\" cy=\"500\" rx=\"42\" ry=\"16\" fill=\"var(--surface)\" stroke=\"var(--ink-3)\" stroke-width=\"1.5\"/>\n<ellipse cx=\"710\" cy=\"500\" rx=\"42\" ry=\"16\" fill=\"var(--surface)\" stroke=\"var(--ink-3)\" stroke-width=\"1.5\"/>\n<ellipse cx=\"840\" cy=\"500\" rx=\"36\" ry=\"16\" fill=\"var(--surface)\" stroke=\"var(--ink-3)\" stroke-width=\"1.5\"/>\n<path d=\"M180 392 C 190 250, 290 140, 382 128 L 386 108 Q 400 100 414 108 L 418 128 C 510 140, 610 250, 620 392 Z\" fill=\"var(--warn-soft)\" stroke=\"var(--ink)\" stroke-width=\"2\"/>\n<path d=\"M354 134.5 Q 368 130 382 128\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"5\"/>\n<path d=\"M418 128 Q 432 130 446 134.5\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"5\"/>\n<circle cx=\"362\" cy=\"129\" r=\"4\" fill=\"var(--a1)\"/>\n<circle cx=\"438\" cy=\"129\" r=\"4\" fill=\"var(--a1)\"/>\n<path d=\"M250 211 C 258 280, 256 340, 248 392\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<path d=\"M313 154 C 330 240, 336 320, 330 392\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<path d=\"M487 154 C 470 240, 464 320, 470 392\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<path d=\"M550 211 C 542 280, 544 340, 552 392\" fill=\"none\" stroke=\"var(--a1)\" stroke-width=\"2\"/>\n<path d=\"M298 288 C 320 220, 372 180, 392 112\" fill=\"none\" stroke=\"var(--a2)\" stroke-width=\"2.5\"/>\n<path d=\"M400 252 L 400 112\" fill=\"none\" stroke=\"var(--a2)\" stroke-width=\"2.5\"/>\n<path d=\"M502 288 C 480 220, 428 180, 408 112\" fill=\"none\" stroke=\"var(--a2)\" stroke-width=\"2.5\"/>\n<path d=\"M232 344 C 250 320, 270 300, 290 296\" fill=\"none\" stroke=\"var(--a2)\" stroke-width=\"2\"/>\n<path d=\"M568 344 C 550 320, 530 300, 510 296\" fill=\"none\" stroke=\"var(--a2)\" stroke-width=\"2\"/>\n<ellipse cx=\"400\" cy=\"170\" rx=\"8\" ry=\"16\" fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"2\"/>\n<g fill=\"var(--a2-soft)\" stroke=\"var(--a2)\" stroke-width=\"1.5\">\n<circle cx=\"281\" cy=\"294\" r=\"7\"/><circle cx=\"296\" cy=\"291\" r=\"7\"/><circle cx=\"300\" cy=\"305\" r=\"7\"/><circle cx=\"288\" cy=\"311\" r=\"7\"/><circle cx=\"278\" cy=\"307\" r=\"7\"/>\n<circle cx=\"391\" cy=\"256\" r=\"7\"/><circle cx=\"406\" cy=\"253\" r=\"7\"/><circle cx=\"410\" cy=\"267\" r=\"7\"/><circle cx=\"398\" cy=\"273\" r=\"7\"/><circle cx=\"388\" cy=\"269\" r=\"7\"/>\n<circle cx=\"519\" cy=\"294\" r=\"7\"/><circle cx=\"504\" cy=\"291\" r=\"7\"/><circle cx=\"500\" cy=\"305\" r=\"7\"/><circle cx=\"512\" cy=\"311\" r=\"7\"/><circle cx=\"522\" cy=\"307\" r=\"7\"/>\n<circle cx=\"217\" cy=\"346\" r=\"7\"/><circle cx=\"232\" cy=\"343\" r=\"7\"/><circle cx=\"236\" cy=\"357\" r=\"7\"/><circle cx=\"224\" cy=\"363\" r=\"7\"/><circle cx=\"214\" cy=\"359\" r=\"7\"/>\n<circle cx=\"583\" cy=\"346\" r=\"7\"/><circle cx=\"568\" cy=\"343\" r=\"7\"/><circle cx=\"564\" cy=\"357\" r=\"7\"/><circle cx=\"576\" cy=\"363\" r=\"7\"/><circle cx=\"586\" cy=\"359\" r=\"7\"/>\n<\/g>\n<g stroke=\"var(--ink-3)\" stroke-width=\"1.2\" fill=\"none\">\n<line x1=\"448\" y1=\"90\" x2=\"415\" y2=\"106\"/>\n<line x1=\"515\" y1=\"127\" x2=\"447\" y2=\"134\"/>\n<line x1=\"555\" y1=\"171\" x2=\"409\" y2=\"169\"/>\n<line x1=\"595\" y1=\"219\" x2=\"477\" y2=\"233\"/>\n<line x1=\"635\" y1=\"271\" x2=\"528\" y2=\"296\"/>\n<line x1=\"635\" y1=\"331\" x2=\"547\" y2=\"326\"/>\n<line x1=\"635\" y1=\"367\" x2=\"602\" y2=\"376\"/>\n<line x1=\"226\" y1=\"199\" x2=\"256\" y2=\"207\"/>\n<line x1=\"70\" y1=\"378\" x2=\"70\" y2=\"419\"/>\n<\/g>\n<text x=\"452\" y=\"94\" font-size=\"15\">Nipple<\/text>\n<text x=\"520\" y=\"132\" font-size=\"15\">Areola and Montgomery tubercles<\/text>\n<text x=\"560\" y=\"176\" font-size=\"15\">Lactiferous sinus (ampulla)<\/text>\n<text x=\"600\" y=\"224\" font-size=\"15\">Lactiferous duct<\/text>\n<text x=\"640\" y=\"272\" font-size=\"15\">Lobule (terminal duct<\/text>\n<text x=\"640\" y=\"290\" font-size=\"15\">lobular unit, TDLU)<\/text>\n<text x=\"640\" y=\"336\" font-size=\"15\">Cooper (suspensory) ligament<\/text>\n<text x=\"640\" y=\"372\" font-size=\"15\">Subcutaneous fat<\/text>\n<text x=\"190\" y=\"204\" font-size=\"15\">Skin<\/text>\n<text x=\"20\" y=\"372\" font-size=\"15\">Pectoral fascia<\/text>\n<text x=\"650\" y=\"410\" font-size=\"14\">Retromammary space<\/text>\n<text class=\"b\" x=\"24\" y=\"452\" font-size=\"15\">Pectoralis major<\/text>\n<text x=\"24\" y=\"505\" font-size=\"15\">Ribs and intercostal muscles<\/text>\n<text x=\"14\" y=\"558\" font-size=\"15\"><tspan class=\"b\">Dimpling:<\/tspan> tumor shortening a Cooper ligament pulls the skin inward<\/text>\n<text x=\"14\" y=\"586\" font-size=\"15\"><tspan class=\"b\">Fixation:<\/tspan> tumor crossing the retromammary space anchors the mass<\/text>\n<\/svg>\n", "teach": "Read the figure from the bottom up. Ribs and pectoralis major form the chest wall; the pectoral fascia covers the muscle; the retromammary space is the gliding plane; the gland and its fat sit in the subcutaneous tissue under the skin. Each labeled layer is a plane a carcinoma can reach, and each gives a different exam sign."}};
const BLOCKS = [{"id": "rpanat", "n": "Reproductive anatomy", "wk": "", "topics": [{"id": "rp1", "t": "The pelvis, pelvic floor and pelvic viscera", "sub": "A bony basin closed by a muscular floor, draped in peritoneum, and crossed by vessels, ureters and nerves that surgeons must keep apart.", "yld": "mid", "exam": "mid", "mins": 15, "pretest": [{"q": "Through which part of the vagina can a needle reach the lowest point of the female peritoneal cavity?", "o": ["Posterior fornix", "Anterior fornix", "Lateral fornix", "Vaginal vestibule"], "a": 0, "why": "The posterior fornix lies directly against the rectouterine pouch of Douglas, the most dependent recess of the peritoneal cavity when a woman is upright, so blood or pus collecting there can be aspirated through the vaginal wall.", "w": {"Anterior fornix": "The anterior fornix faces the bladder and the shallow vesicouterine pouch, so a needle there risks the bladder and misses dependent fluid.", "Lateral fornix": "The lateral fornix sits beside the cervix, close to the uterine artery and the ureter, which makes it a dangerous and unhelpful puncture site.", "Vaginal vestibule": "The vestibule is the space between the labia minora at the vaginal opening, far below the peritoneum, so no pouch can be reached from it."}}, {"q": "Which vessel runs on the cardinal ligament and crosses over the ureter beside the cervix?", "o": ["Uterine artery", "Ovarian artery", "Internal pudendal artery", "Superior vesical artery"], "a": 0, "why": "The uterine artery leaves the anterior division of the internal iliac, runs medially at the base of the broad ligament on the cardinal ligament, and passes over the ureter about 2 cm lateral to the cervix: water under the bridge.", "w": {"Ovarian artery": "The ovarian artery arises from the abdominal aorta and reaches the ovary through the infundibulopelvic ligament, well above the cervix.", "Internal pudendal artery": "The internal pudendal artery leaves the pelvis below the piriformis and hooks around the ischial spine to supply the perineum, not the uterus.", "Superior vesical artery": "The superior vesical artery comes from the patent part of the umbilical artery and supplies the bladder dome, not the cervix."}}], "body": [["h", "Where does the pelvis end and the perineum begin?"], ["p", "The bony pelvis is a ring of two hip bones and the sacrum, and each hip bone is an ilium, **ischium** and pubis fused at the acetabulum. The ring is joined at the **sacroiliac** joints and the pubic symphysis. The sacrospinous ligament (sacrum to ischial spine) and sacrotuberous ligament (sacrum to ischial tuberosity) turn the sciatic notches into the greater and lesser sciatic foramina. The pelvic brim, from the sacral promontory to the top of the pubic symphysis, separates the **false pelvis** above, which holds abdominal organs, from the **true pelvis** below, the bony birth canal. Its lower opening, the pelvic outlet, is closed by the pelvic diaphragm, and the diamond-shaped perineum lies beneath."], ["p", "Obstetric room is judged at three levels. At the inlet, the {{rp1_conjugate|diagonal conjugate}} runs from the sacral promontory to the lower edge of the pubic symphysis, the one inlet distance a finger can reach; subtracting 1.5 to 2 cm gives the **obstetric conjugate**, the true narrowest inlet distance, which should be at least about 10 cm. In the midpelvis, the interspinous distance between the ischial spines is usually the tightest diameter. At the outlet, the intertuberous distance and the subpubic arch matter. A round **gynecoid** pelvis with an arch wider than 90 degrees favors vaginal birth; the narrow, heart-shaped male-type (android) pelvis does not."], ["h", "What holds the pelvic organs up?"], ["p", "Two muscles line the walls and leave for the hip: obturator internus on the side wall, which leaves through the lesser sciatic foramen, and piriformis on the back wall. The floor is the pelvic diaphragm, a funnel made of the **levator ani** and the smaller **coccygeus**. Levator ani has three parts: pubococcygeus, the main mass around the urethra and vagina; puborectalis, a sling that pulls the anorectal junction forward; and the thin iliococcygeus behind."], ["p", "The floor's job is **continence** and support. Pubococcygeus holds the urethra and bladder neck steady against a cough, so a tear causes urinary incontinence, and the puborectalis sling kinks the anorectal junction to hold stool in. The **nerve to levator ani** (chiefly S4, with S3 and S5) supplies the floor, and the pudendal nerve supplies the external sphincters. Floor tone holds the organs up against straining; the floor relaxes for defecation and birth."], ["p", "Fascia completes the support. Parietal fascia lines the walls, as the obturator fascia does over obturator internus, visceral fascia wraps each organ, and the {{rp1_endopelvic|endopelvic fascia}} between them condenses into supports. The **cardinal ligament** (transverse cervical ligament) runs from the cervix to the side wall and the uterosacral ligament back to the sacrum; together they suspend the cervix and upper vagina. Pubocervical fascia props the bladder against the anterior vaginal wall, and the rectovaginal septum separates rectum from posterior wall. The broad and round ligaments give almost no support. Childbirth stretches these supports and the levator ani, and estrogen loss after menopause weakens them, so **prolapse** appears years later. The bulging wall names the organ: a **cystocele** pushes the bladder into the anterior vaginal wall, a rectocele the rectum into the posterior wall, and apical failure drops the uterus or vaginal vault."], ["h", "How does the peritoneum drape the pelvic organs?"], ["p", "Peritoneum drapes over the pelvic organs like a sheet dropped from above, so it dips wherever two organs meet. In women it passes from the bladder onto the uterus, forming the shallow **vesicouterine** pouch, then over the fundus and down onto the posterior fornix of the vagina before rising onto the rectum. That deep fold is the {{rp1_douglas|rectouterine pouch}} of Douglas, the lowest point of the peritoneal cavity in an upright woman. Men have one **rectovesical** pouch and a closed cavity; the female cavity opens through the tubes. Below the peritoneum, a suprapubic catheter crosses the **retropubic** space in front of the bladder without entering the peritoneal cavity, and the retrorectal space between rectum and sacrum holds presacral veins that a surgeon follows to free the rectum."], ["f", "rp1_sagittal"], ["h", "How are the female pelvic organs arranged?"], ["p", "The uterus is a pear-shaped muscular organ 7 to 8 cm long, with a fundus, body, isthmus and cervix. It usually lies **anteverted**, tipped forward on the vagina, and **anteflexed**, bent forward on the cervix, so it rests on the bladder. A retroverted uterus, tipped backward, is a common normal variant that can make the ovaries hard to feel. Its wall is endometrium, a thick **myometrium** of smooth muscle, and the peritoneal perimetrium."], ["p", "The cervical canal opens into the uterine cavity at the internal os and into the vagina at the **external os**, round before vaginal birth and a transverse slit after it. The vagina is an 8 to 9 cm fibromuscular tube that surrounds the cervix in anterior, lateral and posterior **fornices**. Each uterine tube runs from the uterine wall through the isthmus and ampulla, where fertilization usually occurs, to the fimbriated infundibulum, whose **fimbria** sweep up the oocyte."], ["p", "The ovary sits in the ovarian fossa on the pelvic side wall, bounded above by the external iliac vessels and behind by the ureter and internal iliac artery. The **obturator nerve** runs on the floor of the fossa, so an inflamed ovary can refer pain to the medial thigh. The broad ligament is a double peritoneal sheet with three parts: the mesovarium, from which the ovary hangs; the mesosalpinx, which wraps the tube; and the mesometrium, the largest part, which wraps the uterus."], ["t", ["Ligament", "Runs between", "Contains", "Exam point"], [["{{rp1_ip|Infundibulopelvic}} (suspensory)", "Ovary and pelvic side wall", "Ovarian artery and vein", "Clamped in oophorectomy; twists in ovarian **torsion**"], ["Ovarian ligament", "Ovary and uterus", "No major vessel", "Gubernaculum remnant"], ["**Round ligament**", "Uterine horn and labia majora", "No major vessel", "Passes through the inguinal canal"], ["Cardinal ligament", "Cervix and side wall", "Uterine artery and vein", "Main support; ureter passes under the artery"], ["Uterosacral ligament", "Cervix and sacrum", "Fibrous tissue and smooth muscle", "Holds the cervix back"]]], ["h", "What sits in front of and behind the uterus?"], ["p", "The bladder lies behind the pubic symphysis and holds about 500 mL; its smooth-muscle wall is the detrusor. The ureters enter its back wall obliquely, so a filling bladder squeezes them shut and prevents reflux. The smooth, triangular **trigone** between the two ureteric openings and the urethral opening is mesonephric (mesodermal) in origin and, in women, lies on the anterior vaginal wall. The rectum is the pelvic part of the large bowel. It begins at the **rectosigmoid** junction at S3, follows the sacrum, and turns forward at the **anorectal** flexure, held by puborectalis, before passing through the floor as the anal canal. In women the vagina lies in front of it."], ["h", "Why is the ureter at risk when a surgeon clamps the uterine artery?"], ["p", "The gonads develop high on the posterior abdominal wall, and their vessels stay there. The **ovarian artery** arises from the aorta below the renal arteries; the right gonadal vein drains into the inferior vena cava and the left into the **left renal vein**. Most other pelvic structures are fed by the **internal iliac** artery. Its posterior division gives the iliolumbar, lateral sacral and superior gluteal arteries; its anterior division gives the uterine, vaginal, vesical, middle rectal and internal pudendal arteries, and in men the inferior vesical artery to the bladder base, seminal vesicle and prostate. The internal pudendal artery crosses the ischial spine, felt on vaginal exam, to reach the perineum. Only the superior rectal artery, the end of the inferior mesenteric, is a large pelvic vessel outside this system."], ["p", "Pelvic veins form plexuses around the organs, such as the **uterovaginal** and prostatic plexuses, and drain through the internal iliac veins, which join the external iliac veins as the common iliac veins. Pelvic lymph follows the arteries to iliac and sacral nodes and then to para-aortic nodes. The plexuses also connect with the valveless vertebral venous plexus of {{rp1_batson|Batson}}, so a cough or strain can push blood backward into the spine, and prostate cancer reaches the lumbar vertebrae without passing through the lungs."], ["p", "The uterine artery runs medially at the base of the broad ligament, on top of the cardinal ligament, through the parametrium, the connective tissue beside the cervix. About 2 cm lateral to the cervix it passes over the **ureter**, which runs forward underneath it to the bladder: **water under the bridge**. A clamp placed too far laterally in hysterectomy can crush, tie or cut the ureter. Higher up, the ureter crosses the pelvic brim at the bifurcation of the common iliac artery, just medial to the ovarian vessels, so it is also at risk when the infundibulopelvic ligament is clamped. In men the **ductus deferens** crosses over the ureter behind the bladder, the male bridge. Cervical cancer that spreads through the parametrium can compress the ureter and cause hydronephrosis."], ["f", "rp1_vessels"], ["call", "key", "The left gonadal vein takes the long way home", "The right gonadal vein enters the inferior vena cava obliquely, but the left climbs farther and enters the **left renal vein** at a right angle. That longer, higher-pressure column is why varicoceles are more common on the left, and why a new left varicocele in an older man suggests a renal tumor blocking the left renal vein."], ["steps", ["How surgeons stop pelvic bleeding without killing the organs", [["Tie the vessel next to the organ", "After tracing the ureter, **ligation** of the uterine artery beside the uterus, or of the ovarian vessels in the infundibulopelvic ligament, spares neighboring organs. In rectal resection the **superior rectal** artery, the end of the inferior mesenteric, is tied and the stump lives on the middle and inferior rectal arteries."], ["Know each organ's pedicle", "Radical prostatectomy controls the prostate's vascular pedicles and dorsal vein but spares the neurovascular bundles beside the capsule, which carry the nerves for erection."], ["For hemorrhage, block the anterior division", "Ligating the **anterior division** of both internal iliac arteries lowers pelvic pulse pressure so clots can form in torn vessels; interventional radiologists reach the same goal by embolization of the bleeding branch or the uterine arteries."], ["Collaterals keep the organs alive", "Blood returns through **collateral** arteries: the ovarian arteries from the aorta, the superior rectal artery and posterior division branches. That is why ligation achieves **hemostasis** without necrosis."]]]], ["h", "What do the male pelvic organs add?"], ["p", "Sperm are made in the seminiferous tubules, pass through the rete testis and the **efferent ductules** into the epididymis, a coiled tube where they mature and are stored, and leave in the ductus deferens. The testis lies in a closed serosal sac, the **tunica vaginalis**, a remnant of the processus vaginalis, where fluid collects in a hydrocele. The ductus deferens climbs the spermatic cord, crosses the inguinal canal and passes over the ureter to the back of the bladder; a vasectomy cuts and ligates it in the scrotum."], ["p", "Behind the bladder the ductus widens into an ampulla and joins the duct of the **seminal vesicle** to form an ejaculatory duct, which runs through the prostate and opens into the prostatic urethra on the {{rp1_colliculus|seminal colliculus}}, a midline bump on its posterior wall. The seminal vesicles add about 70 percent of the semen, a viscous alkaline fluid rich in **fructose** that feeds sperm and clots after ejaculation. The prostate adds about 20 percent, a thin alkaline fluid whose protease, prostate-specific antigen, liquefies the clot within about half an hour. Sperm are a small share, so a vasectomy barely changes the volume."], ["p", "The **prostate** is a walnut-sized gland around the **prostatic urethra**. Its base lies against the bladder neck, its apex rests on the pelvic floor at the external urethral sphincter, and its posterior surface lies against the rectum, separated by thin rectoprostatic (**Denonvilliers**) fascia beneath the rectovesical pouch. A digital rectal exam therefore palpates the posterior surface of the prostate, and the seminal vesicles if they are enlarged."], ["p", "During emission, sympathetic nerves contract the ductus, vesicles and prostate and also close the smooth-muscle **internal urethral sphincter** at the bladder neck, so semen can only go forward. If that sphincter fails, semen flows backward into the bladder and the man has a dry orgasm followed by cloudy urine: {{rp1_retrograde|retrograde ejaculation}}. Causes include sympathetic nerve injury (retroperitoneal lymph node dissection, diabetic neuropathy), earlier bladder neck or prostate surgery, and alpha-1 blockers such as tamsulosin."], ["f", "rp1_male"], ["h", "Which nerves run the pelvis, and what does each do?"], ["p", "The **sacral plexus** forms on the front of the piriformis from the **lumbosacral trunk** (L4 and L5) and the ventral rami of S1 to S4, which exit through the anterior sacral foramina. Its branches leave through the greater sciatic foramen, which the piriformis splits into a suprapiriform and an infrapiriform space. Above the muscle pass only the superior gluteal nerve and vessels, which supply the hip abductors. Below it pass the sciatic nerve, the inferior gluteal nerve, the **pudendal nerve** and the internal pudendal vessels. A wound above the piriformis therefore weakens hip abduction, and the pelvis sags toward the opposite side when the patient stands on the injured leg."], ["p", "Autonomic fibers reach the organs through the inferior hypogastric (pelvic) plexus beside the rectum. Sympathetic preganglionic fibers leave the lower thoracic and upper lumbar cord and arrive through the lumbar splanchnic nerves and the **hypogastric** nerves; parasympathetic fibers come from S2 to S4 as the {{rp1_splanchnic|pelvic splanchnic nerves}}. In the bladder they oppose each other. Sympathetic tone relaxes the **detrusor** and closes the internal urethral sphincter, so urine is stored. To void, pelvic splanchnic fibers act on **muscarinic** M3 receptors and the detrusor contracts while the external sphincter relaxes. In the genitals, parasympathetic fibers cause erection and sympathetic fibers cause emission."], ["p", "Pain follows the same routes: uterine body pain travels with sympathetic fibers to lower thoracic and upper lumbar segments, cervical pain with pelvic splanchnic fibers to S2 to S4."], ["f", "rp1_nerves"], ["call", "trap", "Pelvic splanchnic nerves are parasympathetic", "Thoracic, lumbar and sacral splanchnic nerves are all sympathetic, so students guess wrong here. The **pelvic splanchnic** nerves from S2 to S4 are the parasympathetic supply to the bladder, the hindgut from the descending colon onward and erectile tissue. Injury during rectal surgery causes urinary retention and erectile dysfunction."], ["sexp", {"id": "sx_rp1_collat", "q": "Both internal iliac anterior divisions are tied to stop postpartum bleeding. Which reasoning best explains why the uterus survives?", "o": ["Ligation lowers pelvic pulse pressure so clots hold, while ovarian and other collateral arteries keep perfusing the uterus", "The uterine artery comes from the posterior division, so tying the anterior division leaves its flow untouched", "The uterus depends on the round ligament artery, from the external iliac system", "All flow stops, but smooth muscle tolerates days of ischemia until the ligatures dissolve"], "a": 0, "why": "The uterine artery is an anterior-division branch, so ligation cuts its direct flow, and the fall in pelvic pulse pressure lets torn vessels clot. The uterus survives because blood returns through anastomoses, chiefly the ovarian arteries from the aorta, which join the uterine arteries near the tubes. The round ligament artery is trivial, and myometrium cannot survive days without flow."}], ["why", "Why does blood from a ruptured ectopic pregnancy pool behind the uterus, and why is it reached through the vagina?", "Peritoneum drapes over the back of the uterus and dips onto the posterior fornix before climbing onto the rectum, so the rectouterine pouch is the most dependent part of the peritoneal cavity when a woman sits or stands. Free blood and pus run downhill and collect there first. Only the thin posterior vaginal wall separates the pouch from the vagina, so a needle passed through the posterior fornix, a culdocentesis, enters it without crossing bowel or bladder."], ["vis", "rp1"]], "grid": {"q": "Which of these are true of the female pelvis?", "items": [["The rectouterine pouch is the lowest point of the peritoneal cavity", 1], ["The ureter passes under the uterine artery beside the cervix", 1], ["The ovarian artery runs in the infundibulopelvic ligament", 1], ["The left ovarian vein drains into the left renal vein", 1], ["The cardinal ligament is a main support of the cervix", 1], ["Pelvic splanchnic nerves contract the detrusor", 1], ["Only the superior gluteal nerve leaves above the piriformis", 1], ["The normal uterus is anteverted and anteflexed", 1], ["The round ligament carries the uterine artery", 0], ["The broad ligament is the main barrier to uterine prolapse", 0], ["The right ovarian vein drains into the right renal vein", 0], ["Pelvic splanchnic nerves are sympathetic", 0], ["The puborectalis sling helps hold stool in", 1], ["Retrograde ejaculation follows failure of the bladder-neck sphincter", 1], ["The seminal vesicles add most of the semen volume", 1], ["The prostate adds most of the semen volume", 0]]}}, {"id": "rp2", "t": "The perineum, external genitalia and lymph drainage", "sub": "Below the pelvic floor, one membrane splits two pouches, one nerve serves the whole region, and lymph follows embryology rather than distance.", "yld": "mid", "exam": "mid", "mins": 15, "pretest": [{"q": "After a straddle injury tears the spongy urethra, leaking urine swells the scrotum but spares which region?", "o": ["Thighs", "Penis", "Lower abdominal wall", "Perineum"], "a": 0, "why": "Colles fascia fuses with the fascia lata just below the inguinal ligament and with the back edge of the perineal membrane, so urine in the superficial pouch is channeled into the scrotum, penis and abdominal wall but cannot enter the thighs.", "w": {"Penis": "Colles fascia continues as the dartos layer of the penis, so the penile shaft swells with urine after this injury.", "Lower abdominal wall": "Colles fascia is continuous with Scarpa fascia of the abdominal wall, so urine climbs freely onto the lower abdomen.", "Perineum": "The superficial pouch lies in the urogenital triangle of the perineum itself, so perineal swelling is expected rather than spared."}}, {"q": "Which nerve block, placed beside the ischial spine, numbs most of the perineum for delivery?", "o": ["Pudendal nerve block", "Ilioinguinal nerve block", "Obturator nerve block", "Genitofemoral nerve block"], "a": 0, "why": "The pudendal nerve (S2 to S4) hooks around the ischial spine and sacrospinous ligament before entering the pudendal canal, so anesthetic placed beside the spine, felt through the vaginal wall, blocks most perineal sensation.", "w": {"Ilioinguinal nerve block": "The ilioinguinal nerve supplies only the mons and anterior labia, so it is added when the front of the vulva must also be numbed.", "Obturator nerve block": "The obturator nerve runs along the side wall to the medial thigh and supplies adductor muscles and thigh skin, not the perineum.", "Genitofemoral nerve block": "The genital branch of the genitofemoral nerve supplies a small anterior area near the mons and does not reach the posterior perineum."}}], "body": [["h", "How is the perineum divided, and what fills each part?"], ["p", "The perineum is the diamond-shaped region below the pelvic diaphragm, bounded by the pubic symphysis in front, the ischiopubic rami and **ischial tuberosities** at the sides, and the sacrotuberous ligaments and the coccyx behind. A line between the ischial tuberosities divides it into two triangles. The **urogenital triangle** in front lies in a horizontal plane and holds the urethra and external genitalia. The **anal triangle** behind lies in a nearly vertical plane and holds the anal canal, the external anal sphincter and the fat-filled ischioanal fossae, which let the canal expand during defecation and the perineum stretch at birth."], ["p", "Across the urogenital triangle stretches the {{rp2_permem|perineal membrane}}, a tough sheet attached to the ischiopubic rami at the sides, to the pubic arch in front, where it thickens into the transverse perineal ligament, and to the perineal body behind; the urethra, and in women the vagina, pierce it. The **deep perineal pouch** above it holds the external urethral sphincter, the deep transverse perineal muscle, the membranous urethra and bulbourethral glands in men, and the dorsal nerves and vessels of the penis or clitoris. The **superficial perineal pouch** below it holds the roots of the erectile bodies, the bulbospongiosus and ischiocavernosus muscles, the superficial transverse perineal muscles and, in women, the Bartholin glands. It is closed below by {{rp2_colles|Colles fascia}}."], ["f", "rp2_pouches"], ["t", ["Space", "Lies between", "Contents in men", "Contents in women"], [["Deep perineal pouch", "Pelvic floor and perineal membrane", "External urethral sphincter, deep transverse perineal muscle, membranous urethra, bulbourethral glands", "External urethral and urethrovaginal sphincters"], ["Superficial perineal pouch", "Perineal membrane and Colles fascia", "Bulb and crura, spongy urethra, three muscles", "Vestibular bulbs, clitoral crura, Bartholin glands, three muscles"], ["Ischioanal fossa", "Anal canal and obturator internus", "Fat, pudendal canal, inferior rectal nerve and vessels", "Same as in men"]]], ["h", "Why does a straddle injury spread urine into the scrotum but not the thighs?"], ["p", "Colles fascia is the membranous layer of superficial fascia in the perineum. It attaches to the ischiopubic rami and the back edge of the perineal membrane, and in front it continues as the dartos of the penis and scrotum and as Scarpa fascia on the abdominal wall, which fuses with the fascia lata just below the inguinal ligament. When a fall astride a beam tears the spongy urethra below the membrane, urine extravasates into the superficial pouch and follows that sleeve into the scrotum, penis and lower abdominal wall, but never into the thighs or the anal triangle. This **urethral rupture** pattern is the classic test of the fascial planes."], ["call", "trap", "A pelvic fracture does not fill the scrotum", "A pelvic fracture shears the **membranous urethra** above the perineal membrane, so urine leaks into the deep pouch and up into the **retropubic** space around the bladder, and the scrotum often stays dry. Blood at the meatus or a high-riding prostate calls for a retrograde urethrogram before anyone passes a catheter."], ["h", "What are the parts of the external genitalia?"], ["p", "The vulva starts at the mons pubis, a fat pad over the pubic symphysis. The hair-bearing **labia majora**, where the round ligaments end, enclose the thinner **labia minora**, and the space between the labia minora is the **vestibule**. Into it open the external urethral orifice in front and the vaginal orifice behind it, partly rimmed by the hymen, a thin mucosal fold. An imperforate hymen blocks menstrual flow and causes primary amenorrhea with cyclic pelvic pain and a bulging bluish membrane."], ["p", "The ducts of the Bartholin (greater vestibular) glands open at about 4 and 8 o'clock, posterolateral to the vaginal orifice. The glands lie in the superficial pouch and secrete mucus for lubrication during arousal; a blocked duct forms a cyst or abscess. The vestibular bulbs, erectile tissue along the sides of the vaginal opening, swell with arousal. The clitoris has a glans, a body of paired corpora cavernosa and two crura."], ["p", "The penis has a root and a body. The root, in the superficial pouch, is the bulb of the penis in the midline and a crus on each ischiopubic ramus. The crura continue as the two **corpora cavernosa**, which fill with blood in erection, and the bulb continues as the **corpus spongiosum**, which carries the urethra and expands into the glans. Each erectile body is wrapped in a dense tunica albuginea, and a fold of skin, the prepuce, covers the glans. The male urethra has three parts: the prostatic urethra; the short **membranous urethra** in the deep pouch and external urethral sphincter; and the long spongy urethra, which widens in the bulb and again in the glans as the navicular fossa. Apart from the external meatus, the membranous part is the narrowest and least stretchy, so catheters and pelvic fractures injure it."], ["f", "rp2_vulva"], ["h", "How do the pudendal nerve and vessels reach the perineum?"], ["p", "The **pudendal nerve** (S2 to S4) and the internal pudendal artery leave the pelvis through the greater sciatic foramen below the piriformis, hook around the **ischial spine** and sacrospinous ligament, and re-enter through the lesser sciatic foramen. They then run forward in the {{rp2_alcock|pudendal canal}} (Alcock canal), a split in the obturator fascia on the side wall of the ischioanal fossa. The nerve gives the inferior rectal nerve to the external anal sphincter and perianal skin; the perineal nerve, whose deep branch supplies the perineal muscles and external urethral sphincter and whose superficial branch gives posterior labial or posterior scrotal nerves to the skin; and the dorsal nerve of the penis or clitoris. The palpable spine guides a **pudendal block** in labor."], ["f", "rp2_pudendal"], ["p", "A pudendal block leaves the front of the perineum sensitive, because the mons and anterior labia or scrotum are supplied by the **ilioinguinal** nerve (L1). The internal pudendal artery gives inferior rectal, perineal, bulb and dorsal branches and the deep artery of the penis or clitoris, whose helicine arteries open into the erectile sinusoids and fill them in erection. The external pudendal arteries from the femoral artery supply the anterior scrotum and labia, and the deep dorsal vein of the penis drains under the pubic symphysis into the prostatic venous plexus."], ["p", "The bladder outlet has two sphincters. The **internal urethral sphincter** at the bladder neck is smooth muscle: sympathetic fibers from the hypogastric nerves close it through alpha-1 receptors, which keeps semen out of the bladder, and alpha-1 blockers such as tamsulosin relax it. The **external urethral sphincter** is skeletal muscle under voluntary pudendal control."], ["p", "The anal canal repeats the pattern. The **internal anal sphincter** is thickened smooth muscle that keeps the canal closed without effort; the **external anal sphincter** is skeletal muscle supplied by the inferior rectal nerve and squeezed on purpose. Both anchor to the {{rp2_perbody|perineal body}}, the fibromuscular knot between the anal canal and the vagina or bulb where the perineal muscles meet. Childbirth can tear it: a second-degree laceration reaches the perineal muscles, a third-degree tear the anal sphincter, and a fourth-degree tear the rectal mucosa. A mediolateral episiotomy cuts away from the midline to spare the perineal body and sphincter."], ["h", "How do the autonomic nerves run erection and emission?"], ["p", "Autonomic fibers reach the pelvic and perineal organs through the inferior hypogastric (pelvic) plexus. Sympathetic fibers arrive through the lumbar splanchnic nerves and cause vasoconstriction, closure of the internal urethral and anal sphincters and, in men, emission. Parasympathetic fibers arrive as the pelvic splanchnic nerves and cause vasodilation, contraction of the detrusor and engorgement of erectile tissue. Male sexual function strings the three kinds of nerve in sequence."], ["steps", ["Point, squeeze, shoot: the nerves of male sexual function", [["Point: erection is parasympathetic", "**Pelvic splanchnic** nerves (S2 to S4) release nitric oxide, which relaxes penile arteries and sinusoids so the corpora fill and compress their veins against the tunica albuginea."], ["Squeeze: emission is sympathetic", "Hypogastric fibers from L1 and L2 contract the ductus deferens, seminal vesicles and prostate to move semen into the urethra, and close the internal urethral sphincter."], ["Shoot: ejaculation is somatic", "The pudendal nerve drives rhythmic contraction of the bulbospongiosus, which expels semen; damage to sympathetic fibers lets the sphincter open, causing retrograde ejaculation into the bladder."]]]], ["h", "Why does the pectinate line split the anal canal in two?"], ["p", "The {{rp2_pectinate|pectinate line}} marks where the endoderm of the hindgut met the ectoderm of the anal pit, so everything above and below it differs. Above the line the lining is columnar, cancers are adenocarcinomas, the superior rectal artery from the inferior mesenteric artery supplies it, its veins drain to the portal system, lymph goes to internal iliac nodes and the nerves are visceral, sensing only stretch. **Internal hemorrhoids** arise here, so they bleed but do not hurt. Below the line the lining is stratified squamous, cancers are squamous cell carcinomas, the inferior rectal vessels join the caval system, lymph goes to **superficial inguinal** nodes, and the somatic inferior rectal nerve makes **external hemorrhoids** painful."], ["f", "rp2_pectinate"], ["p", "Rectal veins join both venous systems, so the anorectal junction is a {{rp2_portocaval|portocaval anastomosis}}. In portal hypertension, blood from the superior rectal veins flows through the middle and inferior rectal veins into the caval system and swells rectal varices, which bleed but are not hemorrhoids."], ["call", "key", "Pain marks the somatic side of the line", "Anything below the pectinate line, such as a thrombosed external hemorrhoid, an anal fissure or a squamous tumor, hurts because the **inferior rectal** branch of the pudendal nerve carries somatic pain. Above the line, an internal hemorrhoid or adenocarcinoma presents with painless bleeding because visceral afferents respond only to stretch."], ["h", "Where does lymph from each pelvic organ drain?"], ["p", "Lymph runs back along the arteries that supply an organ, so distance is a poor guide. The ovaries and testes developed near the kidneys and kept their aortic vessels, so they drain to **para-aortic** nodes, and testicular cancer spreads there rather than to the groin. The uterine body, cervix and upper vagina drain with the uterine and vaginal vessels to internal iliac, external iliac and obturator nodes, and the prostate drains mainly to **internal iliac** nodes. The lower vagina, vulva, scrotum, penile shaft skin and anal canal below the pectinate line drain to the superficial inguinal nodes. The glans drains to **deep inguinal** nodes, and some fundal lymph follows the round ligament to the groin."], ["f", "rp2_lymph"], ["t", ["Structure", "First nodes", "Classic case"], [["Ovary or testis", "Para-aortic (lumbar)", "Testicular seminoma with retroperitoneal nodes"], ["Uterus, cervix, upper vagina", "Internal and external iliac, obturator", "Cervical cancer in pelvic side-wall nodes"], ["Prostate", "Internal iliac, obturator, sacral", "Prostate cancer in pelvic nodes"], ["Lower vagina, vulva, scrotum", "Superficial inguinal", "Scrotal abscess with tender groin nodes"], ["Anal canal below the pectinate line", "Superficial inguinal", "Anal squamous cell carcinoma"], ["Glans penis or clitoris", "Deep inguinal", "Penile cancer of the glans"]]], ["p", "These routes explain clinical patterns. Vulvar and penile cancers spread first to the superficial inguinal nodes, so the surgeon removes the {{rp2_sentinel|sentinel node}}, the first node on the route, and examines it before deciding on a full groin dissection. Infections of the same skin enlarge the same nodes: chancroid and lymphogranuloma venereum produce tender, matted nodes that can suppurate as an **inguinal bubo**, while the chancre of primary syphilis leaves painless, rubbery nodes. Deep pelvic infections drain to iliac nodes that cannot be felt, so they give no groin signal."], ["sexp", {"id": "sx_rp2_colles", "q": "After falling astride a beam, a man has swelling of the scrotum, penis and lower abdominal wall but not the thighs. Which reasoning best explains the pattern?", "o": ["The membranous urethra tore above the perineal membrane, so urine rose through the deep pouch into the retropubic space", "The bladder ruptured into the peritoneal cavity, and urine tracked down the inguinal canals into the scrotum", "Urine spread through loose subcutaneous fat, which is continuous everywhere, so sparing of the thighs is chance", "The spongy urethra tore below the membrane, and Colles fascia, tied to the rami and perineal membrane and continuous with Scarpa fascia, channels urine forward and upward"], "a": 3, "why": "A straddle injury crushes the spongy urethra against the pubic arch below the perineal membrane, so urine enters the superficial pouch, whose floor is Colles fascia. That fascia is attached to the ischiopubic rami and the back of the membrane but continues into dartos and Scarpa fascia, which fuses with the fascia lata, so urine can only go forward and up. A membranous tear fills the retropubic space instead, and bladder rupture causes ascites."}], ["why", "Why does testicular cancer spread to nodes beside the aorta instead of the groin?", "The testis forms on the posterior abdominal wall near the kidney and descends through the inguinal canal late in fetal life, dragging its artery, veins and lymphatics behind it. Its lymph vessels therefore climb back up the spermatic cord to the para-aortic nodes near the origin of the testicular artery. The scrotal skin is different: it is body wall that never moved, so it drains to the superficial inguinal nodes. Enlarged groin nodes in testicular cancer suggest spread to the scrotal skin, one reason testes are removed through the groin rather than the scrotum."], ["vis", "rp2"]], "grid": {"q": "Which of these are true of the perineum and its drainage?", "items": [["The perineal membrane separates the deep and superficial pouches", 1], ["Colles fascia keeps leaked urine out of the thighs", 1], ["A straddle injury tears the spongy urethra", 1], ["The pudendal nerve hooks around the ischial spine", 1], ["External hemorrhoids are painful", 1], ["Testicular lymph drains to para-aortic nodes", 1], ["Scrotal skin drains to superficial inguinal nodes", 1], ["Erection is parasympathetic; emission is sympathetic", 1], ["Bartholin ducts open at the posterolateral vaginal orifice", 1], ["The bulbourethral glands lie in the superficial pouch", 0], ["Internal hemorrhoids are painful because of somatic nerves", 0], ["The glans penis drains to para-aortic nodes", 0], ["A pelvic fracture tears the spongy urethra below the membrane", 0], ["Sentinel node biopsy samples the first groin node in vulvar cancer", 1], ["The external urethral sphincter is skeletal muscle supplied by the pudendal nerve", 1], ["Sympathetic fibers produce erection", 0]]}}, {"id": "rp3", "t": "Breast anatomy and histology", "sub": "A modified sweat gland hung from the skin and resting on the pectoral fascia, whose layers, lymphatics and two-cell epithelium explain the exam and the pathology.", "yld": "mid", "exam": "mid", "mins": 12, "pretest": [{"q": "Which structure, when shortened by an underlying tumor, pulls the overlying skin into a dimple?", "o": ["Suspensory (Cooper) ligament", "Pectoral fascia", "Lactiferous sinus", "Retromammary space"], "a": 0, "why": "Cooper ligaments are fibrous bands that run from the dermis through the breast to the pectoral fascia. A carcinoma that infiltrates and shortens them tugs the skin inward, producing dimpling or retraction over the mass.", "w": {"Pectoral fascia": "Tumor that reaches the deep fascia anchors the mass to the chest wall, so it stops gliding when pectoralis contracts; that is fixation, not a pulled dimple.", "Lactiferous sinus": "The sinus is the widened end of a duct beneath the areola where milk collects; involvement there retracts the nipple rather than distant skin.", "Retromammary space": "This loose plane behind the gland lets the breast slide over the chest wall; invasion across it causes fixation, while the skin stays smooth."}}, {"q": "Which nerve, injured during axillary lymph node surgery, produces a winged scapula?", "o": ["Long thoracic nerve", "Thoracodorsal nerve", "Intercostobrachial nerve", "Medial pectoral nerve"], "a": 0, "why": "The long thoracic nerve runs down the medial wall of the axilla on the surface of serratus anterior. Without serratus holding the scapula against the ribs, its medial border lifts off when the patient pushes forward.", "w": {"Thoracodorsal nerve": "It travels with the thoracodorsal vessels to latissimus dorsi; injury weakens arm extension, adduction and internal rotation but leaves the shoulder blade flat.", "Intercostobrachial nerve": "This branch of the second intercostal nerve carries only sensation; cutting it numbs the medial upper arm and armpit without any weakness.", "Medial pectoral nerve": "It supplies pectoralis minor and part of pectoralis major; damage causes subtle chest muscle weakness and atrophy, never a lifted shoulder blade."}}, {"q": "Which breast cells contract in response to oxytocin to push milk out of the alveoli?", "o": ["Myoepithelial cells", "Luminal epithelial cells", "Intralobular stromal cells", "Areolar smooth muscle cells"], "a": 0, "why": "Myoepithelial cells form the outer layer of every duct and alveolus. Oxytocin released during suckling makes them contract, squeezing milk from the alveoli into the ducts, which is the let-down reflex.", "w": {"Luminal epithelial cells": "Luminal cells line the lumen and synthesize milk under prolactin, but they lack the actin and myosin apparatus needed to expel it.", "Intralobular stromal cells": "The loose, hormone-responsive stroma around lobules supports the epithelium and gives rise to fibroadenoma, but it has no role in milk ejection.", "Areolar smooth muscle cells": "Areolar smooth muscle firms and erects the nipple for latching; it does not surround alveoli, so it cannot move milk into the ducts."}}], "body": [["h", "How is the breast built, from skin to chest wall?"], ["p", "The breast is a **modified apocrine sweat gland** that develops in the subcutaneous tissue of the anterior chest wall. It spans roughly the second to sixth ribs and reaches from the edge of the sternum to the midaxillary line, and its **axillary tail** (tail of Spence) extends up toward the armpit. The gland is divided into 15 to 20 lobes. Each lobe drains through its own {{rp3_lact|lactiferous duct}}, which widens beneath the areola into a lactiferous sinus, or ampulla, before opening separately on the nipple. At the far end of each duct tree sits the **lobule**, a cluster of small blind-ending ductules. The lobule and its terminal duct form the {{rp3_tdlu|terminal duct lobular unit}} (TDLU), the working unit that makes milk and the place where most breast disease starts."], ["p", "Fat fills the spaces between lobes, and fibrous bands called **Cooper ligaments** (suspensory ligaments) run from the dermis through the breast to the deep fascia, holding the gland up like the ropes of a hammock. Behind the gland lies the {{rp3_retro|retromammary space}}, a thin plane of loose connective tissue that separates the breast from the **pectoral fascia** covering pectoralis major. Because this plane is loose, a normal breast and a benign mass glide freely over the chest wall. On the surface, the nipple sits near the fourth intercostal space in a young breast, and the pigmented areola around it carries **Montgomery tubercles**, the openings of areolar glands that enlarge in pregnancy and lubricate the nipple during nursing."], ["f", "rp3_section"], ["call", "key", "Tethering pulls skin; fixation holds the mass", "A carcinoma that infiltrates and shortens **Cooper ligaments** pulls the overlying skin inward, so the exam shows **dimpling** or skin retraction over the tumor. A carcinoma that crosses the retromammary space into the pectoral fascia is fixed: when the patient presses her hands on her hips to tense pectoralis major, the mass moves with the muscle instead of sliding. **Fixation** therefore signals deep invasion."], ["h", "What does the clinical breast exam check, and why there?"], ["p", "The clinical exam follows the anatomy. On inspection the examiner looks at the nipple and areola for new inversion, scaling or discharge, and at the skin for dimpling, which is easiest to see when the patient raises her arms or tenses her chest muscles. On palpation every quadrant is covered, and the **upper outer quadrant** gets special attention because it holds the most glandular tissue, including the axillary tail. It lies at 9 to 12 o'clock in the right breast and 12 to 3 o'clock in the left, because a lump is recorded by breast, clock-face position and distance from the nipple (left breast, 2 o'clock, 3 cm from the nipple), so the next examiner or radiologist finds the same spot. The exam then moves into the axilla and above the clavicle, because those node beds are where breast cancer spreads first. A hard, irregular or fixed mass, or new **nipple retraction** from tumor shortening the lactiferous ducts, needs imaging and biopsy."], ["h", "Where do the vessels, lymphatics and nerves run?"], ["p", "The breast has a double arterial supply that mirrors its position between the sternum and the axilla. Medially, perforating branches of the **internal thoracic artery** (internal mammary artery) emerge through the upper intercostal spaces beside the sternum. Laterally, the **lateral thoracic artery**, a branch of the axillary artery, supplies the outer breast, helped by pectoral branches of the thoracoacromial artery and by branches of the posterior intercostal arteries. Veins follow the arteries, so most blood drains to the axillary vein and the rest to the internal thoracic and **intercostal veins**. Intercostal veins connect with the valveless vertebral venous plexus of {{rp3_batson|Batson}}, so a rise in chest pressure can send tumor cells straight to the vertebrae, a route to spinal metastases."], ["p", "Lymph follows a similar split. About 75 percent of breast lymph, especially from the lateral quadrants, flows to the **axillary nodes**, which surgeons group into three levels by their relation to pectoralis minor: level I lies lateral to the muscle, level II behind it, and level III medial to it at the apex of the axilla. The medial quadrants also drain to the {{rp3_imn|internal mammary nodes}} along the internal thoracic vessels, and a smaller share crosses to the opposite breast or runs toward abdominal nodes. Because tumor cells travel along this path in order, the first node on it, the {{rp3_sentinel|sentinel node}}, is found with blue dye or a radiotracer and removed; if it is free of tumor, the rest of the axilla can usually be left alone. Apical (level III) nodes drain on to the supraclavicular nodes, and a hard supraclavicular node on the same side signals advanced regional disease (N3 in staging)."], ["p", "Skin sensation comes from the anterior and lateral cutaneous branches of the fourth to sixth **intercostal nerves**, and the nipple lies in the T4 dermatome. Three nerves cross the axilla, where node surgery puts them at risk. The **long thoracic nerve** runs down the medial wall on serratus anterior; cutting it lets the medial border of the scapula lift away from the ribs, a **winged scapula**. The {{rp3_td|thoracodorsal nerve}} runs along the posterior wall to latissimus dorsi, so injury weakens extension, adduction and internal rotation of the arm. The intercostobrachial nerve, a sensory branch of the second intercostal nerve, crosses the axilla to the medial arm, and cutting it leaves that skin numb."], ["f", "rp3_axilla"], ["t", ["Structure", "Course", "Injury or spread"], [["Internal thoracic artery", "Perforating branches beside the sternum", "Supplies the medial breast"], ["Lateral thoracic artery", "From the axillary artery down the lateral chest wall", "Supplies the lateral breast"], ["Long thoracic nerve (C5 to C7)", "Medial axillary wall, on serratus anterior", "Winged scapula; trouble raising the arm overhead"], ["Thoracodorsal nerve (C6 to C8)", "Posterior axillary wall, to latissimus dorsi", "Weak extension, adduction and internal rotation"], ["Intercostobrachial nerve (T2)", "Across the axilla to the medial arm", "Numb skin of the medial upper arm"], ["Axillary nodes, levels I to III", "Lateral to, behind and medial to pectoralis minor", "First site of spread for most cancers"], ["Internal mammary nodes", "Beside the sternum with the internal thoracic vessels", "Spread from medial tumors"]]], ["call", "trap", "Winging means serratus anterior, not latissimus", "Both nerves run close to the axillary nodes, so either can be injured in the same operation. Winging poi /* @region patch.p46-placements (PATCH, drop): dropped */
/* @region content.multi-drills (CONTENT, drop): cardio content; build.py emits the globals */
/* @region engine.core (ENGINE, engine) */
/* =====================================================================
   STEP 1 BLOCK ENGINE  v2
   Budget model: 2 hours a day, 4-5 days per block.
   ===================================================================== */

const LS_KEY  = "step1." + META.key + ".v2";
const HUB_KEY = "step1.hub.v1";        /* shared across every block */
/* Gaps scaled to the RETENTION interval (weeks to the exam), not to one sitting.
   The old ladder topped out at 72 h, so block-1 material was never seen again. */
const BOXES  = [0, 15*60e3, 24*3600e3, 3*24*3600e3, 7*24*3600e3, 14*24*3600e3];
/* P2.6 (F33, reopened 2026-10-04) - every sentence the page says about when something comes back is
   built from the constants below, never typed: the rule had drifted from its texts three times (the
   plan row and method card said a slow right rapid pick stays on its step while the code dropped it
   a box at the top step; Weak Spots said "come back tomorrow" for a miss that returns in 15 minutes;
   the due-set text gave 1, 3, 7, 14 days for a first right answer that was due in 15 minutes).
   REPRO-PLAN section 8 F33 asks only that an item comes back when due, and ENGINE-MAP F33 and F22 name
   this ladder (15 min, 1, 3, 7, 14 days) and the 12 s hesitation rule, so the ladder and the rule are
   right and the texts were wrong, except in one place: at the top step the old code moved a slow right
   pick DOWN a step, which no text said and no rule intends, so promote() now holds it (see hold below).
   What the code does, and what the texts say:
     first answer to anything, right or wrong     BOXES[1] (15 minutes)
     rapid pick: right / slow right / miss        up one step / holds its step (SLOW_RAPID_MS) / down one step, never below BOXES[1]
     question and recall grid: right / miss       up one step / the first step (a question), grid per promote()
     question right, lucky-answer re-check        VERIFY_GAP.first (a day) after a first right answer
   Every gap carries +-15% jitter and is capped by examCeiling(). */
const SLOW_RAPID_MS = 12000;                     /* a right rapid pick slower than this is recognised, not known */
const VERIFY_GAP    = {first: 24*3600e3, again: 3*24*3600e3};
const LAST_PASS_MS  = 2*24*3600e3;               /* nothing is scheduled later than this before the exam (examCeiling) */
const JITTER        = 0.15;                      /* each gap is varied by +-15% so items do not clump */
const gapMs         = box => BOXES[box] * (1 - JITTER + Math.random() * 2 * JITTER);
const NUM_WORD = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
function spanWord(ms, spell){
  const m = Math.round(ms/6e4), h = Math.round(ms/36e5), d = Math.round(ms/864e5);
  const [n, u] = m < 60 ? [m, "minute"] : h < 24 ? [h, "hour"] : [d, "day"];
  return (spell && NUM_WORD[n] ? NUM_WORD[n] : n) + " " + u + (n === 1 ? "" : "s"); }
/* the steps after the first, "1, 3, 7 and 14 days"; the first step alone is "15 minutes" */
function ladderTail(){
  const st = BOXES.slice(2).map(ms => Math.round(ms/864e5));
  return st.length > 1 ? st.slice(0, -1).join(", ") + " and " + st[st.length-1] + " days" : st.length ? st[0] + (st[0] === 1 ? " day" : " days") : ""; }
const ladderWords = () => spanWord(BOXES[1]) + (BOXES.length > 2 ? ", then " + ladderTail() : "");
const slowWords   = () => (SLOW_RAPID_MS/1000) + " seconds";
const spanAdj     = ms => spanWord(ms).replace(/s$/, "").replace(" ", "-");   /* "15-minute", for "the 15-minute one" */
/* the two rules as one sentence each, for the places that explain a set that has nothing due */
const schedQuestionRule = () => "The first answer to a question, right or wrong, brings it back in about " + spanWord(BOXES[1])
  + "; each further right answer moves it up one step (" + ladderTail() + "), and a miss puts it back at " + spanWord(BOXES[1]) + ".";
const schedRapidRule = () => "The first answer to a pick, right or wrong, brings it back in about " + spanWord(BOXES[1])
  + "; each right answer moves it up one step (" + ladderTail() + ") unless it took over " + slowWords()
  + ", which keeps it on its step; a miss moves it down one step, never below the " + spanAdj(BOXES[1]) + " one.";
const DAILY_MIN    = 120;              /* fallback when no pace is selected */
/* P1.9 - REVIEW_FLOOR used to protect a flat 40 minutes for due review. On a
   30-minute day (a 14-day pace) that was more than the whole day, so a short
   pace served almost nothing but review and never reached new material. The
   protected slice is now a share of the day: see reviewCap in todaysPlan(). */
/* P3.6 - DBREF is the viewer's OWN progress document, resolved once by syncDb().
   It stays null whenever the db or the user capability is missing, or the viewer
   has no id - and that null IS the localStorage-only mode, which is what a page
   opened outside the artifact runtime always gets. */
let DB = null, DBREF = null, saveTimer = null;

const blank = () => ({
  v:2, ts:0,
  topics:{}, qs:{}, rapid:{}, drills:{}, spot:{}, pre:{}, sexp:{}, stage:{},
  days:{}, linked:[], chat:[], socratic:false,
  mode:"path", cur:null, stg:null, cloze:false, hiOnly:false,
  /* P2.2 - which yield axis drives the rail, the high-yield filter, the badges and the
     Weak Spots weights: "exam" reads t.exam (the course exam), "step1" reads t.yld. */
  yAxis:"exam",
  ps:null, rf:null, dr:null, sp:null, scroll:{}, bld:{}, paceDays:5,
  /* P3.5 - items the student marked for another look. An array, oldest
     first, of {kind, id, note, ts}. A save written before P3.5 has no such
     key at all, which is why repairState() rebuilds the shape rather than
     trusting it. */
  flags:[],
  /* P3.3 - when the CURRENT pace block started. 0 means "not anchored yet";
     repairState() resolves it, to now for a new state or to the start of the
     block a pre-P3.3 save was already part-way through. blockDay() counts only
     the studied days on or after it. */
  paceSetAt:0
});
let S = blank();

/* @region engine.flags (ENGINE, engine) */
/* =====================================================================
   FLAGGED ITEMS (P3.5)
   What was wrong: a student who met an item they thought was wrong,
   ambiguous, or simply worth returning to had nowhere to put the thought,
   so it was gone by the next click. What is right about this: the control
   toggles S.flags and repaints ITSELF - see wire() - because render()
   rebuilds the whole app subtree, and a rebuild in the middle of a question
   would move the page and the reader's focus. Declared here, above
   repairState(), so the kind table exists before the first repair runs.
   ===================================================================== */
const FLAG_KINDS = {q:"Question", rapid:"Rapid pick", img:"Image", drill:"Drill"};
/* esc() leaves the double quote alone, which is safe in text and wrong in an
   attribute: a note typed with quotes in it would end the value early. */
const escA = s => esc(s).replace(/"/g, "&quot;").replace(/>/g, "&gt;");
const flagList = () => (Array.isArray(S.flags) ? S.flags : (S.flags = []));
const flagIx = (kind, id) => flagList().findIndex(f => f && f.kind === kind && f.id === id);
const flagRef = (kind, id) => kind + ":" + id;
const unflagRef = ref => { const i = String(ref).indexOf(":"); return [String(ref).slice(0, i), String(ref).slice(i + 1)]; };
/* The control itself. The note box is rendered with the markup and simply
   hidden until the item is flagged, so toggling never has to build DOM and
   the note survives every later render (it lives in S, not in the input). */
function flagCtrl(kind, id){
  if(!kind || id == null || id === "") return "";
  const i = flagIx(kind, String(id)), on = i >= 0, note = on ? (flagList()[i].note || "") : "";
  const ref = escA(flagRef(kind, String(id)));
  return '<span class="flagwrap">' +
    '<button class="btn sm gho flagbtn' + (on ? " on" : "") + '" data-flag="' + ref + '"' +
      ' aria-pressed="' + (on ? "true" : "false") + '"' +
      /* the accessible name has to CONTAIN the visible label, so it is built
         from it rather than replacing it, and it changes with the state. */
      ' aria-label="' + (on ? "Flagged - press to remove the flag" : "Flag this item for another look") + '"' +
      ' title="' + (on ? "Flagged - press to remove the flag" : "Flag this item for another look") + '">' +
      (on ? "Flagged" : "Flag this") + '</button>' +
    '<input class="flagnote" data-flagnote="' + ref + '" value="' + escA(note) + '" maxlength="140"' +
      ' placeholder="note (optional)" aria-label="Note on this flagged item"' + (on ? "" : " hidden") + '></span>';
}
/* Resolve a stored flag back to something readable. Ids are chosen to still
   resolve months later: q.id for questions, r.i (<META.key>.xxxxx) for rapid
   picks, the IMGS key for images, and drill id plus the item's index in
   d.items for the sorts. Anything that no longer resolves is still listed,
   with a row that says so, rather than deleted behind the student's back. */
function flagTarget(f){
  let label = "", topic = null;
  if(f && f.kind === "q"){ const q = QS.find(x => x.id === f.id); if(q){ label = stripTags(q.l || q.s); topic = q.c; } }
  else if(f && f.kind === "rapid"){ const r = rItem(f.id); if(r){ label = stripTags(r.q); topic = r.c; } }
  else if(f && f.kind === "img"){ const im = IMGS[f.id]; if(im) label = im.n; }
  else if(f && f.kind === "drill"){
    const p = String(f.id).split("#"), d = DRILLS.find(x => x.id === p[0]);
    if(d){ const it = p.length > 1 ? d.items[+p[1]] : null;
      label = d.t + (it ? " \u2014 " + stripTags(Array.isArray(it) ? it[0] : it) : ""); topic = d.c; }
  }
  const gone = !label;
  if(gone) label = "This item is no longer in the block";
  const t = topic ? findT(topic) : null;
  return {label: label.length > 130 ? label.slice(0, 127) + "\u2026" : label,
          sub: ((f && FLAG_KINDS[f.kind]) || "Item") + (t ? " \u00b7 " + t.t : ""), topic: t ? topic : null, gone: gone};
}

/* @region engine.persistence (ENGINE, engine) */
function load(){
  try{
    let r = localStorage.getItem(LS_KEY);
    if(!r){ /* carry forward v1 progress so nothing already earned is lost */
      const old = localStorage.getItem("step1." + META.key + ".v1");
      if(old) r = old;
    }
    if(r) S = Object.assign(blank(), JSON.parse(r));
    migrateRapidKeys();
    repairState();
    hubPull();
  }catch(e){}
}
/* The old build marked sets "done" with zero answers and marked topics "read" just for
   opening them. Any saved flag with no supporting evidence is cleared on load. */
function repairState(){
  Object.keys(S.stage||{}).forEach(pid => {
    const st = S.stage[pid]; if(!st) return;
    if(st.done && !(st.n > 0)){ st.done = false; st.acc = 0; }
    if(st.quiz && st.quiz.done && !(st.quiz.n > 0)) st.quiz = {done:false, acc:0, n:0, total:st.quiz.total||0};
  });
  Object.keys(S.topics||{}).forEach(id => {
    const t = S.topics[id];
    if(t && t.read && !(t.dwell > 0) && t.grid == null) t.read = false;
  });
  /* P2.V F13: a finished pretest is kept on its topic page (pre[tid].keep) only while the
     student is still on that page; any other view or topic releases it, so the next visit
     opens on the lesson. Runs before every render, and on load (a reload on the page keeps it). */
  Object.keys(S.pre||{}).forEach(id => {
    const r = S.pre[id];
    if(r && r.keep && !(S.mode === "learn" && S.cur === id)) delete r.keep;
  });
  /* P3.5 - flags are the student's own marks, not scored records, so the
     only thing to repair is their shape: a save written before this task
     has no array at all, and a restored file can carry anything. Malformed
     and duplicate entries go; an entry whose id no longer resolves stays,
     because deleting somebody's note silently is worse than one stale row. */
  if(!Array.isArray(S.flags)) S.flags = [];
  S.flags = S.flags
    .filter(f => f && typeof f === "object" && FLAG_KINDS[f.kind] && typeof f.id === "string" && f.id)
    .map(f => ({kind:f.kind, id:f.id, note:String(f.note == null ? "" : f.note).slice(0,140),
                ts:(+f.ts > 0 ? +f.ts : Date.now())}))
    .filter((f,i,a) => a.findIndex(x => x.kind === f.kind && x.id === f.id) === i);
  if(S.yAxis !== "step1" && S.yAxis !== "exam") S.yAxis = "exam";
  if(!Number.isFinite(+S.paceDays) || +S.paceDays < 1) S.paceDays = 5;
  S.paceDays = Math.min(21, Math.max(1, Math.round(+S.paceDays)));
  /* P3.3 - a save written before paceSetAt existed. The epoch would keep
     counting every day ever studied (the bug this task removes) and today would
     silently restart a block the student is part-way through, so anchor on the
     earliest of their most recent paceDays studied days: the day number they
     saw yesterday is unchanged, and the next pace change re-anchors properly. */
  if(!(+S.paceSetAt > 0)){
    const studied = Object.keys(S.days||{}).filter(k => S.days[k] && S.days[k].acts).sort();
    const start = studied.length ? +new Date(studied[Math.max(0, studied.length - S.paceDays)]+"T00:00:00") : NaN;
    S.paceSetAt = start > 0 ? start : Date.now();
  }
  /* P2.3 - the linked queue holds this block's rapid items only, once each, in queue order. An id whose
     item has left the content (editing a rapid question changes its id) can never be served, so it is
     never answered and never drained; it used to keep the plan's linked row showing, and costed, for
     nothing. Pacing (stageAllot, planDaysLeft) therefore sees only items the Linked queue can serve. */
  { const seen = {};
    S.linked = (Array.isArray(S.linked) ? S.linked : []).filter(id =>
      typeof id === "string" && Object.prototype.hasOwnProperty.call(RBYID, id) && !seen[id] && (seen[id] = true)); }
  if(S.ps && (!Array.isArray(S.ps.set) || S.ps.i < 0 || S.ps.i >= S.ps.set.length || !QS.some(q=>q.id===S.ps.set[S.ps.i]))) S.ps = null;
  if(S.rf && (!Array.isArray(S.rf.set) || S.rf.i < 0 || S.rf.i >= S.rf.set.length || !rItem(S.rf.set[S.rf.i]))) S.rf = null;
  if(S.sp && (!Array.isArray(S.sp.set) || S.sp.i < 0 || S.sp.i >= S.sp.set.length || !IMGS[S.sp.set[S.sp.i]])) S.sp = null;
  if(S.dr){ const d=DRILLS.find(x=>x.id===S.dr.id);
    if(!d || (d.kind!=="order" && (!Array.isArray(S.dr.order) || S.dr.order.length!==d.items.length || S.dr.order.some(ix=>ix<0||ix>=d.items.length)))) S.dr=null;
  }
}
function save(){
  if(window.__SELFTEST) return;           /* self-test never persists */
  S.ts = Date.now();
  try{ hubPull(); }catch(e){}
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  try{ hubSync(); }catch(e){}
  flash(); clearTimeout(saveTimer); saveTimer = setTimeout(pushDb, 1200);
}
async function pushDb(){ if(!DBREF) return;
  /* P3.6 - writes only into this viewer's private subtree. The single shared
     document this used to write handed every signed-in visitor of the link the
     owner's progress, and overwrote whatever they had done themselves. */
  try{ await DBREF.set(JSON.parse(JSON.stringify(S))); }catch(e){} }
function flash(){ const d = el("savedot"); if(!d) return; d.classList.add("on"); setTimeout(()=>d.classList.remove("on"), 900); }
function flushNow(){ if(window.__SELFTEST) return; try{ S.ts = Date.now(); localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} pushDb(); }
window.addEventListener("pagehide", flushNow);
window.addEventListener("beforeunload", flushNow);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "hidden") flushNow(); });
setInterval(()=>{ if(S.ts) flushNow(); }, 20000);

/* P3.6 - claude.use() is contracted to settle (null when nothing answers), but
   nothing on this page may sit on a promise that does not. Sync is optional, so
   a missing or half-loaded runtime resolves null here and the page carries on
   with localStorage alone. Outside the artifact runtime window.claude does not
   exist at all and this returns without creating a promise to wait on. */
/* @region engine.db-sync (ENGINE, engine) */
function capOrNull(make, ms){
  try{
    if(!(window.claude && typeof window.claude.use === "function")) return Promise.resolve(null);
    return Promise.race([
      Promise.resolve(make()).catch(() => null),
      new Promise(done => setTimeout(() => done(null), ms || 12000))
    ]);
  }catch(e){ return Promise.resolve(null); }
}

/* P3.6 - two devices that both studied while offline. Newer still wins every
   conflict, and wins it per RECORD, so one topic row is never half from each
   device. What is new: a record only the OLDER side has is kept rather than
   dropped, because study records only ever accumulate and an evening's work
   lost to a clock comparison cannot be got back. Session fields (mode, cur,
   scroll, an unfinished set) come wholly from the newer side. */
function mergeProgress(newer, older){
  const out = Object.assign(blank(), newer);
  const map = o => (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
  const arr = a => Array.isArray(a) ? a : [];
  ["topics","qs","rapid","drills","spot","pre","sexp","stage","days"].forEach(k => {
    out[k] = Object.assign({}, map(older[k]), map(newer[k]));
  });
  out.linked = arr(older.linked).concat(arr(newer.linked).filter(x => arr(older.linked).indexOf(x) < 0));
  /* flags carry their own ts, so the later note on any one item wins; the list
     is rebuilt oldest-first, the order the rest of the page assumes. */
  const seen = {};
  arr(older.flags).concat(arr(newer.flags)).forEach(f => {
    if(!f || typeof f !== "object") return;
    const k = f.kind + ":" + f.id, p = seen[k];
    if(!p || (+f.ts || 0) >= (+p.ts || 0)) seen[k] = f;
  });
  out.flags = Object.keys(seen).map(k => seen[k]).sort((a,b) => (+a.ts || 0) - (+b.ts || 0));
  out.ts = Math.max(+newer.ts || 0, +older.ts || 0);
  return out;
}

/* P3.6 - progress used to live in ONE shared document, so a second signed-in
   person opening the link inherited the owner's study record and overwrote
   their own. It now lives in that viewer's private subtree, the path
   data/users/ + id + /progress, which the platform hides from every other
   viewer, the owner included. No db, no user, or no id means no sync at all:
   localStorage only, no error, nothing said. */
(async function syncDb(){
  try{
    const [db, user] = await Promise.all([
      capOrNull(() => claude.use("db")),
      capOrNull(() => claude.use("user"))
    ]);
    if(!db || !user || typeof user.id !== "function" || typeof db.doc !== "function") return;
    const uid = await user.id();   /* user reads never reject; null = no private subtree */
    if(!uid || typeof uid !== "string") return;
    DB = db; DBREF = db.doc("data/users/" + uid + "/progress");
    const snap = await DBREF.get();
    const raw = snap && typeof snap.data === "function" ? snap.data() : null;
    const remote = (raw && typeof raw === "object" && !Array.isArray(raw)) ? raw : null;
    if(!remote){ if(S.ts) pushDb(); return; }
    const was = JSON.stringify(S), fresher = (+remote.ts || 0) > (S.ts || 0);
    S = fresher ? mergeProgress(remote, S) : mergeProgress(S, remote);
    repairState();                 /* a copy written by an older build has no flags and no paceSetAt */
    if(JSON.stringify(S) !== was){ save(); render(); }   /* local gained something */
    else if((+remote.ts || 0) !== (S.ts || 0)) pushDb(); /* the remote copy is the one behind */
  }catch(e){}
})();

/* @region engine.helpers (ENGINE, engine) */
/* ---------------------------------------------------------------- helpers */
const el = id => document.getElementById(id);
function migrateRapidKeys(){
  /* v2 stored S.rapid under the array index. Move those records onto the new
     stable ids once, using the order they were written in. */
  const old = S.rapid || {}; if(!Object.keys(old).some(k => /^\d+$/.test(k))) return;
  const next = {};
  Object.keys(old).forEach(k => {
    if(/^\d+$/.test(k)){ const r = RAPID[+k]; if(r && r.i) next[r.i] = old[k]; }
    else next[k] = old[k];
  });
  S.rapid = next;
  S.linked = (S.linked||[]).map(x => /^\d+$/.test(String(x)) ? (RAPID[+x]||{}).i : x).filter(Boolean);
}
const ALLT = () => BLOCKS.flatMap(b => b.topics.map(t => Object.assign({blk:b}, t)));
const findT = id => ALLT().find(t => t.id === id);
/* P2.2 - two yield axes. t.yld is Step 1 yield, t.exam is how likely the topic is on the
   course exam; they differ by design. S.yAxis chooses the one that drives the rail dot,
   the high-yield filter, every yield badge and the priority weights in topicEvidence()
   and conceptThreads(). A topic missing one axis falls back to the other. */
const YAXES = {step1:"Step 1", exam:"course final"};
const yAxis = () => S.yAxis === "step1" ? "step1" : "exam";
const yv = t => { const v = !t ? "" : yAxis() === "step1" ? (t.yld || t.exam) : (t.exam || t.yld);
  return v === "hi" || v === "lo" ? v : "mid"; };
const yWord = t => ({hi:"high yield", mid:"mid yield", lo:"low yield"})[yv(t)];
const esc = s => String(s).replace(/&(?![a-z#0-9]+;)/gi,"&amp;").replace(/</g,"&lt;");
const pct = (n,d) => d ? Math.round(100*n/d) : 0;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
/* P6 cleanup - this only deleted the glossary DELIMITERS, so a link written as
   key then bar then label survived as "foamcell|foam cells" wherever plain text
   is wanted. The image-annotation aria-label is built here, so a screen reader
   read the raw key out loud. Expand the pair the way fmt() does - label if there
   is one, else the key - then keep the old sweep for any unpaired delimiter. */
const stripTags = s => String(s)
  .replace(/\{\{(.+?)\}\}/g, (m,x)=>{ const p = x.split("|"); return p[1] || p[0]; })
  .replace(/\[\[(.+?)\]\]/g, "$1")
  .replace(/\[\[|\]\]|\{\{|\}\}|\*\*/g,"").replace(/<[^>]+>/g,"");
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function examCeiling(){
  const e = +EXAM, now = Date.now();
  /* A date already gone gave a ceiling two days further gone, so every
     Math.min(when, ceiling) landed behind now, every item stayed due forever and
     the boxes stopped meaning anything. A passed exam caps nothing. All four
     callers are Math.min(now + gap, ceiling) with gap > 0, so Infinity degrades
     to "no cap" rather than reaching state as an Infinity or a NaN. */
  if(!isFinite(e) || e <= now) return Infinity;
  /* everything gets one last pass two days out */
  const last = e - LAST_PASS_MS;
  if(last > now) return last;
  /* P2.V F6 - inside the last 48 h "two days out" is already behind now: with the
     exam tomorrow a correct answer was given a due date the day before, stayed due
     for ever and sat on top of the plan. The last pass lands halfway between now and
     the exam instead, so the ceiling is always after now and before the exam. */
  return now + (e - now) / 2;
}
/* hold: a right answer that does not earn a step (a slow rapid pick) stays on the step it is on, the first one
   for an item never seen. It used to be promoted and then moved down a box, which at the top step
   dropped it from 14 days to 7 where every lower step simply held. */
function promote(rec, ok, hold){
  rec.box = ok ? (hold ? Math.max(rec.box||0, 1) : Math.min((rec.box||0)+1, BOXES.length-1)) : Math.max((rec.box||0)-1, 1);

/* An item never seen is NOT due -- it is new. Mixing the two made the due queue

const isDue    = rec => !!rec && rec.box > 0 && (!rec.due || rec.due <= Date.now());
const overdue  = rec => { if(!isDue(rec)) return 0;
  const gap = Math.max(60e3, BOXES[rec.box||1] || 60e3);
  return (Date.now() - (rec.due || Date.now())) / gap + 1; };

function fmt(s){
