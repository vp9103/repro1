<svg class="dia" viewBox="0 0 900 588" role="img" aria-label="Endometrium in layers and by day after ovulation: the functionalis is shed each cycle, the basalis regrows it, and the glands show subnuclear vacuoles at 2 days, stromal edema at 7 days and predecidual cells later, until falling progesterone brings prostaglandins and menses">
<text class="ttl" x="14" y="24" font-size="17">The endometrium: the basalis survives, progesterone dates the functionalis</text>
<rect x="14" y="40" width="290" height="534" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text class="b" x="28" y="66" font-size="15">Layers and blood supply</text>
<rect x="30" y="82" width="258" height="214" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<text class="b" x="44" y="108" font-size="15">Stratum functionalis</text>
<text x="44" y="130" font-size="13">Compacta and spongiosa</text>
<text x="44" y="156" font-size="13">Grown by estradiol,</text>
<text x="44" y="174" font-size="13">matured by progesterone</text>
<text x="44" y="204" font-size="13">Fed by spiral arteries</text>
<text x="44" y="222" font-size="13">that coil and then spasm</text>
<text class="b" x="44" y="252" font-size="14">Shed at every menses</text>
<path d="M268 94 q12 12 0 24 t0 24 t0 24 t0 24 t0 24 t0 24 t0 24 t0 24" fill="none" stroke="var(--crit)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="304" width="258" height="130" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.4"/>
<text class="b" x="44" y="330" font-size="15">Stratum basalis</text>
<text x="44" y="352" font-size="13">Fed by straight arteries</text>
<text class="b" x="44" y="380" font-size="14">Never shed: it regrows</text>
<text class="b" x="44" y="400" font-size="14">the functionalis each cycle</text>
<line x1="268" y1="316" x2="268" y2="424" stroke="var(--a2)" stroke-width="3"/>
<rect x="30" y="442" width="258" height="40" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="44" y="468" font-size="14">Myometrium</text>
<rect x="30" y="494" width="258" height="66" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/>
<text x="44" y="520" font-size="13">Curettage through the basalis:</text>
<text class="wn" x="44" y="542" font-size="13">Asherman syndrome: scarring</text>
<rect x="318" y="40" width="568" height="534" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text class="b" x="334" y="66" font-size="15">Days after ovulation: the histologic clock</text>
<text x="334" y="86" font-size="13">Day 0 is ovulation, day 14 of a 28-day cycle</text>
<rect x="334" y="100" width="136" height="54" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="346" y="133" font-size="15">Before</text>
<rect x="480" y="100" width="392" height="54" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="492" y="124" font-size="14">Straight glands, many mitoses</text>
<text x="492" y="144" font-size="13">Estradiol drives the proliferative phase</text>
<rect x="334" y="164" width="136" height="54" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<text class="b" x="346" y="197" font-size="15">+2 days</text>
<rect x="480" y="164" width="392" height="54" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="492" y="188" font-size="14">Subnuclear vacuoles</text>
<text x="492" y="208" font-size="13">First sign of progesterone; no stromal edema yet</text>
<rect x="334" y="228" width="136" height="54" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<text class="b" x="346" y="261" font-size="15">+3 to 4 days</text>
<rect x="480" y="228" width="392" height="54" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="492" y="252" font-size="14">Vacuoles move above the nuclei</text>
<text x="492" y="272" font-size="13">Glands coil further</text>
<rect x="334" y="292" width="136" height="54" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<text class="b" x="346" y="325" font-size="15">+5 to 6 days</text>
<rect x="480" y="292" width="392" height="54" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="492" y="316" font-size="14">Secretions fill the lumens</text>
<text x="492" y="336" font-size="13">Coiled glands, glycogen-rich fluid</text>
<rect x="334" y="356" width="136" height="54" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<text class="b" x="346" y="389" font-size="15">+7 days</text>
<rect x="480" y="356" width="392" height="54" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="492" y="380" font-size="14">Stromal edema peaks</text>
<text x="492" y="400" font-size="13">Timed to implantation of the blastocyst</text>
<rect x="334" y="420" width="136" height="54" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<text class="b" x="346" y="453" font-size="15">+9 to 13 days</text>
<rect x="480" y="420" width="392" height="54" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="492" y="444" font-size="14">Predecidual cells, spiral arteries</text>
<text x="492" y="464" font-size="13">Cells around the vessels swell and grow plump</text>
<rect x="334" y="484" width="136" height="54" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.4"/>
<text class="b" x="346" y="517" font-size="15">+14 days</text>
<rect x="480" y="484" width="392" height="54" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="492" y="508" font-size="14">Progesterone falls: prostaglandins surge</text>
<text x="492" y="528" font-size="13">Spiral arteries spasm: ischemia, cramps, menses</text>
</svg>
