<svg class="dia" viewBox="0 0 900 560" role="img" aria-label="Five lenses for analyzing a reproductive case (clinical, ethical, legal, psychosocial, health equity), the three sources of obligation that can disagree (law, ethics, clinical judgment), and a worked case of a 15-year-old who asks for confidential contraception">
<text class="ttl" x="14" y="24" font-size="17">Law, ethics and clinical judgment ask different questions</text>
<rect x="14" y="40" width="432" height="296" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.4"/>
<rect x="14" y="40" width="432" height="34" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.4"/>
<text class="b" x="26" y="63" font-size="15">Five lenses on one case</text>
<text class="b" x="26" y="100" font-size="14">Clinical</text>
<text x="26" y="120" font-size="14">What are the diagnosis, the risk and the best treatment?</text>
<text class="b" x="26" y="150" font-size="14">Ethical</text>
<text x="26" y="170" font-size="14">Autonomy, beneficence, nonmaleficence and justice</text>
<text class="b" x="26" y="200" font-size="14">Legal</text>
<text x="26" y="220" font-size="14">What do state law and reporting duties require?</text>
<text class="b" x="26" y="250" font-size="14">Psychosocial</text>
<text x="26" y="270" font-size="14">Family, culture, trauma, safety and support</text>
<text class="b" x="26" y="300" font-size="14">Health equity</text>
<text x="26" y="320" font-size="14">Which barriers, history and bias shape access?</text>
<rect x="454" y="40" width="432" height="296" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.4"/>
<rect x="454" y="40" width="432" height="34" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/>
<text class="b" x="466" y="63" font-size="15">Three answers that can disagree</text>
<rect x="466" y="84" width="408" height="68" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.3"/>
<text class="b" x="478" y="106" font-size="14">Law</text>
<text x="478" y="126" font-size="14">Sets duties and limits: mandatory reporting,</text>
<text x="478" y="145" font-size="14">state consent law and the standard of care</text>
<rect x="466" y="160" width="408" height="84" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.3"/>
<text class="b" x="478" y="182" font-size="14">Ethics</text>
<text x="478" y="202" font-size="14">Says what ought to be done: respect for persons,</text>
<text x="478" y="221" font-size="14">justice, and conscientious objection with a</text>
<text x="478" y="240" font-size="14">duty to refer and not to abandon</text>
<rect x="466" y="252" width="408" height="68" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.3"/>
<text class="b" x="478" y="274" font-size="14">Clinical judgment</text>
<text x="478" y="294" font-size="14">Weighs risk, benefit and the patient's goals</text>
<text x="478" y="313" font-size="14">for this patient at this time</text>
<rect x="14" y="348" width="872" height="34" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="26" y="371" font-size="15">Worked case: a 15-year-old asks for contraception and asks that her parents not be told</text>
<rect x="14" y="392" width="168" height="110" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text class="b" x="24" y="416" font-size="14">Clinical</text>
<text x="24" y="440" font-size="14">Progestin or LARC;</text>
<text x="24" y="461" font-size="14">offer infection</text>
<text x="24" y="482" font-size="14">testing</text>
<rect x="190" y="392" width="168" height="110" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text class="b" x="200" y="416" font-size="14">Ethical</text>
<text x="200" y="440" font-size="14">Autonomy and</text>
<text x="200" y="461" font-size="14">confidentiality</text>
<text x="200" y="482" font-size="14">support access</text>
<rect x="366" y="392" width="168" height="110" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text class="b" x="376" y="416" font-size="14">Legal</text>
<text x="376" y="440" font-size="14">Minors may consent</text>
<text x="376" y="461" font-size="14">in most states;</text>
<text x="376" y="482" font-size="14">report abuse</text>
<rect x="542" y="392" width="168" height="110" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text class="b" x="552" y="416" font-size="14">Psychosocial</text>
<text x="552" y="440" font-size="14">Ask if sex is</text>
<text x="552" y="461" font-size="14">consensual; screen</text>
<text x="552" y="482" font-size="14">for safety</text>
<rect x="718" y="392" width="168" height="110" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text class="b" x="728" y="416" font-size="14">Health equity</text>
<text x="728" y="440" font-size="14">Confidential, low-</text>
<text x="728" y="461" font-size="14">cost access with</text>
<text x="728" y="482" font-size="14">no judgment</text>
<text x="14" y="530" font-size="14">The answers agree here, but they can diverge: a report to authorities may be required even when she asks for secrecy.</text>
</svg>
