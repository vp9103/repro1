<text x="470" y="424" font-size="14">Pelvic fracture: urine enters the deep pouch</text>
<text x="470" y="448" font-size="14">and rises into the retropubic space</text>
<text x="470" y="472" font-size="14">Scrotum and penis usually stay dry</text>
<text class="a2" x="470" y="500" font-size="14">High-riding prostate, blood at the meatus</text>
<text class="a2" x="470" y="524" font-size="14">Retrograde urethrogram before a catheter</text>
