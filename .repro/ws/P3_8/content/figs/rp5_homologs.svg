<svg class="dia" viewBox="0 0 900 458" role="img" aria-label="Genital homologs: the genital tubercle, urogenital folds, labioscrotal swellings, urogenital sinus, gubernaculum and processus vaginalis each shown in the middle with the male structure on the left and the female structure on the right">
<text class="ttl" x="14" y="24" font-size="17">One primordium, two outcomes: the genital homologs</text>
<rect x="14" y="38" width="290" height="42" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="28" y="65" font-size="16">Male</text>
<rect x="314" y="38" width="272" height="42" rx="8" fill="var(--surface-3)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="328" y="65" font-size="16">Indifferent structure</text>
<rect x="596" y="38" width="290" height="42" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="610" y="65" font-size="16">Female</text>
<rect x="14" y="90" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="28" y="122" font-size="15">Glans penis</text>
<rect x="314" y="90" width="272" height="52" rx="6" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="328" y="122" font-size="15">Genital tubercle</text>
<rect x="596" y="90" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="610" y="122" font-size="15">Glans clitoris</text>
<rect x="14" y="150" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="28" y="182" font-size="15">Ventral shaft, spongy urethra</text>
<rect x="314" y="150" width="272" height="52" rx="6" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="328" y="182" font-size="15">Urogenital folds</text>
<rect x="596" y="150" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="610" y="182" font-size="15">Labia minora</text>
<rect x="14" y="210" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="28" y="242" font-size="15">Scrotum</text>
<rect x="314" y="210" width="272" height="52" rx="6" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="328" y="242" font-size="15">Labioscrotal swellings</text>
<rect x="596" y="210" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="610" y="242" font-size="15">Labia majora</text>
<rect x="14" y="270" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="28" y="302" font-size="15">Prostate, bulbourethral glands</text>
<rect x="314" y="270" width="272" height="52" rx="6" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="328" y="302" font-size="15">Urogenital sinus</text>
<rect x="596" y="270" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="610" y="302" font-size="15">Skene and Bartholin glands</text>
<rect x="14" y="330" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="28" y="362" font-size="15">Anchors testis in scrotum</text>
<rect x="314" y="330" width="272" height="52" rx="6" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="328" y="362" font-size="15">Gubernaculum</text>
<rect x="596" y="330" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="610" y="362" font-size="15">Ovarian and round ligaments</text>
<rect x="14" y="390" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="28" y="422" font-size="15">Tunica vaginalis</text>
<rect x="314" y="390" width="272" height="52" rx="6" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="328" y="422" font-size="15">Processus vaginalis</text>
<rect x="596" y="390" width="290" height="52" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="610" y="422" font-size="15">Normally obliterates</text>
</svg>
