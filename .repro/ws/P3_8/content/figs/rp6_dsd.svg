<svg class="dia" viewBox="0 0 900 608" role="img" aria-label="Disorders of sex development compared across gonads, uterus, androgen and clinical clue: Swyer syndrome, complete androgen insensitivity and 5-alpha-reductase deficiency in 46,XY; Müllerian agenesis, 46,XX testicular DSD, 21-hydroxylase deficiency and placental aromatase deficiency in 46,XX">
<text class="ttl" x="14" y="26" font-size="18">Four facts sort each disorder: karyotype, gonad, uterus, androgen</text>
<rect x="14" y="44" width="872" height="34" rx="6" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="67" font-size="14">Condition</text>
<text class="b" x="214" y="67" font-size="14">Gonads</text>
<text class="b" x="342" y="67" font-size="14">Uterus and tubes</text>
<text class="b" x="490" y="67" font-size="14">Androgen</text>
<text class="b" x="658" y="67" font-size="14">Clinical clue</text>
<rect x="14" y="82" width="872" height="26" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="101" font-size="14">46,XY: a Y chromosome is present</text>
<rect x="14" y="112" width="872" height="52" rx="4" fill="var(--surface-2)" stroke="none" stroke-width="0"/>
<text class="b" x="28" y="134" font-size="14">Swyer syndrome</text>
<text class="b" x="28" y="154" font-size="14">(SRY defect)</text>
<text x="214" y="134" font-size="14">Streak gonads</text>
<text x="214" y="154" font-size="14">(no hormones)</text>
<text x="342" y="134" font-size="14">Present</text>
<text x="342" y="154" font-size="14">no AMH made</text>
<text x="490" y="134" font-size="14">Testosterone and</text>
<text x="490" y="154" font-size="14">DHT both low</text>
<text x="658" y="134" font-size="14">Gonadoblastoma risk;</text>
<text x="658" y="154" font-size="14">remove the streaks</text>
<text class="b" x="28" y="190" font-size="14">Complete androgen</text>
<text class="b" x="28" y="210" font-size="14">insensitivity</text>
<text x="214" y="190" font-size="14">Testes</text>
<text x="214" y="210" font-size="14">may be inguinal</text>
<text x="342" y="190" font-size="14">Absent</text>
<text x="342" y="210" font-size="14">AMH removed it</text>
<text x="490" y="190" font-size="14">High, but cannot</text>
<text x="490" y="210" font-size="14">act (receptor)</text>
<text x="658" y="190" font-size="14">Breasts; sparse pubic</text>
<text x="658" y="210" font-size="14">and axillary hair</text>
<rect x="14" y="224" width="872" height="52" rx="4" fill="var(--surface-2)" stroke="none" stroke-width="0"/>
<text class="b" x="28" y="246" font-size="14">5-alpha-reductase</text>
<text class="b" x="28" y="266" font-size="14">deficiency</text>
<text x="214" y="246" font-size="14">Testes</text>
<text x="214" y="266" font-size="14">(work normally)</text>
<text x="342" y="246" font-size="14">Absent</text>
<text x="342" y="266" font-size="14">AMH removed it</text>
<text x="490" y="246" font-size="14">Testosterone normal,</text>
<text x="490" y="266" font-size="14">DHT low</text>
<text x="658" y="246" font-size="14">Ambiguous at birth;</text>
<text x="658" y="266" font-size="14">virilizes at puberty</text>
<rect x="14" y="282" width="872" height="26" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="28" y="301" font-size="14">46,XX: no Y chromosome</text>
<rect x="14" y="312" width="872" height="52" rx="4" fill="var(--surface-2)" stroke="none" stroke-width="0"/>
<text class="b" x="28" y="334" font-size="14">Müllerian agenesis</text>
<text class="b" x="28" y="354" font-size="14">(MRKH)</text>
<text x="214" y="334" font-size="14">Normal ovaries</text>
<text x="214" y="354" font-size="14">(work normally)</text>
<text x="342" y="334" font-size="14">Absent</text>
<text x="342" y="354" font-size="14">no ducts formed</text>
<text x="490" y="334" font-size="14">Normal female</text>
<text x="490" y="354" font-size="14">range</text>
<text x="658" y="334" font-size="14">Normal pubic hair;</text>
<text x="658" y="354" font-size="14">renal anomalies</text>
<text class="b" x="28" y="390" font-size="14">46,XX testicular</text>
<text class="b" x="28" y="410" font-size="14">DSD</text>
<text x="214" y="390" font-size="14">Testes</text>
<text x="214" y="410" font-size="14">(small)</text>
<text x="342" y="390" font-size="14">Absent</text>
<text x="342" y="410" font-size="14">AMH made</text>
<text x="490" y="390" font-size="14">Testosterone made</text>
<text x="490" y="410" font-size="14">by the testes</text>
<text x="658" y="390" font-size="14">SRY translocation onto</text>
<text x="658" y="410" font-size="14">an X; azoospermia</text>
<rect x="14" y="424" width="872" height="52" rx="4" fill="var(--surface-2)" stroke="none" stroke-width="0"/>
<text class="b" x="28" y="446" font-size="14">21-hydroxylase</text>
<text class="b" x="28" y="466" font-size="14">deficiency (CAH)</text>
<text x="214" y="446" font-size="14">Ovaries</text>
<text x="214" y="466" font-size="14">(normal)</text>
<text x="342" y="446" font-size="14">Present</text>
<text x="342" y="466" font-size="14">with tubes</text>
<text x="490" y="446" font-size="14">Adrenal androgens</text>
<text x="490" y="466" font-size="14">high; 17-OHP high</text>
<text x="658" y="446" font-size="14">Virilized; salt wasting</text>
<text x="658" y="466" font-size="14">in severe forms</text>
<text class="b" x="28" y="502" font-size="14">Placental aromatase</text>
<text class="b" x="28" y="522" font-size="14">deficiency</text>
<text x="214" y="502" font-size="14">Ovaries</text>
<text x="214" y="522" font-size="14">(cysts later)</text>
<text x="342" y="502" font-size="14">Present</text>
<text x="342" y="522" font-size="14">no AMH made</text>
<text x="490" y="502" font-size="14">Androgens high,</text>
<text x="490" y="522" font-size="14">estrogen low</text>
<text x="658" y="502" font-size="14">Maternal virilization;</text>
<text x="658" y="522" font-size="14">low estriol</text>
<rect x="14" y="540" width="872" height="56" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="564" font-size="15">Uterus present: no testis made AMH. Uterus absent: a testis did.</text>
<text x="28" y="586" font-size="14">The one link that fails names the diagnosis.</text>
</svg>
