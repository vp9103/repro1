<svg class="dia" viewBox="0 0 900 480" role="img" aria-label="Breast lesions by age: fibroadenoma under 35, fibrocystic change until menopause, intraductal papilloma in the 30s to 50s, phyllodes tumor around 50, duct ectasia in the 50s and 60s and carcinoma after menopause; in men, gynecomastia peaks in newborns, puberty and older age, and male breast cancer occurs late">
<text class="ttl" x="14" y="24" font-size="17">Which breast lesion is most likely at each age</text>
<text class="b" x="14" y="58" font-size="15">Women</text>
<text x="14" y="88" font-size="15">Fibroadenoma</text>
<rect x="344" y="70" width="165" height="26" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text x="352" y="88" font-size="14">Mobile, rubbery</text>
<text x="14" y="124" font-size="15">Fibrocystic change</text>
<rect x="385" y="106" width="256" height="26" rx="6" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text x="393" y="124" font-size="14">Premenopausal, cyclic pain</text>
<text x="14" y="160" font-size="15">Intraductal papilloma</text>
<rect x="468" y="142" width="206" height="26" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="476" y="160" font-size="14">Bloody discharge</text>
<text x="14" y="196" font-size="15">Phyllodes tumor</text>
<rect x="550" y="178" width="206" height="26" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="558" y="196" font-size="14">Large, fast-growing</text>
<text x="14" y="232" font-size="15">Duct ectasia</text>
<rect x="591" y="214" width="206" height="26" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="599" y="232" font-size="14">Green-brown discharge</text>
<text x="14" y="268" font-size="15">Carcinoma</text>
<rect x="633" y="250" width="247" height="26" rx="6" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="641" y="268" font-size="14">Postmenopausal, hard mass</text>
<text class="b" x="14" y="318" font-size="15">Men</text>
<text x="14" y="348" font-size="15">Gynecomastia</text>
<rect x="220" y="330" width="12" height="26" rx="4" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<rect x="319" y="330" width="41" height="26" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<rect x="633" y="330" width="247" height="26" rx="6" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text x="641" y="348" font-size="14">Centered under the areola</text>
<text x="210" y="374" font-size="13">Newborn</text>
<text x="310" y="374" font-size="13">Puberty</text>
<text x="14" y="402" font-size="15">Male breast cancer</text>
<rect x="715" y="384" width="165" height="26" rx="6" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text x="723" y="402" font-size="14">Hard, eccentric mass</text>
<line x1="220" y1="430" x2="880" y2="430" stroke="var(--ink-2)" stroke-width="1.5"/>
<g stroke="var(--ink-2)" stroke-width="1.5">
<line x1="220" y1="430" x2="220" y2="437"/><line x1="302.5" y1="430" x2="302.5" y2="437"/><line x1="385" y1="430" x2="385" y2="437"/><line x1="467.5" y1="430" x2="467.5" y2="437"/><line x1="550" y1="430" x2="550" y2="437"/><line x1="632.5" y1="430" x2="632.5" y2="437"/><line x1="715" y1="430" x2="715" y2="437"/><line x1="797.5" y1="430" x2="797.5" y2="437"/><line x1="880" y1="430" x2="880" y2="437"/>
</g>
<g font-size="14" text-anchor="middle">
<text x="226" y="454" font-size="14">0</text><text x="302.5" y="454" font-size="14" text-anchor="middle">10</text><text x="385" y="454" font-size="14" text-anchor="middle">20</text><text x="467.5" y="454" font-size="14" text-anchor="middle">30</text><text x="550" y="454" font-size="14" text-anchor="middle">40</text><text x="632.5" y="454" font-size="14" text-anchor="middle">50</text><text x="715" y="454" font-size="14" text-anchor="middle">60</text><text x="797.5" y="454" font-size="14" text-anchor="middle">70</text><text x="872" y="454" font-size="14" text-anchor="middle">80</text>
</g>
<text class="b" x="14" y="454" font-size="15">Age in years</text>
</svg>
