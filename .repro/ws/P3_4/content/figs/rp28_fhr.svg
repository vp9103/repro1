<text x="26" y="282" font-size="14">Nadir lines up with the peak</text>
<text class="b" x="26" y="308" font-size="14">Head compression</text>
<text x="26" y="334" font-size="14">Vagal reflex, benign</text>
<text class="gd" x="26" y="360" font-size="14">No action needed</text>
<text x="324" y="282" font-size="14">Abrupt drop, any timing</text>
<text class="b" x="324" y="308" font-size="14">Cord compression</text>
