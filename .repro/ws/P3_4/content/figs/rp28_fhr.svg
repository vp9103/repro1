<text x="622" y="282" font-size="14">Nadir after the peak</text>
<text class="b" x="622" y="308" font-size="14">Uteroplacental insufficiency</text>
<text x="622" y="334" font-size="14">Fetal hypoxia</text>
<text class="cr" x="622" y="360" font-size="14">Stop oxytocin, resuscitate</text>
