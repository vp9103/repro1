<text x="28" y="432" font-size="14">Reassuring: baseline 110 to 160/min, moderate variability, accelerations</text>
<text x="28" y="456" font-size="14">Sinusoidal: severe fetal anemia. Absent variability with recurrent lates: acidemia</text>
