<svg class="dia" viewBox="0 0 900 470" role="img" aria-label="Testicular torsion compared with epididymitis: a bell-clapper testis twisting its spermatic cord, and a grid of seven bedside discriminators including onset, testis position, cremasteric reflex, Prehn sign and Doppler flow">
<text class="ttl" x="14" y="24" font-size="17">Testicular torsion or epididymitis? Read the bedside signs</text>
<rect x="14" y="44" width="290" height="412" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="70" font-size="16">Bell-clapper deformity</text>
<path d="M150 86 C 172 108, 146 128, 170 150" fill="none" stroke="var(--a1)" stroke-width="3"/>
<path d="M170 86 C 148 108, 174 128, 150 150" fill="none" stroke="var(--a1)" stroke-width="3"/>
<ellipse cx="160" cy="228" rx="84" ry="70" fill="none" stroke="var(--a2)" stroke-width="2" stroke-dasharray="6 4"/>
<ellipse cx="160" cy="232" rx="58" ry="36" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="2"/>
<line x1="160" y1="150" x2="160" y2="196" stroke="var(--a1)" stroke-width="3"/>
<text x="28" y="330" font-size="15">Testis hangs free, horizontal</text>
<text x="28" y="354" font-size="15">Twisted spermatic cord</text>
<text x="28" y="378" font-size="15">Thin-walled veins close first</text>
<text x="28" y="402" font-size="15">Congestion, then</text>
<text class="cr" x="28" y="426" font-size="15">hemorrhagic infarction</text>
<rect x="320" y="44" width="170" height="412" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<rect x="498" y="44" width="192" height="412" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<rect x="698" y="44" width="188" height="412" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="332" y="72" font-size="15">Feature</text>
<text class="b" x="510" y="72" font-size="15">Torsion</text>
<text class="b" x="710" y="72" font-size="15">Epididymitis</text>
<line x1="320" y1="86" x2="886" y2="86" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="332" y="118" font-size="15">Onset</text>
<text x="510" y="118" font-size="15">Sudden, minutes</text>
<text x="710" y="118" font-size="15">Gradual, days</text>
<line x1="320" y1="138" x2="886" y2="138" stroke="var(--line)" stroke-width="1"/>
<text x="332" y="170" font-size="15">Typical patient</text>
<text x="510" y="170" font-size="15">Adolescent boy</text>
<text x="710" y="170" font-size="15">Sexually active man</text>
<line x1="320" y1="190" x2="886" y2="190" stroke="var(--line)" stroke-width="1"/>
<text x="332" y="222" font-size="15">Testis position</text>
<text x="510" y="222" font-size="15">High, horizontal lie</text>
<text x="710" y="222" font-size="15">Normal lie</text>
<line x1="320" y1="242" x2="886" y2="242" stroke="var(--line)" stroke-width="1"/>
<text x="332" y="274" font-size="14">Cremasteric reflex</text>
<text x="510" y="274" font-size="15">Absent</text>
<text x="710" y="274" font-size="15">Present</text>
<line x1="320" y1="294" x2="886" y2="294" stroke="var(--line)" stroke-width="1"/>
<text x="332" y="326" font-size="15">Lifting testis</text>
<text x="510" y="326" font-size="15">No relief</text>
<text x="710" y="326" font-size="15">Relief: Prehn sign</text>
<line x1="320" y1="346" x2="886" y2="346" stroke="var(--line)" stroke-width="1"/>
<text x="332" y="378" font-size="15">Doppler flow</text>
<text x="510" y="378" font-size="15">Absent or reduced</text>
<text x="710" y="378" font-size="15">Increased</text>
<line x1="320" y1="398" x2="886" y2="398" stroke="var(--line)" stroke-width="1"/>
<text x="332" y="430" font-size="15">Treatment</text>
<text class="b" x="510" y="430" font-size="15">Surgery in hours</text>
<text x="710" y="430" font-size="15">Antibiotics</text>
</svg>
