<svg class="dia" viewBox="0 0 900 460" role="img" aria-label="Turner syndrome (45,X) and Klinefelter syndrome (47,XXY) compared: the gonad, the hormone pattern and the signature findings, with high FSH and LH in both">
<text class="ttl" x="14" y="24" font-size="17">Turner and Klinefelter: two karyotypes, one gonadal failure pattern</text>
<rect x="14" y="44" width="428" height="340" rx="10" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="30" y="74" font-size="16">Turner syndrome: 45,X</text>
<text x="30" y="112" font-size="15">Streak ovaries, no estrogen</text>
<text x="30" y="146" font-size="15">Primary amenorrhea, FSH and LH high</text>
<text x="30" y="180" font-size="15">Short stature from SHOX loss</text>
<text x="30" y="214" font-size="15">Cystic hygroma, then webbed neck</text>
<text x="30" y="248" font-size="15">Lymphedema of hands and feet</text>
<text x="30" y="282" font-size="15">Bicuspid aortic valve, coarctation</text>
<text x="30" y="316" font-size="15">Horseshoe kidney, shield chest</text>
<text x="30" y="350" font-size="15">No Barr body</text>
<rect x="458" y="44" width="428" height="340" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="474" y="74" font-size="16">Klinefelter syndrome: 47,XXY</text>
<text x="474" y="112" font-size="15">Small, firm testes, infertile</text>
<text x="474" y="146" font-size="15">Inhibin B low, so FSH high</text>
<text x="474" y="180" font-size="15">Testosterone low, so LH high</text>
<text x="474" y="214" font-size="15">LH drives aromatase: gynecomastia</text>
<text x="474" y="248" font-size="15">Tall with long legs</text>
<text x="474" y="282" font-size="15">Female pattern of hair and fat</text>
<text x="474" y="316" font-size="15">Higher male breast cancer risk</text>
<text x="474" y="350" font-size="15">Barr body present</text>
<rect x="14" y="396" width="872" height="48" rx="10" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="30" y="426" font-size="15">Both: hypergonadotropic hypogonadism; the karyotype makes the diagnosis</text>
</svg>
