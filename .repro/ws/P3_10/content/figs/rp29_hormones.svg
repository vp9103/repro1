<svg class="dia" viewBox="0 0 900 558" role="img" aria-label="Comparison of feminizing therapy, puberty blockers and masculinizing therapy by drugs, mechanism, expected changes, key risks and monitoring">
<text class="ttl" x="14" y="26" font-size="17">Gender-affirming hormones: what each regimen does and what to watch</text>
<rect x="14" y="44" width="140" height="40" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="24" y="69" font-size="15">Feature</text>
<rect x="162" y="44" width="236" height="40" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="174" y="69" font-size="16">Feminizing</text>
<rect x="404" y="44" width="236" height="40" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="416" y="69" font-size="16">Puberty blocker</text>
<rect x="646" y="44" width="240" height="40" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="658" y="69" font-size="16">Masculinizing</text>
<rect x="14" y="90" width="140" height="64" rx="6" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="24" y="116" font-size="15">Drugs</text>
<rect x="162" y="90" width="236" height="64" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="174" y="115" font-size="14">Estradiol + spironolactone</text>
<text x="174" y="136" font-size="14">or a GnRH agonist</text>
<rect x="404" y="90" width="236" height="64" rx="6" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text x="416" y="115" font-size="14">Continuous GnRH agonist</text>
<text x="416" y="136" font-size="14">(leuprolide, histrelin)</text>
<rect x="646" y="90" width="240" height="64" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="658" y="115" font-size="14">Testosterone</text>
<text x="658" y="136" font-size="14">(injection or gel)</text>
<rect x="14" y="160" width="140" height="85" rx="6" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="24" y="186" font-size="15">How it works</text>
<rect x="162" y="160" width="236" height="85" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="174" y="185" font-size="14">Estradiol suppresses LH;</text>
<text x="174" y="206" font-size="14">spironolactone blocks</text>
<text x="174" y="227" font-size="14">androgen receptors</text>
<rect x="404" y="160" width="236" height="85" rx="6" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text x="416" y="185" font-size="14">Constant GnRH signal</text>
<text x="416" y="206" font-size="14">downregulates receptors,</text>
<text x="416" y="227" font-size="14">so LH and FSH fall</text>
<rect x="646" y="160" width="240" height="85" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="658" y="185" font-size="14">Testosterone binds the</text>
<text x="658" y="206" font-size="14">androgen receptor and</text>
<text x="658" y="227" font-size="14">suppresses LH and FSH</text>
<rect x="14" y="251" width="140" height="85" rx="6" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="24" y="277" font-size="15">Changes</text>
<rect x="162" y="251" width="236" height="85" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="174" y="276" font-size="14">Breast growth, softer skin;</text>
<text x="174" y="297" font-size="14">smaller testes, fewer</text>
<text x="174" y="318" font-size="14">erections, less sperm</text>
<rect x="404" y="251" width="236" height="85" rx="6" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text x="416" y="276" font-size="14">Puberty pauses and</text>
<text x="416" y="297" font-size="14">resumes if stopped</text>
<text x="416" y="318" font-size="14">(reversible)</text>
<rect x="646" y="251" width="240" height="85" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="658" y="276" font-size="14">Deeper voice, facial hair,</text>
<text x="658" y="297" font-size="14">clitoral growth, acne;</text>
<text x="658" y="318" font-size="14">menses stop</text>
<rect x="14" y="342" width="140" height="64" rx="6" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="24" y="368" font-size="15">Key risks</text>
<rect x="162" y="342" width="236" height="64" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="174" y="367" font-size="14">VTE, highest with oral</text>
<text x="174" y="388" font-size="14">estrogen; hyperkalemia</text>
<rect x="404" y="342" width="236" height="64" rx="6" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text x="416" y="367" font-size="14">Lower bone accrual;</text>
<text x="416" y="388" font-size="14">fertility concerns</text>
<rect x="646" y="342" width="240" height="64" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="658" y="367" font-size="14">Erythrocytosis, low HDL,</text>
<text x="658" y="388" font-size="14">vaginal atrophy</text>
<rect x="14" y="412" width="140" height="64" rx="6" fill="var(--surface-2)" stroke="var(--line)" stroke-width="1.2"/>
<text class="b" x="24" y="438" font-size="15">Monitor</text>
<rect x="162" y="412" width="236" height="64" rx="6" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text x="174" y="437" font-size="14">Potassium, estradiol,</text>
<text x="174" y="458" font-size="14">testosterone levels</text>
<rect x="404" y="412" width="236" height="64" rx="6" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text x="416" y="437" font-size="14">Bone density, growth,</text>
<text x="416" y="458" font-size="14">Tanner stage</text>
<rect x="646" y="412" width="240" height="64" rx="6" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text x="658" y="437" font-size="14">Hematocrit, lipids,</text>
<text x="658" y="458" font-size="14">testosterone level</text>
<rect x="14" y="488" width="872" height="58" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="28" y="512" font-size="15">Neither estradiol nor testosterone is contraception.</text>
<text x="28" y="534" font-size="14">Plan contraception and fertility preservation before the first dose.</text>
</svg>
