<svg class="dia" viewBox="0 0 900 400" role="img" aria-label="Four stages of the fallopian tube in pelvic inflammatory disease: a normal tube with delicate folds and an open fringed end, acute salpingitis with neutrophils and pus in the lumen, a sealed pus-filled pyosalpinx that can fuse with the ovary as a tubo-ovarian abscess, and a scarred hydrosalpinx filled with clear fluid">
<text class="ttl" x="14" y="26" font-size="17">What the fallopian tube looks like at each stage of PID</text>
<rect x="14" y="44" width="210" height="268" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<rect x="234" y="44" width="210" height="268" rx="10" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.2"/>
<rect x="454" y="44" width="210" height="268" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.2"/>
<rect x="674" y="44" width="212" height="268" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.2"/>
<text class="b" x="30" y="72" font-size="15">1  Normal tube</text>
<text class="b" x="250" y="72" font-size="15">2  Acute salpingitis</text>
<text class="b" x="470" y="72" font-size="15">3  Pyosalpinx</text>
<text class="b" x="690" y="72" font-size="15">4  Hydrosalpinx</text>
<rect x="34" y="136" width="128" height="28" rx="14" fill="var(--surface-2)" stroke="var(--ink-3)" stroke-width="1.6"/>
<polyline points="46,150 58,141 70,159 82,141 94,159 106,141 118,159 130,141 142,159 152,150" fill="none" stroke="var(--a1)" stroke-width="1.6"/>
<line x1="162" y1="144" x2="188" y2="122" stroke="var(--ink-3)" stroke-width="2.4" stroke-linecap="round"/>
<line x1="164" y1="148" x2="192" y2="140" stroke="var(--ink-3)" stroke-width="2.4" stroke-linecap="round"/>
<line x1="164" y1="152" x2="192" y2="160" stroke="var(--ink-3)" stroke-width="2.4" stroke-linecap="round"/>
<line x1="162" y1="156" x2="188" y2="178" stroke="var(--ink-3)" stroke-width="2.4" stroke-linecap="round"/>
<text x="30" y="226" font-size="13">Slender tube with delicate</text>
<text x="30" y="246" font-size="13">folds (plicae)</text>
<text x="30" y="270" font-size="13">Open, fringed end</text>
<text x="30" y="290" font-size="13">The egg passes freely</text>
<rect x="254" y="124" width="128" height="52" rx="22" fill="var(--surface)" stroke="var(--crit)" stroke-width="2"/>
<circle cx="276" cy="142" r="4" fill="var(--warn)"/>
<circle cx="296" cy="158" r="4" fill="var(--warn)"/>
<circle cx="314" cy="141" r="4" fill="var(--warn)"/>
<circle cx="334" cy="160" r="4" fill="var(--warn)"/>
<circle cx="352" cy="143" r="4" fill="var(--warn)"/>
<circle cx="366" cy="158" r="4" fill="var(--warn)"/>
<line x1="382" y1="142" x2="408" y2="120" stroke="var(--crit)" stroke-width="2.4" stroke-linecap="round"/>
<line x1="384" y1="148" x2="412" y2="140" stroke="var(--crit)" stroke-width="2.4" stroke-linecap="round"/>
<line x1="384" y1="154" x2="412" y2="162" stroke="var(--crit)" stroke-width="2.4" stroke-linecap="round"/>
<line x1="382" y1="160" x2="408" y2="182" stroke="var(--crit)" stroke-width="2.4" stroke-linecap="round"/>
<text x="250" y="226" font-size="13">Swollen, red wall</text>
<text x="250" y="246" font-size="13">Neutrophils in the folds</text>
<text x="250" y="270" font-size="13">Pus in the lumen</text>
<text x="250" y="290" font-size="13">Fimbriae still open</text>
<path d="M474 124 L 534 124 C 566 88, 640 88, 644 134 C 648 176, 580 178, 534 148 L 474 148 Z" fill="var(--surface)" stroke="var(--warn)" stroke-width="2"/>
<text class="b" x="594" y="138" font-size="14" text-anchor="middle">pus</text>
<ellipse cx="598" cy="184" rx="40" ry="18" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.8"/>
<text x="598" y="189" font-size="13" text-anchor="middle">ovary</text>
<text x="470" y="226" font-size="13">Sealed fimbriae, tube</text>
<text x="470" y="244" font-size="13">distended with pus</text>
<text x="470" y="268" font-size="13">Pus fusing with the ovary:</text>
<text x="470" y="286" font-size="13">tubo-ovarian abscess</text>
<path d="M694 138 L 750 138 C 786 100, 856 100, 862 148 C 866 196, 796 200, 750 162 L 694 162 Z" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.6"/>
<text class="b" x="802" y="156" font-size="14" text-anchor="middle">clear fluid</text>
<text x="690" y="226" font-size="13">Healed, scarred, sealed tube</text>
<text x="690" y="246" font-size="13">Thin wall, folds flattened</text>
<text x="690" y="270" font-size="13">Tubal factor infertility</text>
<text x="690" y="290" font-size="13">and ectopic pregnancy</text>
<rect x="14" y="326" width="872" height="58" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text x="30" y="351" font-size="14">Left to right: the open tube, acute infection, a sealed infected tube, and the scar that remains.</text>
<text x="30" y="372" font-size="14">Fibrosis fuses the folds and seals the fimbriae, so the egg cannot pass.</text>
</svg>
