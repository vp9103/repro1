<svg class="dia" viewBox="0 0 900 622" role="img" aria-label="The four steps of Müllerian duct development and the anomaly each failure causes: Müllerian agenesis or unicornuate uterus, didelphys or bicornuate uterus, septate uterus, and imperforate hymen, with the mesonephric duct link to renal agenesis and the origin of the lower vagina">
<text class="ttl" x="14" y="26" font-size="18">Which of four steps failed? Müllerian anomalies by step</text>
<rect x="14" y="44" width="432" height="186" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="72" font-size="16">1. The two ducts form</text>
<text class="b" x="28" y="102" font-size="15">Neither forms: Müllerian agenesis (MRKH)</text>
<text x="28" y="128" font-size="15">46,XX; normal ovaries, breasts, hair</text>
<text x="28" y="154" font-size="15">Short blind vagina; renal anomalies common</text>
<text class="b" x="28" y="180" font-size="15">One fails: unicornuate uterus</text>
<text x="28" y="206" font-size="15">Ipsilateral (same-side) renal agenesis</text>
<rect x="454" y="44" width="432" height="186" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="468" y="72" font-size="16">2. The ducts fuse</text>
<text class="b" x="468" y="102" font-size="15">No fusion: uterus didelphys</text>
<text x="468" y="128" font-size="15">Two uteri and two cervices</text>
<text x="468" y="154" font-size="15">A hemivagina may obstruct; renal agenesis</text>
<text class="b" x="468" y="180" font-size="15">Partial fusion: bicornuate uterus</text>
<text x="468" y="206" font-size="15">Deep fundal cleft between two horns</text>
<rect x="14" y="240" width="432" height="186" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="28" y="268" font-size="16">3. The septum resorbs</text>
<text class="b" x="28" y="298" font-size="15">Septum persists: septate uterus</text>
<text x="28" y="324" font-size="15">Smooth fundus, two cavities</text>
<text x="28" y="350" font-size="15">Most common anomaly</text>
<text x="28" y="376" font-size="15">Recurrent miscarriage</text>
<text x="28" y="402" font-size="15">Hysteroscopic resection helps</text>
<rect x="454" y="240" width="432" height="186" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="468" y="268" font-size="16">4. The vaginal plate canalizes</text>
<text class="b" x="468" y="298" font-size="15">Imperforate hymen</text>
<text x="468" y="324" font-size="15">Bulging bluish membrane at the introitus</text>
<text x="468" y="350" font-size="15">Hematocolpos, cyclic pain, normal uterus</text>
<text class="b" x="468" y="376" font-size="15">Also: transverse septum, vaginal atresia</text>
<text x="468" y="402" font-size="15">Uterus present above the obstruction</text>
<rect x="14" y="436" width="872" height="96" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="464" font-size="15">The mesonephric duct links kidney and uterus</text>
<text x="28" y="488" font-size="15">It sprouts the ureteric bud and guides the Müllerian duct,</text>
<text x="28" y="512" font-size="15">so a one-sided defect gives same-side renal agenesis: image the kidneys.</text>
<rect x="14" y="544" width="872" height="70" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="570" font-size="15">Upper vagina, cervix, uterus and tubes: Müllerian ducts</text>
<text x="28" y="598" font-size="15">Lower vagina: urogenital sinus</text>
</svg>
