<svg class="dia" viewBox="0 0 900 500" role="img" aria-label="The layers of sex and gender: genotypic sex, gonadal sex, phenotypic sex, gender identity and sexual orientation, what each one is, what sets it, and the example of a 46,XY woman with complete androgen insensitivity">
<text class="ttl" x="14" y="26" font-size="18">Sex has layers, and each layer can differ</text>
<text x="14" y="52" font-size="14">Example column: a 46,XY woman with complete androgen insensitivity (CAIS)</text>
<rect x="14" y="66" width="872" height="34" rx="6" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="89" font-size="14">Layer</text>
<text class="b" x="226" y="89" font-size="14">What it is</text>
<text class="b" x="536" y="89" font-size="14">What decides it</text>
<text class="b" x="756" y="89" font-size="14">In CAIS</text>
<rect x="14" y="106" width="872" height="56" rx="4" fill="var(--surface-2)" stroke="none" stroke-width="0"/>
<text class="b" x="28" y="140" font-size="15">Genotypic sex</text>
<text x="226" y="140" font-size="14">Karyotype: X or Y from the sperm</text>
<text x="536" y="140" font-size="14">Fertilization</text>
<text x="756" y="140" font-size="14">46,XY</text>
<rect x="14" y="168" width="872" height="56" rx="4" fill="var(--surface)" stroke="none" stroke-width="0"/>
<text class="b" x="28" y="202" font-size="15">Gonadal sex</text>
<text x="226" y="202" font-size="14">Testis or ovary</text>
<text x="536" y="202" font-size="14">SRY on the Y chromosome</text>
<text x="756" y="202" font-size="14">Testes</text>
<rect x="14" y="230" width="872" height="56" rx="4" fill="var(--surface-2)" stroke="none" stroke-width="0"/>
<text class="b" x="28" y="264" font-size="15">Phenotypic sex</text>
<text x="226" y="264" font-size="14">Ducts, genitalia and body</text>
<text x="536" y="264" font-size="14">Hormones and receptors</text>
<text x="756" y="264" font-size="14">Female body</text>
<rect x="14" y="292" width="872" height="56" rx="4" fill="var(--surface)" stroke="none" stroke-width="0"/>
<text class="b" x="28" y="326" font-size="15">Gender identity</text>
<text x="226" y="316" font-size="14">Inner sense of being a woman,</text>
<text x="226" y="336" font-size="14">a man or another gender</text>
<text x="536" y="316" font-size="14">The person:</text>
<text x="536" y="336" font-size="14">ask, never infer</text>
<text x="756" y="326" font-size="14">Woman</text>
<rect x="14" y="354" width="872" height="56" rx="4" fill="var(--surface-2)" stroke="none" stroke-width="0"/>
<text class="b" x="28" y="388" font-size="15">Sexual orientation</text>
<text x="226" y="388" font-size="14">Whom a person is attracted to</text>
<text x="536" y="378" font-size="14">The person:</text>
<text x="536" y="398" font-size="14">ask, never infer</text>
<text x="756" y="388" font-size="14">Not implied</text>
<rect x="14" y="424" width="872" height="62" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="450" font-size="15">Each layer is set by a different step, so the layers can differ.</text>
<text x="28" y="474" font-size="14">Describe each layer separately; ask about identity rather than assume it.</text>
</svg>
