<svg class="dia" viewBox="0 0 900 560" role="img" aria-label="Typical order and ages of pubertal changes: in girls thelarche, pubarche, the growth spurt and menarche; in boys testicular enlargement to 4 mL, pubarche, penile growth and a later growth spurt">
<text class="ttl" x="14" y="24" font-size="17">The order of puberty in girls and boys</text>
<rect x="14" y="44" width="872" height="210" rx="10" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="30" y="72" font-size="16">Girls: breasts first, menarche last</text>
<rect x="310" y="97" width="428" height="14" rx="7" fill="var(--a1)"/>
<text x="300" y="109" font-size="15" text-anchor="end">Thelarche (breast bud)</text>
<rect x="357" y="133" width="381" height="14" rx="7" fill="var(--a1)"/>
<text x="347" y="145" font-size="15" text-anchor="end">Pubarche (pubic hair)</text>
<rect x="310" y="169" width="285" height="14" rx="7" fill="var(--a1)"/>
<circle cx="452" cy="176" r="9" fill="var(--surface)" stroke="var(--a1)" stroke-width="3"/>
<text x="300" y="181" font-size="15" text-anchor="end">Growth spurt, peak near 11.5</text>
<circle cx="547" cy="212" r="9" fill="var(--a1)"/>
<text x="530" y="217" font-size="15" text-anchor="end">Menarche, 2 to 3 years after thelarche</text>
<rect x="14" y="268" width="872" height="210" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="30" y="296" font-size="16">Boys: testes first, growth spurt later</text>
<rect x="405" y="321" width="428" height="14" rx="7" fill="var(--a2)"/>
<text x="395" y="333" font-size="15" text-anchor="end">Testicular enlargement to 4 mL</text>
<rect x="452" y="357" width="381" height="14" rx="7" fill="var(--a2)"/>
<text x="442" y="369" font-size="15" text-anchor="end">Pubarche (pubic hair)</text>
<rect x="500" y="393" width="333" height="14" rx="7" fill="var(--a2)"/>
<text x="490" y="405" font-size="15" text-anchor="end">Penile growth, then voice</text>
<rect x="500" y="429" width="333" height="14" rx="7" fill="var(--a2)"/>
<circle cx="642" cy="436" r="9" fill="var(--surface)" stroke="var(--a2)" stroke-width="3"/>
<text x="490" y="441" font-size="15" text-anchor="end">Growth spurt, peak near 13.5</text>
<line x1="120" y1="500" x2="880" y2="500" stroke="var(--ink-3)" stroke-width="1.5"/>
<line x1="120" y1="500" x2="120" y2="508" stroke="var(--ink-3)" stroke-width="1.5"/>
<line x1="215" y1="500" x2="215" y2="508" stroke="var(--ink-3)" stroke-width="1.5"/>
<line x1="310" y1="500" x2="310" y2="508" stroke="var(--ink-3)" stroke-width="1.5"/>
<line x1="405" y1="500" x2="405" y2="508" stroke="var(--ink-3)" stroke-width="1.5"/>
<line x1="500" y1="500" x2="500" y2="508" stroke="var(--ink-3)" stroke-width="1.5"/>
<line x1="595" y1="500" x2="595" y2="508" stroke="var(--ink-3)" stroke-width="1.5"/>
<line x1="690" y1="500" x2="690" y2="508" stroke="var(--ink-3)" stroke-width="1.5"/>
<line x1="785" y1="500" x2="785" y2="508" stroke="var(--ink-3)" stroke-width="1.5"/>
<line x1="880" y1="500" x2="880" y2="508" stroke="var(--ink-3)" stroke-width="1.5"/>
<text x="120" y="528" font-size="15" text-anchor="middle">8</text>
<text x="215" y="528" font-size="15" text-anchor="middle">9</text>
<text x="310" y="528" font-size="15" text-anchor="middle">10</text>
<text x="405" y="528" font-size="15" text-anchor="middle">11</text>
<text x="500" y="528" font-size="15" text-anchor="middle">12</text>
<text x="595" y="528" font-size="15" text-anchor="middle">13</text>
<text x="690" y="528" font-size="15" text-anchor="middle">14</text>
<text x="785" y="528" font-size="15" text-anchor="middle">15</text>
<text x="876" y="528" font-size="15" text-anchor="end">16</text>
<text class="b" x="450" y="552" font-size="15" text-anchor="middle">Typical age in years</text>
</svg>
