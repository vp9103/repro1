<svg class="dia" viewBox="0 0 900 470" role="img" aria-label="Two routes of perinatal infection: organisms that cross the placenta are prevented by protecting the mother before exposure, and organisms caught in the birth canal are prevented by interventions at delivery">
<text class="ttl" x="14" y="24" font-size="17">The route of infection decides the prevention</text>
<rect x="14" y="40" width="428" height="416" rx="10" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="30" y="70" font-size="16">Across the placenta (in utero)</text>
<text x="30" y="94" font-size="14">Reaches the fetus through maternal blood</text>
<text class="b" x="30" y="128" font-size="15">Toxoplasma</text>
<text class="b" x="30" y="156" font-size="15">Rubella</text>
<text class="b" x="30" y="184" font-size="15">Cytomegalovirus</text>
<text class="b" x="30" y="212" font-size="15">Syphilis</text>
<text class="b" x="236" y="128" font-size="15">Parvovirus B19</text>
<text class="b" x="236" y="156" font-size="15">Varicella</text>
<text class="b" x="236" y="184" font-size="15">Zika virus</text>
<text class="b" x="236" y="212" font-size="15">Listeria</text>
<text class="a1" x="30" y="246" font-size="14">Result: malformation, hydrops, fetal loss</text>
<rect x="26" y="264" width="404" height="178" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.2"/>
<text class="b" x="40" y="292" font-size="15">Prevent before or early in pregnancy</text>
<text x="40" y="320" font-size="14">Check rubella and varicella immunity early</text>
<text x="40" y="346" font-size="14">Vaccinate nonimmune patients after delivery</text>
<text x="40" y="372" font-size="14">Avoid cat litter and undercooked meat</text>
<text x="40" y="398" font-size="14">Avoid unpasteurized cheese and deli meat</text>
<text x="40" y="424" font-size="14">Screen for syphilis; treat with penicillin G</text>
<rect x="458" y="40" width="428" height="416" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="474" y="70" font-size="16">In the birth canal (intrapartum)</text>
<text x="474" y="94" font-size="14">Reaches the newborn during vaginal birth</text>
<text class="b" x="474" y="128" font-size="15">Group B strep</text>
<text class="b" x="474" y="156" font-size="15">Herpes simplex</text>
<text class="b" x="474" y="184" font-size="15">Hepatitis B</text>
<text class="b" x="680" y="128" font-size="15">Gonorrhea</text>
<text class="b" x="680" y="156" font-size="15">Chlamydia</text>
<text class="b" x="680" y="184" font-size="15">HIV</text>
<text class="a2" x="474" y="246" font-size="14">Result: sepsis, encephalitis, eye infection</text>
<rect x="470" y="264" width="404" height="178" rx="8" fill="var(--surface)" stroke="var(--a2)" stroke-width="1.2"/>
<text class="b" x="484" y="292" font-size="15">Prevent at delivery</text>
<text x="484" y="320" font-size="14">GBS culture at 36-37 wk, penicillin in labor</text>
<text x="484" y="346" font-size="14">Acyclovir from 36 weeks if herpes history</text>
<text x="484" y="372" font-size="14">Cesarean for HSV lesions or prodrome</text>
<text x="484" y="398" font-size="14">Erythromycin eye ointment at birth</text>
<text x="484" y="424" font-size="14">HBIG plus vaccine within 12 hours</text>
</svg>
