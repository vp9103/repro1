<svg class="dia" viewBox="0 0 900 516" role="img" aria-label="PCOS mechanism: fast GnRH pulses raise LH, insulin resistance stimulates theca cells and lowers SHBG, free testosterone rises, follicles stall, anovulation leaves estrogen unopposed on the endometrium">
<text class="ttl" x="14" y="24" font-size="17">PCOS: one loop links androgen, anovulation and endometrial risk</text>
