<svg class="dia" viewBox="0 0 900 530" role="img" aria-label="hCG follow-up after evacuation of a mole: a normal fall to undetectable, a plateau over 3 weeks or a rise over 2 weeks defines gestational trophoblastic neoplasia, which is staged and scored; a score of 6 or less gets single-agent methotrexate or actinomycin D, 7 or more multiagent chemotherapy, and placental site and epithelioid tumors need hysterectomy">
<text class="ttl" x="14" y="24" font-size="17">After evacuation, the hCG curve decides who has neoplasia</text>
<rect x="14" y="40" width="440" height="470" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="28" y="66" font-size="15">hCG</text>
<line x1="70" y1="76" x2="70" y2="300" stroke="var(--ink-2)" stroke-width="2"/><line x1="70" y1="300" x2="430" y2="300" stroke="var(--ink-2)" stroke-width="2"/>
<text x="150" y="326" font-size="14">Weeks after evacuation</text>
<path d="M70 96 C 110 150, 170 270, 250 292 L 420 292" fill="none" stroke="var(--good)" stroke-width="3"/>
<path d="M70 96 C 110 130, 150 170, 190 186 L 420 186" fill="none" stroke="var(--warn)" stroke-width="3"/>
<path d="M70 96 C 110 130, 140 150, 180 150 C 250 150, 320 110, 420 84" fill="none" stroke="var(--crit)" stroke-width="3"/>
<text class="cr" x="290" y="70" font-size="14">Rise: climbing hCG</text>
<text class="wn" x="240" y="176" font-size="14">Plateau: flat for 3 weeks</text>
<text class="gd" x="270" y="282" font-size="14">Falls to undetectable</text>
<rect x="28" y="350" width="412" height="44" rx="6" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/><text x="40" y="378" font-size="14">Falls to undetectable: weekly, then monthly</text>
<rect x="28" y="404" width="412" height="44" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/><text x="40" y="432" font-size="14">Plateau: 4 values within 10% over 3 weeks</text>
<rect x="28" y="458" width="412" height="44" rx="6" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/><text x="40" y="486" font-size="14">Rise: more than 10% over 2 weeks</text>
<rect x="470" y="40" width="416" height="470" rx="10" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="484" y="66" font-size="15">Plateau or rise: gestational trophoblastic neoplasia</text>
<rect x="482" y="82" width="392" height="62" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="494" y="108" font-size="15">Stage by extent and WHO risk score</text><text x="494" y="132" font-size="14">referral to a gynecologic oncologist</text>
<line x1="580" y1="144" x2="580" y2="162" stroke="var(--ink-2)" stroke-width="2"/><polygon points="575,162 580,170 585,162" fill="var(--ink-2)"/>
<line x1="780" y1="144" x2="780" y2="162" stroke="var(--ink-2)" stroke-width="2"/><polygon points="775,162 780,170 785,162" fill="var(--ink-2)"/>
<rect x="482" y="170" width="194" height="150" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text class="b" x="494" y="198" font-size="15">Score 6 or less</text>
<text x="494" y="224" font-size="14">low risk</text>
<text x="494" y="248" font-size="14">single-agent</text>
<text x="494" y="272" font-size="14">methotrexate or</text>
<text x="494" y="296" font-size="14">actinomycin D</text>
<rect x="680" y="170" width="194" height="150" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="692" y="198" font-size="15">Score 7 or more</text>
<text x="692" y="224" font-size="14">high risk</text>
<text x="692" y="248" font-size="14">multiagent</text>
<text x="692" y="272" font-size="14">chemotherapy</text>
<text x="692" y="296" font-size="14">(EMA-CO)</text>
<rect x="482" y="338" width="392" height="150" rx="8" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="494" y="366" font-size="15">Intermediate trophoblast tumors</text>
<text x="494" y="394" font-size="14">placental site and epithelioid:</text>
<text x="494" y="418" font-size="14">poor response to chemotherapy,</text>
<text x="494" y="442" font-size="14">so the treatment is hysterectomy</text>
<text x="494" y="466" font-size="14">they make little hCG</text>
</svg>
