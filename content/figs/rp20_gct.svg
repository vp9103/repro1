<svg class="dia" viewBox="0 0 900 530" role="img" aria-label="Classification of testicular tumors: germ cell tumors (seminoma and the nonseminomatous embryonal carcinoma, yolk sac tumor, choriocarcinoma and teratoma) with their markers, sex cord-stromal tumors, and lymphoma in older men">
<text class="ttl" x="14" y="24" font-size="17">Testicular tumors: sort by cell, then by marker</text>
<rect x="200" y="38" width="500" height="42" rx="8" fill="var(--surface-2)" stroke="var(--ink-2)" stroke-width="1.5"/>
<text class="b" x="214" y="65" font-size="15">Painless, firm intratesticular mass</text>
<line x1="450" y1="80" x2="450" y2="92" stroke="var(--ink-2)" stroke-width="2"/>
<line x1="207" y1="92" x2="801" y2="92" stroke="var(--ink-2)" stroke-width="2"/>
<line x1="207" y1="92" x2="207" y2="104" stroke="var(--ink-2)" stroke-width="2"/>
<line x1="558" y1="92" x2="558" y2="104" stroke="var(--ink-2)" stroke-width="2"/>
<line x1="801" y1="92" x2="801" y2="104" stroke="var(--ink-2)" stroke-width="2"/>
<rect x="14" y="104" width="386" height="110" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="128" font-size="15">Germ cell tumors (about 95%)</text>
<text x="28" y="152" font-size="15">Ages 15 to 35; GCNIS precursor</text>
<text x="28" y="176" font-size="15">Isochromosome 12p</text>
<text x="28" y="200" font-size="15">Spread to para-aortic nodes</text>
<rect x="416" y="104" width="284" height="110" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="430" y="128" font-size="15">Sex cord-stromal (about 5%)</text>
<text x="430" y="152" font-size="15">Leydig: Reinke crystals,</text>
<text x="430" y="176" font-size="15">androgen or estrogen excess</text>
<text x="430" y="200" font-size="15">Sertoli: usually silent</text>
<rect x="716" y="104" width="170" height="110" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text class="b" x="730" y="128" font-size="15">Lymphoma</text>
<text x="730" y="152" font-size="15">Most common</text>
<text x="730" y="176" font-size="15">mass after 60</text>
<text x="730" y="200" font-size="15">Often bilateral</text>
<line x1="96" y1="214" x2="96" y2="236" stroke="var(--ink-2)" stroke-width="2"/>
<line x1="300" y1="214" x2="300" y2="236" stroke="var(--ink-2)" stroke-width="2"/>
<rect x="14" y="236" width="164" height="200" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="26" y="262" font-size="15">Seminoma</text>
<text x="26" y="290" font-size="15">Fried-egg cells</text>
<text x="26" y="314" font-size="15">and lymphocytes</text>
<text x="26" y="342" font-size="15">PLAP positive</text>
<text x="26" y="366" font-size="15">AFP never raised</text>
<text x="26" y="394" font-size="15">Radiosensitive</text>
<text x="26" y="418" font-size="15">Best prognosis</text>
<rect x="190" y="236" width="696" height="34" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="204" y="259" font-size="15">Nonseminomatous germ cell tumors: usually mixed</text>
<rect x="190" y="280" width="168" height="156" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="202" y="306" font-size="15">Embryonal</text>
<text class="b" x="202" y="330" font-size="15">carcinoma</text>
<text x="202" y="358" font-size="15">Hemorrhagic,</text>
<text x="202" y="382" font-size="15">necrotic mass</text>
<text x="202" y="410" font-size="15">AFP, hCG vary</text>
<rect x="366" y="280" width="168" height="156" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="378" y="306" font-size="15">Yolk sac tumor</text>
<text x="378" y="334" font-size="15">Schiller-Duval</text>
<text x="378" y="358" font-size="15">bodies</text>
<text class="cr" x="378" y="386" font-size="15">AFP high</text>
<text x="378" y="410" font-size="15">Boys under 3</text>
<rect x="542" y="280" width="168" height="156" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="554" y="306" font-size="15">Choriocarcinoma</text>
<text x="554" y="334" font-size="14">Trophoblast cells</text>
<text class="cr" x="554" y="358" font-size="15">hCG very high</text>
<text x="554" y="386" font-size="15">Blood spread</text>
<text x="554" y="410" font-size="15">to lungs</text>
<rect x="718" y="280" width="168" height="156" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="730" y="306" font-size="15">Teratoma</text>
<text x="730" y="334" font-size="14">Three germ layers</text>
<text x="730" y="358" font-size="15">Malignant in</text>
<text x="730" y="382" font-size="15">adult men</text>
<text x="730" y="410" font-size="15">Chemoresistant</text>
<rect x="14" y="452" width="872" height="66" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="28" y="478" font-size="15">AFP raised: a nonseminomatous part is present, never pure seminoma</text>
<text x="28" y="504" font-size="15">hCG very high: choriocarcinoma; mildly raised: seminoma is still possible</text>
</svg>
