<path d="M468 462 L 462 396 L 450 340" fill="none" stroke="var(--crit)" stroke-width="3.5" stroke-linecap="round"/>
<polygon points="446,332 458,338 448,346" fill="var(--crit)"/>
<text x="330" y="222" font-size="14" text-anchor="middle">Bladder</text>
<text x="14" y="134" font-size="14">Pubic symphysis</text>
<line x1="136" y1="130" x2="235" y2="150" stroke="var(--ink-3)" stroke-width="1"/>
<text x="14" y="196" font-size="14">Retropubic space</text>
<line x1="136" y1="192" x2="262" y2="204" stroke="var(--ink-3)" stroke-width="1"/>
<text class="b" x="14" y="250" font-size="14">Internal urethral</text>
<text class="b" x="14" y="268" font-size="14">sphincter</text>
<text x="14" y="286" font-size="14">smooth muscle at</text>
<text x="14" y="304" font-size="14">the bladder neck</text>
<line x1="124" y1="262" x2="316" y2="268" stroke="var(--ink-3)" stroke-width="1"/>
<text x="14" y="346" font-size="14">Prostate: base on</text>
<text x="14" y="364" font-size="14">the bladder neck,</text>
<text x="14" y="382" font-size="14">apex on the floor</text>
<line x1="130" y1="352" x2="294" y2="326" stroke="var(--ink-3)" stroke-width="1"/>
<text class="b" x="14" y="426" font-size="14">Membranous urethra</text>
<text x="14" y="444" font-size="14">in the external sphincter</text>
<line x1="160" y1="422" x2="320" y2="382" stroke="var(--ink-3)" stroke-width="1"/>
<text x="14" y="492" font-size="14">Bulb of the penis</text>
<text x="14" y="510" font-size="14">and spongy urethra</text>
<line x1="136" y1="488" x2="292" y2="422" stroke="var(--ink-3)" stroke-width="1"/>
<text class="b" x="560" y="96" font-size="14">Ductus deferens</text>
<text x="560" y="114" font-size="14">crosses over the ureter</text>
<line x1="556" y1="104" x2="424" y2="160" stroke="var(--ink-3)" stroke-width="1"/>
<text x="560" y="146" font-size="14">Ureter</text>
<line x1="556" y1="142" x2="450" y2="148" stroke="var(--ink-3)" stroke-width="1"/>
<text class="b" x="560" y="176" font-size="14">Rectovesical pouch</text>
<text x="560" y="194" font-size="14">(peritoneum, men)</text>
<line x1="556" y1="190" x2="470" y2="286" stroke="var(--ink-3)" stroke-width="1"/>
<text x="560" y="248" font-size="14">Ampulla of the ductus</text>
<text x="560" y="266" font-size="14">and seminal vesicle</text>
<line x1="556" y1="256" x2="442" y2="250" stroke="var(--ink-3)" stroke-width="1"/>
<text class="a1" x="560" y="316" font-size="14">Ejaculatory duct opens into</text>
<text class="a1" x="560" y="334" font-size="14">the prostatic urethra</text>
<line x1="556" y1="324" x2="348" y2="304" stroke="var(--ink-3)" stroke-width="1"/>
<text x="560" y="412" font-size="14">Pelvic floor</text>
<line x1="556" y1="408" x2="430" y2="364" stroke="var(--ink-3)" stroke-width="1"/>
<text x="560" y="446" font-size="14">Rectum</text>
<text class="cr" x="500" y="488" font-size="14">Digital rectal exam: finger</text>
<text class="cr" x="500" y="506" font-size="14">feels the posterior prostate</text>
<rect x="14" y="520" width="282" height="116" rx="10" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.5"/>
<text class="b" x="28" y="544" font-size="15">Where the semen comes from</text>
<text x="28" y="568" font-size="14">Seminal vesicles: about 70%,</text>
<text x="28" y="586" font-size="14">fructose and clotting proteins</text>
<text x="28" y="610" font-size="14">Prostate: about 20%, PSA</text>
<text x="28" y="628" font-size="14">liquefies the clot</text>
<rect x="308" y="520" width="282" height="116" rx="10" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="322" y="544" font-size="15">Emission is sympathetic</text>
<text x="322" y="568" font-size="14">Hypogastric fibers contract the</text>
<text x="322" y="586" font-size="14">ductus, vesicles and prostate,</text>
<text x="322" y="604" font-size="14">and close the internal sphincter</text>
<text x="322" y="622" font-size="14">(alpha-1): semen goes forward</text>
<rect x="602" y="520" width="284" height="116" rx="10" fill="var(--crit-soft)" stroke="var(--crit)" stroke-width="1.5"/>
<text class="b" x="616" y="544" font-size="15">Retrograde ejaculation</text>
<text x="616" y="568" font-size="14">Sphincter fails: dry orgasm,</text>
<text x="616" y="586" font-size="14">cloudy urine afterward</text>
<text x="616" y="604" font-size="14">Nerve injury, bladder neck or</text>
<text x="616" y="622" font-size="14">prostate surgery, tamsulosin</text>
</svg>
