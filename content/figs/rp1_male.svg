<svg class="dia" viewBox="0 0 900 650" role="img" aria-label="Male pelvis in midline section: the bladder with its internal urethral sphincter at the neck, the prostate around the prostatic urethra where the ejaculatory duct opens, the ductus deferens crossing over the ureter to join the seminal vesicle, the rectovesical pouch in front of the rectum, a finger on a digital rectal exam, and three cards on the sources of semen, emission and retrograde ejaculation">
<text class="ttl" x="14" y="24" font-size="17">Male pelvis in midline section: semen path, bladder neck and rectal exam</text>
