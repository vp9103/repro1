<text x="388" y="398" font-size="13">clitoris: skin</text>
<text x="388" y="416" font-size="13">and glans</text>
<text x="388" y="434" font-size="13">sensation</text>
<text class="cr" x="30" y="496" font-size="14">Anterior scrotum or labia: ilioinguinal nerve (L1),</text>
