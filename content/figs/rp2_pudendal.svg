<text x="44" y="237" font-size="14">Re-enters the perineum via the lesser sciatic foramen</text>
<rect x="30" y="266" width="510" height="32" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
<text x="44" y="287" font-size="14">Runs in the pudendal (Alcock) canal, ischioanal fossa</text>
<path d="M285 76 L 285 94 M285 126 L 285 144 M285 198 L 285 216 M285 248 L 285 266" fill="none" stroke="var(--ink-3)" stroke-width="2.5"/>
<path d="M285 298 L 111 334 M285 298 L 285 334 M285 298 L 457 334" fill="none" stroke="var(--ink-3)" stroke-width="2.5"/>
<rect x="30" y="334" width="163" height="132" rx="8" fill="var(--a2-soft)" stroke="var(--a2)" stroke-width="1.5"/>
<text class="b" x="42" y="356" font-size="14">Inferior rectal</text>
<text x="42" y="380" font-size="13">External anal</text>
<text x="42" y="398" font-size="13">sphincter and</text>
<text x="42" y="416" font-size="13">perianal skin,</text>
<text x="42" y="434" font-size="13">canal below the</text>
