<svg class="dia" viewBox="0 0 900 540" role="img" aria-label="The pudendal nerve's path from the S2 to S4 ventral rami through the greater sciatic foramen below the piriformis, around the ischial spine where a pudendal block is placed, back through the lesser sciatic foramen into the pudendal canal, and its three branches: inferior rectal, perineal and dorsal nerve of the penis or clitoris; beside it the autonomic and somatic steps of male sexual function: point, squeeze, shoot">
<text class="ttl" x="14" y="24" font-size="17">The pudendal nerve: path, landmark and branches, and who runs sex function</text>
<rect x="30" y="44" width="510" height="32" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.5"/>
