<text x="215" y="380" font-size="13">Deep: external</text>
<text x="215" y="398" font-size="13">urethral sphincter,</text>
<text x="215" y="416" font-size="13">perineal muscles</text>
<text x="215" y="434" font-size="13">Superficial: labial</text>
<text x="215" y="452" font-size="13">or scrotal skin</text>
