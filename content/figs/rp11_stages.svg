<svg class="dia" viewBox="0 0 900 468" role="img" aria-label="Stages of reproductive aging from prepubertal through the reproductive years, early and late menopausal transition and postmenopause, with ovarian follicles, cycle pattern and FSH in each stage; the final menstrual period is stage 0 and is recognized after 12 months without menses">
<text class="ttl" x="14" y="24" font-size="17">Reproductive aging: follicles, cycles and FSH by stage</text>
<rect x="416" y="38" width="306" height="28" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text class="b" x="428" y="57" font-size="14">Menopausal transition (perimenopause)</text>
<rect x="14" y="72" width="84" height="46" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="24" y="101" font-size="14">Stage</text>
<rect x="104" y="72" width="150" height="46" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.6"/>
<text class="b" x="116" y="101" font-size="14">Prepubertal</text>
<rect x="260" y="72" width="150" height="46" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.6"/>
<text class="b" x="272" y="101" font-size="14">Reproductive</text>
<rect x="416" y="72" width="150" height="46" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.6"/>
<text class="b" x="428" y="101" font-size="14">Early transition</text>
<rect x="572" y="72" width="150" height="46" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.6"/>
<text class="b" x="584" y="101" font-size="14">Late transition</text>
<rect x="728" y="72" width="150" height="46" rx="8" fill="var(--a1-soft)" stroke="var(--a1)" stroke-width="1.6"/>
<text class="b" x="740" y="101" font-size="14">Postmenopause</text>
<rect x="14" y="126" width="84" height="78" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="24" y="153" font-size="14">Ovary</text>
<rect x="104" y="126" width="150" height="78" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text x="116" y="152" font-size="14">About 1 million</text>
<text x="116" y="173" font-size="14">follicles at birth</text>
<rect x="260" y="126" width="150" height="78" rx="8" fill="var(--surface)" stroke="var(--good)" stroke-width="1.3"/>
<text x="272" y="152" font-size="14">250,000 to 400,000</text>
<text x="272" y="173" font-size="14">follicles remain</text>
<rect x="416" y="126" width="150" height="78" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.3"/>
<text x="428" y="152" font-size="14">Fewer follicles,</text>
<text x="428" y="173" font-size="14">more FSH needed</text>
<rect x="572" y="126" width="150" height="78" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.3"/>
<text x="584" y="152" font-size="14">Few follicles</text>
<text x="584" y="173" font-size="14">left</text>
<rect x="728" y="126" width="150" height="78" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.3"/>
<text x="740" y="152" font-size="14">Follicles</text>
<text x="740" y="173" font-size="14">depleted</text>
<rect x="14" y="210" width="84" height="98" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="24" y="237" font-size="14">Cycles</text>
<rect x="104" y="210" width="150" height="98" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text x="116" y="236" font-size="14">None until</text>
<text x="116" y="257" font-size="14">menarche</text>
<rect x="260" y="210" width="150" height="98" rx="8" fill="var(--surface)" stroke="var(--good)" stroke-width="1.3"/>
<text x="272" y="236" font-size="14">Regular,</text>
<text x="272" y="257" font-size="14">ovulatory</text>
<rect x="416" y="210" width="150" height="98" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.3"/>
<text x="428" y="236" font-size="14">Shorter; length</text>
<text x="428" y="257" font-size="14">varies by 7 days</text>
<text x="428" y="278" font-size="14">or more</text>
<rect x="572" y="210" width="150" height="98" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.3"/>
<text x="584" y="236" font-size="14">Skipped; gaps of</text>
<text x="584" y="257" font-size="14">60 days or more</text>
<text x="584" y="278" font-size="14">(anovulatory)</text>
<rect x="728" y="210" width="150" height="98" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.3"/>
<text x="740" y="236" font-size="14">None; any</text>
<text x="740" y="257" font-size="14">bleeding is</text>
<text x="740" y="278" font-size="14">abnormal</text>
<rect x="14" y="312" width="84" height="62" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.2"/>
<text class="b" x="24" y="339" font-size="14">FSH</text>
<rect x="104" y="312" width="150" height="62" rx="8" fill="var(--surface)" stroke="var(--line-strong)" stroke-width="1.3"/>
<text x="116" y="338" font-size="14">Low</text>
<rect x="260" y="312" width="150" height="62" rx="8" fill="var(--surface)" stroke="var(--good)" stroke-width="1.3"/>
<text x="272" y="338" font-size="14">Normal,</text>
<text x="272" y="359" font-size="14">cyclic</text>
<rect x="416" y="312" width="150" height="62" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.3"/>
<text x="428" y="338" font-size="14">Fluctuates,</text>
<text x="428" y="359" font-size="14">starts to rise</text>
<rect x="572" y="312" width="150" height="62" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.3"/>
<text x="584" y="338" font-size="14">High but</text>
<text x="584" y="359" font-size="14">fluctuating</text>
<rect x="728" y="312" width="150" height="62" rx="8" fill="var(--surface)" stroke="var(--a1)" stroke-width="1.3"/>
<text x="740" y="338" font-size="14">Persistently</text>
<text x="740" y="359" font-size="14">high</text>
<line x1="725" y1="68" x2="725" y2="376" stroke="var(--crit)" stroke-width="2.5" stroke-dasharray="7 5"/>
<text class="cr" x="734" y="57" font-size="14">Final period (0)</text>
<rect x="14" y="388" width="872" height="68" rx="8" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="1.4"/>
<text class="b" x="28" y="412" font-size="14">The final menstrual period is stage 0 and is known only in hindsight, after 12 months without menses.</text>
<text x="28" y="436" font-size="14">Median age 51. A high FSH before age 40 is primary ovarian insufficiency, not menopause.</text>
</svg>
